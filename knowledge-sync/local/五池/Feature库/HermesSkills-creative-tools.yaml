# Hermes Skills - Creative Tools Feature YAML
# 来源: gif-sticker-maker, shader-dev, vision-analysis
# 提取日期: 2026-07-02

name: HermesSkills-creative-tools
version: "1.0"

products:
  - 文鳐技能集市: 自动匹配
category: creative-tools
description: >
  创意工具集(gif-sticker-maker/shader-dev/vision-analysis)的能力特征。
  三个Skill各有独特领域(GIF动画/GLSL着色器/视觉AI)，但共享API-First设计、
  路由表驱动、环境门控等模式。每个Skill的管线结构不同但阶段一致。

features:

  # ──────────────────────────────────────────
  # 共性架构特征
  # ──────────────────────────────────────────

  - id: creative-api-first-tool-design
    name: API-First工具封装(创意类)
    skills: [gif-sticker-maker, shader-dev, vision-analysis]
    description: >
      创意类Skill也遵循API-First设计，但调用方式不同：
      - gif: 云API调用(MiniMax Image/Video API)通过Python脚本封装
      - shader: 本地GPU编译(GLSL)，依赖知识库(techniques/)而非API
      - vision: MCP工具调用作为唯一入口
    value: 统一"脚本驱动"的Agent交互模式

  - id: creative-technique-routing
    name: 技术路由表
    skills: [gif-sticker-maker, shader-dev, vision-analysis]
    description: >
      根据用户输入路由到不同的专业处理路径。各Skill路由粒度和数量不同。
    routing_tables:
      gif: (单一管线，但需要从captions表路由到正确语言)
      shader: 36种技术 → 路由表映射到techniques/中的具体文件
      vision: 5种分析模式 → 各模式有独立的提示词策略
    value: 意图到专业处理的标准化映射

  - id: creative-environment-gate
    name: 环境前置门(创意类)
    skills: [gif-sticker-maker, shader-dev, vision-analysis]
    description: >
      每个工具在执行前需通过环境检查。
    requirements:
      gif: Python venv + MINIMAX_API_KEY + ffmpeg
      shader: WebGL2兼容浏览器/环境
      vision: MiniMax MCP配置(MINIMAX_API_KEY + uvx minimax-coding-plan-mcp)
    value: 确保执行环境就绪，避免运行时错误

  - id: creative-output-contract
    name: 交付输出契约
    skills: [gif-sticker-maker, shader-dev, vision-analysis]
    description: >
      每个Skill的输出有严格格式约定。
    output_formats:
      gif: 
        - 4个GIF文件路径
        - <deliver_assets> XML块(必须是响应最后内容)
      shader:
        - 可运行的HTML文件(WebGL2 + GLSL)
        - 或完整的GLSL代码片段
      vision:
        - describe: 散文格式描述
        - ocr: 逐字文本(保持结构)
        - ui-review: 结构化的"优点/问题/建议"三段式
        - chart-data: 数据点+趋势摘要
        - object-detect: 分类列举
    value: Agent和用户都能可靠解析输出

  # ──────────────────────────────────────────
  # 个性特征
  # ──────────────────────────────────────────

  - id: gif-media-conversion-pipeline
    name: AI媒体转换管线
    skill: gif-sticker-maker
    description: >
      从静态照片到动画GIF，经过三阶段转换：MiniMax Image API(生成4张静态贴纸)
      → MiniMax Video API(image-to-video动画化) → ffmpeg(视频转GIF)。
      三个步骤可并发执行，最大化吞吐。
    pipeline:
      step_0: 收集文案(用户自定义或查表默认)
      step_1: 并发生成4张静态贴纸 (minimax_image.py)
      step_2: 并发将每张贴纸动画化 (minimax_video.py --image)
      step_3: 批量转换MP4→GIF (convert_mp4_to_gif.py)
    concurrent_strategy: Step 1四并发 → Step 2四并发 → Step 3单批次
    value: 全AI驱动的创意生产管线，3步完成"照片→动画贴纸"

  - id: gif-subject-reference
    name: 人物面部参考生成
    skill: gif-sticker-maker
    description: >
      通过MiniMax Image API的--subject-ref参数，在Funko Pop/Pop Mart风格的
      3D手办化贴纸中保持用户真实面部相似度。仅限人物类型subject。
    value: 从普通照片生成个性化、高相似度的卡通形象

  - id: shader-technique-module-composition
    name: 着色器技术模块组合
    skill: shader-dev
    description: >
      完整着色器由36个技术模块按管线顺序组合。路由表将用户需求映射到
      主技术+辅助组合技术。示例：写实SDF场景由5层管线组合。
    recipe_pipeline:
      geometry: sdf-3d + csg-boolean
      rendering: ray-marching + normal-estimation
      lighting: lighting-model + shadow-techniques + ambient-occlusion
      atmosphere: atmospheric-scattering
      post_processing: post-processing + anti-aliasing + camera-effects
    value: 模块化知识体系，支持"需求→技术方案"精准映射

  - id: shader-webgl2-adaptation
    name: WebGL2适配层
    skill: shader-dev
    description: >
      所有GLSL技术文件使用ShaderToy风格编写，输出时需适配为WebGL2标准：
      - #version 300 es + precision highp float
      - gl_FragCoord替代fragCoord
      - main()包装mainImage
      - 函数声明顺序校正
    value: 一次编写(ShaderToy)，多平台部署(WebGL2/Three.js等)

  - id: shader-performance-budget
    name: 着色器性能预算
    skill: shader-dev
    description: >
      部署环境下GPU性能有限，着色器必须遵守性能预算：
      - Ray march主循环: ≤128步
      - Volume采样/光照内循环: ≤32步
      - FBM octaves: ≤6层
      - 每像素总嵌套循环: ≤1000次
    value: 防止浏览器卡死，保障用户体验

  - id: vision-mode-specific-prompt
    name: 模式化提示词策略
    skill: vision-analysis
    description: >
      5种分析模式各有专用的系统提示词，针对不同任务优化：
      - describe: 详细描述(主题/背景/色彩/文字/构图)
      - ocr: 逐字提取(保持结构和格式)
      - ui-review: UX评审三段式(优点/问题/建议)
      - chart-data: 提取数据点+趋势
      - object-detect: 分类列举+位置
    value: 使用单一MCP工具处理多种分析任务，提示词专业化确保质量

  - id: vision-mcp-configuration
    name: MCP工具配置流
    skill: vision-analysis
    description: >
      MiniMax MCP工具的配置流程针对3种常见环境(OpenCode/Claude Code/Cursor)
      提供了分步指导。必须检测用户环境并输出对应配置命令。
    environments:
      opencode: package.json → mcp.MiniMax
      claude_code: claude mcp add -s user MiniMax
      cursor: MCP settings → mcpServers.MiniMax
    value: 降低用户配置门槛，确保工具可用

  # ──────────────────────────────────────────
  # 通用FAQ & 最佳实践
  # ──────────────────────────────────────────

  - id: creative-best-practices
    name: 创意工具最佳实践
    skills: [gif-sticker-maker, shader-dev, vision-analysis]
    practices:
      - 执行前先检查环境依赖(API key/venv/MCP配置)
      - gif/sticker任务使用并发加速(API调用可并行)
      - shader任务先从techniques/路由表定位技术，再编码
      - vision任务根据用户意图选择分析模式，用正确提示词
      - 交付格式严格遵循各Skill的输出契约
      - gif的image prompts必须用英文(仅caption本地化)
