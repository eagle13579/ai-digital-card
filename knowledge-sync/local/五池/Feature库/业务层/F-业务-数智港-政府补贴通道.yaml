description: |
  政府补贴/税收优惠智能匹配与申请辅助通道。按双卡方向（中→韩/韩→中）自动
  匹配对应可用的政府补贴政策和税收优惠项目。核心功能：
  (1)补贴政策聚合——动态抓取并更新中韩各级政府发布的出海/外贸/投资补贴政策；
  (2)智能匹配——基于企业画像（规模/行业/出海阶段/资质）匹配可申请项目；
  (3)申请辅助——生成申请材料清单、模板填写指引、常见驳回原因预警；
  (4)进度追踪——记录每项补贴的申请状态、审批节点和预计到账时间；
  (5)付费增值——基础匹配免费，深度分析+申请代办为付费服务（"报告钩子转化"模式）。
  补贴信息以"免费预览概要→付费解锁完整匹配报告"模式交付。
