business_value: >
  为中韩出海企业提供政府补贴/税收优惠政策的一站式匹配和申请通道。补贴信息
  分散在中韩各级政府网站，企业自行查找成本极高。本通道聚合两地补贴政策，
  通过AI匹配为企业推荐可申请的补贴项目，并辅助申请流程，是平台差异化竞争力
  和付费增值服务的重要来源。
