products:
  - 通用: 自动匹配
depend_on:
  - "F-数据-数智港-市场情报引擎"
  - "F-CHAINKE-ML-01_ML匹配评分引擎"
  - "F-CHAINKE-ESCROW-01_交易保障系统"
  - "F-CHAINKE-CONTRACT-01_合同模板标准化"
description: |
  基于AI匹配算法的中韩贸易供需撮合系统。输入买方需求（品类/规格/预算/认证要求）
  和卖方供给（产品/资质/产能/报价），通过ML匹配评分引擎计算供需匹配度，
  输出推荐列表+匹配评分+匹配理由。核心流程：
  (1)智能匹配：多维度评分算法（品类匹配/价格区间/合规兼容/物流适配/信誉评分）；
  (2)意向确认：双方确认匹配意向后进入交易流程；
  (3)交易保障：对接e签宝电子签约和合同模板标准化，保障交易安全；
  (4)交易后跟踪：订单状态追踪、争议协商、评价体系。
  在战略走廊中属于"匹配"阶段节点入口。
project: "中韩出海数智港"
