business_value: >
  打通中韩贸易供需双方的智能撮合通道，是平台从"信息服务"到"交易服务"升级的
  核心业务闭环。通过AI匹配算法将买家（中国进口商）与卖家（韩国供应商）精准对接，
  缩短贸易链路，降低交易摩擦。预计可产生平台交易佣金收入，是商业模型的关键一环。
priority: "P1"
models:
  - "2026-06-25_中韩出海数智港_多模态模型心智模型"
