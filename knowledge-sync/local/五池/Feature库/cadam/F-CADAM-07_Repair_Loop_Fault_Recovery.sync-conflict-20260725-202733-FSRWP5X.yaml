feature_id: F-CADAM-07
feature_name: Repair Loop 容错闭环
feature_type: 心智模型 / 容错治理模式
version: 1.0.0
created: 2026-06-15
author: CADAM项目 -> Feature吸收

# ============================================================
# 核心理念
# ============================================================
core_concept: >
  当生成、验证或渲染失败时，按照标准闭环流程处理：
  读取错误输出 -> 分类故障类别 -> 做最小源码修改
  -> 重新运行失败命令 -> 重新运行依赖验证
  -> 报告剩余风险或刻意偏离。
  这是一个元模式，管理所有其他模式的容错机制。

# ============================================================
# CADAM实现
# ============================================================
cadam_implementation:
  description: >
    CADAM将故障处理标准化为可重复的六步闭环：
    Step 1: 读失败命令的输出（不要跳过）
    Step 2: 分类故障（源码语法/几何无效/布尔失败/倒角失败/验证失败）
    Step 3: 做最小责任源码修改（不要大面积重写）
    Step 4: 重跑失败的命令
    Step 5: 重跑依赖的验证检查（特别是不跳过snapshot）
    Step 6: 报告剩余风险或刻意偏离
    每种故障类型有预定义的排查指南和fix建议，
    见repair-loop.md中的failure classes and fixes表格。
  key_components:
    - repair-loop.md 参考文档（六步闭环定义）
    - 故障分类表（class -> likely causes -> fix）
    - 最小修改原则（smallest responsible source change）
    - 依赖验证重跑（rerun dependent validation）
    - 风险报告（remaining risk / deliberate deviations）
  invariant: >
    不做minimal fix + rerun validation = 没修好。
    报告"看起来好了"而不报告验证结果 = 不可信。

# ============================================================
# 映射盖娅进化大脑
# ============================================================
mapping_to_gaiya:
  description: >
    这一模式对应"Agent的自我诊断和修复机制"
  baize_analogy:
    - 读错误输出 -> 白泽分析失败原因
    - 分类故障 -> 确定问题类型
    - 最小修改 -> 最小化变更范围
    - 重跑验证 -> 回归测试
    - 风险报告 -> 透明沟通剩余风险
  analogy: >
    正如CADAM要求每次失败都走标准闭环，
    白泽员工在面对失败时应当有标准化的
    自我诊断和修复流程，
    而非盲目重试或跳过验证。

# ============================================================
# 适用场景
# ============================================================
applicable_scenarios:
  - 任何AI生成任务出现错误时的修复流程
  - 自动化流水线中的故障处理
  - Agent自我纠错机制
  - 多步骤工作流的容错
  - 有质量门禁的生产环境

# ============================================================
# 心智模型详细描述
# ============================================================
mental_model_detail:
  name: Repair Loop - Structured Fault Recovery (容错闭环)
  level: L5孵化室 - 核心元心智模型
  description: >
    这是管理所有其他模式容错的元模式。
    核心洞察：失败不是异常，是流程的一部分。
    好的系统不假设"不会失败"，而是标准化"失败了怎么办"。
    六步闭环的关键在于：
    - 读输出：人类倾向于跳过错误信息直接猜
    - 分类：不同类型的失败需要不同策略
    - 最小修改：避免修复A时破坏B
    - 重跑：验证修复真的有效
    - 重跑依赖验证：修复可能影响下游
    - 报告风险：透明比完美更重要
  principles:
    - 失败即流程: 失败不是例外，是标准流程的一步
    - 先读后改: 读完错误输出才能分类
    - 最小修改: 每次只改最可能的那一处
    - 验证闭环: 修完必须重跑验证
    - 风险透明: 报告剩余风险和刻意偏离
  workflow:
    - "1. 读取失败命令输出"
    - "2. 分类故障（source/geometry/fillet/boolean/validation）"
    - "3. 做最小责任修改"
    - "4. 重跑失败命令"
    - "5. 重跑所有依赖的验证检查"
    - "6. 报告剩余风险或刻意偏离"
