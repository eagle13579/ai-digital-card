name: "F-ENTERPRISE-AI-03"
description: "隐性经验资产化 — 自动将员工的隐性经验（客户细节/踩坑/解决方案）沉淀为公司的固定资产"
version: "1.0.0"
dimension: "数据"
source_model: "2026-07-07_企业AI知识飞轮_M05_隐性经验资产化.md"

one_liner: "核心骨干离职不可怕，TA的经验已经卷进飞轮里了"

what_it_does: |
  核心骨干离职=公司最大的隐性损失。本Feature在工作流中自动捕捉员工的隐性经验：
  客户跟进细节、踩过的坑、解决问题的独特思路，全部沉淀到知识飞轮中。
  新人接手时打开AI，直接无缝衔接前任的工作。

input:
  - 员工工作流中的操作记录
  - 客户跟进历史
  - 问题解决过程
  - 审批决策链

output:
  - 隐性经验知识图谱
  - 岗位经验传承包
  - 新人Onboarding AI向导

sop: |
  1. 监控员工在AI工作台中的操作路径
  2. 自动提取异常处理模式（踩坑与修复）
  3. 提取高价值决策案例（含上下文+结果）
  4. 将个人经验匿名化后注入知识飞轮
  5. 生成岗位经验传承包（新人可查询）
  6. 新人上岗时自动激活AI向导，预加载前任经验

quality_gate:
  score: 5
  items:
    - "每位核心岗位至少沉淀50+条隐性经验"
    - "新人上岗后能回答前任才知道的细节问题"
    - "经验提取对员工工作无感知干扰"

products:
  - "企业知识库RAG: 隐性经验模块"
  - "AI数字名片: 客户关系经验传承"
  - "数字员工SaaS: 员工成长记录"

depends_on:
  - "F-ENTERPRISE-AI-01 知识飞轮引擎"
enhanced_by:
  - "F-ENTERPRISE-AI-02 岗位视角隔离器"

iteration_log: |
  v1.0.0 - 创建: 初始版本，来自向海容-企业AI知识飞轮框架
