name: "F-ENTERPRISE-AI-02"
description: "千人千面岗位视角 — 同一套底层数据，每个岗位看到完全不同的AI工作台"
version: "1.0.0"
dimension: "场景"
source_model: "2026-07-07_企业AI知识飞轮_M04_千人千面岗位视角.md"

one_liner: "让销售的AI看客户画像，财务的AI看异常账目，老板的AI看效率透视图"

what_it_does: |
  基于同一套底层数据底座，为不同岗位生成完全隔离的AI工作台视图。
  销售AI：客户画像+历史报价+跟单建议
  财务AI：合规要求+异常账目+风险提示
  老板AI：全公司效率透视图+瓶颈自动发现

input:
  - 底层知识飞轮数据（统一数据源）
  - 岗位角色定义（销售/财务/运营/管理）
  - 权限约束规则

output:
  - 岗位定制AI工作台
  - 角色隔离的对话上下文
  - 老板效率仪表盘

sop: |
  1. 读取底层飞轮数据，按实体类型分类
  2. 按岗位角色规则，定义每个角色的数据权限
  3. 为每个角色生成专属的AI上下文（预加载+动态）
  4. 销售AI：自动注入客户360°视图+报价历史
  5. 财务AI：自动注入合规规则+异常检测结果
  6. 老板AI：汇总全公司AI使用数据，生成效率透视图

quality_gate:
  score: 5
  items:
    - "CEO看到全公司效率透视图"
    - "销售看不到财务数据"
    - "每个角色AI工作台开箱即用，无需手动配置"

products:
  - "企业知识库RAG: 多角色门户"
  - "AI数字名片: 销售侧客户360视图"
  - "赛博参谋: 老板效率透视仪表盘"

depends_on:
  - "F-ENTERPRISE-AI-01 知识飞轮引擎"
enhanced_by: []

iteration_log: |
  v1.0.0 - 创建: 初始版本，来自向海容-企业AI知识飞轮框架
