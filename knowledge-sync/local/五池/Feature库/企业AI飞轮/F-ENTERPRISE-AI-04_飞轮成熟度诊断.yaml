name: "F-ENTERPRISE-AI-04"
description: "企业AI飞轮成熟度诊断 — 从'高级打字机'到'企业护城河'的六维评估"
version: "1.0.0"
dimension: "基本功"
source_model: "2026-07-07_企业AI知识飞轮_M12_从打字机到护城河.md"

one_liner: "你的AI是打字机还是护城河？一测便知"

what_it_does: |
  评估企业AI化成熟度，判断当前处于什么阶段：
  阶段0：高级打字机（只有输入框）
  阶段1：数据沙箱就绪（安全隔离）
  阶段2：知识飞轮启动（活的关系网）
  阶段3：自动织网（AI自学）
  阶段4：岗位视角隔离（千人千面）
  阶段5：护城河（隐性经验资产化）

input:
  - 企业AI使用现状描述
  - 数据资产清单
  - 岗位角色与AI交互频率

output:
  - 飞轮成熟度报告（0-5阶段）
  - 差距分析（缺什么）
  - 下一步行动建议（P0/P1/P2）

sop: |
  1. 采集企业AI使用的6个维度数据
  2. 对照5阶段模型逐层评估
  3. 找出卡点（最弱的维度）
  4. 生成P0-P2行动建议
  5. 输出报告，包含ROI估算

quality_gate:
  score: 5
  items:
    - "诊断结果可映射到具体行动项"
    - "报告可在30分钟内生成"
    - "每个阶段有明确的进入标准"

products:
  - "赛博参谋: 企业AI化诊断功能"
  - "企业知识库RAG: 成熟度模块"
  - "AI数字名片: 客户企业AI成熟度评估"

depends_on: []
enhanced_by:
  - "F-ENTERPRISE-AI-01 知识飞轮引擎"

iteration_log: |
  v1.0.0 - 创建: 初始版本，来自向海容-企业AI知识飞轮框架
