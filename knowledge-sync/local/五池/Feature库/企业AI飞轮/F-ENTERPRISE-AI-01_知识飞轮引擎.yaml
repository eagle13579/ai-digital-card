name: "F-ENTERPRISE-AI-01"
description: "企业AI知识飞轮核心引擎 — 数据沙箱隔离+活的关系网+自动进化，让AI越用越懂公司"
version: "1.0.0"
dimension: "体系"
source_model: "2026-07-07_企业AI知识飞轮_M03_活的关系网（知识飞轮核心）.md"

one_liner: "让AI从死知识库进化成活的关系网，自动织网、自动进化"

what_it_does: |
  知识飞轮引擎将一个企业的静态数据（报价单/合同/审批流/客户记录）转化为活的关联网络。
  AI自动从数据中提取人-事-物关系，每次使用都自动学习新知识，越用越聪明。

input:
  - 企业高价值数据: 报价单/客户沟通记录/审批流（脱敏后）
  - 用户操作反馈: 员工使用AI时的选择和行为

output:
  - 活的关系网: 客户-合同-批次-投诉的关联
  - 自动进化模型: 风险识别/成单率预测/异常检测

sop: |
  1. 连接数据沙箱，读取脱敏后的高价值数据
  2. 从数据中提取实体（人/事/物）和关系
  3. 构建动态关联图，支持上下级追溯
  4. 每次员工使用AI时，自动吸收新关联
  5. 定期评估关系网密度，自动补全弱关联

quality_gate:
  score: 5
  items:
    - "关系网覆盖核心业务实体 >80%"
    - "AI每使用一次，至少学会一条新关联"
    - "新员工可以基于关系网回答历史问题"

products:
  - "企业知识库RAG: 从静态知识库升级为活的关系网"
  - "AI数字名片: 客户-合同-关系网络增强"
  - "䑏疏跨境助手: 跨境业务关联分析"

depends_on: []
enhanced_by:
  - "F-ENTERPRISE-AI-02 岗位视角隔离器"
  - "F-ENTERPRISE-AI-03 隐性经验沉淀器"

iteration_log: |
  v1.0.0 - 创建: 初始版本，来自向海容-企业AI知识飞轮框架
