description: |
  出海里程碑可视化导航系统，将企业出海全流程拆解为四个阶段：
  调研 → 合规 → 匹配 → 交易，以战略走廊形式展示进度。
  每个阶段是一个可点击/可查看的里程碑节点，包含：
  (1)当前阶段状态（未开始/进行中/已完成）；
  (2)已完成节点回顾；
  (3)待办事项列表；
  (4)下一阶段操作入口。
  点击节点直接跳转对应功能模块。走廊同时也是双卡方向选择（中→韩/韩→中）
  的承载界面，方向切换后走廊内容自动适配。侧边栏常驻AI客服召唤入口，
  提供全局"驻场但不搭讪"的帮助服务。
