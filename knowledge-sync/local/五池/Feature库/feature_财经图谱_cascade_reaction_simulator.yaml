# ============================================================
名称: 连锁反应推演器

products:
  - 通用: 自动匹配
描述: >
  输入重大事件、政策变化或企业公告，通过因果推理引擎与知识图谱遍历，
  自动推演事件在多级产业链上的传导路径，输出N层因果链 —— 从直接受
  影响实体到二级、三级乃至终端影响，为情景分析与压力测试提供决策支持。

输入:
  type: 事件描述
  format:
    - "政策公告全文 (例: 新能源汽车购置税减免延期)"
    - "企业重大事件 (例: 某龙头宣布减产30%)"
    - "宏观事件 (例: 美联储加息50bp)"
  encoding: UTF-8
  optional_params:
    推演深度: integer (默认3, 范围1-5)
    时间窗口: string (默认30天, 如 "90天")

输出:
  type: N层因果链
  schema:
    根事件:
      id: string
      描述: string
      时间: datetime
    因果链:
      - 层级: integer           # 1=直接影响, 2=次级, ...
        节点列表:
          - 实体: string
            影响类型: string    # 利好 / 利空 / 中性
            影响路径: string    # 传导路径描述
            置信度: float       # [0,1]
            证据: string        # 逻辑支撑或数据来源
    终端影响:
      - 实体: string
        汇总影响: string
        综合置信度: float

核心:
  - 因果推理 (Structural Causal Model + 反事实推理)
  - 知识图谱遍历 (广度优先 + 权重传导)
  - 事件-实体关联索引

技术栈:
  - 因果推理: DoWhy / CausalNex / 基于LLM的因果抽取
  - 图谱遍历: Neo4j Graph Data Science (GDS) 路径算法
  - 事件抽取: BERT事件抽取模型 + 时序逻辑
  - 影响量化: 蒙特卡洛模拟 / 敏感性分析
  - 可视化: D3.js / G6 因果链图谱展示

关联产品:
  - 中国软银策略引擎

成熟度: ⭐ (新创建)
