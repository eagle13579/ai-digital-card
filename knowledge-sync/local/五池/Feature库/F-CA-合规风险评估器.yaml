feature_id: "F-CA-合规风险评估器"
name: "合规风险评估器 — 制裁穿透+三合一闭环"
version: "1.0.0"
dimension: "体系"
source_model:
  - "五池/模型池/_原子/黑河-资本套利元框架/MM_M3_三合一闭环检测.md"
  - "五池/模型池/_原子/黑河-麦肯锡定义权/M10-三合一闭环.md"
  - "五池/模型池/_原子/黑河离岸资本/H04-经济实质避险.md"
  - "五池/模型池/_原子/黑河离岸资本/H08-阳光下行走.md"
  - "五池/模型池/_原子/黑河调查局-矿产合规套利四步法/M08-制裁折扣套利.md"
  - "五池/模型池/_原子/黑河调查局-矿产合规套利四步法/M10-三合一闭环检测.md"
  - "五池/模型池/_原子/黑河调查局-矿产合规套利四步法/M11-法律确定性.md"
  - "五池/模型池/_原子/黑河调查局-矿产合规套利四步法/M12-地缘断层套利.md"
one_liner: "三合一闭环检测+制裁穿透分析+离岸架构合规评估的三层合规审计"

products:
  - 通用: 自动匹配
what_it_does: >
  对投资标的执行三层递进式合规风险评估：
  
  第一层：三合一闭环检测（C1）
  检测规则的设计者、执行者、受益者是否为同一实体或利益集团。
  评分≥80阻断交易，评分≥60发出警告。基于M3元框架+麦肯锡M10+
  矿产M10的三合一检测逻辑。
  
  第二层：制裁穿透检测（C2）
  穿透分析标的的注册地/实控人/交易对手是否涉及制裁国家或实体。
  检测制裁折价率（M08核心）、制裁标签、注册地制裁状态。
  直接制裁标记为阻断，间接关联为警告。
  
  第三层：离岸架构合规评估（C3）
  评估离岸实体的合规风险：避税天堂暴露、经济实质缺失（H04）、
  实体过多。有经济实质但涉及避税天堂为警告，无经济实质为阻断。
  
  附加检查：
  - C4转让定价审查风险：利润液化比例>30%触发警告
  - C5消费端合规：取消迷宫>5步或默认续费违反FTC指南触发警告
  - C6地缘政治风险：制裁国家注册地阻断，制裁折价>30%警告
  
  所有检查项统一输出：通过/不通过 + 严重程度（block/warning/info）
  + 详细证据列表。
input:
  - "投资标的结构化数据（制裁/离岸/三合一相关字段）"
  - "八维仲裁矩阵中的D8三合一闭环评分"
output:
  - "6项合规检查结果（每项: check_id/name/passed/severity/detail/evidence）"
  - "整体合规结论（通过/未通过）"
  - "合规阻塞项列表（block级别，强制阻断交易的项）"
  - "合规警告项列表（warning级别，需关注但不阻断）"
sop:
  - "step: 执行C1三合一闭环检测（基于D8评分+重合度+闭环完整度）"
  - "step: 执行C2制裁穿透检测（注册地/标签/折价率三级穿透）"
  - "step: 执行C3离岸架构合规评估（法域/经济实质/实体数量）"
  - "step: 执行C4转让定价审查（利润液化比例阈值判断）"
  - "step: 执行C5消费端合规（自动续费监管合规检查）"
  - "step: 执行C6地缘政治风险评估（制裁国家+折价率综合判断）"
  - "step: 汇总检查结果，生成合规结论"
  - "step: 合并到门禁结论（有block项强制BLOCK）"
quality_gate:
  - "6项合规检查全覆盖（不缺项）"
  - "每项检查有明确的通过/不通过阈值"
  - "block级别检查正确阻断交易"
  - "合规证据列表可溯源到原子模型"
  - "与现有sanctions_compliance_gate.py兼容"
score_target: 9/10
depends_on:
  - "F-CA-八维仲裁矩阵（D8三合一闭环评分作为输入）"
enhanced_by:
  - "现有模块: sanctions_compliance_gate.py（制裁门禁）"
  - "现有模块: sanctions_discount_analyzer.py（折价分析）"
  - "F-TX-05: 全球套利能力融合门禁(Gate 0)"
iteration_log:
  - version: "1.0.0"
    date: "2026-06-13"
    author: "黑河调查局/白泽"
    changes: |
      初始创建。三层合规架构设计：
      第一层三合一闭环检测（覆盖麦肯锡M10+元框架M3+矿产M10），
      第二层制裁穿透（覆盖矿产M08+M12），
      第三层离岸合规（覆盖离岸H04+H08）。
      附加C4-C6覆盖转让定价、消费端合规、地缘风险。
      与现有sanctions_compliance_gate.py和sanctions_discount_analyzer.py
      功能互补。
