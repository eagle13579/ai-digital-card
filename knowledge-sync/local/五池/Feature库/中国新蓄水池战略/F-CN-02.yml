description: 整合CN02国有资产证券化数据库与CN04证券化定价引擎，对央企和地方国企的资产证券化项目进行系统性梳理与估值分析。覆盖信贷ABS、企业ABS、ABN及类REITs等品种，自动提取基础资产池特征、信用增级结构与发行利差，输出证券化可行性与定价偏离度评分。
