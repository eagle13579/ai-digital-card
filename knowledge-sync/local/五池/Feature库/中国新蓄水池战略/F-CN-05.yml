id: F-CN-05
name: 蓄水池配置模型
description: 基于CN08蓄水池量化配置方法论，构建从宏观周期定位到微观资产匹配的端到端配置模型。输入周期引擎阶段判断、各类蓄水池资产（国债、地方债、REITs、ABS、高股息权益）的预期收益-风险特征及流动性水位，输出战略基准配置比例与战术调整幅度，实现"顺周期蓄水、逆周期放水"的配置纪律。
