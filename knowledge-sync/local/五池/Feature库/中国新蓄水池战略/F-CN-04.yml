id: F-CN-04
name: 认知套利信号器
description: 结合CN07行为金融识别体系与CN09认知偏差图谱，实时检测市场参与者在蓄水池相关资产上的集体认知偏差与情绪极端化信号。覆盖代表性偏差、锚定效应、处置效应与信息级联等偏差类型，在认知偏离均值超过阈值时发出套利入场/离场信号，服务于蓄水池策略的逆向配置决策。
dimension: 创造力
domain: 行为金融/量化信号
status: 孵化中
