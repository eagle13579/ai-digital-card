name: "产品内核定义"
version: "1.0.0"
dimension: "场景"
source_model: "chainke-full/产品内核/链客宝JTBD核心句式.md + chainke-full/产品内核/内核共识清单_TEMPLATE.md"
source_project: "chainke-full"
created_at: "2026-06-08"
author: "白泽 (向海容授权自动扫描吸收)"

one_liner: "以JTBD(Jobs-To-Be-Done)方法论锁定产品核心任务——帮企业家找到靠谱的合作伙伴，并通过三问门禁系统守护内核不变形"

products:
  - 通用: 自动匹配
what_it_does: |
  场景：产品团队需要共识链客宝的产品内核是什么，以及如何确保每项功能都服务于核心任务。
  问题：产品团队容易陷入"功能堆砌"陷阱，不断添加新功能但偏离真正的用户任务，导致产品臃肿、定位模糊。
  价值：链客宝通过"四步锁定法+JTBD核心句式"明确定义产品内核，并通过三个门禁守护内核：

  核心任务句式：
  "当企业家需要找合作伙伴/供应商/客户，但缺乏靠谱的匹配渠道和信任背书时，
   他需要一个能精准匹配+身份认证+信任背书的对接平台，
   以获得靠谱的商业合作机会，节省到处找关系的时间和踩坑的信任成本。"

  内核验证三个特征：
  - 高频：企业家持续需要新合作伙伴
  - 高痛：找错合作伙伴成本极高（钱+时间+声誉）
  - 无完美方案：现有渠道（微信群/商会/转介绍）都很原始

  内核守护三问门禁（每次需求/功能决策时使用）：
  Q1：这个功能是否帮助用户更高效地找到靠谱合作伙伴？
  Q2：如果没有这个功能，用户还能完成核心任务吗？
  Q3：竞品有这个功能，我们就要有吗？——还是回到Q1来回答

  内核共识清单（三方对齐）：
  - 创始人填写：功能强化的内核是什么？
  - 产品经理填写：怎么翻译成产品方案？
  - 程序员填写：技术上怎么实现？
  - 三个门禁投票：每人打≥7分通过，<5分退回

input: |
  - 产品功能/需求提案: 待评审的新功能描述
  - 核心任务句式: 已锁定的JTBD句式
  - 内核共识清单: 三方（创始人/产品经理/程序员）的填空内容
  - 门禁评分: 每人1-10分的功能符合度评分

output: |
  - 内核对齐度评估: 功能与核心任务的匹配程度
  - 门禁通过/不通过: 三个门禁的投票结果
  - 功能优先级建议: P0(内核核心)/P2(增强)/P3(非内核)
  - 减法检查结果: 砍掉该功能对核心任务的影响评估

sop: |
  1. 提出新功能/需求提案，包含功能描述和预期效果
  2. 用核心任务句式（JTBD）评估功能对齐度：是否帮助用户更高效找到靠谱合作伙伴？
  3. 创始人填写：这个功能强化的内核是什么？用户完成任务效率提升了什么？
  4. 产品经理填写：怎么翻译成产品方案？用户看到了什么？怎么衡量成功？
  5. 程序员填写：技术上怎么实现？开发周期？风险点？
  6. 三方投票门禁：每人打1-10分，三人都≥7分通过进入排期
  7. 通过门禁的分配P0优先级，不通过的退回重新设计或放弃

quality_gate:
  - gate: "内核句式稳固"
    standard: "核心任务句式半年内不随意更改，除非用户研究发现更精准的表述"
    score: 5
  - gate: "三问门禁执行"
    standard: "每个新功能/需求必须经过三问门禁评审，不可跳过"
    score: 5
  - gate: "减法检查"
    standard: "每个功能决策时都执行减法检查：砍掉它用户完成任务能力受影响吗？"
    score: 5

score_target: "9/10"
