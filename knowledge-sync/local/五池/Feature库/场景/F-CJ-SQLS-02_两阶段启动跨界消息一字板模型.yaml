id: F-CJ-SQLS-02
name: 两阶段启动·跨界消息一字板模型
dimension: 场景
domain: 龙头战法·消息驱动
description: >-
  个股先因基本面改善首板涨停 → 缩量洗盘 → 放量试盘确认底部 →
  随后发布跨界消息刺激连续一字涨停的两阶段启动模型。
  核心逻辑: 主业改善提供安全垫 + 新业务消息提供弹性 = 双重驱动。
  
  实战来源: 宿迁联盛(603065) 2026-06-02~06-12
  8日涨幅: +80% (4连板一字)
source_model: 宿迁联盛603065 (2026-06-02~06-12)

products:
  - 通用: 自动匹配
signals:
  - "P-2 蛰伏期: 长期低价横盘, 日均换手<2%, 市值<30亿, 无人关注"
  - "P-1 资金预热: 无消息下主力资金持续净买入(单日>300万)"
  - "P0 基本面首板: 放量涨停, 逻辑清晰(主业改善+新业务预期)"
  - "P1 缩量洗盘: 首板后缩量调整, 不破首板起点=健康"
  - "P2 试盘确认: 放量阳线+上影线(量>2x日均), 放量不涨停=测试抛压"
  - "P3 消息一字: 跨界/合作公告发布→一字涨停, 量比<0.3x(无人卖)"
  - "P4 连续一字: 振幅=0, 量能V型(缩→放→缩=分歧转一致)"
  - "P5 终局: 开板日换手决定生死(<15%健康, >20%危险)"

sop:
  - "Step 1: 监控蛰伏期异动 → 无消息下连续3日主力净买入>100万"
  - "Step 2: 识别基本面首板 → 放量涨停+逻辑自洽(非纯题材)"
  - "Step 3: 跟踪洗盘 → 缩量不破首板起点=安全"
  - "Step 4: 识别试盘日 → 放量上影线+不涨停=主力测试"
  - "Step 5: 试盘次日如果低开→放弃; 如果直接一字→确认强势"
  - "Step 6: 一字板持有→量能V型结构正常→开板日看换手率"

quality_gate:
  score: 8
  checks:
    - "基本面首板必须有真实逻辑(非纯概念)"
    - "试盘日放量但收盘>开盘=有效试盘"
    - "消息一字板量比<0.3x=最强信号"
    - "开板日换手<15%=接力可期"

iteration_log:
  - "2026-06-13: v2.0 从6/2-6/12完整走势中吸收, 修正旧模型的单阶段认识"
