products:
  - 链客宝: 自动匹配
what_it_does: 直言不讳是建立信任的前提——有话直说，不藏着掖着。链客宝平台内建"直言反馈"机制：交易双方可以在不伤害关系的前提下，对产品/服务/价格提出直接质疑。平台提供结构化的直言模板（非情绪化表达），引导双方聚焦问题本质而非人身攻击。内置AI调解员解析直言内容，提炼核心分歧点，推动高效解决。直言文化也应用于平台治理——用户可实名/匿名向平台运营团队直说意见。
input:
  - 争议/意见: 用户提出的问题或建议
  - 直言模板: 结构化表达框架
  - AI调解: 矛盾点解析
output:
  - 结构化直言反馈卡
  - 矛盾点提炼与解决建议
  - 直言文化参与度评分
sop: |
  1. 交易双方产生分歧时，自动推荐直言反馈模板
  2. 用户填写结构化反馈（事实描述→我的感受→我的期望）
  3. AI调解引擎解析并提炼3个核心矛盾点
  4. 矛盾点推送给对方，引导针对性回复
  5. 48小时内未回复→平台介入协调
  6. 年度直言文化评分纳入平台治理报告
  7. 直言参与度高的用户获得"坦诚标识"
quality_gate:
  - score: 7/10
  - checks:
    - 直言模板有结构化字段
    - AI调解解析准确率≥80%
    - 直言反馈→解决闭环率≥70%
