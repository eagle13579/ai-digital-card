feature_id: "F-CJ-BIO-01"
name: "入口产品飞轮"
version: "1.0"
dimension: "场景"
source_model: "陈总材料科技·入口产品飞轮"
# 精确source_model溯源 (2026-06-12): 五池/模型池/2026-06-09_陈总材料科技_12心智模型.md
domain: "bio_materials"
description: "入口产品飞轮：从99元袜子到生态平台——以低门槛爆品（袜子）为流量入口，建立用户信任后逐步推广高价值材料产品，最终形成平台生态"
input:
  - 入口产品定义（99元袜子原型）
  - 成本结构与定价模型
  - 目标用户画像与触达渠道
  - 升级产品线规划
  - 用户复购/升级行为数据
output:
  - 入口产品销量与用户基数
  - 用户→升级产品转化漏斗
  - 全生命周期客户价值(LTV)
  - 产品矩阵收入占比分布
  - 平台生态覆盖率指标
sop: |
  1. 爆品设计 — 选定高频低门槛产品（抗菌袜），定价低于用户心理阈值（99元），强调材料科技卖点（连续长丝/pH自愈）
  2. 信任积累 — 通过产品品质和效果（碘伏验证可视化）建立信任，收集用户反馈数据
  3. 升级引导 — 在包装/社群/AI私域中植入升级品信息（床垫/敷料/军工材料），设计阶梯式升级路径
  4. 生态扩展 — 从个人消费延伸至企业采购（军工/医疗），开放技术平台给第三方品牌
  5. 飞轮闭环 — 生态收入反哺爆品成本优化，降低入口门槛→扩大用户基数→更多升级转化
  6. 入口转化漏斗: 记录每个入口的曝光→点击→注册→首单转化率, 定位流失环节
  7. 飞轮启动阈值: 日活用户>1000或月转化率>5%时自动切换为加速模式

quality_gate:
  score: 9
  checks:
    - "入口产品毛利率≥30%"
    - "入口→升级转化率≥5%"
    - "用户复购率≥40%"
    - "入口产品月销≥10000件"
  reusable_by: ["陈总材料科技", "消费品牌创业", "DTC材料品牌"]
status: active

products:
