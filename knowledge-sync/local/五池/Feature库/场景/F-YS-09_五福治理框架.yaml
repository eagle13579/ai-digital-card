products:
  - 链客宝: 自动匹配
what_it_does: 五福治理框架来源于尚书洪范篇：长寿(活得久)+富贵(有度)+康宁(身心安)+好德(行得正)+善终(有传承)。链客宝用此框架评估平台自身和入驻企业的健康度——不看单一财务指标，而是五维综合评分。很多企业富而不贵（高杠杆高危），贵而不康（创始人焦虑）。五福评分展示给企业主，帮助他们看到自己企业的"盲区"，同时也作为链客宝的治理自检工具。
input:
  - 企业数据: 存续年限/利润率/团队稳定性/合规记录/传承计划
  - 链客宝平台数据: 运营月数/现金流/团队状态/价值观/产品矩阵
output:
  - 五福评分雷达图: 长寿/富贵/康宁/好德/善终各维度
  - 详细诊断报告: 每项的分析和改进建议
  - 五福趋势: 季度对比
sop: |
  1. 长寿评分=企业存续年限×稳定性指数（团队/产品/客户）
  2. 富贵评分=利润率×增长×经营多样性（不超过满分上限）
  3. 康宁评分=创始人身心健康自评+团队氛围评级
  4. 好德评分=客户投诉率+合规项目完成率+行业贡献
  5. 善终评分=是否有接班人计划+产品矩阵是否完整
  6. 五福评分自动展示在企业主页上
  7. 任一维度<3分时触发建议方案推送
quality_gate:
  - score: 7/10
  - checks:
    - 五维评分标准明确可量化
    - 企业版和平台版区分
    - 低分触发建议机制生效
