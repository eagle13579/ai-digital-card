name: 30年眼光 — 链客宝长期战略规划引擎
version: "1.0"
dimension: 场景
source_model: 儒商联盟原子18 300年眼光
source: yishang-alliance
relevance: 链客宝
maturity: 7.0
tags:
  - 儒商联盟
  - 长期眼光
  - 链客宝
  - 战略规划
one_liner: 用30年后的视角看今天的链客宝决策，让短期困难不干扰长期方向

products:
  - 链客宝: 自动匹配
what_it_does: 看得越远，当下的困难就越小。链客宝的每项重大决策都要经过"30年眼光"检验：这个决定在30年后看来是正确还是错误的？用长期视角过滤短期诱惑——不做伤害品牌信誉的短期变现，不追逐脱离主线的热点。30年眼光的另一面是"慢就是快"：基础架构多花3个月，未来少花3年重构。每月输出"30年眼光纪要"，记录本月决策的长期意义。
input:
  - 当前决策项: 排期/预算/功能/合作
  - 30年愿景: 链客宝30年后的定位
  - 历史决策: 过往重大决策记录
output:
  - 30年检验评分: 每个决策的长期视角评分
  - 短期诱惑识别: 偏离长期价值的决策预警
  - 30年眼光月度纪要
sop: |
  1. 每项重大决策（人力>20%或预算>10%）自动触发30年眼光检验
  2. 检验标准：30年后的链客宝会因为此决定感谢你还是后悔？
  3. 评分≤5/10的决策打回重新论证
  4. 月度输出"30年眼光纪要"（本月决策的长期意义评估）
  5. 季度复盘"短期诱惑识别"——做了哪些当时爽长期伤的事
  6. 年度回顾：去年决策的30年眼光检验准确率
quality_gate:
  - score: 7/10
  - checks:
    - 重大决策触发30年检验
    - 检验评分可量化
    - 月度纪要定期输出
iteration_log:
  - "2026-06-16: v1.0初始版本, 基于儒商联盟原子18 300年眼光"
