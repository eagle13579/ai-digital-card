id: F-CJ-FGGP-01
name: 20cm换手板二板启动模型
dimension: 场景
domain: 龙头战法框架(科创板/创业板)
description: >-
  科创板/创业板(20cm涨跌幅)个股的换手板启动模式：
  启动前经历洗盘整理(1-3天回调)，首板放巨量换手涨停(振幅>15%)，
  二板继续放量换手涨停(振幅>10%)，全程非一字板/非T板，是充分换手的连续涨停。
  与主板10cm模式的核心区别: 振幅大、换手率高、量能持续放大而非收敛。
source_model: 福光股份688010 (2026-06-08~06-12)

products:
  - 通用: 自动匹配
signals:
  - "P-1洗盘: 启动前1-3天阴线回调(-2%到-5%)，量能正常或略放"
  - "P0首板: 20cm涨停，振幅>15%，成交量暴增>3x前日"
  - "P0特征: 非一字开板，有盘中震荡换手(开板后回封)"
  - "P1二板: 20cm涨停，振幅>10%，成交量继续放大>1.3x首板"
  - "P1特征: 非加速缩量，而是继续换手=接力而非锁仓"
  - "区别于10cm: 20cm模式振幅更大、换手率更高、量能持续放大"
sop:
  - "Step 1: 识别P-1洗盘 — 首板前1-3天的阴线回调"
  - "Step 2: 确认P0首板 — 20cm涨停+振幅>15%+量>3x+非一字开板"
  - "Step 3: 验证P1二板 — 20cm涨停+振幅>10%+量继续放大"
  - "进入条件: 科创板/创业板标的 + P-1洗盘 + P0放量换手板 + P1继续放量"
  - "持有条件: 每日换手率>10%但<40%(健康换手区间)"
  - "退出条件: 缩量一字板(模式切换)或放量不涨停(出货)"
signal_weights:
  p_minus1_washout: 0.15       # 洗盘确认
  p0_volume_surge: 0.25        # 首板量比
  p0_amplitude: 0.20           # 首板振幅
  p1_volume_sustain: 0.25      # 二板继续放量=接力
  turnover_health: 0.15        # 换手率区间
thresholds:
  p_minus1_washout: [-5.0, -1.0]     # 洗盘跌幅1-5%
  p0_amplitude_min: 15.0             # 首板最小振幅15%
  p0_volume_ratio_min: 3.0           # 首板量比最低3x
  p1_volume_ratio_min: 1.3           # 二板量比最低1.3x(相对首板)
  turnover_range: [10.0, 40.0]       # 健康换手率10-40%
source_stock: 福光股份(688010)
