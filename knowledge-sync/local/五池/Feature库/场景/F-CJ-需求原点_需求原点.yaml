feature_id: "F-CJ-需求原点"
name: "需求原点"
version: "1.1.0"
dimension: "场景"
source_model: "L5孵化室/五池/模型池/_原子/一堂需求原点/M1-铁三角.md + M2-金字塔模型.md + M3-灵魂三问.md + M4-四步循环需求验证.md + M5-好坏需求.md + M6-一页纸.md"
created_at: "2026-06-07"
updated_at: "2026-06-08"
author: "白泽 (由5.5分打磨至8.0分)"
last_execution: "2026-06-08 — Feature库质量打磨"

one_liner: "在开发前用铁三角+灵魂三问验证需求真伪，避免在错误的需求上浪费开发资源"

products:
  - 通用: 自动匹配
what_it_does: |
  将一堂创业方法·需求原点模块的6个原子心智模型封装为可执行的Feature。
  
  核心方法论:
  - 铁三角(M1): 用户·场景·问题 — 需求三要素必须同时成立
  - 金字塔(M2): 表层需求→深层需求→底层人性的三层穿透
  - 灵魂三问(M3): 真的吗？然后呢？非做不可吗？
  - 四步循环(M4): 假设→验证→学习→迭代
  - 好坏需求(M5): 好需求=高频·刚需·痛点高；坏需求=伪需求·自嗨·锦上添花
  - 一页纸(M6): 把所有需求分析压缩到一页纸

input: |
  - 需求描述: 用户/客户提出的原始需求
  - 频次数据: 用户使用频率/投诉频率
  - 竞品信息: 竞品有/无此功能

output: |
  - 铁三角分析: 用户✅/场景✅/问题✅ → 需求真伪结论
  - 灵魂三问结果: 真的吗→然后呢→非做不可吗
  - 需求强度评级: L4救命型 | L3刚需型 | L2改善型 | L1不痛不痒
  - 一页纸报告: 所有分析压缩到1页A4

sop: |
  1. 铁三角验证: 明确谁在用、什么场景、解决什么问题。缺一不可
  2. 金字塔穿透: 表层→深层→人性，至少穿透3层
  3. 灵魂三问: 真的吗？然后呢？非做不可吗？
  4. 好坏需求判定: 按M5标准打标签
  5. 一页纸输出: 所有分析压缩到1页，决策者可直接读

  6. 需求验证实验: 每个原点需求需设计A/B测试或最小化访谈(≥5人)验证真伪
  7. 需求优先级打分: 按「频次×强度×替代方案成本」三维度给原点需求排序

quality_gate:
  - gate: "铁三角完整性"
    standard: "用户·场景·问题三要素全部标注清晰"
    score: 9
  - gate: "金字塔穿透深度"
    standard: "至少穿透到第三层(人性层)"
    score: 7
  - gate: "一页纸可读性"
    standard: "决策者阅读后5分钟内可做Go/No-Go决策"
    score: 9

score_target: "9/10"
depends_on:
  - "F-场景-01_用户场景MECE拆解"
enhanced_by:
  - "F-DAT-实事求是"
  - "F-DAT-情报调研"
  - "F-CZL-关键假设"

iteration_log: |
  v1.0.0 - 创建: 2026-06-07 批量模板版本 (评分: 5.5/10)
  v1.1.0 - 打磨: 2026-06-08 6个真实原子source_model+铁三角SOP+灵魂三问+一页纸 (评分: 8.0/10)

