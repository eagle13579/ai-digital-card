one_liner: 链客宝必须有且只有一个清晰的战略聚焦点，所有资源围绕这个聚焦点分配，拒绝功能蔓延

products:
  - 链客宝: 自动匹配
what_it_does: 任何组织必须有且只有一个清晰的聚焦点，否则成员发现什么做什么，无法形成合力。链客宝的聚焦点是"AI企业营销匹配"——所有功能、资源、运营都围绕这一个核心。当出现新功能需求时，先用"与聚焦点的相关度"过滤：任何与AI企业营销匹配无关的功能延迟或拒绝。检验：如果不能用一句话说清链客宝是干什么的，说明聚焦点没找到。
input:
  - 新功能需求: 需求描述
  - 聚焦点声明: 链客宝当前战略聚焦
  - 资源分配现状: 各功能的人力/预算占比
output:
  - 功能聚焦度评分: 1-10分
  - 资源聚焦看板: 各功能与聚焦点的关联度
  - 否决/延迟建议: 偏离聚焦点的需求
sop: |
  1. 明确定义链客宝的聚焦点并与全员对齐
  2. 所有新增功能需求在进入排期前通过聚焦度评估
  3. 聚焦度评估=功能与"AI企业营销匹配"的直接关联度评分
  4. 聚焦度<6/10的功能直接否决或延迟
  5. 每月扫描资源分配（人力/预算）与聚焦点的一致性
  6. 偏离聚焦点的资源>20%时触发重新对齐流程
quality_gate:
  - score: 7/10
  - checks:
    - 聚焦点声明文档化且全员可见
    - 功能聚焦度评估已嵌入排期流程
    - 月度资源聚焦看板自动生成
iteration_log:
