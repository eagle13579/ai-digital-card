feature_id: F-YS-08
name: 聚焦点法则 — 链客宝战略聚焦引擎
version: "1.0"
dimension: 场景
source_model: 儒商联盟原子12 聚焦点法则
source: yishang-alliance
relevance: 链客宝
maturity: 7.0
tags:
  - 儒商联盟
  - 聚焦点法则
  - 链客宝
