feature_id: "F-CJ-XT-02"
name: "向上社交策略师"
version: "1.0.0"
dimension: "场景"
source_model: "系统思维M7"
one_liner: "帮用户找到并维护高质量的合作关系"

products:
  - 通用: 自动匹配
what_it_does: |-
  帮用户识别当前社交网络中的高价值节点，制定'向上社交'策略。核心不是巴结，是找到能产生价值交换的人。
input: |-
  用户当前的社交网络分析 + 想合作的领域
output: |-
  社交策略方案（高价值人物识别+接触策略+价值交换设计）
sop: |-
  1. 扫描当前社交网络 2. 识别高价值节点 3. 分析对方的价值需求 4. 设计价值交换方案 5. 制定接触策略
quality_gate: |-
  1. 至少识别3个高价值节点 2. 每个节点有接触策略 3. 价值交换设计真实可行
score_target: "9/10"
depends_on: []
enhanced_by: []
iteration_log: |-
