one_liner: "右脑(三角二·场景)将左脑发散方案收敛为可执行任务，派单给数字员工执行并验证交付质量"

products:
  - 盖娅之城: 自动匹配
what_it_does: |
  盖娅左右脑双螺旋的右脑引擎。接收左脑TOP方案→场景收敛→可行性验证→RORY迭代规划→派单执行。每2h右脑吸收全球工程/数据/验证最佳实践(gaia_duality.py --right-absorb)。已实战验证394个执行任务/0失败。

input: |
  - 左脑TOP方案(TCP-R门禁通过)
  - 底座评估(基本功+数据能否支撑)
  - 可选员工列表(166人)

output: |
  - 收敛后的执行方案
  - 派单列表(含推荐员工+铁律七十九路由)
  - 执行验证结果

sop: |
  1. 接收左脑TOP方案
  2. 场景收敛: 可行性验证(技术/资源/时间约束)
  3. 底座检查: 基本功+数据能否支撑该方案
  4. RORY规划: 迭代路线图+里程碑
  5. 铁律七十九路由: employee_router匹配员工
  6. delegate_task派单执行
  7. 验证交付: gaia_validate.py自检

  quality_gate:
  - gate: "底座检查"
    standard: "基本功+数据支撑度评估完成"
    score: 7
  - gate: "路由公平"
    standard: "employee_router匹配,禁止默认选3人"
    score: 8

score_target: "9/10"
depends_on:
  - "F-CZL-盖娅左脑发散"
  - "F-TX-盖娅七层飞轮"

enhanced_by:
  - "F-CJ-盖娅饱和攻击"
  - "F-JBG-盖娅cronjob值守"

aggregate_components: []

