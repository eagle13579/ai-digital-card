id: F-CJ-ZSDL-01
name: 五段量价阶梯题材连板模型
dimension: 场景
domain: 龙头战法·量价结构
description: >-
  完整五段量价结构: 首板放量→加速缩量→T板分歧换手→放量高潮→缩量顶。
  实战来源: 宗申动力(001696) 2026年4-6月
source_model: 宗申动力001696

products:
  - 通用: 自动匹配
signals:
  - "P1首板放量: 首板涨停伴随量能放大(量比>2x), 封板时间早"
  - "P2加速缩量: 2-3板缩量(量比<0.8x), 振幅收敛, 主力控盘"
  - "P3T板分歧: T字板换手<15%, 振幅<8%, 快速回封=健康接力"
  - "P4放量高潮: 放量涨停(量比>2x), 换手15-25%=市场合力"
  - "P5缩量顶: 缩量涨停或冲高回落=趋势末端信号"

sop:
  - "Step 1: 识别P1首板放量→介入"
  - "Step 2: P2-P3缩量加速→持有不加仓"
  - "Step 3: P4放量T板→确认是否健康换手(<15%)"
  - "Step 4: P5缩量加速→准备卖出"

quality_gate:
  score: 8
  checks:
    - "五段必须完整(缺一段=弱)"
    - "P3换手<15%=健康, >20%=危险"

iteration_log:
  - "2026-06-13: v1.0 从宗申动力走势中吸收"
