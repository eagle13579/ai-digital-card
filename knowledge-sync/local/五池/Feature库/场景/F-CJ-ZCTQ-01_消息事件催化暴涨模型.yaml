id: F-CJ-ZCTQ-01
name: 消息事件催化暴涨模型
dimension: 场景
domain: 龙头战法·事件驱动
description: >-
  外围供给中断/政策突变→国内唯一替代→股价暴涨7倍的完整模型。
  核心逻辑链：外围减产/关厂(供给冲击) → 产品价格暴涨 → 国内唯一受益标的
  → 业绩预期重构 → 估值+业绩双击 → 最终催化剂落地→利好兑现见顶。
  
  实战来源: 中船特气(688146) 2026-04-03~06-11 暴涨765%
source_model: 中船特气688146 (2026-04-03~06-11)

products:
  - 通用: 自动匹配
signals:
  - "P-2 蛰伏期: 常年低价横盘, 换手<2%, 无人关注, 市值<50亿"
  - "P-1 消息触达: 外围供给中断消息(日本企业停产/地震/环保关厂)"
  - "P-1 价格暴涨: 核心产品价格短期暴涨>50%(六氟化钨涨90%)"
  - "P0 首板启动: 科创板20cm涨停, 量比>5x, 换手>10%, 振幅>15%"
  - "P1 预期共识: 量能持续放大(连续5日换手>12%), 券商研报覆盖"
  - "P2 加速主升: 20cm连板, 日均换手15-30%, 科创板高波动"
  - "P3 分歧夯实: 官方降温公告(T字板回封), 不破20日均线=承接有力"
  - "P4 消息高潮: 最终催化剂落地(永久关门/签大单), 最高点=卖点"
  - "P5 利好兑现: 次日暴跌>10%, 故事结束"

sop:
  - "Step 1: 扫描外围消息 → 搜索'断供''停产''关门''唯一替代'等关键词"
  - "Step 2: 确认供给冲击规模 → 影响全球供给>10%为强信号"
  - "Step 3: 确认A股唯一受益标的 → 国产唯一/全球唯二"
  - "Step 4: P0首板放量时介入(20cm量比>5x)"
  - "Step 5: P2加速段持有不卖(20日均线为止损)"
  - "Step 6: P4最终催化剂落地=卖出信号(不贪最后一棒)"

quality_gate:
  score: 8
  checks:
    - "消息来源必须是真实供给冲击(非传闻)"
    - "唯一替代逻辑必须可验证(国内外竞品分析)"
    - "首板放量是必要条件(无量=伪启动)"

iteration_log:
  - "2026-06-13: v1.0 从中船特气765%涨幅中吸收"
