feature_id: F-CJ-软银-01
name: 下马威分时龙头启动模式
version: "1.0"
dimension: 场景
source_model: 泰和新材(002254) 2026-06-09 实战分时复盘
source_project: 中国软银投资系统/龙头战法量化模型
one_liner: 跳空高开→3分钟砸绿洗盘→快速拉回→高位换手→封板的龙头分时标准形态

products:
  - 通用: 自动匹配
what_it_does: 识别「下马威分时」——主力通过开盘瞬间砸盘恐吓散户交出筹码，完成快速建仓后拉回封板的经典龙头启动模式。提供量化识别条件+分时五阶段验证门禁。
input:
  - stock_code: str  # 股票代码
  - minute_data: list  # 当日分钟级数据[[time, price, volume], ...]
  - pre_close: float  # 昨收价
  - limit_up_price: float  # 涨停价
output:
  - is_matched: bool  # 是否匹配下马威模式
  - confidence: float  # 置信度(0-10)
  - phase_analysis: dict  # 五阶段分析结果
  - entry_quality: str  # 介入质量评级(S/A/B/C)
  - advice: str  # 操作建议
sop: |
  【五阶段验证门禁】

  Phase 1 — 开盘诱多(9:30-9:31)
    条件: 高开 ≥ 3%（相对昨收）
    信号: 开盘价在涨幅3-7%之间，非一字板（有换手机会）
    通过: ✅

  Phase 2 — 暴力下杀(9:31-9:33)
    条件: 3分钟内从开盘价砸到绿盘或接近昨收
    量价信号: 成交量急剧放大（洗盘量），价格瞬间击穿关键价位
    最低价不破昨收（或破即收）
    通过: ✅ 下杀至涨幅<0%但最低价接近昨收

  Phase 3 — 快速拉回(9:33-9:38)
    条件: 下杀见底后8分钟内拉回开盘价上方
    量价信号: 拉回过程成交量持续放大，说明主力真金白银在买
    通过: ✅ 从最低拉起>4%回到开盘价上方

  Phase 4 — 高位换手(9:38-11:00)
    条件: 在涨幅5-9%区间长时间震荡（≥60分钟）
    量价信号: 分时均价线不破，换手率>10%
    特征: 不直接封板而是充分换手，让获利盘出局、新资金接力
    通过: ✅ 震荡区间稳定，换手充分

  Phase 5 — 封板(11:00后)
    条件: 换手足够后推升封板
    验证: 封板后不打开，封单量>全天成交量10%
    通过: ✅ 封死涨停

  6. 历史回测验证: 用过去6个月龙头股分时数据回测，模式识别准确率≥70%
  7. 风控熔断: 当模式匹配但后续3天亏损>5%时，自动标记为假信号并降权

quality_gate:
  score: 9
  checks:
    - 基于2026-06-09泰和新材真实分时数据验证
    - 五阶段条件全部可量化
    - 振幅>8% 和换手率>10% 是两个关键辅助验证指标
    - 需在不同股票上回测验证泛化能力
iteration_log:
  - "2026-06-09: v1.0初始版本，基于泰和新材(002254)分时数据创建"
  - "2026-06-09: 注入中国软银AI自动交易系统对应员工memory.db"
