domain: "bio_materials"
description: "军需跑量战略：5%利润率换3000万订单——以极低利润率切入军需/大宗采购市场，用规模跑量换取工厂满产、边际成本优化和战略卡位"
input:
  - 军需/大宗采购招标文件
  - 工厂产能负载率数据
  - 成本结构（原料/人工/设备折旧/物流）
  - 竞品报价区间
  - 战略价值评估（非财务维度）
output:
  - 投标报价方案（含利润率模型）
  - 产能分配计划与排产时间表
  - 边际成本优化预测
  - 军需资质/认证进度
  - 长期合作战略收益评估
sop: |
  1. 战略选单 — 识别军需/政府/大企业采购中「跑量型」订单，评估战略价值（资质背书/行业准入/产线满产）
  2. 极限报价 — 按5%净利润率倒推报价，以量换价，利用军需订单规模降低边际成本
  3. 产线满配 — 军需订单排产填充产能冗余期，降低单位固定成本，提升全厂稼动率
  4. 资质积累 — 利用军需订单获取军工/行业认证（GJB/ISO等），为后续高利润产品铺路
  5. 战略跃迁 — 跑量→建立信任→切入高利润定制产品（特种材料/高端装备），完成利润率爬坡
quality_gate:
  score: 7
  checks:
    - "订单金额≥3000万"
    - "净利率≥5%（不低于盈亏线）"
    - "工厂稼动率提升≥20%"
    - "军需/行业认证获取≥1项"
