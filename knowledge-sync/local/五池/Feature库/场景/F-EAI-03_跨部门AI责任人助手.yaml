feature_id: "F-EAI-03"
name: "跨部门AI责任人助手"
version: "1.0.0"
dimension: "场景"
status: "active"
source_model: |
  M08 技术主导AI陷阱
  M09 试点陷阱
  M10 定责任人

one_liner: "帮企业明确谁管AI——不是IT主管，是能跨部门拍板的AI落地官"

what_it_does: |
  AI落地天然跨部门。销售的数据、运营的流程、财务的规则——任何一个人都推不动另一个部门。
  这个Feature帮助企业：
  1. 识别谁应该当AI落地负责人（级别不够=项目必死）
  2. 给责任人AI落地的「三权清单」：决策权/时间权/问责权
  3. 从试点到全员推广的分阶段SOP

input:
  - 企业组织架构图
  - 部门职责清单
  - 现有IT/HR/业务负责人信息

output:
  - AI落地责任人任命方案
  - 责任人三权清单
  - 推广阶段路线图

sop: |
  1. 访谈CEO确认：AI落地归谁管？
  2. 检查级别：是否直接向CEO汇报？否→升级
  3. 给出「三权清单」：跨部门决策权/第一周投入时间/定期问责
  4. 输出推广路线图：首个部门→第2-3部门→全员
  5. 每周检查责任人履职情况

quality_gate:
  score: 7
  gate_1: "AI落地责任人已明确且级别足够"
  gate_2: "三权清单已签署"
  gate_3: "推广路线图已输出"

