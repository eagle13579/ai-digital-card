# === Feature 定义文件 ===
feature_id: "F-CJ-数智港-03"
name: "AI数字员工展示区"
version: "1.0.0"
dimension: "场景"
source_model: "PRD-002数字员工展示 + 三个产品演示脚本"

## 定位
one_liner: "向韩国客户演示AI数字员工如何为其产品提供合规/营销/监控全链路服务"
what_it_does: |
  三个Demo场景(抹茶拿铁/济州海苔/韩天红参)展示AI数字员工的完整能力：小红书内容生成(创造力)、合规知识库问答(知识)、合规监控预警(风控)。每个场景有演示脚本+截图Demo。
  
  ## 输入输出
input: |
  产品资料(品牌/品类/收据) + 演示场景选择(内容/合规/监控)
output: |
  演示脚本.md + 截图demo.html + 演示门户页面
  
  ## 执行SOP
sop: |
  1. 选择目标产品(已有3个产品演示模板)
  2. 按场景类型(内容/合规/监控)加载对应演示脚本
  3. 用产品真实数据填充demo
  4. 生成截图demo.html
  5. 输出演示门户页面
  
  ## 质量门禁
  quality_gate: |
  1. 演示数据是真实产品数据(非虚构)
  2. 3个场景都有完整的操作流程和截图
  3. 客户可直接打开demo页面体验
  score: 7
  
  ## 关联项目
  project: "中韩出海数智港"
  project_path: "L5孵化室/产品开发/出海项目/中韩出海数智港/"
  
  ## 迭代记录
