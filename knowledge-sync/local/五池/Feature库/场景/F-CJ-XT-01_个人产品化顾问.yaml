feature_id: "F-CJ-XT-01"
name: "个人产品化顾问"
version: "1.0.0"
dimension: "场景"
source_model: "系统思维M5+M6"
one_liner: "帮用户把自己的能力封装为可售卖的产品"

products:
  - 通用: 自动匹配
what_it_does: |-
  帮用户识别自己的核心竞争力，找到目标客户群体，将能力封装为标准化产品。核心：客户买的不是'你'，是你提供的价值和解决方案。
input: |-
  用户的能力清单 + 行业背景
output: |-
  个人产品化方案（价值主张+目标客户+产品形态+定价建议）
sop: |-
  1. 提取核心竞争力 2. 定义目标客户画像 3. 封装为标准化产品 4. 设计价值主张 5. 建议定价策略
quality_gate: |-
  1. 价值主张一句话说清 2. 目标客户有清晰画像 3. 产品形态有交付标准
score_target: "9/10"
depends_on: []
enhanced_by: []
iteration_log: |-
  v1.0.0 - 创建: 系统思维5大人生系统吸收
