feature_id: "F-CJ-XST-05"
name: "分销裂变分享系统"
version: "1.0.0"
dimension: "场景"
source_model: "芯森态·经销商招商裂变分享"
domain: "bio_materials"
description: "芯森态经销商招商四种分享渠道(分享海报/邀请链接/招商画册/企微模板) + 裂变追踪，覆盖线上+线下全场景经销商招募传播"
input:
  - dealer_id: 经销商ID（用于生成分享海报/邀请链接/画册/企微模板）
  - share_token: 用于Token公开查询的分享令牌
  - download参数: 分享海报的预览/下载切换
output:
  - 分享海报: image/png（含经销商专属二维码和品牌VI）
  - 邀请链接: text/html（落地页含招商介绍+注册入口）
  - 招商画册: text/html（翻页式经销商招商电子画册）
  - 企微模板: text/plain（格式化企微话术+分享链接）
  - 裂变追踪: 分享打开率/注册转化率/裂变层级统计
sop: |
  1. 分享海报: 查询经销商信息→生成专属二维码(ERROR_CORRECT_H高容错)→叠加品牌模板→返回PNG
  2. 邀请链接: 查询经销商信息→构建含tracking参数的落地页URL→返回HTML（含招商介绍+注册表单+信任背书）
  3. 招商画册: 查询经销商信息→构建翻页式电子画册(品牌故事/产品矩阵/合作政策/成功案例)→返回HTML
  4. 企微模板: 查询经销商信息→构建标准化话术(打招呼/邀请理由/链接/跟进建议)→返回纯文本
  5. 裂变追踪: 跟踪分享link打开→注册→签约→运营，记录裂变层级和转化率
quality_gate:
  score: 7
  checks:
    - "分享海报支持预览(inline)和下载(attachment)两种模式"
    - "邀请链接含tracking参数，支持裂变归因"
    - "招商画册含品牌故事/产品矩阵/合作政策/成功案例四板块"
    - "企微模板防XSS，字段缺失自动跳过"
    - "裂变追踪覆盖打开→注册→签约→运营全链路"
  reusable_by: ["芯森态招商系统", "经销商裂变体系", "分销招募产品线"]
status: active

products:
  - 通用: 自动匹配
created_at: "2026-06-10"
product: "芯森态"
