one_liner: 必须先成就他人才能成就自己——链客宝用此原则筛选入驻企业，只接纳具有"成人"基因的诚信商家

products:
  - 链客宝: 自动匹配
what_it_does: 必须先成人（成就他人），才能达己（成就自己），顺序不可颠倒。链客宝在审核入驻企业时，核心指标不是企业规模，而是"成人意愿"——该企业是否愿意先为需求方提供价值，再考虑自己的利润。筛选标准包括：是否有免费咨询/试用服务、历史客户评价的利他程度、定价是否合理。只接纳"先成人"的企业入驻，淘汰"先达己"的商家，从源头保证平台生态的健康。
input:
  - 入驻申请: 企业资料/服务描述/定价
  - 历史评价: 客户反馈/利他行为
  - 服务流程: 是否提供免费咨询/试用
output:
  - 成人意愿评分: 1-10分
  - 入驻审批: 通过/拒绝/建议改进
  - 平台成人率: 入驻企业的成人意愿分布
sop: |
  1. 入驻申请时提交"成人案例"：过去帮助了哪些客户、怎么帮的
  2. AI分析申请资料提取"成人意愿"信号（免费服务/首发优惠/价值前置）
  3. 成人意愿评分<5分直接拒绝入驻
  4. 入驻后的前3个月监测实际行为与申请资料的一致性
  5. 发现"宣称成人实际逐利"的企业黄牌警告
  6. 月度平台成人率作为核心运营KPI
quality_gate:
  - score: 7/10
  - checks:
    - 成人意愿评分有明确维度
    - 入驻门禁已嵌入审批流程
    - 前后一致性监测机制运行
