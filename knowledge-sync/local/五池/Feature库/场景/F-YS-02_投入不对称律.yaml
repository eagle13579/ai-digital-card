one_liner: 早期核心会员以时间/智力投入为主、后期会员以资金投入为主，设计链客宝的分层会员体系与权益分配

products:
  - 链客宝: 自动匹配
what_it_does: 链客宝的会员体系中，早期种子用户投入的是信任和时间（测试产品、反馈意见），后期会员投入的是资金。此Feature将投入不对称律应用于会员等级设计——早期会员获得更高权益倍数（股权/分红权）作为承担不确定性的回报，后期会员享受成熟产品和稳定服务。让每个阶段的会员投入产出比合理，避免"早期贡献被稀释"的不满。
input:
  - 会员注册时间: 阶段判定
  - 累计投入类型: 时间/智力/资金/资源
  - 贡献记录: 邀请/反馈/成交数据
output:
  - 会员等级 + 权益倍数
  - 投入类型分布雷达图
  - 权益领取建议
sop: |
  1. 会员注册时按时间窗口判定阶段（种子期/成长期/成熟期）
  2. 种子期（首批100人）：权益倍数3x，享分红权+投票权
  3. 成长期（100-1000人）：权益倍数2x，享分红权
  4. 成熟期（1000+人）：权益倍数1x，享标准服务
  5. 贡献值=时间投入权重×2 + 智力投入权重×2 + 资金投入权重×1
  6. 每月刷新投入类型分布并展示给会员
quality_gate:
  - score: 7/10
  - checks:
    - 会员阶段划分有明确时间窗口
    - 权益倍数差异合理（不大于3倍）
    - 投入类型权重正确定义
