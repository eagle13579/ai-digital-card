id: F-CJ-HYQT-01
name: N型阶梯趋势洗盘再攻模型
dimension: 场景
domain: 龙头战法·趋势结构
description: >-
  N型三阶段: 涨停→缩量洗盘(不破起点)→突破前高再涨停。
  核心: 洗盘日缩量不破首板起点=主力未出货, 突破前高放量=确认。
  实战来源: 和远气体(002971) 2026年4-6月
source_model: 和远气体002971

products:
  - 通用: 自动匹配
signals:
  - "P1首板涨停: 放量涨停, 封板时间早, 量比>2x"
  - "P2洗盘: 1-3日调整, 量缩至首板50%以下, 最低不破首板起点"
  - "P2关键: 缩量不破起点=主力锁仓, 放量下跌=主力出货"
  - "P3突破: 放量突破前高(量比>1.5x), 确认N型完成"
  - "P4加速: 突破后缩量加速=趋势确认, 放量滞涨=趋势末端"

sop:
  - "Step 1: 识别首板放量涨停→加入观察"
  - "Step 2: 等待洗盘→确认缩量+不破起点=安全"
  - "Step 3: 突破前高放量=买入信号"
  - "Step 4: 加速段持有, 放量不涨停=卖出"

quality_gate:
  score: 8
  checks:
    - "洗盘必须缩量(量<首板50%)"
    - "洗盘最低不破首板涨停价"
    - "突破必须放量(量比>1.5x)"

iteration_log:
  - "2026-06-13: v1.0 从和远气体走势中吸收"
