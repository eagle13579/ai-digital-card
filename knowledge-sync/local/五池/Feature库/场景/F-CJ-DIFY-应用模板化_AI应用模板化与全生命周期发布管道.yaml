feature_id: "F-CJ-DIFY-应用模板化"
name: "AI应用模板化与全生命周期发布管道"
version: "1.0.0"
dimension: "场景"
source_model: "dify/应用模板化与发布管理"
# 精确source_model溯源 (2026-06-12): * 2026-06-12: 来源待进一步溯源
created_at: "2026-06-08"
author: "白泽 (向海容授权自动扫描吸收)"

one_liner: "从应用模板创建→配置→测试→发布→监控→迭代的全生命周期管理管道，支持聊天助手/Agent/工作流/知识库问答等多种应用类型的一键模板化部署"

products:
  - 通用: 自动匹配
what_it_does: |
  场景：企业需要快速构建和发布AI应用（聊天助手/客服机器人/文档问答/自动化工作流），且需要持续迭代。
  问题：每个AI应用从零搭建，重复配置LLM/知识库/提示词；发布流程不规范，缺少灰度/回滚/监控；迭代版本混乱。
  价值：Dify的应用模板化与发布管道证明了「AI应用可以像建站一样模板化」——从类型选择→模板填充→配置→测试→发布→监控→迭代，全生命周期标准化管理，将AI应用交付周期从天级缩短到小时级。

  核心场景模式：
  - 应用类型体系：聊天助手(Chatbot) | Agent | 工作流(Workflow) | 知识库问答(KB QA) | 文本生成(Completion)
  - 模板化创建：每种应用类型有标准化模板，用户只需填充核心配置
  - 提示词工程内置：系统提示词+变量注入+Few-shot示例的标准化编辑界面
  - 沙箱测试环境：发布前在隔离环境测试，验证效果后再发布到生产
  - 版本管理：每次编辑自动生成新版本，支持版本对比/回滚/发布
  - 访问控制：API密钥管理/白名单/速率限制/日志审计
  - 应用市场：可导出为应用模板分享/复用

input: |
  - 应用需求描述: 要构建的AI应用类型+业务场景
  - 应用类型: 聊天助手|Agent|工作流|知识库问答|文本生成
  - 配置内容:
    - LLM选择+参数配置
    - 提示词模板(系统提示+变量+Few-shot)
    - 知识库关联(如果需要)
    - 工具集配置(如果是Agent)
    - 工作流DAG(如果是工作流应用)
  - 发布策略: 直接发布|灰度发布|A/B测试
  - 运维需求: 访问控制/日志/监控/告警配置

output: |
  - 应用蓝图: 完整的应用配置定义（可导出为模板）
  - 测试报告: 沙箱环境测试结果+边界Case覆盖
  - 版本管理记录: 版本号+变更日志+发布时间戳
  - 发布清单: 灰度比例/访问控制/API密钥/速率限制
  - 监控看板: 调用量/延迟/错误率/Token消耗/成本
  - 迭代路线图: 基于使用数据的优化建议列表

sop: |
  1. 确定应用类型：匹配用户需求到5种标准应用类型之一
  2. 选择/创建模板：从模板库选择或从零创建
  3. 应用配置：
     a. 选择LLM模型+配置参数
     b. 编辑系统提示词+变量定义+Few-shot示例
     c. 关联知识库（如需要）
     d. 配置工具集（如Agent）
     e. 编排工作流DAG（如工作流应用）
  4. 沙箱测试：在隔离环境用测试用例验证应用效果
  5. 发布配置：设置访问控制/速率限制/灰度比例
  6. 发布到生产：生成API端点+Web界面+嵌入代码
  7. 配置监控：调用量/延迟/错误率/成本看板
  8. 收集使用数据 → 生成迭代建议 → 进入下一轮迭代

quality_gate:
  - gate: "模板覆盖度"
    standard: "5种标准应用类型至少有1个可复用的模板"
    score: 7
  - gate: "沙箱测试通过率"
    standard: "发布前至少10个测试用例全部通过"
    score: 7
  - gate: "版本可回滚"
    standard: "最近5个版本可一键回滚，回滚时间≤30秒"
    score: 7
  - gate: "发布后监控"
    standard: "发布后自动激活监控看板，包含至少5个指标"
    score: 6

score_target: "8/10"
depends_on:
  - "F-场景-01_用户场景MECE拆解"
  - "F-TX-DIFY-DAG工作流_DAG可视化工作流编排引擎"
enhanced_by:
  - "F-JBG-DIFY-多模型适配器_多模型适配器与提供商抽象层"
  - "F-CJ-需求原点_需求原点"

