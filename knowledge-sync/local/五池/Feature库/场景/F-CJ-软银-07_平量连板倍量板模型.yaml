feature_id: F-CJ-软银-07
name: 平量连板倍量板模型（天娱数科型）
version: "1.0"
dimension: 场景
source_model: 2026-06-10 向海容实战复盘
one_liner: 前2板平量涨停，第3板放量涨停，量能阶梯放大确认强度

products:
  - 通用: 自动匹配
what_it_does: 识别并量化该模式
sop: |
  Phase 1 — 平量确认
  首板涨停成交量温和（平量或略放量）
  第2板成交量与首板接近（平量）
  Phase 2 — 倍量板
  第3板成交量放大至前板的1.5倍以上
  封板时间早（30分钟内）
  换手率>10%且<25%（有效放量非出货量）
  Phase 3 — 确认
  3板封死后不打开
  净流入为正
quality_gate:
  score: 7
  checks:
    - 基于实战数据验证
