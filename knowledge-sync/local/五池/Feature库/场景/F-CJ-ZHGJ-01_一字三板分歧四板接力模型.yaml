id: F-CJ-ZHGJ-01
name: 一字三板分歧四板接力模型
dimension: 场景
domain: 龙头战法框架
description: >-
  个股连续3个一字涨停板(振幅=0)后，在第4板出现巨量分歧换手(量比>10x)但依然封板，
  确认分歧非出货而是换手接力的极端控盘→换手接力模式。
  核心信号: 一字三板期间量能正常偏小(<2x)，分歧日巨量(>10x前日)但不破板。
source_model: 中化国际600500 (2026-06-08~06-12)

products:
  - 通用: 自动匹配
signals:
  - "P1-P3: 连续3个一字板(振幅=0), 量能逐步缩小或持平"
  - "P4分歧: 第4板放量>10x前日(巨量换手), 但振幅仍<10%"
  - "P4分歧: 开板可回封(非全天一字但最终封板)"
  - "巨量分歧日换手率>10%但<30%(健康换手区间)"
  - "分歧日次日: 如果缩量则分歧转一致=后续仍有空间"
sop:
  - "Step 1: 确认P1-P3 — 连续3个一字板, 振幅=0, 量比稳定"
  - "Step 2: 监控P4分歧 — 放量>10x是否为出货?"
  - "Step 3: 判断分歧性质 — 放量但最终封板=健康分歧(接力); 放量不封板=出货"
  - "Step 4: 分歧日次日—缩量=转一致; 继续放量=分歧持续危险"
  - "进入条件: P1-P3连续一字确认"
  - "持有条件: P4分歧日换手<30%且封板"
  - "退出条件: P4放量不封板/次日低开不修复"
signal_weights:
  p1_p3_yizi_consistency: 0.20    # 前3板一字稳定性
  p4_divergence_volume: 0.30      # 分歧日量比
  p4_recovery_strength: 0.30      # 回封力度
  p5_reconsensus: 0.20           # 分歧次日缩量=转一致
thresholds:
  p1_p3_amplitude: [0.0, 0.5]     # 前3板振幅近似0
  p4_volume_ratio_min: 10.0       # 分歧日量比>10x
  p4_turnover_max: 30.0           # 分歧日换手<30%
  p4_amplitude_max: 10.0          # 分歧日振幅<10%
source_stock: 中化国际(600500)
source_data: |
  日期       | 收盘  | 涨跌幅  | 成交量    | 连板 | 量比前日 | 振幅 | 阶段
  2026-06-09 | 5.95 | +9.98% | 406,417   | 1板  | 0.46x   | 1.8% | P1首板(近一字)
  2026-06-10 | 6.55 | +10.08%| 314,388   | 2板  | 0.77x   | 0%   | P2一字
  2026-06-11 | 7.21 | +10.08%| 388,870   | 3板  | 1.24x   | 0%   | P3一字
  2026-06-12 | 7.93 | +9.99% | 5,777,932 | 4板  | 14.86x  | 6.2% | P4分歧(巨量)
  P1-P3: 3板量能递减(406→314→388K)
  P4: 巨量14.86x, 振幅6.2%(有开板但回封), 换手率约15%
distinct_from:
  - F-CJ-SQLS-01              # 宿迁: 4板无分歧; 中化: 第4板巨量分歧
  - F-CJ-HLB-01               # 海亮: 2板即T板; 中化: 3板后才分歧
  - F-CJ-FGGP-01              # 福光: 全程换手板; 中化: 一字后分歧
related_patterns:
