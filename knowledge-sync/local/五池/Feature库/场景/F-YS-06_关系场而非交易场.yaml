one_liner: 在链客宝内创建无利差的社交空间，让信任在交易之外自然生长，反哺交易效率

products:
  - 链客宝: 自动匹配
what_it_does: 最好的关系不是在有利可图的地方建立的，是在没利润的地方自然长出来的。链客宝不仅是一个交易平台，更是一个企业家社群——通过线上共享花园（行业话题讨论）、线下茶局（无商业目的的聚会）、读书会（共同学习），让企业家在交易之外建立真实关系。关系建立后，交易变成顺带的事——女朋友主动要你买礼物，和你主动给她买礼物，性质完全不同。
input:
  - 社区活动: 读书会/茶局/行业讨论记录
  - 参与者: 企业家档案/兴趣标签
  - 关系链: 互动频率/深度
output:
  - 无利差空间活动日历
  - 企业家兴趣匹配推荐（非商业）
  - 关系强度指数
sop: |
  1. 每月策划1次无商业目的线上话题夜（不卖产品、不推服务）
  2. 每季度组织1次线下茶局（仅限平台认证企业家）
  3. 关系强度=非商业互动频率×互动深度（话题相关性）
  4. 关系强度>7/10的企业家自动获得"信任伙伴"标签
  5. 信任伙伴之间的商业对接走快速通道
  6. 关系场互动数据不用于商业推荐，保持纯净
quality_gate:
  - score: 7/10
  - checks:
    - 每月至少1次无商业目的的社区活动
    - 关系强度指数可量化
    - 关系场数据与交易数据隔离
