version: "1.0"
dimension: 场景
source_model: 儒商联盟原子4 营销三环节飞轮
source: yishang-alliance
relevance: 链客宝
maturity: 7.0
tags:
  - 儒商联盟
  - 营销飞轮
  - 链客宝
  - AI匹配
one_liner: 三环节(获取流量→供需匹配→成交)×AI提升匹配精度，为链客宝构建营销效率飞轮

products:
  - 链客宝: 自动匹配
what_it_does: 企业营销=获取流量→供需匹配→成交，前两环消耗80%成本但不创造价值。链客宝AI的核心价值不在创意，而在匹配精度——通过96%命中率的AI企业营销匹配引擎，大幅降低供需匹配环节的成本，让企业花更少时间找客户、花更多时间成交。成交率的提升会反哺获取流量环节（口碑传播），形成飞轮效应。
input:
  - 企业画像: 产品/服务/目标客群/预算
  - 需求方画像: 需求/预算/决策链
  - 历史成交数据: 匹配/转化记录
output:
  - AI匹配建议: 最优供需对推荐
  - 匹配效率报告: 获取成本/匹配时间/成交率
  - 飞轮加速建议: 基于数据的优化方向
sop: |
  1. 采集企业端和需求端的结构化画像
  2. AI匹配引擎计算供需匹配度得分（基于自然语义+行业知识库）
  3. 高匹配度（>80%）的供需对自动推送提醒
  4. 统计每个企业的营销三环节效率（流量获取成本/匹配时间/成交率）
  5. 成交率提升自动触发推荐位权重增加
  6. 每月输出飞轮健康度报告
quality_gate:
  - score: 7/10
  - checks:
    - AI匹配命中率≥85%
    - 三环节效率数据可追踪
    - 飞轮效应可量化（成交率提升→曝光增加）
iteration_log:
