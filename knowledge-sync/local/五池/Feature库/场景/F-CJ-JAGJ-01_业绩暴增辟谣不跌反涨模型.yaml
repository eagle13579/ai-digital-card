id: F-CJ-JAGJ-01
name: 业绩暴增·辟谣不跌反涨模型
dimension: 场景
domain: 龙头战法·业绩驱动
description: >-
  行业周期反转+业绩暴增(增速>1000%)+创历史新高=最硬的上涨逻辑。
  核心特征: 公司辟谣后不跌反涨=买盘远大于卖盘的极度强势信号。
  实战来源: 金安国纪(002636) 2026年4月-6月, 年内涨幅超400%
source_model: 金安国纪002636 (2026-05-28~06-12)

products:
  - 通用: 自动匹配
signals:
  - "P-1 行业周期启动: 覆铜板/铜箔连续涨价, 板块整体走强"
  - "P-1 趋势启动: 沿20日线温和攀升, 日均换手3-8%, 无涨停但涨幅稳定"
  - "P0 技术突破: 放量突破前高(量比>2x), 确认加速"
  - "P1 业绩首板: 净利润增速>1000%预告发布→涨停创历史新高"
  - "P1 创历史新高关键: 突破历史最高点=无套牢盘=上涨无阻力"
  - "P2 T字换手: 换手率<15%+振幅<8%+回封速度<30分钟=健康接力"
  - "P3 辟谣不跌: 公司二度澄清公告发布后股价不跌反涨=最强买入信号"
  - "P3 辟谣不跌原理: 买的人太多(业绩太硬), 卖的人不够(无套牢盘)"

sop:
  - "Step 1: 扫描行业周期反转信号 → 覆铜板/铜箔/化工等连续涨价"
  - "Step 2: 筛选率先走趋势的个股(沿20日线攀升+换手3-8%)"
  - "Step 3: 监控业绩预告 → 净利润增速>1000% + 创历史新高 = 强信号"
  - "Step 4: T字板日确认换手率<15%+振幅<8%=健康接力, 持有"
  - "Step 5: 辟谣日观察: 辟谣后不跌=加仓信号, 辟谣后下跌=减仓"
  - "Step 6: 顶部信号: 放巨量不涨停+换手>20%+辟谣开始起作用"

quality_gate:
  score: 8
  checks:
    - "业绩增速必须>500% (太低不够震撼)"
    - "创历史新高是必要条件(无套牢盘逻辑)"
    - "辟谣后必须观察当日分时(不跌反涨=确认)"
    - "T字板换手<15%为健康, >20%为危险"

iteration_log:
  - "2026-06-13: v1.0 从金安国纪400%涨幅中吸收"
