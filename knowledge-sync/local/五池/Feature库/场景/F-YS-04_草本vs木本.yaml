name: 草本vs木本 — 链客宝商业分类加速器
version: "1.0"
dimension: 场景
source_model: 儒商联盟原子1 草本vs木本商业分类
source: yishang-alliance
relevance: 链客宝
maturity: 7.0
tags:
  - 儒商联盟
  - 草本vs木本
  - 链客宝
  - 商业分析
one_liner: 将平台上所有企业按草本(零复购)vs木本(持续复购)分类，指导链客宝的资源分配和增长策略

products:
  - gaia-commercial: 自动匹配
what_it_does: 链客宝入驻的企业可分为草本型（一次成交即结束）和木本型（持续复购，如企业营销服务）。此Feature帮助企业主和平台运营者识别自己的商业类型，对草本型企业引导转型木本策略（如增加增值服务），对木本型企业加大平台资源倾斜。平台层面，木本型企业占比提升意味着LTV更高，平台收入更稳定。
input:
  - 企业信息: 产品类别/客单价/复购周期
  - 历史成交: 成交次数/间隔/金额
  - 行业标签: 所属行业
output:
  - 商业类型标签: 草本/木本/混合型
  - 木本化建议: 具体转型路径
  - 平台木本率: 月度趋势
sop: |
  1. 新企业入驻时自动评估商业类型（复购周期<6月→木本，>12月或无复购→草本）
  2. 草本型企业推送木本化建议（增加订阅/增值服务/会员制）
  3. 木本型企业获平台优先推荐位和运营支持
  4. 月度统计平台木本率（木本型企业占比）
  5. 木本率季度目标设为运营KPI
  6. 季度复盘：木本型企业的LTV vs 草本型的对比分析
quality_gate:
  - score: 7/10
  - checks:
    - 分类标准明确（复购周期阈值）
    - 木本化建议有实操性
    - 月度木本率趋势看板
iteration_log:
