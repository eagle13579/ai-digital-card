one_liner: 链客宝初期向企业提供免费价值（AI营销诊断/市场报告），建立信任后再引导付费，替代"先收费后服务"的传统模式

products:
  - 链客宝: 自动匹配
what_it_does: 刚开始必须付出，不能什么都算清楚账。链客宝对新入驻企业提供3项免费服务：AI营销诊断报告（价值2000元）、行业市场趋势分析、1次免费供需匹配对接。企业体验到真实价值后再引导升级到付费会员。检验标准：敢不敢在没出结果之前不收钱？敢就是种庄稼，不敢就是割韭菜。这种"先付出"策略虽然短期让利，但长期建立的是不可替代的信任资产。
input:
  - 新入驻企业信息: 行业/规模/需求
  - 免费服务使用记录: 使用次数/效果
  - 企业满意度: 使用后反馈评分
output:
  - 免费服务清单及使用状态
  - 免费转付费时机建议（基于效果感知）
  - 信任转化率（免费→付费）
sop: |
  1. 新企业入驻自动激活3项免费服务体验包
  2. 每项免费服务完成后收集企业满意度反馈
  3. 当企业完成2项+免费服务且满意度≥8/10时，推送付费会员方案
  4. 付费方案说明"为什么收费"而非"有什么功能"
  5. 统计免费→付费转化漏斗：曝光→体验→满意→付费
  6. 转化率标杆：体验满意用户中付费率应≥30%
quality_gate:
  - score: 7/10
  - checks:
    - 免费服务有实际价值（非鸡肋）
    - 转化时机有数据支撑（满意度触发）
    - 免费→付费转化漏斗可追踪
