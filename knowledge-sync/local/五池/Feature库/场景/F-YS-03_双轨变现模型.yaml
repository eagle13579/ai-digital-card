one_liner: 路线A(分销分成)+路线B(自研增值)双轮驱动，构建链客宝短期现金流+长期护城河

products:
  - 链客宝: 自动匹配
what_it_does: 链客宝的商业模式采用双轨变现：A轨=撮合成交的佣金分成（快速现金流，匹配场景的天然收入），B轨=自研AI企业营销工具/数据分析服务（长期壁垒）。A轨养活B轨，B轨反哺A轨的用户粘性。双轨不可偏废——缺A活不过今天，缺B活不过明天。
input:
  - 平台交易流水: A轨分成基数
  - 用户需求洞察: B轨产品方向
  - 行业内同类产品定价: 参考基准
output:
  - A轨分成比例建议
  - B轨产品定价方案
  - 双轨收入结构看板
sop: |
  1. 统计链客宝月撮合交易额，按行业标准设定分成比例（3-8%）
  2. A轨收入自动计提，每月结算打款
  3. 基于用户需求分析，确定B轨产品方向（如AI营销诊断报告）
  4. B轨产品按SaaS模式定价（基础版免费/专业版付费）
  5. 月度双轨收入对比看板自动生成
  6. 当A轨收入占比>80%时触发B轨加速警报
quality_gate:
  - score: 7/10
  - checks:
    - A轨分成比例透明可查
    - B轨至少1个付费产品在线
    - 双轨收入占比月度追踪
iteration_log:
