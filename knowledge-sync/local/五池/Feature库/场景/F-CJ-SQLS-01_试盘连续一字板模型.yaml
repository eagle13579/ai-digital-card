id: F-CJ-SQLS-01
name: 试盘-连续一字板模型
dimension: 场景
domain: 龙头战法框架
description: >-
  个股在启动前出现放量试盘阳线(冲高回落或中阳)，然后连续N个一字涨停板，
  所有涨停振幅为零(开盘=收盘=最高=最低)，量能呈V型结构。
  核心特征：无量上涨(没人卖得出去)，只在分歧日有放量换手。
  本质是重大利好/强逻辑驱动的极致控盘模式。
source_model: 宿迁联盛603065 (2026-06-08~06-12)

products:
  - 通用: 自动匹配
signals:
  - "P-1试盘日: 涨停前一交易日出现放量阳线(量能>2x平日均值)，可能有上影线"
  - "P0首板: 一字涨停板，成交量骤缩至前日<20%(量比<0.2x)，全天无交易"
  - "P1一致: 第2板继续一字缩量(量比<1x)，振幅=0，浮筹彻底锁定"
  - "P2分歧: 第3板一字板但放量(量比>2x)，有人开始兑现，但封单接住"
  - "P3转一致: 第4板再次缩量(量比<1x)，分歧日后的认同确认"
  - "整体: 所有涨停振幅=0，无T板/无开板/无盘中震荡"
sop:
  - "Step 1: 识别P-1试盘日 — 涨停前放量阳线，量>2x均值，可能有上影线"
  - "Step 2: 确认P0首板一字 — 振幅=0，量比<0.3x，确认进入连续一字模式"
  - "Step 3: 跟踪P1-P3 — 每日检查振幅是否=0，量比变化"
  - "进入条件: P0确认一字板+振幅=0+量比<0.3x"
  - "持有条件: 每日振幅=0且封板"
  - "退出条件: 出现T板(振幅>0)或放量开板=模式终结"
signal_weights:
  p_minus1_trial_volume: 0.15    # 试盘日量能
  p0_yizi_volume_shrink: 0.25    # 首板缩量程度
  p2_divergence_volume: 0.20     # 分歧日放量换手
  p3_reconsensus_volume: 0.20    # 再次缩量=一致确认
  zero_amplitude_days: 0.20      # 0振幅天数(越长越强)
thresholds:
  p_minus1_volume_ratio: [2.0, None]     # 试盘量>2x均值
  p0_volume_ratio: [0.0, 0.3]            # 首板量比<0.3x
  p2_volume_ratio: [2.0, 5.0]            # 分歧日量比2-5x
  p3_volume_ratio: [0.0, 1.0]            # 转一致量比<1x
  max_consecutive_yizi: [3, 7]            # 连续一字板3-7天
source_stock: 宿迁联盛(603065)
source_data: |
  日期       | 收盘   | 涨跌幅   | 成交量   | 连板 | 量比前日 | 振幅 | 阶段
  2026-06-08 | 9.25  | +0.87%  | 319,548  | -    | -       | 6.5% | P-1试盘
  2026-06-09 | 10.20 | +10.27% | 54,674   | 1板  | 0.17x   | 0%   | P0首板
  2026-06-10 | 11.24 | +10.20% | 36,743   | 2板  | 0.67x   | 0%   | P1一致
  2026-06-11 | 12.36 | +9.96%  | 128,522  | 3板  | 3.50x   | 0%   | P2分歧
  2026-06-12 | 13.60 | +10.03% | 98,637   | 4板  | 0.77x   | 0%   | P3转一致
  P-1: 放量试盘(319K), 上影线(9.41), 量能远超平日
  P0: 一字板, 量比0.17x(极缩), 换手~0.4%
  P2: 分歧日, 量比3.50x(放量), 但振幅仍=0
  总市值: 56.98亿, 流通市值: 56.98亿(全流通)
distinct_from:
