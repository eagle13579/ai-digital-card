products:
  - 链客宝: 自动匹配
what_it_does: 链客宝的核心价值是连接企业产品与需求方。信任基础设施Feature让双方在交易前就能建立信任认知——通过对企业资质的多维验证、历史成交记录的可信展示、以及利他指数的量化，降低匹配环节的信任摩擦，提升成交转化率。
input:
  - 企业端: 资质文件/历史成交/客户评价/利他行为记录
  - 需求端: 需求描述/预算/决策标准
output:
  - 信任评分 (0-100): 企业综合信任指数
  - 信任标签: 已认证/口碑优质/高利他等标识
  - 匹配推荐: 基于信任过滤的商机推荐列表
sop: |
  1. 企业注册时采集基本资质信息（营业执照/行业资质）
  2. 链客宝AI审核资质真实性并生成初始信任分（50分基线）
  3. 每次成功成交后，双方互评并更新信任分
  4. 记录利他行为（主动分享/帮助他人/额外服务）并加分
  5. 信任分≥80的企业获得"儒商认证"标签
  6. 需求方搜索时默认按信任分排序展示企业
  7. 定期复检（每季度）：信任分低于阈值的企业触发复审
quality_gate:
  - score: 7/10
  - checks:
    - 信任评分模型有明确计算公式
    - 至少3个维度（能力/诚实/利他）覆盖
    - 评分可被企业查看并申诉
