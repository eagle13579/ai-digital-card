id: F-CJ-HLB-01
name: 三阶量价递进启动模型
dimension: 场景
domain: 龙头战法框架
description: >-
  个股在启动前经历三阶量价递进：P1蓄势(温和放量小阳攀升)→P2加速(缩量一字板)
  →P3高潮(放量T板换手接力)。全程无洗盘回调，逐级加速。
  区别于N型阶梯(有洗盘回调)，这是一个"直接启动-加速-高潮"的连续突破模式。
source_model: 海亮股份002203 (2026-06-08~06-12)

products:
  - 通用: 自动匹配
signals:
  - "P1蓄势: 3-5天温和放量阳线攀升，无涨停，累计涨幅5-15%"
  - "P1振幅逐日收窄: 浮动筹码减少，主力高度控盘"
  - "P2加速: 缩量一字涨停板，开盘=收盘=最高=最低，成交量萎缩30-50%"
  - "P3高潮: T字放量涨停板，开盘涨停→盘中开板→回封涨停"
  - "T板换手率<15%为健康(<5%为极健康)，承接有力非出货"
  - "P3成交量较P2放大2-4倍(健康量比)"
sop:
  - "Step 1: 识别P1 — 连阳(3-5天)无涨停，量价齐升，振幅收窄"
  - "Step 2: 确认P2 — 出现一字涨停板，缩量(量比前日<0.7x)"
  - "Step 3: 验证P3 — T板放量但换手<15%，回封时间<30分钟"
  - "进入条件: P1累计涨幅5-15% + P2缩量一字板 + P3T板换手健康"
  - "退出条件: T板换手>20%或封板失败=高潮转衰退"
signal_weights:
  P1_amplitude_narrowing: 0.20    # 振幅收窄=筹码收敛
  P2_yizi_board_shrink: 0.30     # 一字板缩量=主力高度控盘
  P3_t_board_recovery: 0.35      # T板回封=承接力
  P3_turnover_health: 0.15       # 换手率<15%=健康
thresholds:
  p1_days: [3, 5]
  p1_total_gain: [5.0, 15.0]
  p2_volume_ratio: [0.3, 0.7]    # P2量/前日量
  p3_volume_ratio: [2.0, 4.0]    # P3量/P2量
  p3_turnover: [0.0, 15.0]       # P3换手率上限
source_stock: 海亮股份(002203)
source_data: |
  日期       | 收盘   | 涨跌幅 | 成交量   | 连板 | 阶段
  2026-06-08 | 17.90 | +1.3%  | 417,877  | -    | P1蓄势
  2026-06-09 | 18.86 | +5.36% | 367,729  | -    | P1蓄势
  2026-06-10 | 19.37 | +2.70% | 449,132  | -    | P1蓄势
  2026-06-11 | 21.31 | +10.02%| 268,346  | 1板  | P2加速(缩量一字)
  2026-06-12 | 23.44 | +10.00%| 1,025,318| 2板  | P3高潮(T板放量)
  P1: 3天累计+9.6%, 振幅3.9%→1.6%
  P2: 一字板, 量比0.60x(缩量), 换手率~1.2%
  P3: T板, 量比3.82x(放量), 换手率4.63%(极健康)
compose:
  - F-PAT-VolumeLadder        # 量价阶梯(上层框架)
  - F-PAT-StaircaseVolume     # 阶梯式放量(量价验证)
distinct_from:
  - F-PAT-NTypeLadderSystem   # N型有洗盘回调，本模式无回调直接递进
  - F-CJ-SQLS-01              # 宿迁: 连续一字全振幅=0; 本模式有T板有振幅
cross_ref:
  - F-CJ-SQLS-01              # 同属一字板家族但形态不同
related_stock_cases:
  - 海亮股份(002203) 2026-06
  - 宗申动力(001696) 2026-04
  - 和远气体(002971) 2026-04
