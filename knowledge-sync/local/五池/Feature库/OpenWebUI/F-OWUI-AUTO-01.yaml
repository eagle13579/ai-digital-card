id: F-OWUI-AUTO-01
name: Scheduled Automation Engine with LLM Execution
source_model: Open WebUI Automation System (automations.py 14.4KB + 21.7KB utils) — 定时自动化+LLM执行+后台Worker循环
dimension: 创造力

products:
  - 通用: 自动匹配
description: >-
  定时自动化引擎: 用户可以创建自动化规则(rrule定时表达式)，在指定时间自动调用
  LLM执行预设任务(生成报告/发送通知/数据汇总等)。核心组件包含:
  rrule解析器、Worker后台循环(automation_worker_loop)、执行记录追踪、
  终端(terminal)集成和CWD管理。自动化运行在独立后台进程，不阻塞用户操作。
input: rrule定时表达式 + LLM模型ID + 关联工具 + 执行指令
output: 自动化执行结果(聊天消息/终端输出/通知)
sop: "① 创建: AutomationForm(id/content/meta/rrule/tools) → 写入automations表
  ② 调度: automation_worker_loop() 循环检查到期 → 解析rrule → 触发执行
  ③ 执行: execute_automation(app, automation) → 调用LLM+工具 → 结果写入指定位置
  ④ 记录: AutomationRun表追踪每次执行(状态/输出/耗时/错误)
  ⑤ 重试: 失败自动重试3次 + 错误日志完整"
quality_gates: rrule解析支持标准RRULE格式、Worker循环<1s检测间隔、执行超时<300s、失败告警
created_at: '2026-06-13'
iteration_count: 1
last_score: 8
application_scope: 数字员工自主执行引擎/中国软银定时策略扫描/链客宝自动化报表/AI招商周期性线索挖掘
