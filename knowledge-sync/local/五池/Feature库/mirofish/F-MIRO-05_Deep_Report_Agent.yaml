feature_id: F-MIRO-05
feature_name: Deep Interaction ReportAgent
feature_type: 心智模型 / Cognitive Model
version: 1.0.0
created: 2026-06-15
author: MiroFish盛大集团群体智能引擎

# ============================================================
# 核心理念
# ============================================================

products:
  - 通用: 自动匹配
core_concept: >
  Agent不是静态生成报告，而是动态与模拟后环境交互。
  报告Agent拥有工具集，可主动查询Agent记忆、事件记录和时空数据。

# ============================================================
# MiroFish实现
# ============================================================
mirofish_implementation:
  description: >
    ReportAgent不是简单的聚合报告生成器，而是一个拥有
    自主交互能力的分析型Agent。它在模拟完成后主动「进入」
    模拟后环境，通过工具调用查询各个Agent的记忆、事件时间线、
    网络交互记录和时空数据。这种深度交互式分析能够发现
    表面数据无法揭示的深层模式和因果关系。
  tool_set:
    - agent_memory_query: 查询特定Agent的长期记忆内容
    - event_timeline: 获取模拟中的关键事件时间线
    - social_network_analyzer: 分析Agent社交网络结构
    - spatio_temporal_query: 时空数据查询
    - sentiment_tracker: 群体情绪变化追踪
    - causal_chain_discovery: 因果链发现
  interaction_modes:
    - 多轮查询: ReportAgent可根据初步结果进行追问
    - 假设验证: 主动提出假设并通过工具验证
    - 模式发现: 从多维度数据中自动发现模式

# ============================================================
# 映射盖娅进化大脑
# ============================================================
mapping_to_gaiya:
  description: >
    映射白泽的认知进化引擎（不是静态分析，而是动态交互式分析）
  baize_analogy:
    - 白泽认知进化引擎 → MiroFish ReportAgent
    - 白泽动态分析 → MiroFish的交互式查询
    - 白泽深度洞察 → MiroFish的模式发现
  analogy: >
    正如白泽的认知进化引擎不是静态分析报告，
    而是通过与数据和环境动态交互不断进化认知，
    MiroFish的ReportAgent也是一个动态交互的分析引擎，
    主动探索模拟数据，发现隐藏的模式和因果关系。

# ============================================================
# 适用场景
# ============================================================
applicable_scenarios:
  - 深度归因分析: 从模拟结果中追溯根本原因
  - 反事实推理: 交互式探索「如果...会怎样」场景
  - 多维数据探索: 从Agent记忆/事件/社交关系多维度分析
  - 因果发现: 识别群体行为中的因果关系链
  - 自动洞察生成: 自主发现模拟中的非预期模式

# ============================================================
# 心智模型详细描述
# ============================================================
mental_model_detail:
  name: Deep Interaction ReportAgent (深度交互报告引擎)
  level: L5孵化室 - 核心心智模型
  description: >
    传统的模拟分析是「运行→收集数据→生成报告」的线性流程。
    ReportAgent突破了这一局限：
    它将报告生成从一个被动聚合过程转变为一个主动探索过程。
    通过赋予Agent工具集和环境交互能力，它能够像人类分析师
    一样不断追问、验证和深入，发现深层洞察。
  principles:
    - 主动探索: 不是等待数据，而是主动查询
    - 工具辅助: 通过专门工具进行多维度分析
    - 迭代深入: 基于已有发现提出新问题
    - 交互式认知: 在「提问-验证-发现」循环中不断深入
  workflow:
    1. 模拟完成，环境就绪
    2. ReportAgent初始化（加载任务目标）
    3. 初步探查：查询关键Agent记忆和事件线
    4. 假设生成：基于初步数据形成分析假设
    5. 深度验证：通过工具调用验证假设
    6. 模式发现：识别因果关系和涌现模式
    7. 结构化报告：将发现组织为完整的分析报告
