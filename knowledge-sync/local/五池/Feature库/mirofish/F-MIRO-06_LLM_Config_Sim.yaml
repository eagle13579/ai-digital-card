feature_id: F-MIRO-06
feature_name: LLM-Configurable Simulation
feature_type: 心智模型 / Cognitive Model
version: 1.0.0
created: 2026-06-15
author: MiroFish盛大集团群体智能引擎

# ============================================================
# 核心理念
# ============================================================

products:
  - 通用: 自动匹配
core_concept: >
  AI根据预测需求自主生成模拟参数配置，非人工硬编码。
  LLM分析种子材料后自动生成完整的模拟配置方案。

# ============================================================
# MiroFish实现
# ============================================================
mirofish_implementation:
  description: >
    SimulationConfigGenerator是一个基于LLM的智能配置引擎。
    它接收预测任务描述和种子材料（新闻/数据/领域知识），
    自主分析后生成完整的模拟配置，包括：
    Agent数量、角色分布、交互规则、时间步长、终止条件等。
    整个过程无需人工干预，实现了「需求→配置」的自动闭环。
  configuration_dimensions:
    - agent_pool: 数量、角色分布、认知参数
    - environment: 平台选择、场景设置、规则定义
    - simulation: 时间步长、并行度、终止条件
    - analysis: 关注指标、报告模板、可视化配置
  generation_process:
    1. 解析预测任务描述
    2. 分析种子材料的关键要素
    3. 确定模拟范围和复杂度
    4. 自动生成JSON/YAML配置
    5. 配置合理性校验
    6. 配置优化调整

# ============================================================
# 映射盖娅进化大脑
# ============================================================
mapping_to_gaiya:
  description: >
    映射盖娅进化大脑的自主进化参数
  gaiya_analogy:
    - 盖娅自主进化 → MiroFish的LLM自动配置
    - 盖娅参数调优 → MiroFish的配置生成与优化
    - 盖娅自适应 → MiroFish的任务驱动配置
  analogy: >
    正如盖娅进化大脑能够自主调整进化参数以适应不同任务，
    MiroFish的LLM-Configurable Simulation根据预测需求
    自主生成最优模拟配置，实现从需求到模拟的自动闭环。

# ============================================================
# 适用场景
# ============================================================
applicable_scenarios:
  - 快速原型验证: 从需求直接生成模拟配置进行验证
  - 多场景批量模拟: LLM自动生成不同参数组合的配置
  - 自适应模拟: 根据初步模拟结果自动调整配置
  - 领域适配: 不同领域的模拟自动采用不同的配置策略
  - 非技术用户使用: 用户仅需描述需求，无需了解配置细节

# ============================================================
# 心智模型详细描述
# ============================================================
mental_model_detail:
  name: LLM-Configurable Simulation (LLM配置的模拟参数)
  level: L5孵化室 - 核心心智模型
  description: >
    传统模拟系统的配置依赖领域专家人工完成，耗时且主观。
    本模型用LLM替代了这一过程：LLM分析预测需求和种子材料，
    理解领域上下文，生成最优模拟配置。
    这不仅大幅降低了使用门槛，还使得配置生成过程
    更加系统化和可复现。
  principles:
    - 需求驱动: 配置完全由预测任务需求决定
    - LLM理解: LLM深度分析种子材料提取关键信息
    - 自动生成: 从需求到配置的端到端自动化
    - 可解释: 配置生成过程可追溯和审查
  workflow:
    1. 接收预测任务: "预测XX事件的发展趋势"
    2. 加载种子材料: 相关的新闻/数据/领域知识
    3. LLM分析: 提取关键实体、关系和动态
    4. 配置生成: 自动构建模拟参数
    5. 校验: 检查配置的完整性和合理性
    6. 输出: 生成可执行的模拟配置
