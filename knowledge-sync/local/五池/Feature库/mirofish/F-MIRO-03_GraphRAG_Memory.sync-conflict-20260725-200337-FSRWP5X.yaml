feature_name: GraphRAG Memory Architecture
feature_type: 心智模型 / Cognitive Model
version: 1.0.0
created: 2026-06-15
author: MiroFish盛大集团群体智能引擎

# ============================================================
# 核心理念
# ============================================================
core_concept: >
  实体关系图谱作为Agent的长期记忆基础设施。
  用图结构存储知识，使Agent具备关系推理和联想记忆能力。

# ============================================================
# MiroFish实现
# ============================================================
mirofish_implementation:
  description: >
    使用Zep Cloud作为图谱存储引擎，实现实体抽取、关系推理
    和语义搜索。每个Agent的记忆不再是简单的向量数据库，
    而是由实体和关系构成的动态知识图谱。
  key_components:
    - Zep Cloud图谱存储: 高性能图数据库作为记忆后端
    - 实体抽取管道: 从文本中自动识别和提取实体
    - 关系推理引擎: 基于已有关系推导新关系
    - 语义搜索层: 支持基于向量相似度的图节点检索
  technical_stack:
    - 存储: Zep Cloud (graph + vector)
    - 抽取: LLM-based entity extraction
    - 推理: Graph-based relationship inference
    - 检索: Hybrid search (graph + semantic)

# ============================================================
# 映射盖娅进化大脑
# ============================================================
mapping_to_gaiya:
  description: >
    映射盖娅净化大脑的知识图谱
  gaiya_analogy:
    - 盖娅知识图谱 → MiroFish的GraphRAG图结构
    - 盖娅实体节点 → MiroFish的记忆实体
    - 盖娅关系边 → MiroFish的实体关系
    - 盖娅推理引擎 → MiroFish的关系推理
  analogy: >
    正如盖娅进化大脑使用知识图谱存储和推理信息，
    MiroFish的GraphRAG架构为每个Agent提供了
    基于图结构的长期记忆能力，支持复杂的联想和推理。

# ============================================================
# 适用场景
# ============================================================
applicable_scenarios:
  - 跨会话记忆: Agent在多次模拟间保持知识连贯
  - 关系推理: Agent基于图谱关系进行多跳推理
  - 知识融合: 将新信息动态融入已有知识结构
  - 上下文增强: 为Agent决策提供丰富的图结构上下文
  - 溯源分析: 追溯Agent知识的来源和推导路径

# ============================================================
# 心智模型详细描述
# ============================================================
mental_model_detail:
  name: GraphRAG记忆架构 (GraphRAG Memory Architecture)
  level: L5孵化室 - 核心心智模型
  description: >
    GraphRAG是本项目知识管理的核心创新。传统RAG仅做向量检索，
    丢失了知识之间的结构关系。GraphRAG将记忆组织为图结构，
    实体作为节点，关系作为边，使Agent能够进行结构化的
    知识查询和推理，更接近人类联想记忆的工作方式。
  principles:
    - 图结构化: 记忆不是扁平文档，而是连接的知识网络
    - 关系即知识: 实体间的关系本身就是重要的知识
    - 动态更新: 图谱随着新信息的加入持续演化
    - 多跳推理: 支持通过图路径进行多步推理
  workflow:
    1. 接收新信息（文本/事件）
    2. 实体抽取（人/组织/地点/事件等）
    3. 关系抽取（实体间的语义关系）
    4. 图谱更新（合并/去重/链接）
    5. 推理传播（基于已有关系推导新关系）
    6. 存储持久化（Zep Cloud）
    7. 检索接口（精确匹配+语义搜索+图遍历）
