feature_id: F-MIRO-07
feature_name: Zep Long-Term Memory Integration
feature_type: 心智模型 / Cognitive Model
version: 1.0.0
created: 2026-06-15
author: MiroFish盛大集团群体智能引擎

# ============================================================
# 核心理念
# ============================================================

products:
  - 通用: 自动匹配
core_concept: >
  Agent具备跨会话/跨模拟的持久化记忆。
  记忆不是临时的，而是在不同模拟会话间持续存在和演化。

# ============================================================
# MiroFish实现
# ============================================================
mirofish_implementation:
  description: >
    通过zep_tools.py封装Zep Cloud API，为Agent提供
    企业级的持久化记忆管理。Zep Cloud不仅存储记忆内容，
    还维护记忆的元数据、时间戳、关联关系和重要性评分。
    这使得Agent能够在不同模拟会话之间保持知识连贯性，
    同时具备遗忘和记忆强化的类人记忆特性。
  features:
    - 持久化存储: 记忆跨会话/跨模拟保持
    - 元数据管理: 时间戳、来源、重要性评分
    - 关系关联: 记忆之间的链接和引用
    - 记忆演化: 基于使用频率和重要性的动态调整
    - 结构化检索: 按时间/主题/重要性维度查询
  api_integration:
    - memory_store: 写入新记忆
    - memory_retrieve: 检索相关记忆
    - memory_update: 更新已有记忆
    - memory_delete: 标记遗忘

# ============================================================
# 映射盖娅进化大脑
# ============================================================
mapping_to_gaiya:
  description: >
    映射白泽员工memory.db的跨会话持久化
  baize_analogy:
    - 白泽memory.db → MiroFish的Zep Cloud存储
    - 白泽跨会话记忆 → MiroFish的持久化记忆
    - 白泽记忆管理 → MiroFish的记忆演化机制
  analogy: >
    正如白泽员工通过memory.db实现跨会话的持久化记忆，
    MiroFish的Agent通过Zep Cloud集成获得企业级的
    长期记忆能力，确保知识在模拟会话间持续积累和演化。

# ============================================================
# 适用场景
# ============================================================
applicable_scenarios:
  - 持续学习: Agent在多轮模拟中不断积累知识
  - 角色连贯: Agent在多次交互中保持角色一致性
  - 经验迁移: 在一个模拟中学到的知识用于另一个模拟
  - 长期关系: Agent之间的社交关系跨会话保持
  - 知识积累: Agent对领域的理解随模拟次数加深

# ============================================================
# 心智模型详细描述
# ============================================================
mental_model_detail:
  name: Zep Long-Term Memory Integration (长期记忆集成)
  level: L5孵化室 - 核心心智模型
  description: >
    长期记忆是Agent智能的基石。没有长期记忆的Agent
    每次都从零开始，无法积累经验和知识。
    Zep Cloud提供了企业级的持久化记忆解决方案：
    它不仅存储记忆，还维护记忆的图结构关系，
    支持基于重要性、时效性和关联性的智能检索。
    这使得Agent能够像人类一样：
    - 记住重要的事情
    - 关联相关知识
    - 随时间演化认知
  principles:
    - 记忆持久化: 记忆不会随会话结束而消失
    - 智能检索: 基于上下文自动召回相关记忆
    - 记忆演化: 重要性动态调整，无关记忆被淡化
    - 跨会话: 记忆在不同模拟会话间可迁移
    - 结构化: 记忆不仅是文本，还有关系和元数据
  workflow:
    - "1. Agent在模拟中经历事件/获取信息"
    - "2. 记忆提取: 从交互中提取值得记忆的内容"
    - "3. 存储到Zep Cloud: 保存记忆内容+元数据"
    - "4. 图谱关联: 将新记忆链接到已有知识"
    - "5. 重要性评估: 动态调整记忆优先级"
    - "6. 检索使用: 在需要时基于上下文召回"
    - "7. 反馈强化: 使用频率影响记忆保持强度"
