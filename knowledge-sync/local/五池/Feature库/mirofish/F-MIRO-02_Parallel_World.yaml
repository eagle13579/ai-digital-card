feature_id: F-MIRO-02
feature_name: Parallel World Construction
feature_type: 心智模型 / Cognitive Model
version: 1.0.0
created: 2026-06-15
author: MiroFish盛大集团群体智能引擎

# ============================================================
# 核心理念
# ============================================================

products:
  - 通用: 自动匹配
core_concept: >
  从现实种子信息自动构建高保真模拟世界。
  将现实世界的新闻、政策、金融信号转化为可交互的平行数字世界。

# ============================================================
# MiroFish实现
# ============================================================
mirofish_implementation:
  description: >
    通过多阶段流水线自动从现实信息构建平行数字世界：
    输入(新闻/政策/金融信号)
    → GraphRAG知识图谱构建
    → Agent Profiles生成
    → 模拟环境配置
    → 完整的可运行模拟世界
  pipeline_stages:
    - stage_1_种子提取: 从多源信息提取关键实体、关系和事件
    - stage_2_知识图谱: 使用GraphRAG构建结构化领域知识
    - stage_3_Agent画像: 根据图谱生成差异化的Agent角色和认知
    - stage_4_场景配置: 自动生成模拟参数（时间线、规则、目标）
  key_features:
    - 自动构建: 无需人工设计，AI自动完成
    - 高保真度: 基于真实数据，还原现实复杂性
    - 可扩展: 支持不同领域和规模的模拟世界

# ============================================================
# 映射盖娅进化大脑
# ============================================================
mapping_to_gaiya:
  description: >
    映射盖娅之城的高保真数字公民世界
  gaiya_city_analogy:
    - 盖娅数字公民 → MiroFish的Agent Profiles
    - 盖娅城市环境 → MiroFish的模拟场景配置
    - 盖娅规则系统 → MiroFish的模拟约束条件
  analogy: >
    正如盖娅之城构建了167名数字公民的高保真城市世界，
    MiroFish从现实种子信息自动构建完整的平行数字世界，
    让AI Agent在其中自由生活和交互。

# ============================================================
# 适用场景
# ============================================================
applicable_scenarios:
  - 宏观经济模拟: 从经济数据构建平行经济世界
  - 地缘政治推演: 从新闻事件构建地缘政治模拟
  - 市场竞争分析: 从行业报告构建市场竞争环境
  - 公共卫生预测: 从疫情数据构建疾病传播模型
  - 城市规划模拟: 从城市数据构建数字孪生城市

# ============================================================
# 心智模型详细描述
# ============================================================
mental_model_detail:
  name: 平行数字世界构建 (Parallel World Construction)
  level: L5孵化室 - 核心心智模型
  description: >
    平行世界构建是本项目的核心基础设施。它使得从零开始、
    基于真实数据自动创建高保真模拟环境成为可能。
    这一过程模拟了人类认知中的「情景构建」能力——
    基于已有信息构建对未来的假设性模型。
  principles:
    - 信息驱动: 世界构建完全由现实数据驱动
    - 自动生成: 从原始数据到可运行模拟的端到端自动化
    - 保真优先: 追求与真实世界的高度一致性
    - 可演化: 模拟世界可以随着新信息输入而更新
  workflow:
    1. 采集多源种子信息（新闻/政策/金融）
    2. 实体识别与关系抽取
    3. GraphRAG知识图谱构建
    4. Agent角色自动生成（角色/知识/目标）
    5. 模拟参数自动配置
    6. 世界一致性校验
    7. 模拟世界启动就绪
