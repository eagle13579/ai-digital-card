feature_id: F-MIRO-01
feature_name: Swarm Intelligence Prediction
feature_type: 心智模型 / Cognitive Model
version: 1.0.0
created: 2026-06-15
author: MiroFish盛大集团群体智能引擎

# ============================================================
# 核心理念
# ============================================================

products:
  - 通用: 自动匹配
core_concept: >
  个体简单行为通过群体交互产生涌现智能，远超个体之和。
  数千AI Agent在社会模拟中自由交互，通过catch群体动态实现预测。

# ============================================================
# MiroFish实现
# ============================================================
mirofish_implementation:
  description: >
    数千AI Agent在社会模拟中自由交互，通过捕捉群体动态进行预测。
    每个Agent拥有独立的记忆、目标和行为模式，在模拟环境中并行运行。
    通过分析agent间交互模式、意见演化、共识形成等群体现象，
    推断现实世界的可能发展趋势。
  key_components:
    - Agent群体初始化: 基于种子信息生成差异化Agent配置
    - 自由交互引擎: Agent之间自发交流、辩论、协商
    - 群体动态捕捉: 实时追踪意见分布、社交网络演化、关键事件触发
    - 涌现预测输出: 从群体行为中提取可解释的预测信号
  technical_stack:
    - Agent框架: 基于LLM的自主Agent
    - 交互协议: Agent-to-Agent消息传递
    - 分析引擎: 群体行为模式识别

# ============================================================
# 映射盖娅进化大脑
# ============================================================
mapping_to_gaiya:
  description: >
    映射盖娅之城167名公民的群体讨论/投票/共识机制
  gaiya_city:
    citizens: 167
    mechanism:
      - 群体讨论引擎: 公民在议事厅自由辩论
      - 投票系统: 群体意见汇聚形成决策
      - 共识算法: 从分歧中寻找趋同信号
    analogy: >
      正如盖娅之城167名公民通过讨论和投票达成共识，
      MiroFish的Agent群体通过自由交互涌现群体智能预测。

# ============================================================
# 适用场景
# ============================================================
applicable_scenarios:
  - 金融市场预测: Agent模拟投资者行为预测市场趋势
  - 社会舆情分析: 模拟公众对政策/事件的态度演化
  - 技术趋势预测: Agent模拟研究者行为预测技术突破
  - 风险管理: 模拟黑天鹅事件的多路径推演
  - 政策影响评估: 模拟政策实施后的社会反应

# ============================================================
# 心智模型详细描述
# ============================================================
mental_model_detail:
  name: 群体智能预测 (Swarm Intelligence Prediction)
  level: L5孵化室 - 核心心智模型
  description: >
    群体智能是本项目的核心哲学基础。它不是简单的多数投票，
    而是通过大量自主Agent在模拟环境中的复杂交互，
    涌现出超越单个Agent能力的集体智慧。
    这种涌现智能能够捕捉市场情绪、社会趋势、集体行为等
    难以通过传统分析方法预测的现象。
  principles:
    - 简单个体，复杂整体: 每个Agent的规则简单，但群体行为复杂
    - 分布式认知: 知识分散在群体中，没有中央控制器
    - 自组织: 群体在没有外部指令的情况下自发形成结构
    - 涌现性质: 整体具有部分不具备的新特性
  workflow:
    1. 种子信息处理 → Agent配置生成
    2. Agent初始化（千级别数量）
    3. 模拟环境启动（双平台并行）
    4. Agent自由交互（消息传递/意见交换）
    5. 群体动态实时捕捉与分析
    6. 涌现预测输出与置信度评估
