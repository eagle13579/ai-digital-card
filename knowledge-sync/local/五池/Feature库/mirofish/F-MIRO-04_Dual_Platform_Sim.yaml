feature_id: F-MIRO-04
feature_name: Dual Platform Parallel Simulation
feature_type: 心智模型 / Cognitive Model
version: 1.0.0
created: 2026-06-15
author: MiroFish盛大集团群体智能引擎

# ============================================================
# 核心理念
# ============================================================

products:
  - 通用: 自动匹配
core_concept: >
  同一模拟在多个平台并行运行，通过交叉验证提高预测可靠性。
  不同平台的Agent生态差异成为预测的多元视角。

# ============================================================
# MiroFish实现
# ============================================================
mirofish_implementation:
  description: >
    在Twitter和Reddit两个社交平台同时进行独立仿真。
    每个平台拥有独立的Agent状态追踪、交互规则和环境特征。
    通过比较两个平台上的群体行为差异，识别平台特有噪音
    和跨平台共性的真正信号。
  platform_characteristics:
    twitter:
      - 信息传播快、意见极化明显
      - 短文本交互、话题标签驱动
      - Agent角色: 意见领袖/普通用户/媒体账号
    reddit:
      - 讨论深度高、社区文化鲜明
      - 长文本讨论、Subreddit社区细分
      - Agent角色: 版主/深度贡献者/潜水者
  cross_validation:
    - 寻找跨平台趋同信号 → 高置信度预测
    - 识别平台特有分歧 → 噪音过滤
    - 融合预测 → 综合置信度评估

# ============================================================
# 映射盖娅进化大脑
# ============================================================
mapping_to_gaiya:
  description: >
    映射盖娅大脑左右脑双螺旋并行处理+交叉验证
  gaiya_brain_analogy:
    - 左脑(逻辑/分析) → Twitter平台(快节奏/舆情)
    - 右脑(直觉/综合) → Reddit平台(深层次/理性)
    - 胼胝体(信息交换) → 跨平台交叉验证机制
  analogy: >
    正如盖娅进化大脑的左右脑双螺旋并行处理不同信息
    并通过交叉验证形成统一认知，
    MiroFish在Twitter和Reddit双平台并行模拟，
    通过比较和融合两个平台的群体行为获得更可靠的预测。

# ============================================================
# 适用场景
# ============================================================
applicable_scenarios:
  - 舆情真实性判断: 区分真实社会情绪和平台特定噪音
  - 跨文化比较: 同一事件在不同社区的反应差异
  - 趋势强度评估: 多平台共振趋势的置信度更高
  - 反操控检测: 单一平台操控在多平台对比中暴露
  - 预测鲁棒性提升: 多平台共识预测更稳健

# ============================================================
# 心智模型详细描述
# ============================================================
mental_model_detail:
  name: 双平台并行模拟 (Dual Platform Parallel Simulation)
  level: L5孵化室 - 核心心智模型
  description: >
    双平台并行是本项目确保预测质量的关键设计。
    通过在同一模拟框架下运行两个不同平台生态的Agent群体，
    既保证了模拟场景的一致性，又引入了平台特有的多样性。
    这种设计天然支持交叉验证，有效过滤单一平台偏差。
  principles:
    - 平台多样性: 不同平台有不同的用户生态和交互模式
    - 一致场景: 双平台运行同一模拟场景（种子信息相同）
    - 独立状态: 每个平台Agent状态独立演化
    - 交叉验证: 跨平台共识增强预测置信度
  workflow:
    1. 获取统一模拟配置
    2. 初始化Twitter Agent群体
    3. 初始化Reddit Agent群体
    4. 双平台同步运行（时间步对齐）
    5. 独立记录各平台群体动态
    6. 跨平台对比分析
    7. 融合预测输出
