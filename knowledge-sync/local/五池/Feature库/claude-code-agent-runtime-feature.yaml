id: "F-A2E-CLAUDE-CODE-RUNTIME-01"
name: "Claude Code AI Agent Runtime (SDK + MCP Toolset + Skill Router)"
version: "1.0.0"
description: >
  AiToEarn 的 AI Agent 运行时环境，使用 @anthropic-ai/claude-agent-sdk 作为底层
  引擎驱动 Claude Code，组合 MCP 工具集、Skill 路由、任务编排和流式输出能力。
  核心架构包含：
  (1) AgentRuntimeService — Claude SDK 封装，提供 spawn/query/abort 生命周期管理
  (2) ClaudeCodeRouterService — 多模型路由（Provider + Router 配置），支持不同任务
      路由到不同后端模型
  (3) MCP Toolset — 15+ 命名工具（MediaMcp、UtilMcp、AideoMcp、VideoEditMcp等）
  (4) Skill Router — 技能分析与任务分派
  (5) SSE Streaming — 流式输出 ContentGenerationTaskChunkVo
  用户输入任意任务描述 + 媒体素材 → Agent 自动规划 → 调用工具 → 生成内容。
domain: "backend"
type: "agent-runtime"
maturity: "production"
autonomy: "high"
tags:
  - "claude-code"
  - "agent-runtime"
  - "mcp-tools"
  - "skill-router"
  - "claude-agent-sdk"
  - "ai-orchestration"
  - "streaming"
input_schema:
  type: "object"
  description: "用户任务描述 + 媒体输入"
  properties:
    task_description:
      type: "string"
      description: "用户任务自然语言描述"
      required: true
    media_inputs:
      type: "array"
      description: "媒体输入文件（图片/视频URL列表）"
      items:
        type: "string"
        format: "uri"
      required: false
    session_id:
      type: "string"
      description: "会话ID（用于多轮对话上下文管理）"
      required: false
    model_preference:
      type: "string"
      description: "模型偏好（如 claude-sonnet-4, gemini-3-pro 等）"
      required: false
    output_format:
      type: "string"
      enum: ["text", "json", "content-blocks"]
      description: "输出格式"
      default: "text"
      required: false
    availability_operation:
      type: "string"
      description: "AI 可用性操作标识（用于计费/配额管理）"
      required: false
output_schema:
  type: "object"
  description: "AI 生成内容（支持流式分块和完整结果）"
  properties:
    task_id:
      type: "string"
      description: "任务唯一标识"
    status:
      type: "string"
      enum: ["init", "generating", "completed", "error", "timeout"]
    content:
      type: "object"
      description: "生成的内容（文本/图片/视频URL或结构化数据）"
    chunks:
      type: "array"
      description: "流式输出分块（实时SSE推送）"
      items:
        type: "object"
        properties:
          type:
            type: "string"
            enum: ["init", "stream_event", "keep_alive", "error"]
          taskId:
            type: "string"
          data:
            type: "object"
    workflow_steps:
      type: "array"
      description: "Agent 执行的工作流步骤"
    progress:
      type: "integer"
      description: "进度百分比 (0-100)"
    cost:
      type: "number"
      description: "任务消耗金额"
source:
  type: "application-directory"
  base_path: "project/aitoearn-backend/apps/aitoearn-ai/src/core/agent/"
  core_files:
    - path: "services/agent-runtime.service.ts"
      lines: 1049
      role: "核心运行时（Claude SDK封装、任务生命周期、SSE流式、MCP工具组合）"
    - path: "claude-code-router/claude-code-router.service.ts"
      lines: 200
      role: "Claude Code Router 管理器（子进程生命周期、Provider/路由配置）"
    - path: "agent.controller.ts"
      role: "Agent HTTP 控制器（任务创建/查询/中止）"
    - path: "agent.service.ts"
      role: "Agent 服务层（业务编排）"
    - path: "agent.dto.ts"
      role: "数据传输对象"
    - path: "agent.vo.ts"
      role: "视图对象（流式分块定义）"
    - path: "agent.module.ts"
      role: "Agent 模块定义"
    - path: "agent.constants.ts"
      lines: 463
      role: "常量（MCP Server名、Tool名、系统提示词）"
    - path: "agent.utils.ts"
      role: "工具函数（提示词增强、消息过滤）"
    - path: "skill-init.service.ts"
      role: "Skill 初始化服务"
    - path: "agent-task-timeout.scheduler.ts"
      role: "任务超时调度器"
  mcp_tools:
    - path: "mcp/media.mcp.ts"
      lines: 376
      role: "媒体生成工具（图片/视频/Sora/Grok）"
    - path: "mcp/util.mcp.ts"
      lines: 113
      role: "通用工具"
    - path: "mcp/subtitle.mcp.ts"
      lines: 219
      role: "字幕生成工具"
    - path: "mcp/image-edit.mcp.ts"
      lines: 566
      role: "图片编辑工具"
    - path: "mcp/video-utils.mcp.ts"
      lines: 449
      role: "视频处理工具"
    - path: "mcp/volcengine/aideo.mcp.ts"
      role: "火山引擎 Aideo 工具"
    - path: "mcp/volcengine/drama-recap.mcp.ts"
      role: "火山引擎 影视解说工具"
    - path: "mcp/volcengine/style-transfer.mcp.ts"
      role: "火山引擎 风格迁移工具"
    - path: "mcp/volcengine/video-edit.mcp.ts"
      role: "火山引擎 视频编辑工具"
    - path: "mcp/mcp.utils.ts"
      role: "MCP 工具工具函数（wrapTool、successResult/errorResult）"
products:
  - "AiToEarn AI Agent（内容工厂 Agent）"
  - "自动内容生成与发布管道"
  - "AI 视频/图片/文案创作产品线"
  - "MCP 驱动的 AI 创作工作流"
evolution_tags:
  - "claude-code"
  - "agent-runtime"
  - "mcp-tools"
  - "skill-router"
  - "ai-orchestration"
  - "claude-agent-sdk"
  - "content-generation-agent"
