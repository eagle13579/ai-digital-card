feature_id: "F-GAIA-CORTEX-001"
name: "L0感知层微服务拆分"
version: "1.0.0"
created: "2026-06-14"
status: "设计就绪"
priority: "P1"
dimension: "架构"
source_model:
  - "scripts/gaia_cortex.py"
  - "scripts/_data_contract.py"
  - "scripts/gaia_cortex_config.yaml"
one_liner: "将盖娅大脑L0感知层从gaia_cortex.py七层飞轮单进程中独立拆分为独立微服务（端口5199），实现L0持续采集、L1-L7无需等待"

products:
  - 通用: 自动匹配
what_it_does: >
  当前gaia_cortex.py在单个进程内串行执行L0→L1→L2→L3→L4→L5→L6七层飞轮。
  L0感知层执行文件扫描、外部信号采集、技能缺口分析等I/O密集型操作，
  耗时可长达数秒至数十秒，导致后续层必须等待L0完成。

  本Feature将L0感知层独立为常驻微服务perception_service.py（端口5199），
  包含完整的L0感知逻辑、300秒内部缓存、健康检查和强制刷新端点。
  同时提供perception_client.py作为HTTP客户端，暴露与原有layer0_sense()
  一致的函数签名，支持服务不可达时自动降级为本地扫描。

  通过start_with_remote_l0.py启动器，在不修改gaia_cortex.py的前提下，
  将layer0_sense替换为HTTP远程调用版本，实现无缝迁移。
layers:
  - "L0感知层: 独立进程，常驻采集，端口5199"
  - "L1分析层: 通过HTTP获取L0数据（原进程）"
  - "L2组合层: 无变更"
  - "L3创造层: 无变更"
  - "L4反哺层: 无变更"
  - "L5值守层: 无变更"
  - "L6追溯层: 无变更"
architecture_before: >
  gaia_cortex.py (单进程)
  L0 → L1 → L2 → L3 → L4 → L5 → L6  (串行)
architecture_after: >
  perception_service.py (独立进程, :5199) — L0持续感知→缓存
  gaia_cortex.py (原进程, 不修改) — L1→L2→L3→L4→L5→L6
  通过HTTP GET /sense获取L0数据，L0不可达时降级为本地扫描
endpoints:
  - "GET /health — 健康检查"
  - "GET /sense — 获取最新感知数据 (L0Output JSON)"
  - "GET /sense/force — 强制刷新缓存后返回"
  - "GET /assets — 仅返回资产快照"
  - "GET /status — 服务状态信息"
port: 5199
cache_ttl_seconds: 300
fallback_strategy: "L0微服务不可达→降级为本地layer0_sense()→本地也失败→返回空L0Output"
risks:
  - risk: "HTTP调用增加毫秒级延迟"
    mitigation: "L0有300秒缓存，HTTP开销可忽略"
  - risk: "微服务进程crash"
    mitigation: "感知客户端自动降级+watchdog重启"
  - risk: "数据一致性"
    mitigation: "L0输出是快照型数据，不要求强一致"
depends_on:
  - "scripts/gaia_cortex.py (不修改，仅复用逻辑)"
  - "scripts/_data_contract.py (数据契约)"
output:
  - "scripts/perception_service.py — L0感知微服务"
  - "scripts/perception_client.py — HTTP客户端+降级"
  - "scripts/start_with_remote_l0.py — 启动器"
  - "L1图书馆/架构决策/ADR-035-L0感知层微服务拆分.md — 架构决策"
  - "L1图书馆/架构决策/L0感知微服务集成指南.md — 集成指南"
score_target: "9/10"
iteration_log:
  - version: "1.0.0"
    date: "2026-06-14"
    author: "盖娅大脑"
    changes: |
      初始创建。完成L0感知微服务完整架构设计。
      包含Feature定义、微服务脚本、架构决策文档、集成指南四件套。
