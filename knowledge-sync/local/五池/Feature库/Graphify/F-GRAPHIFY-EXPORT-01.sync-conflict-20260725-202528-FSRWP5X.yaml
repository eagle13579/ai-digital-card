id: F-GRAPHIFY-EXPORT-01
name: Multi-Format Knowledge Graph Export
source_model: "Graphify export.py — 同一知识图谱输出6种格式: HTML交互图/Obsidian仓库/Wiki百科/JSON持久化/Cypher图DB/SVG静态图"
dimension: 创造力
description: >-
  一次构建的知识图谱自动导出6种格式, 覆盖不同使用场景:
  graph.html = D3.js力导向交互式图(点击/搜索/筛选/社区着色),
  obsidian/ = 可导入Obsidian的Markdown仓库,
  wiki/ = Wikipedia风格文章(供Agent导航),
  graph.json = JSON持久化(跨会话查询),
  graph.cypher = Neo4j导入格式,
  graph.svg = 静态SVG图。
  同一数据6种呈现, 不锁死在单一格式。
input: nx.Graph + 社区划分
output: graph.html + obsidian/ + wiki/ + graph.json + graph.cypher + graph.svg
sop: "① to_html(): D3.js力导向图 + 社区着色 + 搜索/筛选 + hyperedge
  ② to_obsidian(): 每节点一篇Markdown + [[wikilink]]互相链接
  ③ to_wiki(): Wikipedia风格文章(god node主题)
  ④ to_json(): NetworkX→JSON序列化(持久化可查询)
  ⑤ to_cypher(): CREATE语句(Neo4j导入)
  ⑥ to_svg(): Graphviz静态布局
  ⑦ benchmark(): 查询token数对比(图谱vs原始文件)"
quality_gates: HTML交互图加载<2s(1000节点)、Obsidian格式标准可导入、JSON版本向后兼容
created_at: '2026-06-13'
iteration_count: 1
last_score: 8
application_scope: 记忆宫殿可视化/594技能图谱/数字员工关系网/AI招商知识网络
