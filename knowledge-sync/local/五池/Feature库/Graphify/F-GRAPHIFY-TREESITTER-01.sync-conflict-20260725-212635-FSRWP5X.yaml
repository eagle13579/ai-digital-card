id: F-GRAPHIFY-TREESITTER-01
name: Multi-Language AST Extraction with tree-sitter
source_model: "Graphify extract.py — 12+语言tree-sitter解析器, 统一{node,edge}输出格式, 支持调用图二遍传递"
dimension: 基本功
description: >-
  利用tree-sitter解析12+编程语言的AST(抽象语法树), 统一提取{函数/类/变量}节点和
  {调用/继承/导入}关系边。支持二遍传递: 第一遍提取显式关系(EXTRACTED),
  第二遍推断传递关系(INFERRED)。每个提取器输出标准schema(nodes+edges+confidence)。
input: 文件路径
output: {nodes: [{id, label, source_file, source_location}], edges: [{source, target, relation, confidence}]}
sop: "① classify_file(): 按后缀匹配编程语言
  ② tree-sitter parse: 加载对应语法→解析AST
  ③ walk AST: 识别函数定义/类定义/导入/调用→生成nodes+edges
  ④ 二遍传递: 调用图→推断间接调用关系(INFERRED)
  ⑤ validate schema: 校验输出格式
  ⑥ 支持: Python/JS/TS/Go/Rust/Java/C/C++/Ruby/Kotlin/Scala/PHP"
quality_gates: 每语言parser覆盖率>90%, INFERRED边错误率<15%, 支持新增语言≤200行
created_at: '2026-06-13'
iteration_count: 1
last_score: 9
application_scope: 代码资产库自动分析/技能依赖图谱/白泽军团技能关联
