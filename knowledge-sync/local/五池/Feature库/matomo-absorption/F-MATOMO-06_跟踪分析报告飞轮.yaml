feature_id: "F-MATOMO-06"
name: "跟踪→分析→报告飞轮 — Matomo数据驱动闭环"
version: "1.0.0"
dimension: "创造力"
source_model: "Matomo全链路工作流: JS埋点→数据收集→归档处理→可视化报告→洞察→优化"
one_liner: "一个完整的数据驱动飞轮：埋点收集原始行为 → 归档聚合 → 可视化报告 → 洞察决策 → 产品优化 → 再埋点验证"

products:
  - 通用: 自动匹配
what_it_does: >
  Matomo的端到端分析工作流构成了一个完整的数据驱动飞轮：
  
  **转1: 埋点 (Instrument)** — JS追踪代码嵌入网站，捕获页面浏览/事件/目标转化
  **转2: 收集 (Collect)** — Tracker实时将数据写入MySQL log表
  **转3: 归档 (Archive)** — 后台进程将原始数据聚合成预计算指标
  **转4: 报告 (Report)** — 可视化仪表盘展示关键指标：访客/流量来源/页面/转化
  **转5: 洞察 (Insight)** — 分析报告找出优化点：跳出率高的页面/流失环节
  **转6: 优化 (Optimize)** — 基于数据优化产品和营销策略
  **回到转1** — 新埋点验证优化效果
  
  这个飞轮是产品数据驱动迭代的根本方法，适用于任何互联网产品。
  Matomo提供开箱即用的全飞轮组件，无需搭建数据管道。
  
  关键指标集：nb_visits(访客数)/nb_actions(行为数)/nb_bounces(跳出率)/nb_conversions(转化率)
input:
  - "JS追踪代码嵌入目标网页"
  - "用户访问/点击/转化行为"
  - "分析需求 (想了解什么)"
output:
  - "实时访客监控面板"
  - "自定义报告 (时段/渠道/页面)"
  - "洞察建议 (优化方向)"
  - "飞轮循环验证"
sop:
  - "step: 嵌入JS追踪代码到目标页面"
  - "step: 配置目标转化 (Goals)"
  - "step: 设置E-commerce追踪 (可选)"
  - "step: 观察实时访客面板"
  - "step: 查看预设报告 (访问/来源/页面)"
  - "step: 创建自定义报告"
  - "step: 基于洞察做产品优化"
  - "step: 验证优化效果 (飞轮闭合)"
quality_gate:
  - "追踪代码正常加载 (浏览器检查)"
  - "数据在Matomo面板中可见"
  - "目标转化设置正确"
  - "归档正常运行"
dependencies:
  - "Matomo部署完成"
  - "JS追踪代码嵌入"
  - "crontab归档配置"
