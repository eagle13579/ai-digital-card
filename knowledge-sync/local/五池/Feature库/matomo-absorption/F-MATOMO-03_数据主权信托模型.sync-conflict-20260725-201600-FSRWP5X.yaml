feature_id: "F-MATOMO-03"
name: "数据主权信托模型 — Matomo数据完全自主可控"
version: "1.0.0"
dimension: "场景"
source_model: "Matomo自托管架构哲学 — 用户完全掌控自有数据，无第三方数据共享"
one_liner: "自托管分析的核心信任基础：数据100%在自有MySQL中，无第三方SaaS可触及，从根源消除数据泄露风险"
what_it_does: >
  Matomo区别于Google Analytics的核心差异：数据不离开自有服务器。
  
  数据主权信托模型的四个支柱：
  1. **存储主权** — 所有原始数据存储在自有MySQL，无第三方数据库介入
  2. **访问控制** — 用户管理系统 (UsersManager) 支持细粒度权限：超级用户/管理员/查看者
  3. **传输加密** — HTTPS强制，追踪请求通过SSL加密传输
  4. **数据导出** — 完整数据导出API (JSON/XML/CSV/HTML)，用户可随时取走全部数据
  
  商业模式含义：将「数据在谁手里」作为产品差异化核心卖点，面向合规敏感行业
  (金融/医疗/政务/出海企业) 构建信任壁垒。
input:
  - "自有服务器基础设施"
  - "组织的数据安全合规要求 (PIPL/GDPR/等)"
  - "对第三方SaaS数据泄露的担忧"
output:
  - "完全自主的数据存储和管理"
  - "可审计的数据访问日志"
  - "合规证据 (数据未出境)"
sop:
  - "step: 部署Matomo到自有服务器"
  - "step: 配置数据库仅监听127.0.0.1"
  - "step: 启用HTTPS (强制SSL)"
  - "step: 配置用户权限 (最小权限原则)"
  - "step: 定期备份数据库 (mysqldump)"
  - "step: 记录所有管理操作日志"
quality_gate:
  - "数据库端口不对外暴露"
  - "所有用户有明确的角色和权限范围"
  - "HTTPS强制访问"
  - "有自动备份策略"
dependencies:
  - "自管理服务器"
  - "数据库运维能力"
  - "数据备份策略"
