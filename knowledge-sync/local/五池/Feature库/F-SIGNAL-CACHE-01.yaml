# 💾 情报持久化缓存
id: F-SIGNAL-CACHE-01
name: 情报持久化缓存
dimension: 数据
description: 采集的情报存入JSON文件，避免重复采集，支持离线使用和历史回溯
source_model: 多源并行情报采集
status: active
version: "1.0"
created: 2026-06-14

products:
  - 通用: 自动匹配
input:
  - 采集到的 RealSignal[]

output:
  - data/signals/ 目录下的按日期归档的JSON文件

sop: |
  1. 采集完成后，按日期归档到 data/signals/YYYY-MM-DD.json
  2. 保留最近30天数据
  3. 读取时：当天数据优先显示，历史数据可回溯
  4. 采集间隔 <1小时 返回缓存数据，避免重复请求

quality_gate:
  - 缓存过期时间=1小时
  - 历史数据保留30天自动清理
  - 缓存数据必须标注 fetchedAt 时间

draft: false
