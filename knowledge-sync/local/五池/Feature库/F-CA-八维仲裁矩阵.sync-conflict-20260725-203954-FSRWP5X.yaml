feature_id: "F-CA-八维仲裁矩阵"
name: "八维仲裁矩阵 — 原子模型评分矩阵"
version: "1.0.0"
dimension: "创造力"
source_model:
  - "五池/模型池/_原子/黑河-麦肯锡定义权/ (10原子)"
  - "五池/模型池/_原子/黑河-迪士尼法律护城河/ (10原子)"
  - "五池/模型池/_原子/黑河-星巴克影子银行/ (10原子)"
  - "五池/模型池/_原子/黑河-资本套利元框架/ (10原子)"
  - "五池/模型池/_原子/黑河离岸资本/ (8原子)"
  - "五池/模型池/_原子/黑河自动续费系统/ (10原子)"
  - "五池/模型池/_原子/黑河资本逃逸路线图/ (10原子)"
  - "五池/模型池/_原子/黑河调查局-矿产合规套利四步法/ (12原子)"
one_liner: "八维加权评分矩阵，每个维度对应一组原子模型，对投资标的进行84原子全覆盖的结构化评分"
what_it_does: >
  将黑河调查局全部8组84个跨国套利原子心智模型映射为8个独立的评分维度，
  每个维度对其原子模型的核心命题进行量化检测。八维分别为：
  D1规则制定权（15%）— 麦肯锡定义权10原子检测政策影响/旋转门/标准制定
  D2 IP法律护城河（15%）— 迪士尼10原子检测版权/商标/游说/组合权
  D3影子银行/金融套利（12%）— 星巴克10原子检测资金池/递延收入/监管空白
  D4离岸资本架构（12%）— 离岸8原子检测容器切换/经济实质/加密盲区
  D5消费端套利（10%）— 自动续费10原子检测订阅锁/默认效应/取消迷宫
  D6资本逃逸路线（10%）— 逃逸10原子检测利润液化/身份碎片化/信托
  D7矿产合规四步法（12%）— 四步法12原子检测代持/便利旗/制裁折价
  D8三合一闭环（14%）— 元框架10原子检测闭环完整度/组合权/永不赎回
  每维度输出0-100评分+置信度+检测信号列表，加权得出综合评分。
input:
  - "投资标的结构化数据（包含八维所需全部字段）"
  - "业务标签/行业分类"
output:
  - "八维独立评分（每维度0-100 + 置信度）"
  - "每维度检测到的具体信号列表"
  - "加权综合套利评分（0-100）"
  - "八维雷达图数据（用于可视化）"
sop:
  - "step: 接收ArbitrageTarget结构化输入"
  - "step: 执行D1规则制定权评分（麦肯锡10原子检测）"
  - "step: 执行D2 IP法律护城河评分（迪士尼10原子检测）"
  - "step: 执行D3影子银行评分（星巴克10原子检测）"
  - "step: 执行D4离岸架构评分（离岸8原子检测）"
  - "step: 执行D5消费端套利评分（自动续费10原子检测）"
  - "step: 执行D6资本逃逸评分（逃逸10原子检测）"
  - "step: 执行D7矿产合规评分（四步法12原子检测）"
  - "step: 执行D8三合一闭环评分（元框架10原子检测）"
  - "step: 按权重加权计算综合评分"
  - "step: 返回结构化评分结果"
quality_gate:
  - "八维全覆盖（不缺维度）"
  - "每维度评分可溯源到具体原子模型"
  - "置信度≥0.5的评分方可参与加权"
  - "综合评分=八维加权，权重和为1.0"
score_target: 9/10
depends_on: []
enhanced_by:
  - "F-TX-05: 全球套利能力融合门禁(Gate 0)"
  - "F-CA-全局产业扫描器（产业扫描使用八维评分数据）"
  - "F-CA-套利路径推荐器（路径推荐依赖八维评分）"
  - "F-CA-合规风险评估器（合规评估使用八维中的三合一闭环评分）"
iteration_log:
  - version: "1.0.0"
    date: "2026-06-13"
    author: "黑河调查局/白泽"
    changes: |
      初始创建。将8组84原子映射为8个评分维度。
      每维度独立评分函数，覆盖组内全部原子模型的检测逻辑。
      权重设计：D1(0.15)+D2(0.15)+D3(0.12)+D4(0.12)
      +D5(0.10)+D6(0.10)+D7(0.12)+D8(0.14)=1.00
