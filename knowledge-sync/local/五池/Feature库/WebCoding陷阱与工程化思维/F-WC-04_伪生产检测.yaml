description: |-
  伪生产沉迷陷阱是Web Coding时代最危险的认知陷阱之一：
  动动嘴就能生成网页的即时奖励刺激感太强，容易让人沉迷伪生产——
  产出量大但不创造真实价值(WC01)。

  本Feature提供一套检测机制，帮助团队识别"伪生产"状态：

  ✅ 伪生产信号：
  - 生成了大量页面但无人使用
  - 花大量时间优化视觉而非核心逻辑
  - 不断新开项目但从未交付
  - 用"代码量"衡量产出而非"用户价值"

  ✅ 真生产标准：
  - 每个产出有明确用户/场景
  - 产出可度量（访问量/转化率/问题解决数）
  - 先验证价值再投入工程资源
  - 工程化思维优先于编码速度

  核心解法：产出前先问"这个页面/功能创造什么真实价值？
  有没有人在等这个功能？"如果答案是否定的，就是伪生产。
适用场景:
  - 个人开发者自查是否陷入"为了编码而编码"的状态
  - 团队效能回溯时评估产出质量
  - AI Agent技能培养时防止"多产但低效"
  - 项目复盘时区分"真交付"和"伪产出"
product_mapping:
  - 团队效能仪表盘
  - AI员工自我评估工具
  - 项目交付质量门禁
