description: |-
  项目启动四问是任何Web开发任务前必须完成的"启动门禁"：

  问1 — 核心面路是什么？ (来自WC03)
  这个功能最核心的用户交互路径是什么？不做什么比做什么更重要。

  问2 — 每个卡点怎么验证？ (来自WC03)
  技术不确定的地方，能否用最小原型/API调用先验证？

  问3 — 能否优先用API？ (来自WC03)
  当前需求是否存在现成API/SDK/库可以复用？

  问4 — 成功标准是什么？ (来自WC06)
  没有成功标准就开始的项目，99%会做过头或做不够。
  文档化的成功标准是工程的起点——它定义了"做完"的边界，
  防止无休止的迭代膨胀，也确保交付物对齐真实需求。

  WC03提供四问框架，WC06提供"成功标准"这一问的深度阐释。
适用场景:
  - 每次Web开发任务开始前
  - 需求澄清阶段，与产品经理对齐预期
  - AI Agent接收到模糊任务时主动追问
  - 新成员加入项目时的标准启动流程
product_mapping:
  - 任何需要需求澄清-开发对齐的流程
  - AI员工任务派遣时的任务模板
  - 敏捷开发Sprint的启动检查清单
