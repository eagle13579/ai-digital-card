# API优先开发模式 — 能不自己写的就不写
id: F-WC-02
name: API优先开发模式
dimension: 基本功
domain: WebCoding-工程化
status: active
priority: P0
source_models:
  - WC04  # API优先组装原则
  - WC05  # 卡点验证前置
atoms:
  - WC04
  - WC05
description: |-
  API优先开发模式是现代Web Coding的核心基本功：现代软件开发的核心能力
  不是写代码，是选对API和工具把它们组装起来(WC04)；同时每个技术卡点必须
  先验证再推进，不可行的方案越早死掉成本越低(WC05)。

  两者构成开发双引擎：
  - 正向选择：先找现成API再自己写，节约90%开发时间
  - 逆向验证：每个不确定的技术点先做POC再推进，避免方向性浪费

  典型应用场景：收到需求后先问"有没有现成的API/SDK/库"，
  对"没把握的技术方案"先写最小原型验证再commit到主流程。
适用场景:
  - 任何Web项目启动时的技术选型决策
  - AI Agent开发中工具链选型
  - 新框架/新库引入前的POC验证
  - 团队新人培养"先查后用"的工程习惯
product_mapping:
  - 链客宝API网关设计
  - 内容工厂外部数据采集管线
  - 任何涉及API集成的产品模块
