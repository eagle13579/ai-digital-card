description: |-
  工程化思维是从"能跑就行"升级到"可维护、可扩展、可交付"的认知分水岭。
  初级程序员关注代码能否运行，架构师关注系统能否创造商业价值。

  WC02 定义分水岭本身：纯敲代码做CRUD的是初级程序員，能把需求设计成框架的是架构师。
  WC07 阐述商业本质：Web Coding产出页面，工程化思维产出系统——商业价值藏在系统里。
  WC08 给出AI时代新定义：新工程师不是写代码的人，而是能用架构思维拆解需求、用AI工具实现、用工程标准交付的人。

  三者构成完整闭环：认知升级(WC02)→价值导向(WC07)→能力定义(WC08)。
适用场景:
  - 团队技术负责人培养架构思维
  - AI开发者从"单页工具人"向工程化交付转型
  - 项目启动前评估团队工程化水平
  - 代码评审时判断架构质量
product_mapping:
