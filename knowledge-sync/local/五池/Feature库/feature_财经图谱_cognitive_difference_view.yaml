名称: 认知差异视图

products:
  - 通用: 自动匹配
描述: >
  基于语义图谱与用户关注的特定产业链节点，通过对比分析公开可见的
  传播路径与私有图谱中的深层关联，自动筛选出"别人不知道的连锁反应"，
  即未被市场充分定价的多层穿透影响，为用户提供差异化认知优势。

输入:
  type: 多源输入
  format:
    语义图谱:                  # 自进化图谱引擎的输出
      - 当前全量图谱快照
      - 增量更新日志
    用户关注的产业链节点:
      - 节点ID: string
        节点名称: string
        关注理由: string (可选)
    市场共识基线:              # 公开可见的分析师共识/媒体热度
      - 热门事件列表
      - 机构调研方向

输出:
  type: 差异化信息视图
  schema:
    关注的产业链节点: string
    总体认知差异得分: float   # [0,1], 越高越"别人不知道"
    差异化洞察列表:
      - 洞察ID: string
        标题: string
        描述: string
        影响路径:
          - 层级: integer
            实体: string
            影响: string
        差异化程度: string     # 高 / 中 / 低
        市场覆盖度: float      # [0,1], 越低说明越少人知道
        推荐行动: string       # 关注 / 调研 / 建仓 / 避险
        证据链: [string]       # 支撑该洞察的图谱路径

核心:
  - 对比视图 (公开知识 vs 私有图谱的差异分析)
  - 多层穿透展示 (1→2→3→N层因果传导的可视化)
  - 新颖度评分 (基于图谱结构洞 + 信息熵)

技术栈:
  - 对比分析: 图谱差分引擎 (GraphDiff)
  - 新颖度计算: 结构洞理论 (Structural Holes) + PageRank变体
  - 可视化: Three.js / G6 / ECharts (3D穿透展示)
  - 因果路径: Neo4j GDS + 自定义路径评分算法
  - 前端: React + D3.js (交互式看板)
  - 后端: Python FastAPI + GraphQL

关联产品:
  - 谛听3D地球
  - 中国软银看板

成熟度: ⭐⭐ (需构建)
