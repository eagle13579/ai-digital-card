      role: "初始状态定义"
    - path: "agent.methods.ts"
      role: "核心方法（createTask, sendMessage, abortTask 等）"
    - path: "task-instance/TaskInstance.ts"
      lines: 435
      role: "TaskInstance 核心类（实例隔离、状态封装）"
    - path: "task-instance/task-instance.types.ts"
      lines: 109
      role: "TaskInstance 类型定义（上下文/回调/状态接口）"
    - path: "task-instance/sse.handler.ts"
      lines: 372
      role: "SSE 消息处理（init/stream_event/keep_alive/error）"
    - path: "task-instance/message.handler.ts"
      role: "消息处理（addMarkdownMessage, updateMessageContent 等）"
    - path: "task-instance/workflow.handler.ts"
      role: "工作流处理（TextDelta, ToolCall, ToolResult 管理）"
    - path: "handlers/action.handlers.ts"
      role: "Action 按钮处理器"
    - path: "utils/refs.ts"
      role: "Refs 管理工具"
    - path: "utils/message.ts"
