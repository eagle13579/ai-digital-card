  融合 android-native-dev、flutter-dev、react-native-dev 和 ios-application-dev
  四大 Hermes Agent 官方 mobile skill 的核心实践与心智模型，覆盖从平台差异适配、
  原生能力桥接、状态管理、生命周期管理、渲染性能优化、响应式 UI 一致性、
  并发线程模型到多环境发布流水线的全链路跨平台移动开发知识体系。

