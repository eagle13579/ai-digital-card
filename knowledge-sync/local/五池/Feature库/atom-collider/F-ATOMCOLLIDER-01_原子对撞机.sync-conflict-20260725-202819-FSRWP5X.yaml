---
id: F-ATOMCOLLIDER-01
name: 原子对撞机
dimension: 创造力
source_model: "Atom Collider — 从Feature库随机抽取2个Feature，LLM强行组合产生新原子心智模型"
description: >-
  每日3次从Feature库随机选2个Feature，通过LLM进行概念对撞与强制融合，产生全新的
  原子心智模型。每个新模型继承双亲Feature的核心思想，但产生不可还原为任一源的新认知结构。
  结果注入五池/模型池，实现Feature库→模型池的自动新陈代谢。
sop: |-
  ① 08:00/14:00/20:00 触发 → ② 扫描Feature库全部YAML → ③ 随机选2个
  → ④ 调用LLM提取两Feature核心思想 → ⑤ 强制融合生成新原子心智模型描述
  → ⑥ 写入五池/模型池 (铁律: 只追加不覆盖) → ⑦ 记录碰撞日志
quality_gate: |-
  - 两Feature必须来自不同子目录（避免近亲对撞）
  - 新模型名称不得与已有模型池条目重复
  - 输出必须包含完整的心智模型描述（核心框架+一句话+应用场景）
