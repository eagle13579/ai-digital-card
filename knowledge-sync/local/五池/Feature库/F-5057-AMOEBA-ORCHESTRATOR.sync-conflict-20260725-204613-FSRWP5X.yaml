# 阿米巴任务编排引擎 — 从对话指令到任务分配的完整流水线
# 融合 hermes-desktop Profile体系和 hermes-dashboard 任务/看板系统
name: F-5057-AMOEBA-ORCHESTRATOR
dimension: 体系
domain: 盖娅之城-任务指挥中心
status: draft
priority: P0
source_models:
  - hermes-desktop Profile体系 (ProfileSwitcher + IPC sendMessage)
  - hermes-dashboard ProfileManager (CRUD + start/stop/status)
description: |
  从用户对话指令到军团自动组队的完整编排流水线：
  1. 指令解析 → 识别任务类型/领域/复杂度
  2. 自动匹配 → 从AI军团选择最适合的成员组队
  3. 任务分配 → 每个成员认领子任务
  4. 执行监控 → 跟踪每个子任务的进度
  5. 完成汇聚 → 所有产出汇总到任务工作台
input:
  - 用户对话指令（自然语言）
  - 军团成员能力清单（skills/domain/expertise）
  - 当前任务队列状态
output:
  - 任务结构（主任务+子任务）
  - 成员分配表（谁做什么）
  - 进度看板更新
  - 完成报告
sop: |
  1. 用户发送指令 → 指令解析引擎拆解任务
  2. MECE拆分子任务
  3. 匹配军团成员能力（skills_list + memory.db）
  4. 自动创建Amoeba + 工作台
  5. 发送通知给对应成员
  6. 成员认领/拒绝
  7. 执行监控 → 完成门禁 → 汇聚
quality_gates:
  - gate: 指令解析准确率
    criteria: 用户意图识别准确率 > 85%
    method: 抽样测试10条指令
  - gate: 成员匹配合理性
    criteria: 主任务的成员匹配度 > 70%
    method: 验证匹配分数
  - gate: 任务隔离
    criteria: 并行任务互不干扰
    method: 同时运行2个任务验证
version: "0.1"
created_at: 2026-06-14
