name: superpowers-employee-legion
version: v1.0.0
description: 员工军团管理 — 基于8部门×13大师视角映射的AI数智军团组织架构。包含173名员工、8个部门（情报·合规·产品·技术·市场·人力·财务·战略），每个部门由一位大师灵魂注入。员工通过灵魂注入引擎获得大师视角，通过三问自检沉淀记忆。缺口自动创造机制确保能力不足时即时生成新员工。

atomic_models:
  - MM-01: 三层架构决策飞轮 — 血肉层在决策-执行闭环中的定位
  - MM-05: 产品原子复用评分体系 — 员工调用原子时的评分门禁
  - MM-04: 庙算决策飞轮 — 员工派单的完整执行流程

entry_points:
  - 决策白皮书输出任务包后，自动匹配对应部门员工
  - 员工接单后自动进行任务拆解+缺口检查
  - 执行完成后自动执行三问自检+记忆沉淀

products:
  - 通用: 自动匹配

created_at: 2026-07-08
