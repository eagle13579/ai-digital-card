name: superpowers-product-atom-reuse
version: v1.0.0
description: 产品原子复用引擎 — 基于5分制评分体系的跨产品原子复用机制。6大产品（翟如AI超级助理·赛博参谋·中国智慧AI顾问·决策引擎仪表盘·数字员工SaaS·AI开发工坊）共33个原子，其中19个≥5分可跨产品注入。原子通过通用性·稳定性·文档质量·可测试性·性能五维评分，达到阈值后自动注册至ATOM_CATALOG，支持跨产品自由调用。

atomic_models:
  - MM-05: 产品原子复用评分体系 — 原子评分的核心机制
  - MM-01: 三层架构决策飞轮 — 手足层的定位与能力反馈机制
  - MM-02: 五池决策系统 — 能力反馈如何回写五池

entry_points:
  - 员工执行任务时按需调用产品原子
  - 新原子达到5分后自动注册到跨产品目录
  - 原子运行日志每日同步更新ATOM_CATALOG

products:
  - 翟如AI超级助理: 7原子
  - 赛博参谋: 6原子
  - 中国智慧AI顾问: 6原子
  - 决策引擎仪表盘: 5原子
  - 数字员工SaaS: 5原子
  - AI开发工坊: 4原子

created_at: 2026-07-08
