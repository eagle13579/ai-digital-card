feature_id: "F-CA-套利路径推荐器"
name: "套利路径推荐器 — 最优路径推荐"
version: "1.0.0"
dimension: "创造力"
source_model:
  - "五池/模型池/_原子/黑河-麦肯锡定义权/ (M7组合权叠加效应)"
  - "五池/模型池/_原子/黑河-资本套利元框架/ (M1三层楼架构)"
  - "五池/模型池/_原子/黑河离岸资本/ (H05动态配置)"
  - "五池/模型池/_原子/黑河调查局-矿产合规套利四步法/ (全部12原子)"
one_liner: "基于八维评分智能推荐1-3条最优套利路径，含实施步骤与风险清单"

products:
  - 通用: 自动匹配
  - 芯森态
what_it_does: >
  基于八维仲裁矩阵的评分结果，从8条预定义套利路径中推荐最佳匹配的
  1-3条路径。每条路径对应一组原子模型的组合实施方式：
  
  1. 矿产四步法路径 — 制裁折价买入→隐名代持→便利旗→过桥→三汇回流
     依赖维度: D7  |  难度: 高  |  预期回报: 40%+价差套利
  
  2. 规则制定权路径 — 参与行业标准→旋转门布局→影响税法→三层架构
     依赖维度: D1  |  难度: 极高  |  预期回报: 制度性租金(长期)
  
  3. 离岸架构路径 — 多法域容器→经济实质→动态配置→阳光下行走
     依赖维度: D4  |  难度: 中  |  预期回报: 税负降低30-50%
  
  4. 消费端套利路径 — 默认续费→取消迷宫→消极同意→动态挽留
     依赖维度: D5  |  难度: 低  |  预期回报: LTV提升50-200%
  
  5. 影子银行路径 — 预付体系→资金池构建→永不赎回→破损收入
     依赖维度: D3  |  难度: 中  |  预期回报: 资金池收益占总利润30%+
  
  6. IP法律护城河路径 — 文化开采→法律锁定→组合权→游说延长
     依赖维度: D2  |  难度: 高  |  预期回报: IP垄断溢价50-300%
  
  7. 资本逃逸路线路径 — 利润液化→壳公司→碎片化→信托收容
     依赖维度: D6  |  难度: 极高  |  预期回报: 100%利润免于税负
  
  8. 三合一闭环路径 — 设计权→执行权→受益权→永续锁定
     依赖维度: D8  |  难度: 极高  |  预期回报: 规则级收益永续
input:
  - "八维仲裁矩阵评分结果（D1-D8的0-100评分）"
output:
  - "Top 1-3推荐套利路径（含路径名称/评分/描述）"
  - "每条路径的预期回报/时间窗口/难度评估"
  - "路径对应的关键原子模型清单"
  - "路径的可执行步骤（5-6步）"
  - "每条路径的风险清单"
sop:
  - "step: 接收八维评分结果"
  - "step: 对每条预定义路径计算匹配度（主依赖维度×0.6 + 其他维度×0.05）"
  - "step: 按匹配度降序排列8条路径"
  - "step: 取Top N（默认3条）作为推荐结果"
  - "step: 每条路径加载预定义的步骤/风险/预期回报信息"
  - "step: 返回Top 1作为最优路径，Top 1-3作为备选方案"
quality_gate:
  - "覆盖8条套利路径（不缺路径）"
  - "路径匹配度可解释（关联到具体维度评分）"
  - "每条路径至少5个可执行步骤"
  - "每条路径至少3个风险提示"
  - "Top 1路径明确标注为最优推荐"
score_target: 9/10
depends_on:
  - "F-CA-八维仲裁矩阵（路径推荐依赖八维评分输入）"
enhanced_by:
  - "F-TX-05: 全球套利能力融合门禁(Gate 0)"
  - "F-CA-合规风险评估器（合规评估结果影响路径选择）"
iteration_log:
  - version: "1.0.0"
    date: "2026-06-13"
    author: "黑河调查局/白泽"
    changes: |
      初始创建。基于黑河调查局8组原子构建8条标准化套利路径。
      每条路径关联特定的原子模型组合，匹配度算法同时考虑
      主依赖维度（权重×0.6）和其他维度（权重×0.05）。
      路径步骤直接引用原子模型的操作逻辑。
