description: >
  统一多种 Agent CLI 的 Backend 接口，提供流式执行与 stdout/stderr 解析能力。
  将异构 Agent 调用抽象为统一的 Session 结构（Message channel + Result channel），
  对标 LangChain Agent Executor。白泽军团可复用此模式接入更多 Agent CLI。
