name: "F1: Agent-Runtime 插件化引擎"
version: v1.0.0
source: multica
type: infrastructure-pattern
inputs:
  - Agent CLI 多种 (Claude Code / Codex / Hermes / Gemini / Cursor / Copilot / OpenClaw / OpenCode / Pi)
  - Agent 执行指令
