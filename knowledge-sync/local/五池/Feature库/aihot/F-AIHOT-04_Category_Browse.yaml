# 分类聚合内容消费 — 结构化内容按分类呈现，用户按需消费而非全量推送
# AIHOT Bot 核心心智模型 #4
name: F-AIHOT-04_Category_Browse
dimension: 场景
domain: 内容消费-分类导航
status: 生产就绪
priority: P1
source_models:
  - M-AIHOT-04_Category_Browse
description: |
  分类聚合内容消费模型提倡"用户主动选择"而非"系统全量推送"的信息消费方式。
  AIHOT Bot将AI热点分为6个分类，用户通过内联键盘按需浏览感兴趣的类别。

  6大分类体系：
  - 🧠 模型：新模型发布/技术突破
  - 📱 产品：新产品上线/功能更新
  - 🏭 行业：行业动态/政策变化/投融资
  - 📄 论文：重要论文/研究成果
  - 💡 技巧：使用技巧/最佳实践
  - ⚡ 快讯：短平快的即时消息

  两种浏览模式：
  - featured：精选模式（展示每个分类最热门的1-2条）
  - all：全部模式（展示某个分类下的所有热点）
input:
  - 原始热点数据（包含category字段）
  - 分类筛选条件（用户选择的分类）
  - 浏览模式（featured/all）
output:
  - 按分类分组的消息内容
  - 分类导航键盘布局
sop: |
  1. 加载全部热点数据
  2. 按category字段分组为6个分类
  3. 展示分类导航首页（6个分类按钮）
  4. 用户选择分类 → 默认进入featured模式
  5. 用户可切换all模式查看该分类全部内容
  6. 每条热点显示：标题+摘要+链接+时间
quality_gates:
  - gate: 分类覆盖率
    criteria: 所有热点都被正确分类，无未分类项
    method: 遍历热点数据，检查category字段非空
  - gate: 分类切换响应
    criteria: 分类间切换延迟 < 1秒
    method: 测量分类按钮点击到内容展示的时间
  - gate: featured精选质量
    criteria: featured模式展示的内容为同类中热度最高
    method: 按热度排序取top，与人工精选对比
version: "1.0.0"

products:
  - 通用: 自动匹配
created_at: 2026-06-15
product_mapping:
  - 知识库: 知识库的分类导航体系可复用此6分类模型
  - 产品文档: 产品文档的分类呈现参考此按需消费模式
  - 盖娅情报: 情报系统的分类聚合展示参考此设计
