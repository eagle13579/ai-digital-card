# 免认证公开数据集成 — 合理的公开REST API不需要API Key，降低使用门槛
# AIHOT Bot 核心心智模型 #6
name: F-AIHOT-06_Auth_Free_API
dimension: 数据
domain: 数据集成-免认证API
status: 生产就绪
priority: P2
source_models:
  - M-AIHOT-06_Auth_Free_API
description: |
  免认证公开数据集成模型强调：对于公开的、非敏感的数据，优先使用无需API Key
  的公开REST API，大幅降低集成门槛和运维成本。

  AIHOT Bot实践：
  - 数据源：AIHOT API（无需Token/API Key）
  - 频率限制：600次/分钟（远高于Bot实际需求）
  - 请求方式：简单GET请求，无认证头部
  - 数据结构：标准JSON格式，无加密/签名

  核心理念：
  - 公开数据 → 公开API（不要过度保护）
  - 无Auth降低了N倍集成复杂度
  - 合理的频率限制即可，无需复杂OAuth
  - 先试公开API，再看Auth
input:
  - API端点URL（公开可访问）
  - 请求参数（时间段/分类/数量等）
output:
  - JSON响应数据（结构化的热点信息）
  - 响应状态（成功/失败/频率超限）
sop: |
  1. 确认数据源为公开数据，无需认证
  2. 直接构造GET请求 → 调用API端点
  3. 解析JSON响应 → 提取所需数据字段
  4. 检查频率限制头部（RateLimit-Remaining）
  5. 频率接近上限时降级为缓存数据
quality_gates:
  - gate: 无Auth集成
    criteria: 请求中不含任何认证信息（API Key/Token/Basic Auth）
    method: 检查请求头部，无Authorization字段
  - gate: 频率限制合规
    criteria: 请求频率不超过API限制的50%
    method: 监控RateLimit-Remaining头部，低于50%时告警
  - gate: 降级响应
    criteria: 频率超限时自动使用缓存数据
    method: 模拟频率超限响应，验证降级机制
version: "1.0.0"

products:
  - 通用: 自动匹配
created_at: 2026-06-15
product_mapping:
  - 外部数据采集: 所有外部数据采集优先尝试公开API，再考虑Auth方案
  - 盖娅情报: 情报系统的外部数据采集可参考此最小权限原则
  - 内容工厂: 内容工厂的数据源集成遵循此模式
