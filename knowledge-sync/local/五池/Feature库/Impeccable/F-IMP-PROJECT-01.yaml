id: F-IMP-PROJECT-01
name: PRODUCT.md + DESIGN.md 项目初始化协议
source_model: "Impeccable — /impeccable init 自动生成PRODUCT.md(受众/品牌/定位/竞品) + DESIGN.md(色板/字体/组件/语气)"
dimension: 体系

products:
  - 通用: 自动匹配
description: >-
  任何设计开始前必须执行init流程: 询问brand vs product → 采集设计上下文 →
  生成PRODUCT.md(产品定位/受众/品牌/竞品/语气) + DESIGN.md(颜色/字体/间距/组件/动效)。
  所有后续命令读取这两个文件作为设计约束。两个register完全不互通:
  brand register(品牌营销)和product register(产品UI)使用不同的设计体系。
  这解决了AI设计「不知道项目背景就瞎猜」的核心问题。
input: 项目基本信息(brand/product + 领域 + 风格)
output: PRODUCT.md + DESIGN.md 项目设计上下文
sop: "① 识别surface: brand(营销/落地页/品牌) vs product(应用UI/仪表盘/工具)
  ② 采集: 受众/品牌/定位/竞品/语气 → PRODUCT.md
  ③ 采集: 色板/字体/间距/组件库/动效风格 → DESIGN.md
  ④ 选择register: brand register或product register
  ⑤ 所有后续命令读取这两文件作为设计约束"
quality_gates: 必填字段全部采集后才进入设计、brand/product register不混用、支持增量更新
created_at: '2026-06-13'
iteration_count: 1
last_score: 8
application_scope: 链客宝新项目初始化/AI招商设计流程/白泽前端项目启动
