id: F-IMP-DETECT-01
name: 41 Deterministic Anti-Pattern Detectors
source_model: "Impeccable — 41条确定性检测规则, CLI + 浏览器扩展执行, 无需LLM和API Key"
dimension: 基本功

products:
  - 通用: 自动匹配
description: >-
  41条确定性规则扫描前端界面的AI反模式: Inter默认字体检测、紫色渐变检测、
  卡片嵌套卡片检测、灰色文字彩色背景检测、圆角方形图标检测等。
  CLI模式(npx impeccable audit)和浏览器扩展两种执行方式。
  规则100%确定性(无LLM幻觉), 可在CI/CD中运行。
input: HTML/CSS代码或浏览器页面URL
output: 违反规则的列表(规则名+位置+严重度+修复建议)
sop: "① 加载HTML/CSS → DOM解析/正则匹配
  ② 逐条运行41条规则(每条约5-20行确定性代码)
  ③ 输出: 规则名称×违反位置×严重度(高/中/低)×修复建议
  ④ CLI模式: npx impeccable audit ./src
  ⑤ 浏览器扩展: 实时高亮违反区域"
quality_gates: 零假阳性(确定性规则)、每规则不超过50行代码、CI/CD可集成
created_at: '2026-06-13'
iteration_count: 1
last_score: 9
application_scope: 白泽输出前自检/链客宝UI质量门禁/AI招商页面审查/CI流水线
