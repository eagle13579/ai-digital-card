feature_id: "F-TX-DIFY-DAG工作流"
name: "DAG可视化工作流编排引擎"
version: "1.0.0"
dimension: "体系"
source_model: "dify/可视化工作流DSL"
# 精确source_model溯源 (2026-06-12): * 2026-06-12: 来源待进一步溯源
created_at: "2026-06-08"
author: "白泽 (向海容授权自动扫描吸收)"

one_liner: "基于有向无环图(DAG)的可视化AI工作流编排范式，节点可拖拽连接，支持条件分支/循环/并行/子工作流嵌套"

products:
  - 通用: 自动匹配
what_it_does: |
  场景：构建复杂AI应用（多步推理、条件路由、人工审核、工具调用链）时，需要可编排的工作流引擎。
  问题：硬编码流程不可修改、不可观察、不可调试；无代码流程缺乏表达力。
  价值：Dify的Canvas式DAG工作流提供一种中间范式——兼具无代码的可视化优势和代码级流程的表达力。

  核心架构模式：
  - 节点类型体系：LLM节点/知识检索节点/代码执行节点/条件分支节点/迭代节点/模板转换节点/变量聚合节点
  - 连接语义：节点间的数据流通过变量绑定传递，而非显式连线（类Unix管道哲学）
  - 子工作流：支持工作流嵌套调用，形成可复用的工作流组件库
  - 断点续跑：工作流执行到中间节点可暂停，人工审核后继续
  - 可观测性：每个节点独立记录输入/输出/耗时/token消耗

input: |
  - AI任务描述: 需要编排的AI业务流程
  - 流程复杂度: 线性 | 分支 | 循环 | 嵌套
  - 参与方: LLM数量/工具数量/人工审核点数量
  - 执行约束: 延迟要求/成本预算/合规要求

output: |
  - DAG工作流架构图: 节点+数据流拓扑
  - 节点类型分配表: 每个节点选择最合适的节点类型
  - 变量传递矩阵: 节点间输入输出变量映射
  - 执行路径分析: 最长路径延迟评估/关键路径识别
  - 可观测性方案: 每个节点的日志/监控/告警配置

sop: |
  1. 将AI任务分解为原子步骤（每一步一个节点）
  2. 识别步骤间的数据依赖关系 → 确定DAG方向
  3. 为每个节点选择合适的类型（LLM/检索/代码/条件/迭代/模板/变量）
  4. 定义节点间变量传递（输入变量映射到输出变量）
  5. 标注条件分支/循环边界/并行路径
  6. 识别需要人工审核的节点 → 加入暂停/审核逻辑
  7. 评估每一条执行路径的延迟+token成本
  8. 为每个节点配置日志/监控/告警
  9. 输出完整工作流定义+可观测性方案

  6. 节点健康检查: 每个DAG节点运行后自动校验输出格式+数据完整性
  7. 工作流版本化: 每次DAG执行结果自动存档，支持回滚到任意历史版本

quality_gate:
  - gate: "DAG无环验证"
    standard: "100%节点可达，无死循环，无不可达节点"
    score: 9
  - gate: "变量传递正确性"
    standard: "每个节点的输入变量100%来自上游输出或全局变量"
    score: 7
  - gate: "执行路径覆盖"
    standard: "所有条件分支路径至少有一条测试覆盖"
    score: 6
  - gate: "可观测性完备"
    standard: "每个节点至少记录输入摘要/输出摘要/耗时/token消耗"
    score: 7

score_target: "8/10"
depends_on:
  - "F-体系-01_系统架构MECE拆解"
enhanced_by:
  - "F-OPS-LLM-可观测性_LLM应用可观测性框架"
  - "F-JBG-工业化生产_工业化生产"

