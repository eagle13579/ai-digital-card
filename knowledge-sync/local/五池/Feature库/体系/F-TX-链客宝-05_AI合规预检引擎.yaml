# === Feature 定义文件 ===
feature_id: "F-TX-链客宝-05"
name: "AI合规预检引擎"
version: "1.0.0"
dimension: "体系"
source_model: "链客宝compliance_rules.py + 合规知识图谱 + F-TX-数智港-01合规诊断引擎"
created_at: "2026-06-11"
author: "白泽"

# ─── 定位 ───
one_liner: "AI生成内容发布前自动合规预检，过滤违禁词/虚假宣传/资质缺失/敏感声明，拦截不合规内容不流出"

products:
  - 通用: 自动匹配
what_it_does: |
  在AI数字员工生成内容（AI名片/营销文案/产品描述/广告语）发布到用户端之前，
  执行多层合规预检：违禁词过滤 → 虚假宣传检测 → 资质声明验证 → 行业特定规则匹配 →
  综合风险评级。拦截不合规内容，给出具体违规原因+修改建议，让AI产出"出厂即合规"。

  场景：链客宝AI名片自动生成、营销内容工厂、产品描述AI生成
  问题：AI生成内容可能包含违禁词/绝对化用语/未经证实的功效声明/缺失必要资质声明
  价值：减少人工合规审核成本90%，降低违规发布风险，提升内容过审率

# ─── TCP-R 角色定位 ───
tcp_r_role:
  thesis: "AI生成内容在发布前必须经过多层合规预检，从源头拦截违规内容，而非发布后人工补救"
  counter: "如果规则库未及时更新（如行业监管新规发布），预检引擎会产生漏判；如果规则过严（过度过滤），会误杀正常内容"
  position: "规则库应建立周期性更新机制（月度+监管动态触发），配合人工复核白名单机制，平衡合规率与内容产出效率"
  review: "合规预检的门禁不是一劳永逸的——规则需要持续迭代，行业差异需要专项适配"

# ─── 输入输出 ───
input: |
  - 待发布内容: 文本/HTML/Markdown（AI生成的卡片描述/营销文案/产品介绍）
  - 内容类型: 名片文案/营销推文/产品描述/广告语/用户协议
  - 所属行业: 医疗/食品/金融/教育/普通（不同行业合规标准差异大）
  - 发布渠道: 微信/网站/印刷品/APP（渠道合规标准不同）
output: |
  - 合规风险评级: 🟢通过 / 🟡警告（建议修改） / 🔴拦截（禁止发布）
  - 违规明细清单: 每条违规内容+引用规则编号+违规类型
  - 修改建议: 针对每条违规内容给出合规改写方案
  - 合规报告: 结构化JSON/HTML报告，可存档备查

# ─── 执行SOP ───
sop: |
  1. 内容解析：将输入内容按段落/句子/关键词粒度拆解，提取声明性语句/功效描述/数据引用
  2. 违禁词匹配：扫描违禁词库（绝对化用语如"最好""第一"、极限词、虚假承诺、违禁医疗词）
  3. 虚假宣传检测：对功效声明做语义分析（如"7天见效""根治"→标记为功效声明需资质佐证）
  4. 资质声明验证：检查必要声明是否缺失（如"广告""仅供参考""不作为诊断依据"等免责声明）
  5. 行业特殊规则：按输入行业加载专项规则（医疗→广告法特别条款，金融→风险提示必需）
  6. 综合评分：加权计算风险分（违禁词权重40%、虚假宣传30%、资质缺失20%、行业规则10%）
  7. 输出结果：生成合规报告+修改建议，拦截评分≥80的内容，标记评分30-79的内容

# ─── 质量门禁 ───
quality_gate:
  - gate: "违禁词匹配召回率≥95%（对比人工审核标准库）"
    standard: "通过"
    score: 5
  - gate: "虚假宣传误杀率≤5%（合规内容不被错误标记）"
    standard: "通过"
    score: 5
  - gate: "预检响应时间≤2秒/条（不影响AI内容生成体验）"
    standard: "通过"
    score: 5
  - gate: "至少覆盖3个行业的专项合规规则（医疗/金融/普通）"
    standard: "通过"
    score: 5
  - gate: "输出整改建议可执行率≥80%（建议直接可用而非泛泛而谈）"
    standard: "通过"
    score: 5

score_target: "9/10"

# ─── 关联 ───
depends_on:
  - "F-TX-数智港-01（合规诊断引擎 — 规则匹配框架复用）"
  - "F-DAT-链客宝-01（信任评分引擎 — 内容可信度评估联动）"
enhanced_by:
  - "F-DATA-数智港-01（韩国进口合规知识图谱 — 跨境合规规则导入）"
  - "F-SJ-链客宝-01（名片视觉设计系统 — 合规预检后视觉适配）"

