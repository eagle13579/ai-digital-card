feature_id: "F-EAI-01"
name: "企业AI知识飞轮底座"
version: "1.0.0"
dimension: "体系"
status: "active"
source_model: |
  M01 企业AI认知鸿沟
  M03 活的知识飞轮
  M04 三步落地法
  M07 隐性经验资产化

one_liner: "帮企业从空白输入框到活的知识飞轮——数据沙箱+关系网+自我进化的完整底座"

what_it_does: |
  企业AI落地最大的障碍是模型不认识公司。这个Feature提供一个基础设施层：
  1. 数据沙箱：隔离安全护栏，不碰生产系统
  2. 关系图谱：不是死的文件柜，是活的人事物关联网
  3. 自我进化：每次业务操作自动更新知识网络
  4. 三步落地：从高价值数据开始→工作中自动织网→千人千面

input:
  - 企业业务数据（报价单/客户沟通/审批流）
  - 组织结构（部门/角色/权限）
  - 已有知识库文件

output:
  - 活的知识飞轮（关系图谱+自动进化）
  - 每个岗位的AI工作台视图
  - 全公司效率透视图（老板看板）

sop: |
  1. 部署数据沙箱：确认安全隔离边界
  2. 导入高价值数据：优先报价单/客户记录/审批流
  3. 骨干带教三轮：手把手告诉AI人事物关系
  4. 开启自动织网：AI从每次操作提取关系并关联
  5. 配置角色视图：销售/财务/老板各一张AI工作台
  6. 指标看板：使用率/知识增长/效率提升

quality_gate:
  score: 7
  gate_1: "数据沙箱部署完成，不碰生产系统"
  gate_2: "关系图谱覆盖率>70%（能关联大部分核心业务实体）"
  gate_3: "至少2个角色视图可用"

depends_on: ["F-EAI-03", "F-EAI-06"]
enhanced_by: ["F-EAI-02", "F-EAI-05"]

