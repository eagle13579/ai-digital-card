feature_id: "F-EAI-06"
name: "角色视图隔离引擎"
version: "1.0.0"
dimension: "体系"
status: "active"
source_model: |
  M06 千人千面岗位视角
  M03 活的知识飞轮
  M02 数据沙箱安全护栏

one_liner: "一个知识飞轮底座，N个角色视图——销售看客户、财务看账、老板看全公司"

what_it_does: |
  底层是同一个知识飞轮，但每个角色看到不同的AI工作台：
  - 销售：客户画像+历史报价+关联合同
  - 财务：合规要求+异常账目+审批流
  - 运营：流程效率+瓶颈分析+自动建议
  - 老板：全公司AI效率透视图+卡点识别
  数据不重复建，安全严格隔离。

input:
  - 角色定义（名称/权限/关注点）
  - 知识飞轮底层数据
  - 业务规则

output:
  - 每个角色的AI工作台视图
  - 老板效率透视图
  - 数据安全隔离配置

sop: |
  1. 定义角色清单：老板/销售/财务/运营/HR
  2. 每个角色配置：能看到什么数据/能做什么操作/能看什么指标
  3. 配置数据安全隔离：销售不能看财务数据，财务不能改销售报价
  4. 生成角色视图模板
  5. 老板视图特别配置：跨部门效率对比+卡点Top5+趋势

quality_gate:
  score: 7
  gate_1: "3个角色视图配置完成"
  gate_2: "安全隔离验证：跨角色数据不可见"
  gate_3: "老板视图含卡点识别功能"

depends_on: ["F-EAI-01"]
enhanced_by: ["F-EAI-02"]

