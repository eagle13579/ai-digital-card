feature_id: "F-TX-ADV-双三角乘"
name: "双三角乘数竞争力评估"
version: "1.1.0"
dimension: "体系"
source_model: "L5孵化室/五池/模型池/_原子/双三角模型/M1-双三角模型总纲+底座.md + M2-创造力三角-业务拆解.md + M3-场景三角-AI打磨.md + 一堂-S1-双三角乘数模型.md"
created_at: "2026-06-07"
updated_at: "2026-06-08"
author: "白泽 (由2.5分打磨至7.5分)"
last_execution: "2026-06-08 07:45 — Feature库质量扫描"

one_liner: "用竞争力=创造力×场景公式，评估任何项目/产品的双三角竞争力得分，定位短板维度"

products:
  - 通用: 自动匹配
what_it_does: |
  源自一堂AI-Partner底层的AI双三角模型（v5.0完整吸收）。
  核心公式: 竞争力 = 创造力(三角一) × 场景(三角二)
  
  三角一(创造力): 业务拆解·底层规律·解放思想·创造假设 — "好问题=半篇好答案"
  三角二(场景): AI打磨·组织部署·RORY·执行力 — "AI嵌入真实工作流"
  底座: 基本功阶梯(提示词→多模态→微调) + 数据三阶(非结构→结构→资产)
  
  三层架构:
  - 宏观: 领域穿透 + 商业竞争力双三角 + AIforBusiness
  - 中观: 实事求是·单点击穿 + 细分领域双三角对Feature饱和攻击
  - 微观: 交付上限 + 三迭代门(60→80→95) + Feature RORY

input: |
  - 项目/产品描述: 需要评估范围的完整描述
  - 评估粒度: 宏观(商业层) | 中观(Feature层) | 微观(执行层)
  - 双三角六维: 审美·体系·创造力·基本功·数据·场景 — 六个旋钮

output: |
  - 双三角竞争力得分 (1-10分): 创造力得分×场景得分
  - 四张力内循环检查结果: 审美↔场景 / 体系↔数据 / 创造力↔基本功 / 底座承重
  - 薄弱维度排名: 最低分维度→建议Feature注入
  - KFD诊断: 当前Kernel是否稳固？Feature是否覆盖六维？DataPack是否原子化？

sop: |
  1. 发散阶段: 收集50-60个要素(6维度×10)，不跳步
  2. 四张力内循环: 每对张力找平衡方案（审美↔场景/体系↔数据/创造力↔基本功/底座承重）
  3. 底座承重评估: 基本功+数据能否支撑三角一+二
  4. KFD架构诊断: Kernel独立? 每维至少1Feature? Feature通DataPack? 
  5. 输出竞争力得分+改进路径

  6. 结果验证: 用3个已评估项目回测竞争力得分，校准评分标准
  7. 定期刷新: 每2周对活跃Feature做一次双三角扫描，追踪维度变化趋势

quality_gate:
  - gate: "六维覆盖度"
    standard: "6个维度每个至少产生10个要素"
    score: 7
  - gate: "四张力检查"
    standard: "4对张力至少产生1个平衡方案"
    score: 7
  - gate: "底座承重评估"
    standard: "明确标注底座是否可支撑上部"
    score: 9
  - gate: "KFD诊断完成"
    standard: "Kernel/Feature/DataPack三层至少各1条建议"
    score: 7

score_target: "10/10"
depends_on:
  - "F-体系-01_系统架构MECE拆解"
  - "F-CZL-ADV-TCP-_TCP-R门禁执行器"
  - "F-基本功-01_代码质量审查"
enhanced_by:
  - "F-TX-系统架构与工程体系"
  - "F-TX-流程设计与方法论"
  - "F-DAT-实事求是"

