feature_id: "F-体系-原子挖掘-04"
name: "多维度企业匹配规则引擎"
version: "1.0.0"
dimension: "体系"
source_model: "M15-多维度企业匹配规则引擎"
source_project: "AI获客"
source_location: "D:/AI获客/2B_撮合引擎/tools/enterprise_matcher.py: 62渠道×10维评分(类目/地域/规模/资质等)"
created_at: "2026-06-08"
author: "Hermes Agent (原子挖掘)"

one_liner: "62渠道×10维评分的B端企业匹配规则引擎，覆盖类目/地域/规模/资质等多维度"
what_it_does: |
  场景：链客宝B端企业撮合需要精准的多维度匹配规则。
  问题：简单标签匹配无法满足企业级匹配的复杂需求，遗漏关键维度和渠道。
  价值：通过62个渠道×10维评分体系(类目/地域/规模/资质/信用/产能/需求/历史/关系/时效)，实现企业级精准匹配。
  架构亮点：纯规则引擎(无ML依赖)+可配置权重矩阵+渠道自动发现+评分结果可解释。

input: |
  - 企业画像: 目标企业的类目、地域、规模、资质等10维属性
  - 渠道列表: 最多62个匹配渠道的配置
  - 权重矩阵: 10维评分维度的权重配置
  - 匹配类型: 2B撮合/2C撮合/社媒运营

output: |
  - 匹配评分: 每个渠道×企业对的综合评分(0-100)
  - 维度明细: 10个维度的独立评分明细
  - 渠道排序: 按评分降序的渠道排名
  - 推荐企业: 综合评分最高的Top-N企业列表

sop: |
  1. 接收企业画像和匹配渠道列表
  2. 对每个渠道加载对应的规则配置
  3. 按10维评分体系逐维计算匹配分
  4. 应用可配置权重矩阵加权综合评分
  5. 按总分降序排列各渠道匹配结果
  6. 取Top-N结果输出推荐企业列表
  7. 记录匹配日志供后续优化分析

quality_gate:
  - gate: "维度完整性"
    standard: "10维评分维度必须全部参与计算，不允许缺失"
    score: 5
  - gate: "渠道覆盖"
    standard: "渠道配置支持动态增删，不低于40个活跃渠道"
    score: 5
  - gate: "评分可解释"
    standard: "每个评分结果可下钻到10维明细"
    score: 5
  - gate: "规则引擎性能"
    standard: "单次匹配计算 < 1s(62渠道全量)"
    score: 5

score_target: "8/10"
