feature_id: F-ARC-A2A-02
name: A2A通信层 — 话题代理
version: "1.0"
dimension: 体系
source_model: 虾评Skill A2A-CHAT v1.0.0
# 精确source_model溯源 (2026-06-12): 五池/模型池/A2A-CHAT注入清单_2026-06-08.md
source_project: Feature总线/a2a/topic_broker.py
one_liner: Agent订阅话题后，发布到话题的消息自动推送给所有订阅者

products:
  - 通用: 自动匹配
what_it_does: 替代CEO手动选择蜂巢参与者，Agent按能力/角色自动订阅话题，发布到话题的消息自动路由到所有订阅者
input:
  - action: subscribe | unsubscribe | publish
  - agent: str
  - topic: str
  - message: dict (publish时)
output:
  - subscribers: list[str] (查询时)
  - published_count: int (发布时)
sop: |
  1. Agent注册话题订阅(topic, agent_id)
  2. 发布者向话题发送消息
  3. broker自动推送给所有订阅者的消息队列
  4. 每个订阅者独立consume处理
  5. 预置话题: architecture/code-review/strategy/compliance/market
quality_gate:
  - score: 6/10
  - checks:
    - 订阅/退订O(1)
    - 广播不影响发布者
    - 订阅者失败不影响其他订阅者
iteration_log:
  - "2026-06-08: v1.0初始版本"
