feature_id: "F-TX-链客宝-03"
name: "蓝绿部署引擎"
version: "1.0.0"
dimension: "体系"
source_model: "chainke-full/scripts/replace_appid.py + chainke-full/ywhy-ai-backend/main.py"
source_project: "chainke-full"
created_at: "2026-06-08"
author: "白泽 (向海容授权自动扫描吸收)"

one_liner: "通过脚本化部署替换+双环境并行切流，实现零宕机版本更新和即时回滚机制"

products:
  - 通用: 自动匹配
what_it_does: |
  场景：链客宝需要在不停机的情况下发布新版本，并在出现问题时快速回滚。
  问题：传统部署方式需要停机维护，影响用户使用；回滚流程复杂耗时长。
  价值：链客宝通过蓝绿部署引擎实现：
  - 两套独立环境（蓝/绿），一套生产流量、一套新版本预部署
  - 使用replace_appid.py脚本化配置替换，实现环境间快速切换
  - ywhy-ai-backend/main.py作为独立后端服务，支持并行运行
  - 切换时间控制在秒级，回滚只需切回原环境

  核心机制：
  - 蓝环境（当前生产）<-> 绿环境（新版本）并行存在
  - traffic.sh（流量切换脚本）控制路由器/网关的流量分发
  - 切换前自动运行健康检查和冒烟测试
  - 切换后有观察窗口（默认15分钟），发现问题一键回滚
  - 回滚耗时不超过60秒

input: |
  - 蓝环境配置: 当前生产环境的负载均衡/网关配置
  - 绿环境配置: 新版本部署完成后的环境配置
  - 切换脚本: traffic.sh 流量切换指令
  - 健康检查: 新版本健康检查端点的响应状态

output: |
  - 蓝绿环境状态: 当前哪个环境在服务生产流量
  - 切换操作日志: 切换时间/操作人/验证结果
  - 健康检查报告: 新版本全量接口健康状态
  - 回滚操作日志: 回滚时间/原因/耗时

sop: |
  1. 准备好蓝环境（当前生产）和绿环境（新版本代码+依赖）两套基础设施
  2. 将新版本部署到绿环境，运行健康检查和冒烟测试套件
  3. 确认绿环境全部检测通过后，执行traffic.sh切换流量到绿环境
  4. 启动15分钟观察窗口，监控错误率和响应时间
  5. 观察窗口内无异常→确认切换完成，蓝环境保留作为回滚备用
  6. 观察窗口内发现异常→执行一键回滚脚本，流量切回蓝环境
  7. 记录切换/回滚操作日志，更新环境状态文档

quality_gate:
  - gate: "健康检查必过"
    standard: "切换前新版本所有健康检查端点100%通过"
    score: 5
  - gate: "切换时间"
    standard: "流量切换耗时不超过30秒"
    score: 5
  - gate: "回滚能力"
    standard: "一键回滚耗时不超过60秒，不影响生产流量"
    score: 5

score_target: "9/10"
