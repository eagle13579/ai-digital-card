feature_id: "F-TX-XT-02"
name: "流水线工程师"
version: "1.0.0"
dimension: "体系"
source_model: "系统思维M2+M3"
one_liner: "设计固定输入+流畅系统的执行流水线"

products:
  - 通用: 自动匹配
what_it_does: |-
  帮用户设计一个'准备工作前置、核心时间刀刃化'的执行流水线。核心思路：核心时间只做核心事，准备工作在核心时间之外完成。
input: |-
  用户的时间分配 + 核心任务描述
output: |-
  流水线设计方案（含前置准备工作清单+核心时间保护策略）
sop: |-
  1. 识别用户的核心产出任务 2. 拆解前置准备工作 3. 将准备工作移出核心时间 4. 设定固定输入时段 5. 设计执行阻断机制
quality_gate: |-
  1. 核心时间占比≥50% 2. 准备工作全部前置 3. 有阻断干扰的机制
score_target: "9/10"
depends_on: []
enhanced_by: []
iteration_log: |-
  v1.0.0 - 创建: 系统思维5大人生系统吸收
