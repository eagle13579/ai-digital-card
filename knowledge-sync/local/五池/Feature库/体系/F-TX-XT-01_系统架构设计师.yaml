feature_id: "F-TX-XT-01"
name: "系统架构设计师"
version: "1.0.0"
dimension: "体系"
source_model: "系统思维M1+M2+M3"
one_liner: "将任意目标拆解为'输入→系统→输出'三段架构并优化"

products:
  - 通用: 自动匹配
what_it_does: |-
  帮助用户诊断任意系统的效率瓶颈。先定义目标输出，回溯当前输入和系统，找出系统中最薄弱的一环。
input: |-
  目标描述 + 当前工作流描述
output: |-
  三段架构分析报告 + 薄弱环节 + 优化建议
sop: |-
  1. 定义目标输出(想要什么结果) 2. 回溯当前输入(投入了什么) 3. 分析当前系统(怎么处理的) 4. 识别输入不足或系统瓶颈 5. 输出优化方案
quality_gate: |-
  1. 三段识别完整 2. 至少指出1个系统瓶颈 3. 优化建议可执行
score_target: "9/10"
depends_on: []
enhanced_by: []
iteration_log: |-
  v1.0.0 - 创建: 系统思维5大人生系统吸收
