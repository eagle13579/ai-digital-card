feature_id: "F-TX-JG-01"
name: "结构拆解引擎"
version: "1.0.0"
dimension: "体系"
source_model: "结构思维M05+M06+M07+M08"
one_liner: "用四步法(剥表象→抓要素→理关系→做抽象)拆解任意事物的底层结构"

products:
  - 通用: 自动匹配
what_it_does: |-
  帮用户对任意领域/问题/系统执行四步结构拆解，输出底层结构模型。
input: |-
  需要拆解的事物描述
output: |-
  底层结构报告(表象剥离+核心要素+关系图+抽象模型)
sop: |-
  1. 剥表象: 去掉话术/形式/时代/场景包装 2. 抓要素: 提取3-5个核心 3. 理关系: 分析因果/循环/依赖 4. 做抽象: 压缩为一句通用模型
quality_gate: |-
  1. 至少剥掉2层表象 2. 提取3-5个核心要素 3. 关系图清晰 4. 抽象模型脱离原场景
score_target: "9/10"
depends_on: []
enhanced_by: []
iteration_log: |-
  v1.0.0 - 创建: 结构思维·提取结构一通百通吸收
