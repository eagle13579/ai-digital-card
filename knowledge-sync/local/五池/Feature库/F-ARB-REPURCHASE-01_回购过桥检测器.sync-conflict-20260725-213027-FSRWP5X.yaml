id: F-ARB-REPURCHASE-01
name: 回购过桥检测器
dimension: 场景
domain: 资本套利
status: active
score: 7
description: 检测交易结构中是否存在回购过桥模式——对锁合同(现货销售+远期回购)+过桥实体+合规定价
source_model: 黑河调查局-回购过桥 RB-01~10
trigger:
  - 交易链中出现第三方过桥实体
  - 存在两份方向相反、时间错位的合同
  - 回购价格=成本+资金占用+仓储的公式定价
sop: |
  1. 扫描交易合同对，识别现货销售+远期回购的对锁结构
  2. 检查过桥实体的注册地是否在非制裁辖区
  3. 验证回购定价是否完全市场公允(无制裁溢价)
  4. 检查过桥实体与交易发起方的IFRS 10合并关系
quality_gate: score >= 7
