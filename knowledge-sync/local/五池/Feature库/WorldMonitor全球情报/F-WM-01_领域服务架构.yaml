id: F-WM-01
name: 领域服务架构
description: >
  基于 WM01 领域服务与 WM12 能力域编排，构建WorldMonitor的微服务领域边界与事件驱动架构。
  定义"情报采集-分析-呈现"三大核心域，每个域内按能力子域拆分为独立服务单元，通过领域事件
  进行解耦通信。该架构支撑全球情报的实时流转与横向扩展，确保各服务团队在统一领域语言下
  并行迭代。
dimension: 体系
domain: WorldMonitor
status: 规划中
tags:
