name: "F-TRANS-02"
title: "位置感知编码器"
version: 2.0.0
category: "序列建模"
description: "通过位置编码注入序列中Token的相对/绝对位置信息,打破自注意力的置换不变性,使模型感知语序关系"

# ============================================================
# 关联原子心智模型
# ============================================================
atoms:
  - "T02 位置编码"

