name: "F-TRANS-07"
title: "分组查询注意力路由(GQA)"
version: 1.0.0
category: "注意力路由优化"
description: "通过分组查询注意力(Grouped Query Attention)减少KV缓存内存占用,Q头数多于KV头数,多个Q共享同一组K/V,在不显著影响质量的前提下大幅降低推理显存"

