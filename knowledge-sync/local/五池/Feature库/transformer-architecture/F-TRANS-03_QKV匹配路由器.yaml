# ============================================================
# 实现模式: Python伪代码
# ============================================================
implementation_pattern: |
  class QKVMatcher:
      """
      QKV匹配路由器 — 三路投影 + 注意力评分 + 加权聚合

      核心数学: Attention(Q,K,V) = softmax( Q @ K^T / √d_k + mask ) @ V

      架构模式:
        ┌──────┐   ┌───┐         ┌─────────────────────────┐   ┌──────┐
        │ Input │──→│ Q │──┐     │                         │   │      │
        │ (x)   │──→│ K │──┤────→│  softmax( QK^T/√d ) @ V │──→│output│
        │       │──→│ V │──┘     │                         │   │      │
        └──────┘   └───┘         └─────────────────────────┘   └──────┘

      Variant A: 合并投影 (nanoGPT风格) — 一次矩阵乘法出QKV
        qkv = nn.Linear(d_model, 3 * d_model)
        q, k, v = qkv(x).split(d_model, dim=-1)

      Variant B: 独立投影 (原论文风格) — 三路独立Linear
        w_qs = nn.Linear(d_model, n_head * d_k)
        w_ks = nn.Linear(d_model, n_head * d_k)
        w_vs = nn.Linear(d_model, n_head * d_v)

      Variant C: GQA投影 (Llama风格) — Q多KV少,节省缓存
        q_proj = nn.Linear(d_model, num_heads * head_dim)       # Q: 32头
        k_proj = nn.Linear(d_model, num_kv_heads * head_dim)    # K: 8头
        v_proj = nn.Linear(d_model, num_kv_heads * head_dim)    # V: 8头
        # 前向时: repeat_kv(k, n_rep) 将8头复制为32头

      掩码控制:
        - Causal mask: 下三角矩阵,确保只能看到当前位置及之前Token (自回归)
        - Padding mask: 忽略填充位置
        - Cross-attn mask: 编码器→解码器注意力映射
      """

# ============================================================
# 设计原则
# ============================================================
design_principles:
  - "Query主动寻址,Key被动响应,Value承载待聚合信息 — 三路投影的角色分离使模型能灵活控制'谁来问、谁被问、传什么'"
  - "注意力权重归一化(softmax)确保聚合后的语义向量尺度稳定,同时实现稀疏聚焦"
  - "缩放因子 √d_k: 防止高维向量点积后数值过大导致softmax梯度消失"

# ============================================================
# 产品适配 (链客宝/AI名片/数智港)
# ============================================================
product_adaptations:
  - product: "链客宝"
    component: "供需智能匹配引擎"
    description: >
      将需求方Query与供给方Key进行注意力匹配:
      - Q = 需求方描述编码 (如"寻找餐饮供应链资源")
      - K = 供给方标签编码 (如"冷链物流/食材供应/中央厨房")
      - V = 供给方的完整能力描述
      注意力权重即匹配分数,加权V即融合了最匹配的供给方信息。GQA模式可扩展支持
      数十万供给方(更多的Q头,更少的KV缓存)。

  - product: "AI名片"
    component: "人脉精准推荐路由器"
    description: >
      Q = 当前用户的画像向量(行业角色/需求标签)
      K = 其他名片的标签摘要
      V = 名片的完整履历/自我介绍
      通过QKV匹配路由找出与当前用户最相关的人脉,注意力权重作为推荐置信度。
      支持"以人找关系"的多跳路由(链式QKV匹配)。

  - product: "数智港"
    component: "三通道路由中间件"
    description: >
      将数智港中不同数据源的查询请求编码为Query,数据源元信息编码为Key,
      数据内容编码为Value,实现智能路由。支持三种路由模式:
      1. 精确路由 (hard attention): 直接选择最高分Key的Value
      2. 模糊路由 (soft attention): 加权融合多个数据源的Value
      3. 混合路由 (top-k sparse): 选择Top-3数据源后做soft融合

# ============================================================
# 演进路径
# ============================================================
evolution_potential:
  - "已落地: GQA分组查询注意力 — 从LlamaAttention吸收,减少KV缓存内存75%,详见F-TRANS-07"
  - "稀疏注意力路由: 通过Top-K或ReLU门控使注意力矩阵稀疏化,降低长序列O(n²)复杂度"
  - "Flash Attention: 分块计算+IO优化的注意力,无需显式构造完整注意力矩阵"
  - "线性注意力: 使用核方法将注意力复杂度降低到O(n)"
