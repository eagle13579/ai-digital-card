name: "F-TRANS-03"
title: "QKV匹配路由器"
version: 2.0.0
category: "注意力路由"
description: "通过Query-Key-Value三路投影实现Token间语义相关性计算与信息加权聚合,是注意力机制的核心数学引擎"

# ============================================================
# 关联原子心智模型
# ============================================================
atoms:
  - "T03 QKV三重奏"
  - "T04 注意力机制"

