# ============================================================
# 实现模式: Python伪代码
# ============================================================
implementation_pattern: |
  class AutoregressivePipeline:
      """
      自回归任务流水线 — 逐步生成序列的核心引擎

      ===== 主循环 =====
      def generate(self, prompt_ids, max_new_tokens, temperature=1.0, top_k=None):
          idx = prompt_ids  # (batch, seq_len)
          # 可选: 初始化KV缓存

          for step in range(max_new_tokens):
              # 1. 裁剪上下文(防止超过最大长度)
              idx_cond = idx[:, -block_size:]

              # 2. 单次前向传播
              logits, _ = model(idx_cond)  # (batch, seq_len, vocab_size)

              # 3. 取最后一个位置的logits
              logits = logits[:, -1, :]  # (batch, vocab_size)

              # 4. 解码策略
              logits = logits / temperature    # 温度控制
              if top_k is not None:
                  # Top-K截断: 只保留最高K个候选
                  top_k_vals, _ = torch.topk(logits, top_k)
                  logits[logits < top_k_vals[:, [-1]]] = -inf
              probs = F.softmax(logits, dim=-1)

              # 5. 采样
              idx_next = torch.multinomial(probs, num_samples=1)

              # 6. 追加并继续
              idx = torch.cat([idx, idx_next], dim=1)

          return idx

      ===== 解码策略对比 =====
      ┌────────────┬────────────────────────────────┬──────────────────────┐
      │ 策略       │ 实现                          │ 适用场景             │
      ├────────────┼────────────────────────────────┼──────────────────────┤
      │ Greedy     │ argmax(logits)               │ 确定性推理(翻译)     │
      │ Sampling   │ multinomial(softmax(logits)) │ 创造性生成(对话)     │
      │ Top-K      │ 保留Top-K后采样              │ 平衡多样性与质量     │
      │ Top-P(nuc) │ 保留累积概率≥p的最小集合     │ 动态候选集自适应     │
      │ Beam Search│ 保留Top-B个序列路径          │ 高质量但计算昂贵     │
      └────────────┴────────────────────────────────┴──────────────────────┘

      ===== KV缓存加速原理 =====
      第t步时:
        Q_t = proj_q(x_t)                  # 只计算当前输入Token的Q
        K_(1:t) = [K_(1:t-1); proj_k(x_t)] # K缓存拼接新K
        V_(1:t) = [V_(1:t-1); proj_v(x_t)] # V缓存拼接新V
        注意力: softmax(Q_t @ K_(1:t)^T / sqrt(d)) @ V_(1:t)
        复杂度: O(t*d²), 而非从头计算的O(t²*d)
      """

# ============================================================
# 设计原则
# ============================================================
design_principles:
  - "逐步自回归解码,每次前向传播生成一个最优Token — 每一步输出作为下一步输入,形成链式依赖"
  - "因果掩码确保自回归一致性: 每个Token只能关注到自己及之前的Token,不能看到未来信息"
  - "KV缓存避免重复计算: 已生成的Token的K/V矩阵被缓存,每一步只需计算当前新Token的K/V,推理复杂度从O(n²)降到O(n)"

# ============================================================
# 产品适配 (链客宝/AI名片/数智港)
# ============================================================
product_adaptations:
  - product: "链客宝"
    component: "任务分解与执行流水线"
    description: >
      链客宝的复杂业务流程(如"帮企业找到3家匹配的供应链伙伴并发送合作邀约")
      被分解为子任务序列,自回归地生成每一步执行计划:
      步骤1: 解析需求 → 步骤2: 搜索候选 → 步骤3: 排序匹配 → 步骤4: 生成邀约文案
      每一步的输出作为下一步的输入,形成链式任务流水线。KV缓存机制确保
      在长流程中不重复计算已完成的步骤。

  - product: "AI名片"
    component: "智能推荐回复生成器"
    description: >
      当用户收到名片交换请求时,自动生成个性化回复。自回归流水线:
      - prompt: "用户A是[身份],用户B是[身份],生成得体的名片交换回复"
      - 逐步生成: 问候→自我介绍→合作意愿表达→签名
      Top-K采样(temperature=0.7, top_k=50)确保每次回复多样但不偏离主题。
      KV缓存加持下可在100ms内完成30字的回复生成。

  - product: "数智港"
    component: "内容生成飞轮引擎"
    description: >
      基于历史上下文逐步生成:
      - 知识卡片: 从碎片知识点→结构化知识卡片(逐步扩充)
      - 分析报告: 从摘要→引言→数据→分析→结论(分段逐步生成)
      - 对话回复: 从理解→推理→表达(三步自回归)
      飞轮引擎使用束搜索(beam_width=3)在每一步保留3个最佳候选路径,
      确保生成内容在多样性和质量之间取得平衡。

# ============================================================
# 演进路径
# ============================================================
evolution_potential:
  - "已落地: KV缓存加速推理 — 从LlamaAttention和BertSelfAttention吸收"
  - "推测解码(Speculative Decoding): 用小模型猜测N个Token,大模型验证,大幅提升生成速度"
  - "并行解码(Non-autoregressive): 一步生成所有Token,牺牲少量质量换取极致速度"
  - "Medusa解码: 训练多个辅助头预测未来N步,实现并行推测"
  - "分块因果注意力(CCM): 长序列生成的分块策略,既保持自回归又支持长上下文"
