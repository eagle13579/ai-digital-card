name: "F-TRANS-09"
title: "编码器-解码器协同框架(Encoder-Decoder)"
version: 1.0.0
category: "序列到序列架构"
description: "编码器-解码器(Encoder-Decoder)架构通过双向编码器理解源序列,自回归解码器结合交叉注意力生成目标序列,实现序列到序列(Seq2Seq)的完整映射"

