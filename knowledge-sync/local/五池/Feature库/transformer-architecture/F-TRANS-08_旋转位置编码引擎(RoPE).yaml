name: "F-TRANS-08"
title: "旋转位置编码引擎(RoPE)"
version: 1.0.0
category: "位置编码增强"
description: "旋转位置编码(Rotary Position Embedding)通过旋转矩阵对Query和Key向量施加位置感知的旋转变换,使注意力分数天然编码相对位置信息,兼具绝对位置编码的并行性和相对位置编码的外推能力"

