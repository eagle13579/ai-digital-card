---
id: F-SOCIAL-01
name: 社交模拟器 — 多角色人格商务场景推演
dimension: 场景
source_model: "Social Simulator — 数字员工互相扮演不同人格的客户/合作伙伴角色，模拟真实社交/商务场景，产生结构化反馈反向训练决策模型"

products:
  - 通用: 自动匹配
description: >-
  让数字员工之间互相扮演不同人格的客户/合作伙伴角色，模拟真实社交/商务场景。
  每次交互产生结构化反馈（正/负信号），反向训练决策模型。
  
  场景示例：员工A扮演「挑剔的韩国客户」，员工B扮演「AI数智军团的销售」，
  模拟商务谈判。结束后自动输出：对话记录、双方策略分析、改进建议。
  
  核心设计：
  1. 预定义人格角色库（含文化背景、性格特质、利益诉求三维描述）
  2. 预定义场景模板库（商务谈判/客户服务/合作洽谈/危机公关等）
  3. 双角色博弈引擎——LLM驱动的多轮对话模拟
  4. 结构化反馈捕获——每轮结束后提取正/负信号
  5. 反向训练管道——反馈注入模型池，驱动决策模型进化
  6. 铁律：只追加不覆盖
sop: |-
  ① 触发 → ② 从人格角色库随机/指定选2个角色 →
  ③ 从场景模板库随机/指定选1个场景 →
  ④ LLM驱动多轮对话模拟（至少3轮，最多20轮） →
  ⑤ 提取对话记录 + 双方策略分析 + 正/负反馈信号 →
  ⑥ 反馈写入五池/模型池 (铁律: 只追加不覆盖) →
  ⑦ 生成改进建议 → ⑧ 输出完整报告
quality_gate: |-
  - 角色必须来自不同维度（避免同质化对话）
  - 每轮对话双方各至少1句话，含实质性内容
  - 反馈信号必须包含至少1个正信号和1个负信号
  - 策略分析必须覆盖双方视角
  - 改进建议必须有可操作性
  - 输出报告包含完整的对话记录、策略分析、改进建议三部分
  - 模型池写入用JSONL追加模式，绝不覆盖已有记录
draft: false
created_at: 2026-06-14
