# ============================================================
# Feature: 语义关系提取器
# 文件名: feature_财经图谱_semantic_relation_extractor.yaml
# ============================================================
名称: 语义关系提取器

products:
  - 通用: 自动匹配
描述: >
  从非结构化文本（新闻、财报、政策公告等）中自动提取实体之间的语义关系，
  输出标准化的（实体A, 关系类型, 实体B）三元组，为产业链知识图谱的构建
  提供底层数据支撑。

输入:
  type: 非结构化文本
  format:
    - 新闻文章 (纯文本/HTML)
    - 上市公司财报 (PDF/文本)
    - 政策公告 (政府公文)
    - 行业研报
  encoding: UTF-8
  size_limit: 单篇 ≤ 100KB

输出:
  type: 结构化三元组
  schema:
    - 实体A: string          # 主体实体名称
    - 关系类型: string        # 预定义关系类型之一
    - 实体B: string          # 客体实体名称
    - 置信度: float           # [0,1] 提取置信度
    - 原文证据: string        # 支撑三元组提取的原文片段
    - 时间戳: datetime        # 文本发布时间
    - 来源标签: string        # 数据源标识
  relation_types:
    - 供货
    - 竞争
    - 政策传导
    - 客户
    - 投资
    - 合作

技术栈:
  - NER (命名实体识别): BERT-BiLSTM-CRF / GPT-NER
  - 关系抽取: 远程监督 + 联合抽取模型 (CasRel / TPLinker)
  - 分类器: TextCNN / BERT-Classifier 用于关系类型分类
  - 后处理: 规则引擎 (正则 + 依存句法) 用于置信度校准
  - 部署: ONNX Runtime / Triton Inference Server

关联产品:
  - 天机系统
  - 谛听情报

成熟度: ⭐⭐ (需构建)
