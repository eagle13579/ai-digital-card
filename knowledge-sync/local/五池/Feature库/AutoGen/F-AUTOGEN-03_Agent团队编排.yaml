# 👥 Agent团队编排 — 多Agent协作编排
id: F-AUTOGEN-03
name: "Agent团队编排"
description: "Team即元Agent + 消息双分类 + 组合终止条件 + Handoff转移协议。完整的多Agent团队编排框架，支持灵活的角色分配与协作模式"
version: "1.0"
dimension: "场景"
source_model: "AG08+AG09+AG10+AG11"
status: active
created: "2026-07-07"

one_liner: "完整的多Agent团队编排：Team即元Agent + 消息双分类 + 组合终止条件 + Handoff转移协议"

what_it_does: |
  1. Team即元Agent — 团队本身被视为一个元Agent，对外暴露统一接口，内部封装成员协作逻辑
  2. 消息双分类 — 消息按"类型"（指令/查询/事件/反馈）和"范围"（广播/单播/组播）双维度分类路由
  3. 组合终止条件 — 支持AND/OR/NOT/M个条件组合，满足条件组合时团队终止运行
  4. Handoff转移协议 — Agent间任务转移的标准协议，包含上下文打包、转移确认、回滚机制
  5. 角色模板 — 预定义Leader/Worker/Observer/Coordinator等角色模板，快速组建团队
  6. 团队生命周期管理 — 团队创建、运行、暂停、扩容/缩容、解散

input:
  - "团队配置（角色列表、成员AgentId、终止条件、协作模式）"
  - "任务指令（目标描述、输入参数、约束条件）"
  - "Handoff请求（源AgentId、目标AgentId、上下文包）"

output:
  - "团队执行结果（按终止条件判断的最终产出）"
  - "协作日志（消息流转记录、各Agent贡献、决策轨迹）"
  - "Handoff确认（转移成功/失败、上下文差异说明）"

sop: |
  1. 根据目标创建Team实例，配置角色模板和成员Agent
  2. 设置组合终止条件（例如：AND{任务完成, 质量达标} 或 M-of-N{3/5个评审通过}）
  3. Leader Agent接收外部任务，按策略将任务分解为子任务
  4. 使用消息双分类机制分发子任务（单播给指定Worker，广播给全体）
  5. Worker执行子任务，结果通过反馈消息回传
  6. 需要上下文转移时，源Agent发起Handoff请求（含上下文包）
  7. 目标Agent接收Handoff，验证上下文完整性，确认或拒绝
  8. 每轮协作后检查组合终止条件是否满足
  9. 满足条件时团队终止，聚合输出最终结果
  10. 不满足则继续下一轮协作

quality_gate:
  - "Team创建时必须至少配置1个终止条件"
  - "Handoff上下文包必须包含所有未决状态（不可遗漏）"
  - "消息双分类必须在路由层校验通过后分发"
  - "Leader Agent不可单点故障 — 需支持Leader选举切换"
  - "团队扩容/缩容不可丢失进行中的任务上下文"
  - "终止条件检查频率 ≤ 每条消息处理后立即检查"

products:
  - "白泽军团"
  - "数字员工SaaS"
  - "赛博参谋"

