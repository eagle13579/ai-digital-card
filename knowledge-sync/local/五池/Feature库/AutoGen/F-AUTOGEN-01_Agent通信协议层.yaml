# 📡 Agent通信协议层 — Agent即Protocol
id: F-AUTOGEN-01
name: "Agent通信协议层"
description: "Agent即Protocol + 双模通信 + AgentId寻址 + 订阅映射。构建统一Agent通信协议层，使不同Agent能通过标准协议互联互通"
version: "1.0"
dimension: "体系"
source_model: "AG01+AG02+AG03+AG06"
status: active
created: "2026-07-07"

one_liner: "统一Agent通信协议层，Agent即Protocol，双模通信+AgentId寻址+订阅映射"

what_it_does: |
  1. Agent即Protocol — 每个Agent暴露自身Protocol契约（可调用方法、事件、能力声明）
  2. 双模通信 — 支持同步RPC（请求-响应）和异步Pub/Sub（事件总线）两种通信模式
  3. AgentId寻址 — 全局唯一AgentId标识，消息路由基于AgentId到端点的映射
  4. 订阅映射 — Agent可订阅其他Agent的事件流，实现松耦合协作
  5. 协议版本协商 — 通信双方自动协商协议版本，保证向前兼容

input:
  - "Agent注册信息（AgentId、端点URL、协议版本、能力声明）"
  - "消息体（RPC请求 / Event事件 / 订阅指令）"
  - "目标AgentId或Topic名称"

output:
  - "RPC响应（同步模式下返回调用结果）"
  - "事件广播（发布至订阅者的事件流）"
  - "Agent发现目录（当前网络中所有在线Agent映射表）"

sop: |
  1. Agent启动时向协议层注册AgentId、端点URL、能力声明
  2. 协议层维护AgentId → Endpoint映射表，并定期心跳保活
  3. 发送方构造消息（含目标AgentId / Topic、消息类型、载荷）
  4. 协议层根据消息类型选择RPC或Pub/Sub通道转发
  5. 接收方Protocol反序列化消息，路由至对应的Handler
  6. 同步模式返回结果；异步模式通过事件回传结果
  7. 连接断开时自动触发订阅清理与重连

quality_gate:
  - "AgentId必须全局唯一，注册时做冲突检测"
  - "消息超时必须降级返回超时错误（默认30s）"
  - "心跳间隔 ≤ 15s，连续3次失联则标记离线"
  - "协议版本不匹配时自动拒绝并返回兼容版本号"
  - "事件投递至少一次（at-least-once）语义保证"

products:
  - "盖娅之城"
  - "白泽军团"
  - "数字员工SaaS"

iteration_log:
  - "v1.0 — 初始创建，基于AutoGen 15心智模型（AG01~AG03, AG06）设计"
