# 🔧 工具适配器+执行器 — 可插拔工具/执行器体系
id: F-AUTOGEN-04
name: "工具适配器+执行器"
description: "统一工具适配器(7种) + MCP三层架构 + 执行器分层降级 + 序列化注册表。构建可插拔工具/执行器体系，支持多种工具协议的统一接入"
version: "1.0"
dimension: "基本功"
source_model: "AG12+AG13+AG14+AG15"
status: active
created: "2026-07-07"

one_liner: "统一工具适配器(7种) + MCP三层架构 + 执行器分层降级 + 序列化注册表"

what_it_does: |
  1. 统一工具适配器 — 支持7种工具类型（REST API、Shell命令、数据库查询、文件操作、MCP Server、浏览器操作、自定义函数），统一输入/输出接口
  2. MCP三层架构 — Model（工具Schema定义）→ Context（连接管理器/认证/重试）→ Protocol（通信协议适配），三层解耦
  3. 执行器分层降级 — 执行器按可靠性分层（L1-内存/L2-本地进程/L3-远程服务），失败时自动降级
  4. 序列化注册表 — 工具注册信息序列化为JSON/YAML，支持运行时热加载，无需重启
  5. 工具组合 — 支持将多个工具组合为复合工具（Pipeline/Parallel/Choose），复用执行逻辑
  6. 执行沙箱 — 每条执行请求在沙箱中运行，隔离副作用，支持回滚

input:
  - "工具注册信息（名称、类型、Schema、端点/命令、认证配置）"
  - "执行请求（工具名、参数、执行模式、超时设置）"
  - "组合工具定义（子工具列表、组合模式、数据流）"

output:
  - "工具执行结果（结构化输出、状态码、执行耗时）"
  - "注册表快照（当前所有已注册工具的序列化清单）"
  - "执行日志（降级记录、错误详情、沙箱隔离报告）"

sop: |
  1. 开发者通过注册表API注册工具（提供名称、类型、Schema、端点）
  2. 适配器层根据工具类型选择对应适配器（REST适配器/MCP适配器等）
  3. MCP三层初始化：Model层解析Schema → Context层建立连接+认证 → Protocol层匹配通信协议
  4. Agent发送执行请求，执行器收到请求后校验参数与Schema
  5. 执行器按当前最高可用层级尝试执行（L1→L2→L3逐级尝试）
  6. L1失败则自动降级到L2，L2失败降级到L3；三层全失败返回完整错误链
  7. 执行结果经沙箱验证后返回给调用方
  8. 支持热注册：运行时向注册表添加新工具，下次调用立即生效

quality_gate:
  - "工具Schema必须通过OpenAPI/JSON Schema标准校验"
  - "7种工具适配器必须覆盖全部工具类型，不可漏类"
  - "执行器降级不允许跳过层级（必须L1→L2→L3顺序降级）"
  - "热注册变更在 500ms 内生效"
  - "沙箱隔离：工具执行不可影响其他工具或Agent状态"
  - "序列化注册表必须支持JSON+YAML两种格式导入导出"

products:
