---
id: F-CHAINKE-ESIGN-01
dimension: 场景
name: e签宝电子签约集成
status: active
version: "1.0"
created: 2026-06-13
source_model: "链客宝AI招商系统 · L5交易执行层设计"

products:
  - 通用: 自动匹配
description: 链客宝用户可在线发起招商加盟合同签署，支持合同模板管理、签署流程、回调通知
input: 
  - 合同模板(PDF)
  - 签署方信息(企业/个人)
  - 模板填充变量
output:
  - 签署链接(H5嵌入)
  - 签署状态
  - 签署完成回执
sop: |
  1. 环境变量配置: ESIGN_APP_KEY, ESIGN_APP_SECRET, ESIGN_HOST
  2. 管理员创建合同模板(PDF上传)
  3. 系统发起签署(模板+变量+签署方)
  4. 获取签署链接嵌入链客宝前端
  5. 签署完成→Webhook回调→更新合同状态
  api_prefix: /api/esign
quality_gates:
  - 所有API Key从环境变量读取，不硬编码
  - 回调请求头签名验证(HMAC-SHA256)
  - 签署链接支持H5嵌入+直接访问
  - 异常处理: EsignError携带code/message/response
  - AccessToken自动缓存+到期前60s刷新
dependencies:
  - FastAPI
  - SQLAlchemy (EsignTemplate, EsignContract模型)
  - httpx/requests
  - e签宝开放平台账号(AppKey/AppSecret)
  - 链客宝backend/app/main.py
  - app/services/esign_client.py
  - app/routers/esign.py
  - app/models.py (+51行)
deployment:
  type: code_only
  env_vars:
    - ESIGN_APP_KEY
    - ESIGN_APP_SECRET
    - ESIGN_HOST
  pre_requisites:
    - open.esign.cn注册开发者账号
    - 创建应用获取AppKey/AppSecret
    - 配置回调URL -> POST /api/esign/callback
