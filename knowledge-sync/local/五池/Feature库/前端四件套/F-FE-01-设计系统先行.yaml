name: "设计系统先行"
version: "1.0.0"
dimension: "审美"
status: "draft"
draft: true
source_model: "UI Expert"

products:
  - 通用: 自动匹配
description: >
  写页面前先定设计系统——风格/配色/字体/间距全配好，不直接写代码。
  从品牌调性出发，选定风格预设，生成完整的设计token体系，
  确保页面在视觉层面有一致性、专业性和品牌辨识度。

sop:
  - step: 1
    action: "确认品牌调性"
    description: "与用户沟通品牌定位、目标受众、产品调性（高端/亲民/科技/温暖等），输出品牌调性关键词列表"
  - step: 2
    action: "选风格预设"
    description: "从风格库中选择合适的设计风格预设——Swiss风格/粗野主义/和风/极简/Material You/Neumorphism等"
  - step: 3
    action: "定配色板"
    description: "基于风格预设生成配色方案——主色(primary)、辅色(secondary)、强调色(accent)、中性色(neutral)、语义色(success/warning/error)"
  - step: 4
    action: "定字体层级"
    description: "定义完整的字体系统——标题(h1-h6)/正文/小字/标签，含字重、行高、字间距"
  - step: 5
    action: "定间距网格"
    description: "建立基于4px/8px基准的间距系统——margin/padding/gap的统一原子化规约"
  - step: 6
    action: "生成设计token"
    description: "将以上所有决策输出为结构化的设计token（CSS变量 / Tailwind配置 / Style Dictionary格式）"
  - step: 7
    action: "写页面"
    description: "在设计token驱动下进行页面开发，所有样式引用token而非硬编码值"

input:
  format: "用户需求描述 / PRD / 设计稿"
  content: "品牌名称、行业类型、目标用户特征、页面功能需求、参考风格偏好（可选）"

output:
  format: "YAML / JSON 设计token文件 + 解释文档"
  includes:
    - "品牌调性关键词"
    - "风格预设名称及依据"
    - "配色板（含色值及用途说明）"
    - "字体层级表（含CSS规则）"
    - "间距规范（原子类映射）"
    - "设计Token字典（CSS变量声明）"

quality_gates:
  - gate: "完整度检查"
    description: "配色/字体/间距/风格四个维度均需输出，缺一不可"
  - gate: "一致性检查"
    description: "token命名语义统一，无冲突定义，各维度之间逻辑自洽"
  - gate: "可复现检查"
    description: "任一开发者依据token文档即可还原出与预期一致的视觉风格"
  - gate: "审美评分"
    description: "通过taste_gate审美评估，评分≥7/10方可进入页面开发阶段"
