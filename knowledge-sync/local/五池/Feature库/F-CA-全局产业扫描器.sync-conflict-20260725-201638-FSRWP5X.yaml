feature_id: "F-CA-全局产业扫描器"
name: "全局产业扫描器 — 产业套利机会发现维度"
version: "1.0.0"
dimension: "创造力"
source_model:
  - "五池/模型池/_原子/黑河-麦肯锡定义权"
  - "五池/模型池/_原子/黑河-迪士尼法律护城河"
  - "五池/模型池/_原子/黑河-星巴克影子银行"
  - "五池/模型池/_原子/黑河-资本套利元框架"
  - "五池/模型池/_原子/黑河离岸资本"
  - "五池/模型池/_原子/黑河自动续费系统"
  - "五池/模型池/_原子/黑河资本逃逸路线图"
  - "五池/模型池/_原子/黑河调查局-矿产合规套利四步法"
one_liner: "覆盖矿产/能源/金融/科技/消费/地产六大产业的套利机会发现引擎"
what_it_does: >
  独立于八维评分体系的产业级套利扫描器。对每个产业类型（矿产/能源/
  金融/科技/消费/地产/综合）预设套利信号检测点，基于标的输入数据
  自动检测该产业中最显著的套利信号组合。每个产业拥有独特的信号权重
  和检测逻辑，例如矿产产业侧重制裁折价（M08）和四步法（M01-M04），
  科技产业侧重IP护城河（M1-M10）和自动续费（AR1-AR10），
  消费产业侧重影子银行（M1-M10）和认知税（M10）。
input:
  - "投资标的基本信息（名称/代码/产业/注册地/财务数据）"
  - "八维评分中的信号检测结果"
  - "标的业务标签列表（用于产业分类校准）"
output:
  - "六大产业的分产业套利机会评分"
  - "每个产业检测到的具体套利信号清单"
  - "最佳匹配产业判定"
  - "产业套利机会综合评分（0-100）"
sop:
  - "step: 确定标的产业类型（显式指定或自动匹配）"
  - "step: 加载该产业的预设套利检查点（check_points）"
  - "step: 对每个检查点运行专用检测器或通用回退检测器"
  - "step: 统计命中数并计算产业机会评分"
  - "step: 执行产业特定调整（如矿产标的加分制裁折价）"
  - "step: 扫描全部六大产业，返回分产业评分和最佳匹配"
quality_gate:
  - "六大产业全覆盖扫描（不缺产业）"
  - "每个产业至少4个独立检测点"
  - "产业特定检测器优先于通用回退检测器"
  - "产业匹配评分可解释（命中信号可溯源）"
score_target: 9/10
depends_on:
  - "F-TX-05: 全球套利能力融合门禁(Gate 0)"
enhanced_by:
  - "F-CA-八维仲裁矩阵（八维评分提供产业信号输入）"
  - "F-CZ-01: 资本套利模式识别"
iteration_log:
  - version: "1.0.0"
    date: "2026-06-13"
    author: "黑河调查局/白泽"
    changes: |
      初始创建。基于8组84原子心智模型融合设计。
      覆盖矿产(4步法)、能源(碳税/补贴)、金融(监管空白)、
      科技(IP+订阅)、消费(资金池+认知税)、地产(离岸架构)六大产业。
      每个产业配备独立检测点和产业特定调整函数。
