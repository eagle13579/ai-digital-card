name: F-BIZ-07-资本闭环三段论
version: "1.0"
dimension: 体系
status: active
draft: false
source_model: 零食量贩商业模式吸收

products:
  - 通用: 自动匹配
description: >
  商业模式的三个资本层递进闭环：
  第一层（基础层）——卖货赚差价，靠商品进销差获取基础利润；
  第二层（效率层）——供应链效率吃利润，靠周转率、账期、规模获得超额收益；
  第三层（终极层）——资本杠杆+IPO兑现，靠上市或并购完成资本退出。
  每层都是下一层的基础，最终实现从经营利润到资本溢价的跨越。
sop: |
  1. 确认当前在哪一层：诊断企业当前主要利润来源属于基础层/效率层/资本层
  2. 设计升层路径：逐层设计从当前层跃迁到下一层的关键里程碑
  3. 各层数据对齐：确保基础层的经营数据（营收/毛利）能支撑效率层的叙事，效率层的效率指标（周转/账期）能支撑资本层的故事
  4. 资本市场故事包装：将三层逻辑整理为投资人可理解的增长叙事
  5. 退出门槛评估：评估IPO/并购所需的规模、财务指标和合规条件
input: "财务三表、运营效率指标、行业对标数据、资本市场条件"
output: "资本层诊断报告、升层路径图、投资人叙事文档"
quality_gates:
  - name: 逻辑自洽
    score: 7
  - name: 可操作
    score: 7
