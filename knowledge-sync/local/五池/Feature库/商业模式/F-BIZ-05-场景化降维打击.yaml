name: F-BIZ-05-场景化降维打击
version: "1.0"
dimension: 审美
status: active
draft: false
source_model: 零食量贩商业模式吸收

products:
  - 通用: 自动匹配
description: >
  100平门店不搞精装修，刻意营造货架式批发感——用"简陋"的环境给消费者传递"最便宜"的心理暗示。
  把省下的装修成本、服务成本、包装成本反哺到价格优势上。
  本质是用场景语言完成定价说服，而不是用广告或话术。
sop: |
  1. 识别用户对"低价"的视觉信号：研究哪些环境元素（仓储货架、纸箱陈列、工业风）会触发"便宜"联想
  2. 零售场景做减法：针对性削减装修/服务/包装中不必要的成本
  3. 批发感氛围营造：用高密度陈列、工业风照明、简易价签强化"批发价"认知
  4. 成本反哺定价：将省下的场景成本转化为终端价格优势
  5. 用户感知验证：通过A/B测试验证不同场景风格对价格感知和购买意愿的影响
input: "门店面积及租金、装修预算区间、目标客群画像、竞品门店场景分析"
output: "门店场景设计方案、装修成本削减清单、价格感知测试报告"
quality_gates:
  - name: 逻辑自洽
    score: 7
  - name: 可操作
    score: 7
