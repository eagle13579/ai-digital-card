name: F-BIZ-09-品类错位竞争
version: "1.0"
dimension: 创造力
status: active
draft: false
source_model: 零食量贩商业模式吸收

products:
  - 通用: 自动匹配
description: >
  利用消费者注意力错位——消费者进店后习惯在大牌区比价，感知"确实便宜"进而放松价格警惕；
  实际在白牌区被收割，白牌才是利润主力。大牌当门面（不赚钱），白牌当利润主力（赚大钱）。
  货架动线、陈列设计、价格锚点三者配合，引导消费者从引流品自然流向利润品。
sop: |
  1. 分析品类利润结构：将SKU按利润率分层，识别高利品类和白牌品类
  2. 设计引流品+利润品组合：
     - 引流品：知名品牌、价格敏感度高、毛利低（5%以下）
     - 利润品：白牌/自有品牌、价格敏感度低、毛利高（30%以上）
  3. 货架动线设计：引流品放在入口及黄金位置，利润品穿插在动线深处和收银台周边
  4. 价格锚点设置：大牌标价与竞品对比显便宜，白牌标价无参照系难以比价
  5. 测试转化率：通过陈列调整A/B测试，优化引流品→利润品的转化漏斗
input: "品类毛利数据表、消费者动线热力图、竞品价格带分析"
output: "品类组合策略、货架陈列方案、转化率测试报告"
quality_gates:
  - name: 逻辑自洽
    score: 7
  - name: 可操作
    score: 7
