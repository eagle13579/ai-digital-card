name: F-BIZ-08-规模调供应链
version: "1.0"
dimension: 场景
status: active
draft: false
source_model: 零食量贩商业模式吸收

products:
  - 通用: 自动匹配
description: >
  1000家门店同时进货，用集中采购量形成反向定价权。不再是供应商定价、门店接受，
  而是门店提出目标价、供应商选择是否接单。核心逻辑：你不降价我就不拿。
  规模优势使议价地位反转——从"被动接受者"变为"定价主导者"。
sop: |
  1. 建立规模优势：通过门店扩张或联采联盟聚合采购量
  2. 集中采购权归集：将分散的门店采购权统一归集到总部或采购中心
  3. 反向定价谈判：以集中采购量为筹码，向供应商提出目标价而非接受报价
  4. 供应商分级管理：
     - A级供应商（配合度高/价格优）→ 优先合作、长期合同
     - B级供应商（中等配合）→ 备选、部分品类合作
     - C级供应商（不配合）→ 逐步淘汰
  5. 动态调整机制：定期复盘各供应商的价格竞争力，持续施压优化
input: "门店数量及分布、各品类采购量、供应商名录及报价"
output: "集中采购方案、供应商分级清单、反向定价谈判策略"
quality_gates:
  - name: 逻辑自洽
    score: 7
  - name: 可操作
    score: 7
