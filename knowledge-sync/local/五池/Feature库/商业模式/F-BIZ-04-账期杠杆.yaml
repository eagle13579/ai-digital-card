name: F-BIZ-04-账期杠杆
version: "1.0"
dimension: 体系
status: active
draft: false
source_model: 零食量贩商业模式吸收

products:
  - 通用: 自动匹配
description: >
  进货当天A端（消费者）付款给门店获得现结价格优势；B端（供应商）被压8个月才结款。
  中间7个多月的资金沉淀在自己手上，形成无成本的运营资金池。
  规模越大沉淀越多，账期杠杆效应越强——用别人的钱做自己的生意。
sop: |
  1. 设计付款账期结构：明确A端（消费者现结）和B端（供应商长账期）的账期差
  2. A端现结获价格优势：消费者即时付款，简化支付流程换取更低售价
  3. B端长账期谈判：以采购规模为筹码，与供应商协商延长账期（目标6-12个月）
  4. 资金沉淀管理：测算账期差带来的可用资金量
  5. 沉淀资金再投资：将账期差产生的浮存金投入扩店/理财/供应链升级
  6. 风险控制：设置账期上限、供应商集中度预警、坏账准备金
input: "采购规模、供应商账期条款、日流水数据、资金需求计划"
output: "账期结构方案、现金流预测表、沉淀资金投资计划"
quality_gates:
  - name: 逻辑自洽
    score: 7
  - name: 可操作
    score: 7
