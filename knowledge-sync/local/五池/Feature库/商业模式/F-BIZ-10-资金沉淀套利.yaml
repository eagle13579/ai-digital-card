name: F-BIZ-10-资金沉淀套利
version: "1.0"
dimension: 数据
status: active
draft: false
source_model: 零食量贩商业模式吸收

products:
  - 通用: 自动匹配
description: >
  占用供应商7个月货款，用别人的钱做自己的生意。消费者即时付款（现结），供应商延期收款（长账期），
  中间的账期差产生大量资金沉淀。规模越大沉淀越多，杠杆越滚越大——本质上是一种无成本的供应链金融套利。
  核心指标：应付账款周转天数、应收账款周转天数、净现金周转周期。
sop: |
  1. 计算应付账款周转天数：统计从收到货物到支付货款的周期
  2. 设计最优账期结构：在不影响供应链稳定的前提下最大化账期长度
     - 大供应商：6-8个月账期 + 准时付款建立信用
     - 小供应商：3-4个月账期 + 适当价格补偿
  3. 测算资金沉淀量：应付账款周转天数 - 存货周转天数 = 净资金占用周期
  4. 沉淀资金投资策略：
     - 短期：货币基金/银行理财（低风险）
     - 中期：门店扩张/供应链升级（中风险）
     - 长期：战略投资/并购（高风险高回报）
  5. 风险控制：设置供应商集中度上限、建立备选供应商池、账期违约准备金
input: "采购合同账期条款、应付账款明细、日流水数据、资金成本率"
output: "账期优化方案、资金沉淀量测算表、沉淀资金投资配置方案"
quality_gates:
  - name: 逻辑自洽
    score: 7
  - name: 可操作
    score: 7
