name: F-BIZ-01-大牌引流+白牌收割
version: "1.0"
dimension: 场景
status: active
draft: false
source_model: 零食量贩商业模式吸收

products:
  - 通用: 自动匹配
description: >
  用知名品牌（可乐/卫龙）低价不赚钱做引流门面，以高毛利白牌（30%+）做实际利润收割。
  大牌吃亏牌摆位在黄金货架，白牌夹带在周边，利用消费者注意力错位实现交叉销售。
  核心逻辑：牺牲大牌利润换取流量，用白牌利润兑现商业价值。
sop: |
  1. 产品矩阵设计：将SKU划分为引流品（大牌低价）和利润品（白牌高毛利）
  2. 引流品定价策略：大牌商品以接近或低于成本价销售，作为流量入口
  3. 利润品埋伏布局：高毛利白牌商品摆放在大牌周边关联位置，引导消费者顺带购买
  4. 货架动线设计：黄金货架位给大牌引流品，白牌利润品穿插在动线必经之处
  5. 数据追踪转化：监控引流品→利润品的转化路径，持续优化陈列组合
input: "产品线列表、供应商报价、竞品价格带"
output: "产品矩阵清单、定价策略表、货架陈列方案"
quality_gates:
  - name: 逻辑自洽
    score: 7
  - name: 可操作
    score: 7
