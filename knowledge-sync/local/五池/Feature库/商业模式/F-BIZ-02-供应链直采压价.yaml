name: F-BIZ-02-供应链直采压价
version: "1.0"
dimension: 数据
status: active
draft: false
source_model: 零食量贩商业模式吸收

products:
  - 通用: 自动匹配
description: >
  跳过3-5层经销中间环节（省级代理→市级代理→县级代理→分销商→零售商），实现工厂→门店直采。
  用一次性上千万的下单规模反向议价，把加价率从传统超市的50%+压到20%以下。
  本质是信息对称 + 规模杠杆驱动的供应链效率革命。
sop: |
  1. 分析现有供应链层级：MECE梳理从工厂到门店的所有中间环节
  2. 识别可跳过环节：标记增值低、加价高的经销层级
  3. 计算直采成本差：模拟跳过各层级后的成本节省空间
  4. 建立规模杠杆：聚合采购量，用一次性大额订单获得议价权
  5. 反向谈判定价：以"跳过中间商+长期合作"为筹码压低出厂价
  6. 供应商直连管理：建立工厂端直接对接流程，剔除渠道损耗
input: "现有供应链链路图、各层级加价率数据、采购量规模"
output: "直采供应商清单、直采成本对比表、议价谈判方案"
quality_gates:
  - name: 逻辑自洽
    score: 7
  - name: 可操作
    score: 7
