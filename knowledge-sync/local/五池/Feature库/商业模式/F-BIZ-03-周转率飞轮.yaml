name: F-BIZ-03-周转率飞轮
version: "1.0"
dimension: 基本功
status: active
draft: false
source_model: 零食量贩商业模式吸收

products:
  - 通用: 自动匹配
description: >
  同样10万元货，传统超市卖1个多月，量贩店一周清空。一年30转的资金效率是超市的5倍以上。
  货还没到齐就开始换新牌子，以高周转驱动低库存成本和资金利用效率。
  核心指标：库存周转天数、资金周转率、SKU汰换周期。
sop: |
  1. 计算当前库存周转天数：统计从入库到售出的平均周期
  2. 对标行业基准：参照量贩业态（7-10天）vs 传统超市（30-45天）
  3. 压缩供应链响应时间：缩短采购→物流→上架全链路时长
  4. 建立快速汰换机制：设定SKU淘汰阈值（如周销量低于X即下架）
  5. 滚动补货策略：基于实时销售数据动态调整订货量
  6. 资金效率追踪：监控每万元库存的月产出额
input: "历史销售数据、库存台账、供应链响应时间节点"
output: "库存周转率报告、SKU汰换规则、补货策略SOP"
quality_gates:
  - name: 逻辑自洽
    score: 7
  - name: 可操作
    score: 7
