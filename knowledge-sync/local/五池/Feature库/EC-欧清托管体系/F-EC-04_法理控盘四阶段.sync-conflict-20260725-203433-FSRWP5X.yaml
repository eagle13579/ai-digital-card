id: F-EC-04
name: 法理控盘四阶段
dimension: 创造力
domain: EC-欧清托管体系
status: active
atoms:
  - EC11: 法理控盘四阶段
  - EC09: 中立清算基础设施
  - EC12: 40万亿无可奉告
description: >
  从欧清+BH+DB三案例提炼的法理控盘四阶段哲学框架：
  物理控盘→协议控盘→规则控盘→基础设施控盘。
  每个阶段比上一阶段更隐蔽、更持久、更难挑战。
  欧清同时处于阶段3(规则)和阶段4(基础设施)——这是终极控盘形态。
  理解四阶段框架可以重新设计任何竞争策略和防御策略。
适用场景:
  - 竞争策略设计
  - 基础设施防御
  - 规则制定权博弈
trigger_phrases:
  - 法理控盘
  - 控制权分层
  - 基础设施主权
