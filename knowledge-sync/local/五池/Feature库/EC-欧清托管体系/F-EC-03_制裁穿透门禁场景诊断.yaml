id: F-EC-03
name: 制裁穿透门禁场景诊断
dimension: 场景
domain: EC-欧清托管体系
status: active

products:
  - 通用: 自动匹配
atoms:
  - EC06: 绝对合规防御
  - EC08: 跨境司法壁垒逐层消解
  - EC10: 资本无界主权有界
description: >
  对制裁场景/目标是否利用了欧清体系实现制裁规避的系统性诊断。
  输出三轴评分：合规无懈可击度 × 司法壁垒强度 × 单国制裁失效概率。
  核心发现：当资产在欧清体系内且嵌套超过3层司法管辖区时，
  任何单一国家制裁的有效性趋近于零——不是因为违法，而是因为每一层都合法。
适用场景:
  - 制裁可行性预判
  - 合规风险诊断
  - 跨境执行评估
trigger_phrases:
  - 制裁规避
  - 长臂管辖
  - 制裁门禁
