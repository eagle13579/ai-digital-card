id: F-EC-02
name: 跨境资产穿透检测
dimension: 数据
domain: EC-欧清托管体系
status: active
atoms:
  - EC03: 分级账户盲区
  - EC07: 三权分离
  - EC08: 跨境司法壁垒逐层消解
description: >
  基于分级账户层级数和司法管辖区跨度的跨境资产穿透难度量化评估。
  输入目标资产的基础信息，输出其在多级托管体系中的「穿透难度评分」。
  评分维度：层级数(权重0.4) × 司法区跨数(权重0.3) × 名义持有人深度(权重0.3)
适用场景:
  - 尽调穿透可行性评估
  - 制裁合规压力测试
  - 资产隐身等级评定
trigger_phrases:
  - 穿透检测
  - 资产追踪
  - 跨境尽调
