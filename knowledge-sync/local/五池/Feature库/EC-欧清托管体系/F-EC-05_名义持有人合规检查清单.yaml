id: F-EC-05
name: 名义持有人合规检查清单
dimension: 基本功
domain: EC-欧清托管体系
status: active

products:
  - 通用: 自动匹配
atoms:
  - EC01: 名义持有人防火墙
  - EC07: 三权分离
  - EC04: 净额清算效率优先
description: >
  一份可执行的检查清单，用于评估任意跨境资产是否可能使用了名义持有人制度。
  检查点：①股东名册是否存在名义持有人登记 ②受益权是否与法律所有权分离
  ③控制权是否归属于不同司法管辖区的第三方 ④是否存在分级账户结构
  ⑤每一级的合规盾牌是否都有当地法律支撑 ⑥穿透每层需要跨多少个司法管辖区
适用场景:
  - 合规评估作业
  - 尽调检查表
  - 入门培训材料
trigger_phrases:
  - 合规检查清单
  - 名义持有人检测
  - 三权分离检查
