feature_id: F-SIM-01
feature_name: 可视化工作流编排 (Visual Workflow DAG)
feature_type: 核心能力 / 编排引擎
version: 1.0.0
created: 2026-07-04

products:
  - 通用: 自动匹配
source_project: Sim (AI Agent工作空间平台)
source_link: https://sim.ai

# ============================================================
# Sim产品中的原始定义
# ============================================================
sim_definition: >
  Sim提供ReactFlow驱动的可视化DAG(Directed Acyclic Graph)工作流编辑器。
  用户通过拖拽节点(Agent/工具/条件/数据变换)和连线构建完整的Agent工作流，
  支持: 条件分支、并行执行、循环控制、人工审批节点、子工作流嵌套。
  实时可视化运行追踪，节点级状态显示(运行中/成功/失败/等待)。
  典型场景: 自动化客服流程、数据管道、审批链、多Agent协作序列。

sim_implementation:
  - ReactFlow画布 + 自定义节点类型 (Agent, Tool, LLM, Data, Condition, Human)
  - DAG拓扑排序 + 并行执行引擎
  - 节点级拖放配置面板 (参数/提示词/模型选择)
  - 实时运行状态可视化
  - 模板市场: 预置50+工作流模板
  - 导出为YAML/JSON, 支持版本管理

# ============================================================
# 可注入产品分析
# ============================================================
injectable_products:
  - product: 盖娅之城
    priority: P0 (最高优先级)
    gap_analysis: >
      盖娅之城当前173公民通过任务集市+自主认领进行协作，缺可视化编排层。
      公民协作缺乏显式流程设计能力，依赖白泽中枢派单而非用户自定义工作流。
    injection_method: >
      新增「工作流工作室」模块: 
      (1) 在盖娅之城引入ReactFlow画布, 用户拖拽连接公民(Agent)构建工作流
      (2) 每个公民作为一个可拖拽节点, 配置其角色/输入/输出规范
      (3) 支持条件分支(数据判断路由到不同公民)、并行执行(多公民同时处理)、循环
      (4) 运行时可实时查看每个公民的执行状态和输出
      (5) 工作流模板市场: 预置「内容生产流」「客服升级流」「数据分析流」等
    effort_estimate: "2-3周 (前端ReactFlow集成1周 + 后端DAG引擎1周 + 模板0.5周)"
    expected_impact: >
      ★★★ 极大提升: 从"混乱协作"到"可视化编排", 盖娅之城从「AI城市」升级为「AI工作流平台」
      
  - product: 链客宝
    priority: P1 (高优先级)
    gap_analysis: >
      链客宝有6层可叠加接口架构和事件总线, 但缺面向客户的可视化流程配置界面。
      B2B客户(企业)需要自定义审批流/商机跟进流/客户SOP, 当前只能通过代码配置。
    injection_method: >
      在企业控制台增加「自动化流程」标签页:
      (1) ReactFlow画布, 面向企业管理员
      (2) 节点类型: 客户动作触发(创建/升级/付款)、AI Agent节点、审批节点、通知节点
      (3) 对接链客宝已有事件总线(EventBusProtocol)作为流程驱动力
      (4) 预置模板: 客户流失预警流、商机自动跟进流、工单自动分配流
    effort_estimate: "3-4周 (前端2周 + 后端事件桥接1周 + 模板1周)"
    expected_impact: >
      ★★☆ 显著提升: 链客宝从「工具平台」升级为「企业自动化平台」

  - product: 中韩出海数智港
    priority: P2
    gap_analysis: >
      跨境贸易流程复杂(选品→供应商匹配→通关→物流→支付), 当前靠人工对接和PRD文档流转。
      缺端到端的流程可视化。
    injection_method: >
      贸易流程设计器: (1) 拖拽构建跨境贸易工作流 (2) 节点: AI匹配引擎、韩方供应商、清关检查、物流跟踪
    effort_estimate: "4周"
    expected_impact: "★★☆ 提升流程透明度和自动化率"

  - product: 白泽控制台
    priority: P1
    gap_analysis: >
      白泽当前通过「信任渐进曲线L1-L3」管理CEO决策, 但决策流程本身不可视。
      多条业务线的决策流程无法统一编排和监控。
    injection_method: >
      CEO决策流设计器: (1) 可视化设计「决策SOP」 (2) 节点: 情报收集→AI分析→CEO确认→自动执行→复盘
    effort_estimate: "2周"
    expected_impact: "★★☆ 让CEO决策过程可设计、可追踪、可优化"

# ============================================================
# 心智模型(原子能力)
# ============================================================
mental_models:
  - name: DAG编排思维
    description: 任何多步骤AI任务都应可视化为有向无环图, 支持条件/并行/嵌套
  - name: 可视化即配置
    description: 复杂流程的配置不应是代码, 而应是拖拽画布, 降低使用门槛
  - name: 运行时透明
    description: 运行状态应实时可视化到节点级别, 非黑盒执行

# ============================================================
# 注入时序建议
# ============================================================
injection_timeline:
  phase_1_now: "盖娅之城「工作流工作室」MVP (ReactFlow + 3种节点类型 + 5模板)"
  phase_2_next: "链客宝自动化流程 + 白泽决策流设计器 (并行推进)"
  phase_3_future: "中韩出海数智港贸易流程设计器 + 模板生态"
