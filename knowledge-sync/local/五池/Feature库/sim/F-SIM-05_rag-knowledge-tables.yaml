feature_id: F-SIM-05
feature_name: RAG知识库与结构化数据表引擎 (RAG Knowledge Base + Structured Tables)
feature_type: 核心能力 / 数据管理
version: 1.0.0
created: 2026-07-04

products:
  - 通用: 自动匹配
source_project: Sim (AI Agent工作空间平台)
source_link: https://sim.ai

# ============================================================
# Sim产品中的原始定义
# ============================================================
sim_definition: >
  Sim内建RAG知识库引擎和结构化数据表(类似Airtable/Notion DB)。
  
  RAG知识库引擎:
  - 文档上传: PDF/DOCX/TXT/MD/CSV/HTML/URL抓取
  - 智能分块: LLM辅助的语义分块策略(标题/段落/语义边界)
  - 多嵌入模型: 支持OpenAI/Cohere/本地嵌入
  - 混合搜索: 向量相似度 + BM25关键词 + 重排序
  - 引用溯源: 每次检索结果自动附带来源文档和页码
  - 知识库管理: 多知识库, 权限控制, 版本历史
  
  结构化数据表:
  - 类Airtable界面: 表格/看板/日历/画廊视图
  - 字段类型: 文本/数字/日期/单选/多选/关联/公式/附件
  - 数据操作: 筛选/排序/分组/聚合
  - Agent可操作: Agent可直接查询/修改/创建数据行
  - 自动化: 数据变更触发Agent工作流
  - 模板: 预置数据表模板(CRM/项目管理/内容日历/客户跟踪)

sim_implementation:
  - RAG: LangChain/LLamaIndex集成, 可切换后端(Chroma/Pinecone/Weaviate)
  - 结构化表: SQLite/PostgreSQL + 内存缓存
  - 知识库与数据表互操作: Agent检索知识库内容写入数据表
  - 嵌入缓存: 避免重复计算文档嵌入

# ============================================================
# 可注入产品分析
# ============================================================
injectable_products:
  - product: 盖娅之城
    priority: P0 (最高优先级)
    gap_analysis: >
      盖娅之城已有2,994知识模型和知识图谱, 但知识库系统是定制化实现的,
      缺标准化RAG管道: (1) 文档上传和自动索引 (2) 混合搜索(当前仅向量搜索)
      (3) 引用溯源 (4) 结构化数据表(当前经济数据/公民数据通过SQLite直接查询
      无法由公民以表格形式操作)。盖娅之城的经济系统/公民信息/交易记录都是结构化数据
      但缺类Airtable的界面和管理能力。
    injection_method: >
      盖娅知识库升级 + 新增数据表:
      A. RAG升级:
      (1) 文档上传入口: 允许用户上传PDF/URL/文档, 自动索引到知识模型
      (2) 混合搜索: 接入BM25 + 向量搜索 + 重排序 (当前仅向量搜索)
      (3) 引用溯源: 每个知识模型附带来源和引用
      B. 新增数据表:
      (1) 构建盖娅数据表模块: 结构化展示公民信息/经济数据/任务状态/GP交易记录
      (2) 公民可直接操作: 公民Agent可查询和修改表格数据(如更新任务状态)
      (3) 预置模板: 客户跟踪表、项目看板、经济指标仪表盘
      (4) 数据变更→触发行为: 任务状态变更自动触发通知/新任务创建
    effort_estimate: "3-4周 (RAG升级2周 + 数据表引擎1周 + 公民操作集成1周)"
    expected_impact: >
      ★★★ 极大提升: 盖娅之城从「知识库」升级为「企业数据平台」,
      公民不仅能检索知识, 还能操作结构化数据, 形成完整生产力闭环

  - product: 链客宝
    priority: P0 (最高优先级)
    gap_analysis: >
      链客宝当前客户数据/订单数据存储在SQLite/PostgreSQL中,
      但缺智能知识库: (1) 企业客户上传的合同/产品手册无自动索引和检索
      (2) 客服知识库需要人工维护 (3) 缺结构化数据表的灵活视图
      (4) 数据表多视图(看板/日历)缺失
    injection_method: >
      链客宝RAG知识库 + 智能数据表:
      A. RAG: (1) 企业知识库: 上传产品手册/合同模板/FAQ文档→自动索引
      (2) AI客服使用知识库自动回答客户问题 (3) 合规知识库: 自动索引法规文档
      B. 智能数据表: (1) 客户管理看板 (2) 商机跟进Kanban (3) 订单日历视图
      (4) 数据操作→自动化: 商机状态变更→自动分配AI员工跟进
    effort_estimate: "3周 (RAG 1.5周 + 智能数据表1.5周)"
    expected_impact: >
      ★★★ 极大提升: 链客宝从「管理后台」升级为「智能业务平台」,
      知识库/AI/数据表三位一体, 大幅降低客户管理成本

  - product: 赛博参谋
    priority: P1
    gap_analysis: >
      赛博参谋作为创业决策系统, 核心需要市场数据/竞品分析的结构化管理。
      当前以对话式分析为主, 缺结构化数据表和知识库。
    injection_method: >
      赛博参谋知识库: (1) 市场研究报告自动索引 (2) 竞品数据表: 结构化记录竞品信息
      (3) 创业数据看板: 融资/增长/指标 (4) 数据变更→决策建议: 竞品发布新品→自动分析
    effort_estimate: "2周"
    expected_impact: "★★☆ 从「对话式分析」到「数据驱动决策」"

  - product: 中韩出海数智港
    priority: P1
    gap_analysis: >
      中韩出海数智港当前产品数据/供应商数据分散,
      缺统一的RAG知识库和多语言数据管理。
    injection_method: >
      (1) 跨境知识库: 韩国政策/关税/合规文档自动索引 (2) 供应商数据表 (3) 产品目录管理
      (4) 多语言数据表: 中韩双语字段管理
    effort_estimate: "2-3周"
    expected_impact: "★★☆ 数据管理标准化, 提升跨境交易效率"

  - product: 白泽控制台
    priority: P1
    gap_analysis: >
      白泽处理多条业务线的决策数据, 当前以对话方式工作。
      缺结构化数据表来聚合和跟踪各业务线关键指标。
    injection_method: >
      白泽决策数据表: (1) 各业务线KPI数据表 (2) 决策记录表: 每个决策的记录和结果
      (3) OKR跟踪表 (4) 数据变更→自动分析: KPI变动自动触发根因分析
    effort_estimate: "1-2周"
    expected_impact: "★★☆ 从「对话式CEO辅助」到「数据驱动决策中枢」"

  - product: AI数字军团
    priority: P2
    gap_analysis: >
      AI数字军团有技能评估数据/员工成长数据/飞轮运行数据,
      当前以看板展示为主, 缺结构化的数据表接口供员工操作。
    injection_method: >
      (1) 员工技能数据表: AI可编程查询/更新 (2) 飞轮运行记录表 (3) MCP数据桥接
    effort_estimate: "2周"
    expected_impact: "★★☆ 数据可编程操作, 提升自动化水平"

# ============================================================
# 心智模型(原子能力)
# ============================================================
mental_models:
  - name: 数据即燃料
    description: AI产品的能力上限取决于其访问和操作的结构化数据量
  - name: 知识-RAG-表格三位一体
    description: 文档知识(RAG) + 结构化数据(表格) + AI操作 = 完整数据闭环
  - name: 混合搜索优于纯向量
    description: BM25(精确匹配) + 向量搜索(语义) + 重排序 = 最佳检索效果

