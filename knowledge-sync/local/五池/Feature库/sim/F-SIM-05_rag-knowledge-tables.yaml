# 注入时序建议
# ============================================================
injection_timeline:
  phase_1_now: "盖娅之城RAG升级 + 链客宝RAG+智能数据表 (并行推进)"
  phase_2_next: "赛博参谋知识库 + 中韩出海知识库 + 白泽决策数据表"
  phase_3_future: "AI数字军团员工数据表"
