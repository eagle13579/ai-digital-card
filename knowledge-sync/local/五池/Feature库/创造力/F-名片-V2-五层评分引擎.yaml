feature_id: "F-名片-V2"
name: "五层评分匹配引擎 (V2)"
version: "2.0.0"
dimension: "创造力"
source_model: "AI数智名片 matching_engine_v2.py + attention_matcher.py + MMR多样性引擎"

products:
  - AI数智名片: V2匹配推荐
  - AI数智名片: 多样性推荐
  - AI数智名片: 匹配可解释性
source_location: "D:/AI数智名片/backend/app/services/matching_engine_v2.py: MatchEngineV2类"

one_loader: "用户标签向量 → V2五层评分 (标签重叠0.35+语义相似0.25+标签权重0.10+行业互补0.20+注意力匹配0.10) → MMR多样性重排序 → 推荐结果+可解释性"

what_it_does: |
  场景：AI数智名片的核心价值在于精准匹配商业合作机会。V1的三层评分（标签重叠+语义相似+标签权重）在商业场景下缺少行业维度和深度特征交互。
  
  问题：V1匹配引擎的不足——①仅3层评分，缺乏行业互补判断力 ②标签重叠过分依赖精确匹配 ③缺乏多样性控制 ④没有匹配理由可解释性 ⑤ML模型在104样本下严重过拟合(AUC=1.0)。
  
  价值：五层综合评分（V1基础+行业互补分析+四头注意力匹配）+ MMR多样性重排序 + 匹配理由Explain API。48/49 E2E测试通过率。ML模型防过拟合改造（Dropout=0.5, EarlyStopping, WeightDecay=1e-2），验证AUC 0.8577。
  
  架构亮点：①完全向后兼容V1（V2复用V1的tag vector和vector semantic方法） ②10类行业供需映射（6个源头行业→11条供需链） ③四头注意力匹配（行业/能力/地区/热度） ④MMR多样性后处理lambda=0.5 ⑤ItemBasedCF + UserBasedCF 双协同过滤

input: |
  - db: AsyncSession
  - user_a_id / user_b_id: 用户ID对
  - query_text: 搜索关键词 (hybrid_search_v2)
  - top_k: 返回数 (默认10)
  - mmr_lambda: 多样性参数 (默认0.5)

output: |
  compute_similarity_v2: {score, tag_overlap, vector_semantic, tag_weight, industry_complement, attention_score, common_tags}
  hybrid_search_v2: [{user_id, user_name, score, keyword_score, vector_score, source, mmr_score?}]

sop: |
  1. 构建标签向量: 从DB加载用户A/B的provide/need标签 {tag: weight}
  2. 五层评分:
     a. tag_overlap × 0.35 — 供需标签双向匹配 (A提供∩B需要 + B提供∩A需要)
     b. vector_semantic × 0.25 — TF-IDF向量语义相似度 (标签+简介+brochure)
     c. tag_weight × 0.10 — 标签兴趣强度综合 (数量+权重各50%)
     d. industry_complement × 0.20 — 行业互补分析 (10类行业供需映射)
     e. attention_score × 0.10 — 四头注意力匹配 (行业/能力/地区/热度)
  3. 加权融合: 五层加权求和 → 综合评分
  4. 混合搜索 (hybrid_search_v2):
     a. 关键词搜索: 用户信息+标签+画册 → keyword_score
     b. 向量搜索: VectorSearchEngine → vector_score
     c. 混合排序: keyword_weight × 0.3 + vector_weight × 0.7
  5. MMR多样性后处理: mmr_lambda控制相关性与多样性的权衡
  6. 返回结果: 含评分详情、匹配标签、互补行业

quality_gate:
  score: 9
  checks:
    - "48/49 E2E测试通过率 (唯一失败为无torch环境下的正常import错误)"
    - "V2评分权重之和=1.0 验证通过"
    - "行业分类=10类 验证通过"
    - "供需映射全部13条链验证通过"
    - "注意力匹配分数范围 [0.5-0.7] 验证通过"
    - "行业互补: 同行业+0.1, 跨行业互补+0.3 验证通过"
    - "MMR返回正确数量+多样性分数验证通过"
    - "Explain API返回四头注意力详情验证通过"
    - "过拟合修复: V2验证AUC=0.8577 vs V1 AUC=1.0(过拟合)"
  reusable_by: ["AI数智名片", "链客宝", "企业撮合平台", "供需匹配平台", "商业社交网络"]

product:
  - "AI数智名片"
  - "匹配推荐引擎"
  - "企业社交匹配"

