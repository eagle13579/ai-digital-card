one_liner: "Agent自主决定检索时机、检索策略、检索结果融合方式，而非被动执行预设的检索-生成流水线"

products:
  - 企业知识库RAG: 自动匹配
what_it_does: |
  场景：构建需要外部知识支撑的AI问答/生成系统时，传统的「检索→生成」固定流水线无法应对多样化的查询需求。
  问题：固定RAG流水线对所有查询使用相同策略——先检索N个文档再生成回答。这种「一刀切」模式导致：
    - 简单查询：不必要的检索浪费时间和Token
    - 复杂查询：一次检索不够，需多轮检索
    - 模糊查询：无法自主决定是否要澄清/追问
  价值：FastGPT的Agentic RAG模式——让LLM Agent自主规划检索策略，根据查询复杂度动态决定检索次数/检索源/信息融合方式。

  核心创新模式：
  - 三元检索决策树：是否需要检索 → 检索什么 → 如何融合
  - 多轮检索自适应：Agent可执行1-N轮检索，每轮基于已获得信息决定下一步
  - 检索源路由器：根据问题领域自动选择知识库/搜索引擎/API/数据库
  - 信息融合裁决器：当多源信息冲突时，Agent自主裁决可信度
  - 不检索权利：Agent有权决定「这个问题不需要检索，我直接回答」

input: |
  - 用户查询: 原始自然语言问题
  - 可用知识源列表: 知识库/搜索引擎/API/数据库等
  - Agent能力配置: 可用工具集/Token预算/最大检索轮数
  - 知识源元数据: 每个知识源的覆盖领域/更新日期/可信度评分

output: |
  - 检索决策日志: 检索时机/策略/结果的完整记录
  - 检索质量评估: 每次检索的有用性评分(1-10)
  - 信息融合报告: 多源信息如何被融合/裁决
  - 策略优化建议: 基于执行结果优化Agent检索策略
  - 不检索决策记录: 如果Agent选择不检索，记录决策依据

sop: |
  1. 接收用户查询，是否需要检索？(决策点1)
     - 不需要 → 直接生成回答（记录「不检索决策」理由）
     - 需要 → 进入检索规划
  2. 检索规划：选择检索源 + 构造检索查询 + 设定检索深度
  3. 执行检索 → 评估检索结果质量
     - 结果不足 → 调整检索策略再检索（最多N轮）
     - 结果足够 → 进入信息融合
  4. 信息融合：合并多源信息，裁决冲突，提取关键事实
  5. 生成回答：融合检索信息+Agent自身知识生成最终回答
  6. 执行后反思：如果用户反馈不满意 → 启动补充检索

  6. 检索质量评估: 每次RAG响应后自动计算检索命中率+答案相关度得分
  7. 策略自适应切换: 当某检索策略连续3次得分<7/10时自动切换备选策略

quality_gate:
  - gate: "检索必要性正确率"
    standard: "需要检索时检索率≥95%，不需要时检索率≤10%"
    score: 7
  - gate: "多轮检索收敛率"
    standard: "最多3轮检索内获得足以回答的信息"
    score: 7
  - gate: "信息融合无幻觉"
    standard: "检索到的信息与生成回答的事实一致性≥90%"
    score: 9
  - gate: "策略优化闭环"
    standard: "每次执行有反思记录，至少每10次执行触发一次策略更新"
    score: 6

score_target: "8/10"
depends_on:
