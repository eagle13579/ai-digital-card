feature_id: "F-CZL-CL-灵感发现与假设驱"
name: "灵感发现与假设驱动"
version: "1.0.0"
dimension: "创造力"
source_model: "非一堂原子模型聚合/创造力"
# 精确source_model溯源 (2026-06-12): 五池/模型池/2026-05-26_预测之书模型.md + 五池/模型池/M11_双三角乘数公式.md + 五池/模型池/M12_商业竞争力双三角.md
created_at: "2026-06-07"
author: "白泽 (批量聚合)"

one_liner: "聚合创造力维度相关原子心智模型的标准化Feature集群"

products:
  - 通用: 自动匹配
what_it_does: |
  将创造力维度的多个原子心智模型聚合为一个可执行的标准化Feature。
  涵盖灵感发现与假设驱动相关的心智模型群组。
  AI数字员工执行时，自动从关联原子中选择最适合当前场景的模型。

input: |
  - 任务描述: 需要在创造力维度执行的具体任务
  - 上下文: 环境/用户/场景信息

output: |
  - 标准化创造力维度交付物
  - 应用的心智模型记录
  - 质量自评

sop: |
  1. 理解任务，匹配创造力维度最合适的原子模型
  2. 应用选中的心智模型执行任务
  3. 记录使用的模型和效果
  4. 自评并迭代改进

quality_gate:
  - gate: "模型匹配准确"
    standard: "选择了最适合的原子模型"
    score: 5
  - gate: "产出可用"
    standard: "结果可直接交付"
    score: 5

score_target: "9/10"
depends_on: []
enhanced_by: []

iteration_log: |
