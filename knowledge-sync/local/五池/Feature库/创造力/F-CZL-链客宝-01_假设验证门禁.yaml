feature_id: "F-CZL-链客宝-01"
name: "假设验证门禁"
version: "1.0.0"
dimension: "创造力"
source_model: "chainke-full/backend/app/routers/hypothesis_gate.py"
source_project: "chainke-full"
created_at: "2026-06-08"
author: "白泽 (向海容授权自动扫描吸收)"

one_liner: "商业假设→实验设计→数据验证→门禁判断的闭环引擎，结构化验证每个增长想法再投入资源"

products:
  - 通用: 自动匹配
what_it_does: |
  场景：产品和增长团队提出各种商业假设（如"AI匹配推荐提升B2B获客转化率"），需要低成本验证再决定是否投入开发。
  问题：团队容易凭直觉决策，投入大量资源开发未被验证的功能，造成资源浪费。
  价值：链客宝M2模块提供完整的假设验证门禁流程：
  - 假设管理：创建/分类（增长/留存/转化/定价/产品）/风险评分(1-10)
  - 实验设计：A/B测试/用户访谈/数据分析/问卷调研等方法 + 成功标准
  - 数据验证：置信度(0-1) + 关键指标记录 + 通过/不通过判定
  - 门禁判断：综合评分 = 通过分(40分) + 置信度分(30分) - 风险惩罚分
  - 门禁阈值60分：≥60开门放行，<60退回重新设计

  3个预设假设：
  - "AI匹配推荐提升B2B获客转化率"（验证中，风险6/10）
  - "展会场景扫码即用降低获客门槛"（待验证，风险4/10）
  - "社交人脉可视化增加付费转化"（待验证，风险7/10）

input: |
  - 假设标题和描述: 商业假设的核心内容
  - 假设分类: 增长/留存/转化/定价/产品
  - 现有证据等级: 低/中/高
  - 风险评分: 1-10
  - 实验方法: A/B测试/用户访谈/数据分析/问卷调研
  - 验证结果: 通过/不通过 + 置信度 + 指标数据

output: |
  - 门禁检查结果: passed=True/False + 综合评分 + 门禁状态(gate: open/blocked/locked)
  - 决策建议: 建议进入执行阶段 / 建议重新设计实验或调整假设
  - 假设状态机: 待验证→验证中→已验证→已关闭

sop: |
  1. 定义商业假设：标题、描述、分类、现有证据等级、风险评分
  2. 设计实验方案：选择验证方法、设定样本量、定义成功标准
  3. 创建实验记录，自动将假设状态更新为"验证中"
  4. 执行实验并收集数据，提交验证结果（通过/不通过 + 置信度）
  5. 调用门禁检查端点计算综合评分 = 40(通过分) + 30*置信度 - 3*风险评分
  6. 评分≥60分→门禁开放，建议进入执行阶段；<60分→门禁阻塞，建议重新设计
  7. 更新假设状态为"已验证"，记录验证结论和操作人

quality_gate:
  - gate: "假设结构完整性"
    standard: "每个假设包含标题、描述、分类、证据等级、风险评分5个核心字段"
    score: 5
  - gate: "门禁评分正确性"
    standard: "门禁综合评分=40(通过分)+30*置信度-3*风险评分，阈值60分"
    score: 5
  - gate: "状态流转闭环"
    standard: "假设状态按 待验证→验证中→已验证 正确流转"
    score: 5

score_target: "9/10"
depends_on: []
