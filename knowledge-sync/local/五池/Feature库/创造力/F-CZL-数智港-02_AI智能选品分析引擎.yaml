# === Feature 定义文件 ===
feature_id: "F-CZL-数智港-02"
name: "AI智能选品分析引擎"
version: "1.0.0"
dimension: "创造力"
source_model: "PRD_AI智能选品功能_v1.0.md(51KB) + 竞品分析报告"

## 定位
one_liner: "基于韩国消费趋势+中国市场热度+合规可行性的多因子智能选品推荐"

products:
  - 通用: 自动匹配
what_it_does: |
  AI驱动的韩国产品选品分析：从韩国消费趋势数据(韩流/社交电商热品) → 中国市场热度(天猫/小红书/抖音品类表现) → 合规可行性(食品/化妆品/保健食品进口门槛) → 综合评分排序。
  
input: |
  韩国品类(食品/化妆品/保健食品) + 中国市场热度数据 + 合规数据库
  
output: |
  选品推荐清单(按综合评分排序) + 每个产品的进入策略+风险提示
  
sop: |
  1. 从韩国消费数据提取热门品类
  2. 映射到中国电商平台品类热度
  3. 合规门槛评估(cost/time/complexity)
  4. 多因子加权评分(市场*竞争*合规*利润)
  5. 输出Top-N推荐选品
  6. 每个产品附进入策略
  
  quality_gate:
  - gate: "评分因子>=4个(市场/竞争/合规/利润)"
    standard: "通过"
    score: 5
  - gate: "推荐产品有真实市场热度数据支撑"
    standard: "通过"
    score: 5
  - gate: "合规门槛有量化评估(成本/时间/复杂度)"
    standard: "通过"
    score: 5
  - gate: "输出格式可供客户直接查看"
    standard: "通过"
    score: 5
  
  score_target: "10/10"
  project: "中韩出海数智港"
  project_path: "L5孵化室/产品开发/出海项目/中韩出海数智港/"
  
iteration_log: |
  v1.0.0 - 创建: KFD架构标定，2026-06-08
  