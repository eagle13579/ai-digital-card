feature_id: "F-CZL-BIO-02"
name: "产品力碾压式竞争"
version: "1.0"
dimension: "创造力"
source_model: "陈总材料科技·产品力碾压式竞争"
# 精确source_model溯源 (2026-06-12): 五池/模型池/2026-06-09_陈总材料科技_12心智模型.md
domain: "bio_materials"
description: "产品力碾压式竞争：不靠关系靠产品——以材料科技核心优势（自愈/长丝/生物功能）构建降维打击级产品力，在性能/寿命/成本三个维度形成不可超越的差距"
input:
  - 目标市场竞争分析（竞品性能/价格/渠道）
  - 核心技术优势清单
  - 产品力差距量化（我方vs竞品）
  - 客户痛点与未被满足的需求
  - 供应链与成本模型
output:
  - 产品力碾压矩阵（性能/寿命/成本三维对比）
  - 竞品无法复制的技术壁垒清单
  - 目标客户群体验装/试用反馈
  - NPS与竞品替代率数据
  - 市场渗透率曲线
sop: |
  1. 竞品解剖 — 采购竞品做全面性能测试（拉力/耐腐/自愈/寿命），建立量化对比数据库
  2. 差距定位 — 找到我方技术至少3个维度领先2倍以上的差距点（如寿命×5/自愈速度×3/成本↓50%）
  3. 极端测试 — 设计极端条件对比实验（高温/高湿/强酸碱/连续疲劳），放大产品力差距的可视化效果
  4. 体验设计 — 让客户「一次试用即回不去」——提供免费样品+对比实验工具包，让客户自己验证
  5. 口碑裂变 — 利用试用客户的对比结果做案例传播，形成「用过我的产品就看不上别家」的行业共识
  6. 碾压阈值量化: 定义产品力碾压的量化指标(性能领先≥20% 或 成本降低≥30%)
  7. 竞争态势看板: 自动对比竞品在核心指标上的差距，每月刷新排名

quality_gate:
  score: 9
  checks:
    - "至少3个性能维度领先竞品≥2倍"
    - "试用客户转化率≥30%"
    - "客户NPS≥70"
    - "竞品替代成本（客户切换成本）≤客户年采购额5%"
  reusable_by: ["陈总材料科技", "硬科技产品竞争", "B2B材料销售"]
status: active

products:
  - 通用: 自动匹配
