feature_id: "F-CZL-链客宝-02"
name: "增长实验引擎"
version: "1.0.0"
dimension: "创造力"
source_model: "chainke-full/backend/app/routers/hypothesis_gate.py + chainke-full/增长三周期/"
source_project: "chainke-full"
created_at: "2026-06-08"
author: "白泽 (向海容授权自动扫描吸收)"

one_liner: "基于假设验证门禁驱动的增长实验引擎，连接商业假设→A/B测试→数据归因→规模化决策的全链路"

products:
  - 通用: 自动匹配
what_it_does: |
  场景：增长团队需要系统化地设计、执行、分析增长实验，将数据驱动的增长方法论固化到产品中。
  问题：增长实验零散、缺乏结构化流程、实验结果难以沉淀为决策依据。
  价值：链客宝增长实验引擎构建了从假设到规模化的完整增长循环：
  - 假设层：复用假设验证门禁的假设管理能力，支持假设CRUD
  - 实验设计层：A/B测试方法 + 变量设计（对照组vs实验组）+ 样本量计算
  - 数据归因层：实验指标记录 + 置信度计算 + 效果量化（如提升50%）
  - 决策层：门禁判断通过后触发规模化执行建议
  - 周期管理：结合增长三周期方法论（周期切换监控看板+放大前自检三条件）

  与假设验证门禁的关系：
  - 增长实验引擎是假设验证门禁的上层编排器
  - 假设验证门禁负责单个假设的验证判定
  - 增长实验引擎负责多实验的组合管理和规模化决策

input: |
  - 增长假设列表: 从假设验证门禁获取待验证的假设
  - 实验设计方案: A/B测试/多变量测试的详细设计
  - 增长周期状态: 当前所处的增长周期阶段（探索/放大/收割）
  - 放大前自检条件: 三个必检条件的满足状态

output: |
  - 实验排期: 待执行/执行中/已完成 的实验队列
  - 实验结果分析: 各实验的效果量化 + 置信度评级
  - 规模化建议: 通过门禁的实验建议投入更多资源
  - 周期切换信号: 当前增长周期阶段及切换建议

sop: |
  1. 从假设验证门禁获取待验证的增长假设列表
  2. 为每个假设设计实验方案（A/B测试/用户访谈/数据分析）
  3. 排定实验优先级（基于风险评分和预期影响力）
  4. 执行实验并收集数据，记录关键指标和置信度
  5. 提交验证结果到假设验证门禁的门禁检查
  6. 通过门禁的实验进入规模化评估（增长三周期自检）
  7. 输出实验报告含：假设→实验→结果→建议 完整链路

quality_gate:
  - gate: "实验-假设关联"
    standard: "每个实验必须关联到一个已验证的假设，无孤立实验"
    score: 5
  - gate: "实验变量设计"
    standard: "实验设计需明确自变量、对照组、实验组，变量不可混淆"
    score: 5
  - gate: "结果可复现"
    standard: "实验数据记录完整，支持第三方复现验证"
    score: 5

score_target: "9/10"
depends_on:
  - "F-CZL-链客宝-01_假设验证门禁"
enhanced_by:
  - "F-DAT-链客宝-02_单元经济仪表盘"
