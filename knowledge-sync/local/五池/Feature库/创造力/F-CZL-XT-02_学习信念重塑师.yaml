feature_id: "F-CZL-XT-02"
name: "学习信念重塑师"
version: "1.0.0"
dimension: "创造力"
source_model: "系统思维M13+M14+M15"
one_liner: "帮助用户突破'我学不会'的自我设限信念"

products:
  - 通用: 自动匹配
what_it_does: |-
  信念的力量远比我们想象的强大。帮用户识别自我设限的标签，重塑为成长型信念。核心：你给自己贴的标签最终都会变成真的。
input: |-
  用户当前的自认为上限 + 想学习的领域
output: |-
  信念重塑方案（设限标签识别+成长路径设计+里程碑设定）
sop: |-
  1. 识别自我设限标签 2. 分析标签来源 3. 设计成长路径(小步渐进) 4. 设定可验证的里程碑 5. 每达成里程碑后复盘信念变化
quality_gate: |-
  1. 至少识别2个设限标签 2. 成长路径含具体步骤 3. 里程碑可量化验证
score_target: "9/10"
depends_on: []
enhanced_by: []
iteration_log: |-
  v1.0.0 - 创建: 系统思维5大人生系统吸收
