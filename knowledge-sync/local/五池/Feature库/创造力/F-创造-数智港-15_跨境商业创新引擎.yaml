# === Feature 定义文件 ===
feature_id: "F-CZL-数智港-03"
name: "跨境商业创新引擎"
version: "1.0.0"
dimension: "创造力"
source_model: "时光机战略重构PRD(22KB) + 竞品分析 + 差异化策略"

## 定位
one_liner: "基于时光机理论+资本套利框架的跨境电商创新策略发现"
what_it_does: |
  从中国模式(时光机CFC)反推韩国市场机会：韩企进中国≠简单翻译，而是差异化优势分析(韩流文化溢价/品质信任/合规专业度)。结合资本套利三层楼框架发现规则制定/规则扩张/规则套利机会。
  
  ## 输入输出
input: |
  目标品类 + 中韩市场对比数据 + 资本套利框架
output: |
  跨境创新机会报告 + 差异化进入策略 + 3层资本套利分析
  
  ## 执行SOP
sop: |
  1. 分析目标品类在中韩两市场的成熟度差异
  2. 韩国企业差异化优势识别(llm_enhancer分析)
  3. 时光机模型应用(从中国已验证模式反推)
  4. 资本套利三层楼评估
  5. 输出创新机会报告
  
  ## 质量门禁
  quality_gate: |
  1. 创新机会有中外市场对比数据支撑
  2. 差异化优势不是简单翻译本地化
  3. 资本套利分析有2层及以上
  4. 策略建议可执行
  score: 6
  
  ## 关联项目
  project: "中韩出海数智港"
  project_path: "L5孵化室/产品开发/出海项目/中韩出海数智港/"
  
  ## 迭代记录
iteration_log: |
  v1.0.0 - 创建: KFD架构标定，从项目代码提取Feature定义
  
