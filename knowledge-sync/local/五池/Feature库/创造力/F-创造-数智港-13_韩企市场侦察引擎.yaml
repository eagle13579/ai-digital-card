# === Feature 定义文件 ===
feature_id: "F-CZL-数智港-01"
name: "韩企市场侦察引擎"
version: "1.0.0"
dimension: "创造力"
source_model: "scout_blueprint.py(476行) + scout_data.py(332行)"

## 定位
one_liner: "韩国目标企业系统化侦察+情报分析+进入策略的自动化引擎"
what_it_does: |
  scout_blueprint定义侦察框架(企业筛选维度+数据采集模板+情报分析SOP)，scout_data加载韩国企业名录和公开商业数据。输出结构化侦察报告(市场机会/竞争态势/进入壁垒/合作建议)。
  
  ## 输入输出
input: |
  目标企业名称 + 品类 + 市场(中国/韩国)
output: |
  企业侦察报告(市场规模/竞品分析/合规门槛/进入策略/风险提示)
  
  ## 执行SOP
sop: |
  1. 从scout_data加载目标企业信息
  2. 按品类和市场维度做初步筛选
  3. scout_blueprint执行五维分析(市场/竞争/合规/渠道/风险)
  4. 整合侦察报告
  5. 标注情报置信度(已知/推断/未知)
  6. 输出进入策略推荐
  
  ## 质量门禁
  quality_gate: |
  1. 侦察报告覆盖≥5个维度
  2. 每个维度有置信度标注
  3. 信息源可追溯(公开数据/推断/AI生成)
  4. 进入策略可执行(非泛泛建议)
  score: 7
  
  ## 关联项目
  project: "中韩出海数智港"
  project_path: "L5孵化室/产品开发/出海项目/中韩出海数智港/"
  
  ## 迭代记录
iteration_log: |
  v1.0.0 - 创建: KFD架构标定，从项目代码提取Feature定义
  
