feature_id: "F-CZL-XT-01"
name: "主动回忆触发器"
version: "1.0.0"
dimension: "创造力"
source_model: "系统思维M10+M11"
one_liner: "设计随机触发机制帮助用户强化记忆"

products:
  - 通用: 自动匹配
what_it_does: |-
  利用大脑主动回忆比被动识别更有效的原理，设计随机的'记忆触发点'。核心：储存时增加适度困难，提取时才轻松。
input: |-
  用户想记住的知识列表 + 学习时间安排
output: |-
  记忆触发方案（随机测试机制+间隔重复计划+难度递增策略）
sop: |-
  1. 识别知识点列表 2. 设置随机测试机制(每次打开手机/电脑时) 3. 设计间隔重复时间表 4. 从简单回忆开始递增难度 5. 评估记忆保留率
quality_gate: |-
  1. 至少含3种触发机制 2. 有间隔重复计划 3. 有难度递增策略
score_target: "9/10"
depends_on: []
enhanced_by: []
iteration_log: |-
  v1.0.0 - 创建: 系统思维5大人生系统吸收
