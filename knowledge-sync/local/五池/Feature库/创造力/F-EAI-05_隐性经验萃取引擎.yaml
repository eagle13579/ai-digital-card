feature_id: "F-EAI-05"
name: "隐性经验萃取引擎"
version: "1.0.0"
dimension: "创造力"
status: "active"
source_model: |
  M05 自动织网机制
  M07 隐性经验资产化

one_liner: "从员工日常操作中自动萃取隐性经验，变成公司永久资产——离职带不走"

what_it_does: |
  核心骨干离职 = 公司最大损失？不，如果隐性经验已卷进知识飞轮。
  这个Feature在员工使用AI的每一次操作中，自动萃取：
  - 客户跟进的细节和策略
  - 踩过的坑和解决思路
  - 高效报价模式
  - 审批流中的决策规律
  萃取后自动关联到关系图谱，新人入职直接无缝衔接。

input:
  - 员工与AI的对话日志
  - 业务操作记录
  - 决策与结果数据

output:
  - 隐性经验知识条目（人事物三元组）
  - 经验关联关系图谱
  - 新人交接报告

sop: |
  1. 从员工AI对话中提取业务实体（客户/合同/产品/问题）
  2. 关联实体之间的关系（客户A→合同B→投诉C）
  3. 从成功/失败案例中萃取模式（这类报价成单率高）
  4. 将模式注入知识飞轮关系图谱
  5. 新人入职时：输入岗位 → 自动生成经验简报

quality_gate:
  score: 7
  gate_1: "实体提取准确率>85%"
  gate_2: "关系图谱可视化可用"
  gate_3: "至少1个新人用经验简报成功过渡"

depends_on: ["F-EAI-01"]
enhanced_by: ["F-EAI-06"]

products:
  - "AI数智军团"
  - "盖娅进化大脑"

employees:
  - "文鳐"
  - "烛龙"
  - "白泽"

