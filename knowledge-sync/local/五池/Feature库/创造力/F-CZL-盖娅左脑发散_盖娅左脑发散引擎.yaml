feature_id: "F-CZL-盖娅左脑发散"
name: "盖娅左脑发散引擎"
version: "1.0.0"
dimension: "创造力"
source_model: "gaia-cortex SKILL.md §左右脑架构 + scripts/gaia_duality.py + double-triangle-model-absorption v5.0"
