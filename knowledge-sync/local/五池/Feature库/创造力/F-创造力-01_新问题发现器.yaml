feature_id: "F-创造力-01"
name: "新问题发现器"
version: "1.0.0"
dimension: "创造力"
source_model: "灵感闪现(095) + 解放思想(003)"
created_at: "2026-06-07"
author: "白泽"

one_liner: "在给定的领域/场景中发现未被充分解决的问题，输出高价值问题清单"
what_it_does: |
  场景：产品/项目需要创新突破时，发现现有方案没解决的真问题。
  问题：团队容易在已有框架内思考，找不到新方向。
  价值：系统化发现新问题，提供创造力的起点。

input: |
  - 领域: 要探索的领域/市场/场景
  - 已知问题: 当前已解决的问题列表
  - 约束条件: 资源/时间/技术限制

output: |
  - 高价值问题清单: 按价值排序
  - 每个问题的「为什么没人解决」分析
  - TCP-R预判: 每个问题的可行性

sop: |
  1. 输入领域和已知问题
  2. 多角度扫描(用户/竞品/技术/行业)发现盲区
  3. 对每个新问题评估: 真实价值 + 解决成本
  4. 用TCP-R预判：这个问题的假设和反例
  5. 输出排序后的高价值问题清单

quality_gate:
  - gate: "新鲜度"
    standard: "至少3个问题是现有方案未覆盖的"
    score: 4
  - gate: "价值判断"
    standard: "每个问题有定量的价值评估"
    score: 4
  - gate: "TCP-R完整"
    standard: "每个问题有假设+反例分析"
    score: 4

score_target: "9/10"
depends_on: ["F-体系-01"]
enhanced_by: ["F-数据-01"]

iteration_log: |
