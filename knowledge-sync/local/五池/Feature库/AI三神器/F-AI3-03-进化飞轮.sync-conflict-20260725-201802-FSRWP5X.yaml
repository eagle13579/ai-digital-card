name: 进化飞轮
version: 0.1.0
dimension: 体系
status: draft
draft: true
source_model: Darwin
description: >
  基于Darwin心智模型的持续进化引擎。对每一个创建的Skill或Feature
  进行9维度全面评分（功能完整度/代码质量/可维护性/性能/安全/兼容性/
  文档/用户体验/扩展性），配合双评审交叉验证机制，驱动自动迭代改进。
  分数只升不降，从62分起步向94分持续逼近，每次改进均经评审验证，
  不通过则回退。迭代到94分即为最终态，锁版上线。
sop:
  - step: 1
    name: 创建Skill/Feature
    action: 用户创建新的Skill或Feature定义，进入进化飞轮流程
    input: new_artifact
    output: artifact_draft
  - step: 2
    name: 9维度评分
    action: 使用评分引擎对工件从9个维度逐项打分，每个维度0~10分，总分0~90，归一化输出
    dimensions:
      - id: func
        name: 功能完整度
        weight: 1.0
      - id: quality
        name: 代码质量
        weight: 1.0
      - id: maintain
        name: 可维护性
        weight: 1.0
      - id: perf
        name: 性能
        weight: 1.0
      - id: security
        name: 安全
        weight: 1.0
      - id: compat
        name: 兼容性
        weight: 1.0
      - id: doc
        name: 文档
        weight: 1.0
      - id: ux
        name: 用户体验
        weight: 1.0
      - id: extensibility
        name: 扩展性
        weight: 1.0
    scoring:
      scale: 0-10 per dimension
      total_max: 90
      normalization: (raw_score / 90) * 100
    output: score_card
  - step: 3
    name: 双评审交叉验证
    action: 两路独立评审员同时对工件进行评审，独立打分并给出改进建议；若两路评分偏差 > 5%，则启动仲裁评审
    reviwers:
      - reviewer_a: 技术评审（关注功能/代码/性能/安全/兼容性/扩展性）
      - reviewer_b: 体验评审（关注功能/文档/用户体验/可维护性/兼容性）
    arbitration:
      trigger: abs(reviewer_a.score - reviewer_b.score) > 5
      action: 启动第三方仲裁评审，取中位数
    output: validated_score_card + review_comments
  - step: 4
    name: 迭代改进
    action: 根据评审意见生成改进方案，自动执行改进；若当前分数 >= 94，则标记为最终态锁版上线
    condition:
      if: current_score >= 94
      then: 锁版 → 上线归档
      else: 生成改进方案 → 执行改进 → 回到step2重新评分
    rollback:
      mechanism: 每次改进前保存快照，若新版本评分低于旧版本评分，自动回退至上一版本
      policy: 分数只升不降
    output: improved_artifact
  - step: 5
    name: 验证通过才上线
    action: 达到94分后，做最终回归验证，通过后写入Feature库正式目录，标记为released
    output: released_artifact
input:
  - name: new_artifact
    type: object
    description: 待进化的Skill或Feature定义，含完整的YAML描述和实现代码
  - name: iteration_limit
    type: integer
    description: 最大迭代轮次（默认20轮，防止死循环）
    default: 20
output:
  - name: released_artifact
    type: object
    description: 经过进化飞轮验证通过、锁版上线的最终工件
  - name: evolution_log
    type: array
    description: 完整进化历程，每轮包含评分、评审意见、改进摘要
  - name: score_history
    type: array
    description: 分数变化曲线，格式为 [{round, score, delta}]
quality_gates:
  - name: 分数单调递增
    metric: 每一轮新分数 >= 上一轮分数，违反即回退
    severity: critical
  - name: 评审偏差
    metric: 双评审交叉评分偏差 <= 5%
    severity: major
  - name: 迭代收敛
    metric: 最多20轮内达到94分，否则标记为"需要重新设计"
    severity: critical
  - name: 快照回退
    metric: 回退机制必须100%可靠，回退后状态与快照完全一致
    severity: critical
  - name: 锁版条件
    metric: 必须 >= 94分且经双评审确认方可锁版上线
    severity: critical
