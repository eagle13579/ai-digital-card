datapack_id: "DP-PD-链客宝-壁垒强度评估"
name: "链客宝·壁垒强度评估"
version: "1.0.0"
type: "产品包"
schema_version: "1.0"
created_at: "2026-06-08"
author: "白泽"

description: "链客宝现有壁垒的强度评估数据，包含四大真壁垒的当前评估、强度等级划分和壁垒构建行动计划"

source: "chainke-full/壁垒/六大伪壁垒战略评审门禁.md | chainke-full/产品内核/链客宝JTBD核心句式.md"

contents: |
  【壁垒强度评估数据】
  1. 四大真壁垒评估模型（基于六大伪壁垒门禁的转化方向）:
     - 网络效应壁垒（当前强度: ★★★☆☆）:
       - 链客宝的企业名片网络已形成基础连接
       - 每新增企业增加所有企业的连接价值（来源: geo-content名片文章）
       - 当前服务超100家企业，累计500+次成功对接
       - 构建方向: 加速网络密度，提高切换成本
     - 数据效应壁垒（当前强度: ★★★★☆）:
       - AI匹配引擎积累的供需匹配数据
       - 匹配越多算法越精准，形成数据飞轮（来源: 供需匹配文章）
       - 当前对接效率提升3-5倍，交易成本降低40%+
       - 构建方向: 积累结构化行业匹配数据
     - 结构性优势壁垒（当前强度: ★★☆☆☆）:
       - 需通过专利或复杂系统构建
       - 转介绍渠道ROI=3.40，形成成本结构优势（来源: unit_economics.py）
       - 构建方向: 建立独家行业数据源或技术专利
     - 品牌壁垒（当前强度: ★☆☆☆☆）:
       - 需在心智中占据"企业信任对接"关键词
       - 构建方向: 内容营销+案例传播
  2. 强度等级: ★☆☆☆☆(弱)~★★★★★(强)
  3. 壁垒构建优先级: 数据效应 > 网络效应 > 结构性优势 > 品牌

data_format: "心智模型YAML"

mount_interface:
  load: "读取壁垒强度评估数据到工作内存"
  query: "按壁垒类型查询强度评估/查询构建建议"
  version: "返回当前DataPack版本"

consumed_by_features:
  - "壁垒Feature做壁垒强度分析时消费此DataPack"
  - "增长Feature做竞争策略规划时消费此DataPack"

depends_on:
  - "DP-PD-链客宝-伪壁垒检查"
version_history:
  - version: "1.0.0"
    date: "2026-06-08"
    change: "原子化拆解自原壁垒文档包（KFD-07合规）"
