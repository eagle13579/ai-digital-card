datapack_id: "DP-PD-链客宝-伪壁垒检查"
name: "链客宝·伪壁垒检查"
version: "1.0.0"
type: "产品包"
schema_version: "1.0"
created_at: "2026-06-08"
author: "白泽"

description: "链客宝六大伪壁垒战略评审门禁数据，用于每次战略决策前检查是否误将伪壁垒当成真壁垒"

source: "chainke-full/壁垒/六大伪壁垒战略评审门禁.md"

contents: |
  【伪壁垒检查数据】
  1. 六大伪壁垒检查清单（来源: 六大伪壁垒战略评审门禁.md）:
     | # | 伪壁垒 | 提问 | 转化动作 |
     |:-:|:-------|:-----|:---------|
     | 1 | 流量 | 是否认为"有流量就有壁垒"? | 流量→数据效应或网络效应 |
     | 2 | 功能 | 是否认为"功能多就有壁垒"? | 功能→专利或复杂系统 |
     | 3 | 努力 | 是否认为"团队更努力就有壁垒"? | 努力→结构性优势 |
     | 4 | 赛道 | 是否认为"赛道选得好就有壁垒"? | 赛道→阻止变红的能力 |
     | 5 | 融资 | 是否认为"融到钱就有壁垒"? | 钱→转化为四大壁垒 |
     | 6 | 先发 | 是否认为"先做出来就有壁垒"? | 先发→窗口内转化为四大壁垒 |
  2. 门禁规则:
     - 零项依赖 → 决策有效，排除伪壁垒干扰
     - 有1-2项依赖 → 补充转化动作后再执行
     - 有3项以上依赖 → 决策有重大风险，建议暂停
  3. 四大真壁垒转化方向:
     - 数据效应: 用户数据积累形成高壁垒
     - 网络效应: 用户越多价值越大
     - 结构性优势: 成本结构/供应链/技术专利
     - 品牌壁垒: 心智占有

data_format: "决策记录Markdown"

mount_interface:
  load: "读取伪壁垒检查数据到工作内存"
  query: "按战略决策名称查询检查结果/查询伪壁垒转化建议"
  version: "返回当前DataPack版本"

consumed_by_features:
  - "壁垒Feature做战略决策检查时消费此DataPack"
  - "场景Feature做竞争策略规划时消费此DataPack"
  - "创造力Feature做壁垒构建分析时消费此DataPack"

depends_on: []
version_history:
  - version: "1.0.0"
    date: "2026-06-08"
    change: "原子化拆解自原壁垒文档包（KFD-07合规）"
