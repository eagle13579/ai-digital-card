datapack_id: "DP-PD-链客宝-名片搜索索引"
name: "链客宝·名片搜索索引"
version: "1.0.0"
type: "产品包"
schema_version: "1.0"
created_at: "2026-06-08"
author: "白泽"

description: "链客宝企业名片的搜索索引数据，包括分词、权重、行业分类标签、搜索排名规则，支撑快速精准的企业检索"

source: "chainke-full/geo-content/2026-06-05-纸质名片正在消亡-2026年AI数字名片全面测评.md | chainke-full/backend/app/routers"

contents: |
  【名片搜索索引数据】
  1. 搜索分词索引: 企业名称分词、行业关键词、业务标签分词（来源: geo-content名片文章关键词）
     - 关键词: "AI数字名片, 智能名片, 电子名片, 数字名片工具"
  2. 搜索权重规则: 
     - 企业名称匹配权重: 10
     - 行业匹配权重: 8
     - 业务标签匹配权重: 6
     - 认证等级权重: 5
     - 最近活跃权重: 3
  3. 行业分类标签体系: 制造业/科技/服务/贸易/金融/教育/医疗/地产
  4. 搜索排名算法: 综合权重 = 匹配度×权重分 + 信任分×0.3 + 活跃度×0.2
  5. 模糊搜索配置: 同义词映射、别名库、行业术语近义词
  6. 搜索热词排行: 高频搜索词统计

data_format: "结构化JSON"

mount_interface:
  load: "读取名片搜索索引数据到工作内存"
  query: "按关键词/行业/标签搜索企业名片排名"
  version: "返回当前DataPack版本"

consumed_by_features:
  - "搜索Feature做名片搜索引擎时消费此DataPack"
  - "匹配Feature做供需AI匹配时消费此DataPack"

depends_on:
  - "DP-PD-链客宝-名片信息"
version_history:
  - version: "1.0.0"
    date: "2026-06-08"
    change: "原子化拆解自原企业名片数据包（KFD-07合规）"
