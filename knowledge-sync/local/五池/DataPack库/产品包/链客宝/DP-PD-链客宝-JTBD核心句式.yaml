contents: |
  【JTBD核心句式数据】
  1. 核心任务句式（来源: 链客宝JTBD核心句式.md）:
     - 场景: 当企业家需要找合作伙伴/供应商/客户，但缺乏靠谱的匹配渠道和信任背书时
     - 需求: 他需要一个能精准匹配+身份认证+信任背书的对接平台
     - 目标: 以获得靠谱的商业合作机会，节省到处找关系的时间和踩坑的信任成本
  2. 用户验证证据（来源: JTBD核心句式.md用户验证证据表）:
     - 企业家是否已为"找合作伙伴"花过钱? ✅ 真痛信号
     - 企业家是否花了大量时间在这个任务上? ✅ 真痛信号
     - 现有替代方案是否明显不足? ✅ 机会窗口
     - 任务三特征: 高频、高痛、无完美方案
  3. 内核验证门禁（来源: JTBD核心句式.md）:
     - Q1: 这个功能是否帮助用户更高效地找到靠谱合作伙伴?
     - Q2: 如果没有这个功能，用户还能完成核心任务吗?
     - Q3: 竞品有这个功能，我们就要有吗？——回到Q1
  4. 产品叙述对照表（来源: JTBD核心句式.md）:
     | 旧表述 | 新表述 |
     |:-------|:-------|
     | 企业家社交平台 | 帮企业家找到靠谱的合作伙伴 |
     | AI匹配推荐功能 | 让匹配效率提高10倍 |
     | 名片展示功能 | 让您在3分钟内了解一个潜在合作伙伴 |

