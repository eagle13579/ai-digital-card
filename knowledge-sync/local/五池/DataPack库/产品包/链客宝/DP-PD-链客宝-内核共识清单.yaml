datapack_id: "DP-PD-链客宝-内核共识清单"
name: "链客宝·内核共识清单"
version: "1.0.0"
type: "产品包"
schema_version: "1.0"
created_at: "2026-06-08"
author: "白泽"

description: "链客宝产品内核共识清单模板和执行数据，包含三方对齐规则、内核门禁流程和减法检查，用于每个新功能/需求的三方同步"

source: "chainke-full/产品内核/内核共识清单_TEMPLATE.md"

contents: |
  【内核共识清单数据】
  1. 三方填空模板（来源: 内核共识清单_TEMPLATE.md）:
     - 创始人填写: 强化什么内核、用户雇佣链客宝完成的根本任务、效率提升点
     - 产品经理填写: 功能形式、用户操作描述、量化衡量指标
     - 程序员填写: 技术方案、开发周期、风险点
  2. 三个内核门禁（来源: 内核共识清单_TEMPLATE.md）:
     - 门禁1: 三人各自打分(1-10)，≥7分通过，<5分退回
     - 门禁2: "如果只能做一个功能，还选这个吗？"三人答案一致通过
     - 门禁3: "这个功能不做，用户会抱怨吗？"答案模糊→非内核相关
  3. 决策流程: 三门槛全部通过进入需求评审，任一不通过重新设计或放弃
  4. 减法检查（来源: 内核共识清单_TEMPLATE.md附录）:
     - 会显著影响核心任务 → P0保留
     - 会轻微影响 → P2/P3
     - 不会影响 → 砍掉
  5. 执行人员角色:
     - 白泽(创始人) × 乘黄(产品经理) × 烛龙(程序员)

data_format: "决策记录Markdown"

mount_interface:
  load: "读取内核共识清单数据到工作内存"
  query: "按功能名称查询共识记录/查询门禁结果/查询历史决策"
  version: "返回当前DataPack版本"

consumed_by_features:
  - "产品内核Feature做三方对齐时消费此DataPack"
  - "创造力Feature做需求评审时消费此DataPack"
  - "场景Feature做功能裁剪时消费此DataPack"

depends_on:
  - "DP-PD-链客宝-JTBD核心句式"
version_history:
