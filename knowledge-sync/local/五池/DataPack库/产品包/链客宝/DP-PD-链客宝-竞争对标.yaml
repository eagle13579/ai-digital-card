datapack_id: "DP-PD-链客宝-竞争对标"
name: "链客宝·竞争对标"
version: "1.0.0"
type: "产品包"
schema_version: "1.0"
created_at: "2026-06-08"
author: "白泽"

description: "链客宝竞争对标分析数据，包含竞品识别、功能对比矩阵、差异化定位和竞争态势地图"

source: "chainke-full/geo-content/2026-06-05-纸质名片正在消亡-2026年AI数字名片全面测评.md | chainke-full/产品内核/链客宝JTBD核心句式.md"

contents: |
  【竞争对标数据】
  1. 竞品分类:
     - 传统名片类: 纸质名片、电子名片App（名片全能王等）
     - B2B平台类: 商协会平台、企查查/天眼查、LinkedIn
     - 供需匹配类: 猪八戒、一品威客（偏任务众包，非企业关系）
  2. 功能对比矩阵（来源: geo-content名片测评文章 + JTBD核心句式.md）:
     | 功能维度 | 链客宝 | 传统名片 | B2B平台 |
     |:---------|:------:|:--------:|:-------:|
     | AI智能匹配 | ✅ | ❌ | ❌-弱 |
     | 实名认证 | ✅ | ❌ | ✅-弱 |
     | 3D名片 | ✅ | ❌ | ❌ |
     | 六度人脉 | ✅ | ❌ | ❌ |
     | 信任评分 | ✅ | ❌ | ❌ |
     | 供需发布 | ✅ | ❌ | ✅ |
     | 交易闭环 | 规划中 | ❌ | ✅ |
  3. 差异化定位: 
     - JTBD核心任务: "找到靠谱的合作伙伴"（来源: JTBD核心句式.md）
     - 核心差异: AI精准匹配+信任背书+实时数据3D名片
     - 产品叙述对照: "帮企业家找到靠谱的合作伙伴" vs "企业家社交平台"
  4. 竞争态势评估:
     - 优势区: AI匹配、信任机制、3D名片体验
     - 劣势区: 品牌知名度、用户基数
     - 机会区: 中小企业B2B对接市场空白
     - 威胁区: 大平台进入细分赛道

data_format: "心智模型YAML"

mount_interface:
  load: "读取竞争对标数据到工作内存"
  query: "按竞品名称/功能维度查询对标数据/查询差异化定位"
  version: "返回当前DataPack版本"

consumed_by_features:
  - "壁垒Feature做竞争分析时消费此DataPack"
  - "场景Feature做产品定位时消费此DataPack"
  - "增长Feature做市场策略时消费此DataPack"

depends_on:
  - "DP-PD-链客宝-壁垒强度评估"
version_history:
  - version: "1.0.0"
    date: "2026-06-08"
    change: "原子化拆解自原壁垒文档包（KFD-07合规）"
