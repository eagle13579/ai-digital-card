datapack_id: "DP-PD-链客宝-飞轮加速"
name: "链客宝·飞轮加速"
version: "1.0.0"
type: "产品包"
schema_version: "1.0"
created_at: "2026-06-08"
author: "白泽"

description: "链客宝增长飞轮加速引擎数据，包含飞轮模型定义、增长杠杆、网络效应指标和增长期执行策略"

source: "chainke-full/增长三周期/周期切换监控看板.md | chainke-full/增长三周期/放大前自检三条件.md"

contents: |
  【飞轮加速数据】
  1. 增长飞轮模型（来源: 增长三周期体系）:
     - 飞轮核心循环: 更多企业名片 → 更多供需匹配 → 更多成功交易 → 更高信任评分 → 更强网络效应 → 更多企业加入
  2. 增长期监控指标（来源: 周期切换监控看板.md）:
     - 核心增速: >20%月增长(增长期特征)
     - CAC趋势: 稳定或下降(增长期特征)
     - 团队状态: 高效执行(增长期特征)
     - 监控频率: 每月，乘黄+计然(产品+战略)负责
  3. 飞轮加速杠杆:
     - 转介绍杠杆: 转介绍渠道ROI=3.40，投入产出比最高（来源: unit_economics.py）
     - 网络效应杠杆: 每新增一个企业，所有企业获得的新增连接数
     - 数据效应杠杆: 匹配越多，AI算法越精准
  4. 增长期执行 checklist:
     - 确认P0指标: 月增速、CAC趋势、留存率
     - 资源分配: 70%增长产品 + 30%新产品探索
     - 加大高效渠道预算: 重点关注转介绍和线上渠道

data_format: "心智模型YAML"

mount_interface:
  load: "读取飞轮加速数据到工作内存"
  query: "查询飞轮模型定义/查询增长杠杆指标/查询执行策略"
  version: "返回当前DataPack版本"

consumed_by_features:
  - "增长Feature做增长策略执行时消费此DataPack"
  - "数据Feature做增长指标追踪时消费此DataPack"
  - "场景Feature做产品阶段规划时消费此DataPack"

depends_on:
  - "DP-PD-链客宝-PMF验证"
  - "DP-PD-链客宝-用户关系网"
version_history:
  - version: "1.0.0"
    date: "2026-06-08"
    change: "原子化拆解自原增长三周期文档包（KFD-07合规）"
