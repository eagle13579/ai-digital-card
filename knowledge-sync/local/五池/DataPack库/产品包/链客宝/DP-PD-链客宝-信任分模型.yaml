datapack_id: "DP-PD-链客宝-信任分模型"
name: "链客宝·信任分模型"
version: "1.0.0"
type: "产品包"
schema_version: "1.0"
created_at: "2026-06-08"
author: "白泽"

description: "链客宝企业信任评分模型数据，包含信任分计算因子、权重体系、评分标准、信任等级划分和信任分变更历史"

source: "chainke-full/geo-content/2026-06-05-信任即效率-企业信任网络如何降低交易成本.md | chainke-full/geo-content/2026-06-05-B2B交易的核心难题-如何建立企业间信任网络.md"

contents: |
  【信任分模型数据】
  1. 信任分计算因子及其权重（来源: geo-content信任文章）:
     - 企业实名认证完成度: 25%（来源: 认证体系、实名认证）
     - 历史交易履约率: 25%
     - 用户行为评分: 20%（活跃度、响应速度）
     - 关系网络质量: 15%（合作伙伴的信任分均值）
     - 负面记录扣分: 15%（纠纷、违约、逾期）
  2. 信任等级划分:
     - 800-1000: AAA级（金牌信任企业）
     - 600-799: AA级（高信任企业）
     - 400-599: A级（可信企业）
     - 200-399: B级（待验证企业）
     - 0-199: C级（新注册/低活跃）
  3. 信任分变更日志: 每次变更的时间、原因、变化值
  4. 信任机制说明: "信任即效率"——信任网络降低交易成本（来源: 信任文章）
     - 信任缺失是B2B交易核心难题
     - 区块链信任存证、实时数据洞察将成为标配能力
  5. 信任分展示: 名片上信任分展示格式、颜色标识

data_format: "心智模型YAML"

mount_interface:
  load: "读取信任评分模型数据到工作内存"
  query: "按企业ID查询信任分/按等级查询企业列表/查询信任分变更历史"
  version: "返回当前DataPack版本"

consumed_by_features:
  - "信任评分Feature做信任分计算和展示时消费此DataPack"
  - "匹配Feature做匹配排序时参考信任分"
  - "搜索Feature做搜索结果排序时参考信任分"

depends_on:
  - "DP-PD-链客宝-用户身份"
  - "DP-PD-链客宝-用户行为"
  - "DP-PD-链客宝-订单交易"
version_history:
  - version: "1.0.0"
    date: "2026-06-08"
    change: "原子化拆解自原信任评分数据包（KFD-07合规）"
