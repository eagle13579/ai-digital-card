datapack_id: "DP-PD-链客宝-产品内核笔记"
name: "链客宝·产品内核笔记"
version: "1.0.0"
type: "产品包"
schema_version: "1.0"
created_at: "2026-06-08"
author: "白泽"

description: "链客宝产品内核的衍生笔记和补充数据，包含需求评审惊叹点门禁、产品内核方法论记录和产品内核迭代日志"

source: "chainke-full/需求评审门禁_v2.md | chainke-full/产品内核/"

contents: |
  【产品内核笔记数据】
  1. 需求评审惊叹点门禁（来源: 需求评审门禁_v2.md）:
     - Q1: 这个功能的"惊叹点"是什么？→ "竟然可以这样"的瞬间
     - Q2: 如果只能做一个功能，是这个吗？
     - Q3: 其他功能砍到P2/P3后，用户会抱怨少了什么？
     - 执行铁律: 一次迭代只允许1个惊叹点、非惊叹点自动P2/P3
     - 链客宝名片惊叹点示例: "扫码后3秒内看到带实时数据的3D名片，不需要下载APP"
       P0: 3D名片渲染+扫码识别
       P2: 名片编辑、历史记录、数据分析
  2. 产品内核迭代记录:
     - M6(四步锁定法) → JTBD核心句式制定
     - M3(预配曲线模型) → 内核共识清单模板
     - M10(MVP砍到惊叹点) → 需求评审门禁v2新增
  3. 产品内核关联文档索引: 所有产品内核相关的文档路径和版本号
  4. 内核稳定性评分: 基于功能一致性评估内核是否稳定

data_format: "决策记录Markdown"

mount_interface:
  load: "读取产品内核笔记数据到工作内存"
  query: "按主题/版本/决策类型查询内核笔记"
  version: "返回当前DataPack版本"

consumed_by_features:
  - "产品内核Feature做决策回溯时消费此DataPack"
  - "创造力Feature做创新分析时消费此DataPack"

depends_on:
  - "DP-PD-链客宝-JTBD核心句式"
  - "DP-PD-链客宝-内核共识清单"
version_history:
