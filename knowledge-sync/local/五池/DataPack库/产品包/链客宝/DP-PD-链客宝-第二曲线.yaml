datapack_id: "DP-PD-链客宝-第二曲线"
name: "链客宝·第二曲线"
version: "1.0.0"
type: "产品包"
schema_version: "1.0"
created_at: "2026-06-08"
author: "白泽"

description: "链客宝增长第二曲线规划数据，包含增长期→升级期切换信号、第二曲线探索方向及升级期战略准备"

source: "chainke-full/增长三周期/周期切换监控看板.md"

contents: |
  【第二曲线数据】
  1. 增长期→升级期切换信号（来源: 周期切换监控看板.md）:
     | 信号指标 | 增长期特征 | 升级期特征 | 状态 |
     |:---------|:-----------|:-----------|:----:|
     | 核心增速 | >20%月增长 | 连续2-3季度个位数 | 🔴/🟡/🟢 |
     | CAC趋势 | 稳定或下降 | 持续上升 | 🔴/🟡/🟢 |
     | 团队状态 | 高效执行 | 开始内卷，动作变形 | 🔴/🟡/🟢 |
     | 不用你的人群 | 少 | 在扩大 | 🔴/🟡/🟢 |
     | 新替代品出现 | 无 | 跨界竞品或技术变化 | 🔴/🟡/🟢 |
     - 切换判断: ≥3个🔴考虑进入升级期
     - 否则: 继续聚焦增长期飞轮优化
     - 监控频率: 每季度，白泽+计然(CEO+战略)负责
  2. 第二曲线探索方向:
     - 横向扩展: 从企业家社交到更广泛的B2B服务市场
     - 纵向深化: 从名片交换到交易撮合+履约保障
     - 技术升级: AI Agent自动匹配、区块链信任存证
  3. 升级期战略准备:
     - 组织准备: 是否需要新事业部/团队结构调整
     - 资源准备: 第二曲线需要的额外投入预算
     - 风险识别: 第一曲线被破坏的风险

data_format: "心智模型YAML"

mount_interface:
  load: "读取第二曲线数据到工作内存"
  query: "查询切换信号/查询第二曲线方向/查询升级期准备清单"
  version: "返回当前DataPack版本"

consumed_by_features:
  - "增长Feature做长期战略规划时消费此DataPack"
  - "场景Feature做产品路线图规划时消费此DataPack"

depends_on:
  - "DP-PD-链客宝-飞轮加速"
  - "DP-PD-链客宝-PMF验证"
version_history:
  - version: "1.0.0"
    date: "2026-06-08"
    change: "原子化拆解自原增长三周期文档包（KFD-07合规）"
