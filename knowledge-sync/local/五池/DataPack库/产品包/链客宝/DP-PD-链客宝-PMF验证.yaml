datapack_id: "DP-PD-链客宝-PMF验证"
name: "链客宝·PMF验证"
version: "1.0.0"
type: "产品包"
schema_version: "1.0"
created_at: "2026-06-08"
author: "白泽"

description: "链客宝产品-市场匹配(PMF)验证数据，包含PMF验证指标、用户调研数据、留存曲线分析和破局期信号监控"

source: "chainke-full/增长三周期/周期切换监控看板.md | chainke-full/增长三周期/放大前自检三条件.md"

contents: |
  【PMF验证数据】
  1. 破局期→增长期切换信号（来源: 周期切换监控看板.md）:
     | 信号指标 | 破局期特征 | 增长期特征 | 状态 |
     |:---------|:-----------|:-----------|:----:|
     | 用户主动推荐 | 极少 | NPS>30，推荐开始发生 | 🔴/🟡/🟢 |
     | 获客来源认知 | 模糊 | 清楚TOP3渠道+原因 | 🔴/🟡/🟢 |
     | 留存曲线 | 持续下降 | 开始变平，月流失<10% | 🔴/🟡/🟢 |
     | 核心用户数 | <100 | >200连续3周登录 | 🔴/🟡/🟢 |
     | 付费用户比例 | <5% | >15% | 🔴/🟡/🟢 |
     - 切换判断: ≥3个🟢进入增长期
     - 否则: 继续破局期聚焦PMF验证
  2. 放大前自检三条件（来源: 放大前自检三条件.md）:
     - 条件1: 用户主动推荐开始发生（NPS>30? 收到转介绍? 自然流量上升?）
     - 条件2: 知道用户从哪里来、为什么来（TOP3渠道? TOP3理由? 精确画像?）
     - 条件3: 留存曲线开始变平（次日>40%? 7日>20%? 30日月流失<10%?）
     - 三个条件全部通过→可以放大；任一不通过→停止放大
  3. PMF验证方法学: 每周监控频率(破局期)、乘黄(产品经理)负责

data_format: "心智模型YAML"

mount_interface:
  load: "读取PMF验证数据到工作内存"
  query: "查询切换信号状态/查询放大条件通过情况/查询PMF建议动作"
  version: "返回当前DataPack版本"

consumed_by_features:
  - "增长Feature做PMF评估时消费此DataPack"
  - "场景Feature做产品阶段判断时消费此DataPack"
  - "数据Feature做留存分析时消费此DataPack"

depends_on:
  - "DP-PD-链客宝-用户行为"
version_history:
  - version: "1.0.0"
    date: "2026-06-08"
    change: "原子化拆解自原增长三周期文档包（KFD-07合规）"
