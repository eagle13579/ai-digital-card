datapack_id: "DP-PD-链客宝-LTV_CAC模型"
name: "链客宝·LTV/CAC模型"
version: "1.0.0"
type: "产品包"
schema_version: "1.0"
created_at: "2026-06-08"
author: "白泽"

description: "链客宝用户生命周期价值(LTV)与获客成本(CAC)模型数据，包含指标定义、计算逻辑、当前快照和趋势分析"

source: "chainke-full/backend/app/routers/unit_economics.py"

contents: |
  【LTV/CAC模型数据】
  1. 指标定义（来源: unit_economics.py）:
     - CAC: 客户获取成本 = 总获客成本 / 新增客户数
     - LTV: 客户生命周期价值 = avg月收入 × 12个月 × 0.7(留存折损)
     - LTV/CAC比值: 核心健康指标
     - 回收周期: CAC / 平均月收入
  2. 当前快照(2026-06)（来源: unit_economics.py SNAPSHOTS）:
     - CAC: ¥14,400
     - LTV: ¥42,560
     - LTV/CAC比值: 2.96
     - 平均客户收入: ¥8,520
     - 毛利率: 72%
     - 回收周期: 6.2个月
     - 新增客户: 7
     - 流失客户: 1
     - 活跃客户总数: 48
  3. 健康评分模型（来源: unit_economics.py _calculate_health_score）:
     - LTV/CAC≥3.0 +25分, ≥2.0 +15分, ≥1.0 +5分, <1.0 -15分
     - 回收周期≤6个月 +15分, ≤12个月 +5分, >12个月 -10分
     - 毛利率≥70% +10分, ≥50% +5分, <50% -5分
     - 当前评分: 80分(优秀)
  4. 预警规则（来源: unit_economics.py _get_warnings）:
     - LTV/CAC < 2.0 警告
     - 回收周期 > 12个月 警告
     - 毛利率 < 50% 警告
  5. 建议策略（来源: unit_economics.py _get_recommendations）:
     - 提高客单价或增加交叉销售拉高LTV
     - 优化投放渠道降低CAC
     - 缩短付费周期，提供年付折扣

data_format: "结构化JSON"

mount_interface:
  load: "读取LTV/CAC模型数据到工作内存"
  query: "按月份查询单位经济快照/查询健康评分/查询预警和建议"
  version: "返回当前DataPack版本"

consumed_by_features:
  - "单位经济Feature做LTV/CAC追踪时消费此DataPack"
  - "增长Feature做增长健康分析时消费此DataPack"
  - "数据Feature做财务指标展示时消费此DataPack"

depends_on:
  - "DP-PD-链客宝-订单交易"
version_history:
  - version: "1.0.0"
    date: "2026-06-08"
    change: "原子化拆解自原单元经济数据包（KFD-07合规）"
