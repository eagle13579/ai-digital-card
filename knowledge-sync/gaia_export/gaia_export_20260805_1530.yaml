- id: 428
  type: insight
  title: Good-Better-Best 三阶定价框架
  content: |
    全球80% SaaS采用Free-Pro-Enterprise三阶定价。Free引流限制核心功能，Pro主推中等价位标记「最受欢迎」，Enterprise高价锚定价值上限。年付8折、14天免费试用为全球标准。
- id: 429
  type: insight
  title: 诱饵定价效应(Decoy Pricing)
  content: |
    在Pro和Enterprise之间插入一个功能比Pro少、价格比Pro高的「诱饵套餐」。无人购买但让Pro显得超值，预期Pro转化率提升30-50%。经典案例：《经济学人》订阅实验。
- id: 430
  type: insight
  title: AI产品定价溢价依据
  content: |
    拥有AI引擎的产品可以比传统SaaS定价高40-100%。依据：15个自研AI引擎 vs 竞品通常1-3个、功能评分8.2 vs 竞品平均6.5、边际成本趋近于零。对标LinkedIn Sales Navigator $119.99/月的AI溢价。
- id: 431
  type: insight
  title: 年付折扣策略
  content: |
    初始期设33%折扣（12月付8月价）快速培养年付习惯，6个月后评估调至20%（对标Linear/Notion标准）。年付用户LTV是月付的2.5-3倍，流失率降低40%。
- id: 432
  type: insight
  title: 免费版限制阈值设计
  content: |
    免费版必须设「无法绕过的天花板」推动付费转化。典型SaaS做法：限制用量（OCR 3→2次/月）、限制时间（永续→30天有效期）、限制功能（模板3→1种、去水印仅Pro）。阈值需要够痛但不过分。
- id: 433
  type: insight
  title: AI数字名片定价体系
  content: |
    最终定价方案：Free ¥0(收紧阈值)、Oracle ¥299/月(诱饵)、Pro ¥199/月(主推)、Enterprise ¥999/月(利润)、Enterprise Plus ¥1,999(至尊锚定+大客户起点)。年付33%折扣。预计ARPU从¥179提升至¥362-370，ARR增长48-83%。
- id: 434
  type: insight
  title: AiToEarn多平台策略适配器
  content: |
    Strategy+Registry模式统一14+社交平台，6种Provider接口(Auth/Publish/Analytics/Engagement/Work/Browse)。新增平台=新建NestJS模块+实现接口，核心无需改动。
