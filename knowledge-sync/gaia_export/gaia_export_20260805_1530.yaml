  content: |
    # 自建 CRM 战略分析报告 /  / > **AI数字名片 — 内置CRM vs 对接外部CRM 决策文档** / > 版本: v1.0 | 日期: 2026-07-01 /  / --- /  / ## 目录 /  / 1. [竞品分析](#1-竞品分析) / 2. [自建 vs 对接外部 CRM 的 ROI 计算](#2-roi-计算) / 3. [核心功能定义 (P0/P1/P2)](#3-核心功能定义) / 4. [与现有数据模型的复用率](#4-数据模型复用率) / 5. [技术架构决策](#5-技术架构决策) / 6. [商业化策略](#6-商业化策略) /  / --- /  / ## 1. 竞品分析 /  / ### 1.1 CamCard (名片全能王) /  / | 维度 | 评估 | / |------|------| / | CRM 能力 | ❌ 无内置CRM，仅名片扫描+联系人管理 | / | 联系人管理 | ⭐⭐⭐ OCR识别 → 通讯录，无销售管道 | / | 差异点 | 名片识别准确率高，但用完即走，无深度客户经营 | / | 价格 | 免费+Pro订阅，不涉及CRM付费 | /  / **结论**: CamCard 用户量最大但从未发展CRM，这是我们的机会窗口。 /  / ### 1.2 HiHello /  / | 维度 | 评估 | / |------|------| / | CRM 能力 | ❌ 数字名片+联系人分组，无销售阶段管理 | / | 联系人管理 | ⭐⭐⭐ 分组、标签、备注 | / | 差异点 | 设计精美，团队协作，但无Pipeline | / | 价格 | 免费+$5.99/月Pro，无CRM溢价 | /  / **结论**: HiHello 在名片设计上领先，但同样没有CRM功能。名片交换 → CRM的闭环未被打通。 /  / ### 1.3 Lusha /  / | 维度 | 评估 | / |------|------| / | CRM 能力 | ⭐⭐⭐⭐ B2B联系人数据库+ enrichment | / | 联系人管理 | ⭐⭐⭐⭐ 批量导出到Salesforce/HubSpot | / | 差异点 | 不自己管CRM，做数据提供商 | / | 价格 | $49/月起（数据订阅） | /  / **结论**: Lusha 走 enrichment 路线，不是我们的直接竞争对手，但证明"联系人数据=付费意愿"。 /  / ### 1.4 Salesforce / HubSpot /  / | 维度 | 评估 | / |------|------| / | CRM 能力 | ⭐⭐⭐⭐⭐ 行业标准 | / | 与名片场景 | ❌ 无名片交换场景，需手动录入 | / | 适合 | 中大型企业全流程
