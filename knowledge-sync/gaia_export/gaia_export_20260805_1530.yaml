  title: 国际化翻译平台集成方案
  content: |
    # 国际化翻译平台集成方案 /  / ## 当前状态 /  / - **支持语言**: 12种 (zh, en, ja, ko, es, fr, de, pt, ru, ar, th, vi) / - **前后端分离翻译**: /   - 后端: `backend/app/i18n.py` (44KB, ~130个翻译键, 12语言全量映射) /   - 前端: `frontend/src/i18n/` 下12个独立语言文件 (`.ts`), 每文件 ~75键 / - **覆盖情况**: 23/23 个 TSX 文件已接入 `t()` 函数 / - **翻译运行时**: React Context + `useT()` / `useLocale()` hooks; 后端通过 `get_translation()` 按请求头 `Accept-Language` 自动选取 /  / ## 痛点 /  / 1. **手动维护成本高**: 新增一个 key 需同步修改 12 个语言文件 / 2. **人工翻译不可靠**: 早期机器翻译存在术语不一致、语法错误 / 3. **缺乏审校流程**: 没有审批环节，翻译直接上线 / 4. **版本难以追踪**: 翻译变更与代码变更没有关联 /  / ## 推荐工具: Crowdin /  / Crowdin 是行业标准的大规模翻译管理平台，支持开发者工作流集成。 /  / ### 核心优势 /  / - **开发者友好**: GitHub / GitLab / Bitbucket 原生集成 / - **自动化同步**: 源语言文件变更自动触发翻译任务 / - **翻译记忆库**: 复用已翻译内容，降低重复成本 / - **术语库 (Glossary)**: 统一产品术语翻译 / - **截图标注**: 为每个 key 关联 UI 截图，上下文清晰 / - **机器翻译 + 人工校对**: AI 初翻 + 人工审校双通道 / - **免费层**: 1000 个翻译键以内免费 (当前项目 ~130 key，可免费使用) /  / ### 集成步骤 /  / 1. **注册 Crowdin 项目** /    - 前往 [crowdin.com](https://crowdin.com) 创建免费项目 /    - 项目名称: `AI-Digital-Business-Card` /  / 2. **上传源文件** /    - 源语言: 中文 (zh-CN) /    - 上传 `backend/app/i18n.py` 提取翻译键 /    - 上传 `frontend/src/i18n/zh.ts` 作为前端源文件 /    - 建议将前后端拆分为两个 Crowdin 文件，便于独立管理 /  / 3. **配置目标语言**
