    # AI 数智名片 · 宣传墙设计系统 v3.0 /  / > 设计系统版本: v3.0 · AI时尚版 / > 创建日期: 2026-07-05 / > 设计来源: Replicate × ElevenLabs × RunwayML 融合 / > 风格定位: AI-native Dark · 霓虹渐变 · 玻璃质感 /  / --- /  / ## 1. 设计理念 /  / 不再做"企业科技"风格（Stripe/Vercel那套），而是真正的AI原生审美： / - **暗色为画布** — 不是节省墨水，是让内容从黑暗中发光 / - **霓虹三重奏** — 青→紫→粉 三色渐变系统贯穿全场 / - **玻璃质感** — backdrop-filter blur 让卡片有深度和呼吸感 / - **扫描线/网格** — 数字化基底的可见质感 / - **发光文字** — 核心数据用gradient text + drop-shadow glow /  / --- /  / ## 2. 颜色系统 /  / ### 2.1 背景色板 /  / | Token | HEX | 角色 | / |:------|:----|:------| / | `--bg-deep` | `#0a0a18` | 最深的画布底色 | / | `--bg-mid` | `#0d0d24` | 中间过渡色 | / | `--bg-surface` | `rgba(255,255,255,0.02)` | 玻璃卡片基底 | / | `--bg-glass` | `rgba(255,255,255,0.03)` | 标准玻璃卡片 | / | `--bg-glass-hover` | `rgba(255,255,255,0.05)` | 悬停玻璃卡片 | / | `--bg-card-cyan` | `rgba(6,182,212,0.04)` | 青色调玻璃卡片 | / | `--bg-card-purple` | `rgba(139,92,246,0.06)` | 紫色调玻璃悬停 | /  / ### 2.2 霓虹渐变系统 /  / | Token | 渐变方向 | 色值 | / |:------|:---------|:------| / | `--gradient-primary` | 135deg | `#06b6d4` (Cyan) → `#8b5cf6` (Purple) | / | `--gradient-triple` | 135deg | `#06b6d4` → `#8b5cf6` → `#ec4899` | / | `--gradient-text` | 135deg | `#f4f4f5` → `#22d3ee` → `#c084fc` (白色→青→紫渐变文字) | / 
