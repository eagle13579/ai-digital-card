  title: AI数字名片 — 产品需求文档 (PRD)
  content: |
    # AI数字名片 — 产品需求文档 (PRD) /  / > 版本: v1.0 | 更新日期: 2026-07-08   / > 项目目录: `D:\AI数智名片`   / > 仓库: `https://github.com/eagle13579/ai-digital-card` /  / --- /  / ## 1. 产品定位 /  / **一句话定义**:   / AI数字名片是一套以"电子画册 + AI智能匹配 + 信任网络"为核心能力的商务人脉管理工具，帮助用户在微信生态内创建精美的数字名片/画册、自动匹配潜在客户/供应商/合作伙伴、并通过信任关系图谱沉淀人脉资产。 /  / **目标用户**: / - 中小企业主 / 创业者（找客户、找投资人） / - 销售 / BD 人员（找线索、拓客） / - 自由职业者 / 个体服务者（展示个人品牌） / - 采购 / 供应链人员（找供应商） /  / **核心差异**: / - ✅ 将"名片"从单页静态卡片升级为**多页电子画册**（翻页效果） / - ✅ 基于供需标签的**AI双向匹配引擎**（不只是搜，还主动推荐） / - ✅ **信任网络图谱**可视化（1度/2度人脉） / - ✅ 微信生态天然传播（小程序 + H5 + 海报） /  / --- /  / ## 2. 功能清单 /  / ### 2.1 P0 — 最简可用 (MVP) /  / #### 2.1.1 用户注册/登录 / | 项目 | 说明 | / |------|------| / | **输入** | 手机号 + 密码 (微信小程序: wx.login code) | / | **输出** | JWT token + 用户信息 | / | **验收标准** | 用户可注册、登录、获取自己的profile；小程序可静默登录打通 openid | / | **状态** | ✅ 已完成 (后端 auth_router、前端 login page) | /  / #### 2.1.2 电子画册创建与管理 / | 项目 | 说明 | / |------|------| / | **输入** | 姓名/公司/职位/手机/微信/简介 + 用途选择 (partner/client/investor/supplier) | / | **输出** | 多页画册 (Brochure + Pages)，支持封面/正文/图片/视频四种页面类型 | / | **验收标准** | 用户可创建、编辑、删除画册；每页可填内容；前端按用途提供模板推荐 | / | **状态** | ⚠️ 后端接口就绪 (brochure.py / BrochureService)，前端 CardEditorPage 已实现但API调用路径不统一 | /  / **后端 API 路由**
- id: 12
  type: insight
  title: RTL (Right-to-Left) 语言支持文档
  content: |
    # RTL (Right-to-Left) 语言支持文档 /  / ## 概述 /  / AI数字名片支持 RTL 语言布局，优先支持**阿拉伯语 (ar)**，同时涵盖希伯来语 (he)、波斯语 (fa)、乌尔都语 (ur)。 /  / 当用户切换到 RTL 语言时，整个 UI 自动翻转：文字从右向左排列，边距、内边距、flex 方向、圆角、绝对定位等均镜像反转。 /  / --- /  / ## 支持的 RTL 语言 /  / | 代码 | 语言 | 书写方向 | / |------|------|----------| / | ar   | العربية (阿拉伯语) | RTL | / | he   | עברית (希伯来语) | RTL | / | fa   | فارسی (波斯语) | RTL | / | ur   | اردو (乌尔都语) | RTL | /  / --- /  / ## 实现架构 /  / ### 1. 前端 — RTL 语言列表 /  / `frontend/src/i18n/index.tsx` 中定义： /  / ```ts / export const RTL_LANGS = ['ar', 'he', 'fa', 'ur']; / ``` /  / ### 2. 前端 — RTLProvider 组件 /  / `frontend/src/i18n/RTLProvider.tsx` — 独立 Provider，监听语言变化并设置 `document.documentElement.dir`： /  / ```tsx / import { RTLProvider } from './i18n/RTLProvider'; /  / // 在 App.tsx 中使用 / <RTLProvider> /   <Router>...</Router> / </RTLProvider> / ``` /  / 底层逻辑： / - RTL 语言 → `<html dir="rtl">` / - LTR 语言 → `<html dir="ltr">` /  / ### 3. 前端 — CSS Polyfill /  / `frontend/src/index.css` (行 322–450) 包含完整的 `[dir="rtl"]` CSS polyfill，自动处理： /  / | 属性 | 翻转规则 | / |------|----------| / | `text-left` / `text-right` | 互换 | / | `flex-row` | → `row-reverse` | / | `ml-*` / `mr-*` | 互换 | / | `pl-*` / `pr-*` | 互换 | / | `space-x-*`
