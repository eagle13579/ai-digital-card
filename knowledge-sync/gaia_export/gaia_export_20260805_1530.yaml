  content: |
    # 安全策略文档 /  / > **项目**: AI 数智名片 (AI Digital Business Card) / > **版本**: v1.0 / > **生效日期**: 2026-07-01 / > **适用范围**: 后端服务、AI 服务、前端应用、CI/CD 流水线 / > **文档状态**: 已批准 /  / --- /  / ## 目录 /  / 1. [密钥管理与轮换](#1-密钥管理与轮换) / 2. [速率限制分级策略](#2-速率限制分级策略) / 3. [内容安全策略 (CSP)](#3-内容安全策略-csp) / 4. [安全响应头](#4-安全响应头) / 5. [认证与授权](#5-认证与授权) / 6. [数据安全](#6-数据安全) / 7. [审计与监控](#7-审计与监控) / 8. [漏洞管理](#8-漏洞管理) / 9. [合规参考](#9-合规参考) /  / --- /  / ## 1. 密钥管理与轮换 /  / ### 1.1 密钥分类 /  / | 密钥名称 | 来源 | 用途 | 敏感等级 | / |----------|------|------|:--------:| / | `JWT_SECRET` | 环境变量 | JWT 令牌签名 (HS256) | 严重 | / | `DEEPSEEK_API_KEY` | 环境变量 | DeepSeek API 调用 | 高 | / | `EMBEDDING_API_KEY` | 环境变量 | OpenAI / DeepSeek Embedding API | 高 | / | `CHAINKE_AUTH_TOKEN` | 环境变量 | 链客宝 API 认证 | 高 | / | `WECHAT_MINI_SECRET` | 环境变量 | 微信小程序登录 | 严重 | / | `WECHAT_PAY_API_KEY` | 环境变量 | 微信支付 API V2 | 严重 | / | `WECHAT_PAY_V3_KEY` | 环境变量 | 微信支付 API V3 | 严重 | / | `ALIPAY_PRIVATE_KEY` | 环境变量 | 支付宝应用私钥 | 严重 | / | `SENTRY_DSN` | 环境变量 | Sentry 异常上报 | 中 | / | `SSO_*_CLIENT_SECRET` | 环境变量 | OAuth2 / OIDC 客户端密钥 | 高 | /  / ### 1.2 轮换策略 /  / | 密钥类型 | 轮换周期 | 触发条件 | 方法 | / |----------|:--------:|----------|------| / | `JWT_SECRET` | 90 天 | 安全事件、员工离职 | 双密钥发布: 新旧并存
- id: 14
  type: insight
  title: 服务等级协议 (SLA)
  content: |
    # 服务等级协议 (SLA) /  / > **项目**: AI 数智名片 (AI Digital Business Card) / > **版本**: v1.0 / > **生效日期**: 2026-07-01 / > **适用范围**: 后端 API 服务 (`backend`) 及 AI 服务 (`ai_service`) / > **SLA 等级**: **99.9%** (月度可用性) /  / --- /  / ## 1. 服务可用性承诺 /  / | 服务组件 | 月度可用性 | 年度可用性 | 允许停机时间（月度） | / |----------|------------|------------|---------------------| / | 后端 API (`:8201`) | >= 99.9% | >= 99.8% | <= 43.2 分钟 | / | AI 服务 (`:8202`)  | >= 99.5% | >= 99.0% | <= 3.6 小时 | / | 前端静态资源 (Nginx) | >= 99.9% | >= 99.8% | <= 43.2 分钟 | / | **整体平台** | **>= 99.9%** | **>= 99.8%** | **<= 43.2 分钟** | /  / ### 1.1 可用性计算公式 /  / ``` / 月度可用性 (%) = (总分钟数 - 不可用分钟数) / 总分钟数 x 100% /  / 其中: /   - 不可用分钟数 = 用户无法访问核心功能的总时长 /   - 排除计划内维护窗口（见第 6 节） / ``` /  / --- /  / ## 2. 响应时间承诺 /  / | 端点分类 | P50 (中位数) | P95 (百分位) | P99 (百分位) | / |----------|:------------:|:------------:|:------------:| / | **静态资源** (HTML/CSS/JS) | <= 100ms | <= 300ms | <= 500ms | / | **API -- 轻量查询** (名片读取、搜索) | <= 200ms | <= 500ms | <= 1s | / | **API -- 写入** (创建、更新名片) | <= 500ms | <= 1s | <= 3s | / | **API -- AI 流式** (RAG 对话) | 首字 <= 1s | 首字 <= 2s | 首字 <= 5s | / | **API -- 认证** (登录、注册) | <= 500ms | <= 1s | <= 2s | / | **文件上传** (<= 10MB) | <= 2s | <= 5s | <= 10s | / 
- id: 15
  type: insight
