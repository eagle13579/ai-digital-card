    # Web 表单捕获部署指南 /  / > AI数字名片 — 嵌入网站表单 → 自动创建 CRM 联系人 /  / --- /  / ## 1. 功能概述 /  / **Web 表单捕获**允许您创建网页表单，嵌入到您的网站中。访客填写表单后，系统自动在 CRM 中创建联系人，无需手动录入。 /  / ### 工作流程 /  / ``` / ┌─────────────────┐      ┌──────────────────────┐      ┌──────────────────┐ / │  管理员创建表单   │ ──→  │  获取嵌入代码放入网站  │ ──→  │  访客填写并提交   │ / │  POST /api/...  │      │  <script src="..." /> │      │  点击"提交"按钮   │ / └────────┬────────┘      └──────────────────────┘      └────────┬─────────┘ /          │                                                      │ /          ▼                                                      ▼ / ┌─────────────────┐                                    ┌──────────────────┐ / │  CRM 联系人创建   │ ←─────────────────────────────────│  API 处理提交     │ / │  自动添加标签     │                                    │  反垃圾检测       │ / │  记录活动时间线   │                                    │  Honeypot + 限流  │ / └─────────────────┘                                    └──────────────────┘ / ``` /  / ### 核心能力 /  / | 能力 | 说明 | / |------|------| / | **表单生成** | 可视化定义字段（姓名、手机、邮箱、公司、职位等） | / | **嵌入代码** | 自动生成 HTML/JS 嵌入脚本，粘贴到网站即可使用 | / | **自动创建联系人** | 提交自动写入 CRM，带来源标记 `web_form` | / | **防垃圾** | Honeypot 隐藏字段 + IP 速率限制（每小时10次） 
