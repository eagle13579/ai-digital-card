- id: 480
  type: insight
  title: AI数智名片三层AI管线架构
  content: |
    AI Gateway协议层(direct/cached/fallback)→智能路由层(A-B测试/Bandit/Thompson Sampling)→核心引擎层(RAG/推荐/图谱)→反馈闭环→盖娅进化大脑→数字员工军团。降级体系完善：DeepSeek→OpenAI→Anthropic→Ollama四级LLM降级，MLX→HF→sentence-transformers三级推理降级。
- id: 481
  type: insight
  title: AI数智名片盖娅进化飞轮
  content: |
    每30分钟自动运行的进化周期：知识聚合(复盘)→反馈消化(极端模式)→进化循环(计算新权重→更新向量索引→部署)→状态记录。自进化闭环让系统越用越准。
- id: 482
  type: insight
  title: AI数智名片推荐引擎三维融合
  content: |
    协同过滤(40%)+知识图谱关系(30%)+语义相似度向量搜索(30%)→多维度加权混合排序。在线学习每100条反馈自动调三维权重[0.5,1.5]，Thompson Sampling Beta分布采样优化候选排序。
- id: 483
  type: insight
  title: AI数智名片-HyDE检索增强完成
  content: |
    2026-07-05 补齐HyDE检索增强缺口。HyDEQueryTransformer类：先用DeepSeek生成假设文档(商务匹配专家提示词)，再用假设文档做向量搜索(0.4原query+0.6HyDE加权融合去重)。在RAGPipeline.query()中通过settings.USE_HYDE控制开关(默认开)。
- id: 484
  type: insight
  title: AI数智名片-深度推荐模型完成
  content: |
    2026-07-05 补齐深度推荐模型缺口。FeatureBasedScorer类：6维特征(标签匹配度/行业相似度/信任距离/共同访问数/标签重合数/活跃度)，sklearn LogisticRegression训练。集成到RecommendEngine作为第4维度(权重30%)，原三权重各降10%。新增ml_score字段。
- id: 485
  type: insight
  title: AI数智名片-自动ML模型部署管线完成
  content: |
    2026-07-05 补齐自动ML模型部署缺口。deploy/deploy_model.py CLI工具(支持promote/health子命令+auto/rollback模式)，三步验证(文件存在+模型加载测试+API健康检查)，通过后自动promote staging→production。model_registry.py新增health_check()和rollback()方法。GitHub Actions workflow。
- id: 486
  type: insight
  title: 观测驱动克隆流水线
  content: |
    先观测(侦察)→写spec→派builder并行构建→合并→QA，5阶段标准化流水线
- id: 487
  type: insight
  title: Spec文件作为合约模式
  content: |
