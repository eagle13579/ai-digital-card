- id: 470
  type: insight
  title: Task状态机生命周期
  content: |
    SUBMITTED->WORKING->COMPLETED/FAILED/CANCELED/REJECTED。INPUT_REQUIRED/AUTH_REQUIRED中断态。Polling/SSE/Push。
- id: 471
  type: insight
  title: Opaque Execution
  content: |
    Agent协作时不暴露内部状态/记忆/工具。基于声明能力+交换上下文协作，保护IP和安全。
- id: 472
  type: insight
  title: 异步优先设计
