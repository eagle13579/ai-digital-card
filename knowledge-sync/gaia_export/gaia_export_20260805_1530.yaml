  title: 链客宝小程序 — 通讯录导入功能 PRD
  content: |
    # 链客宝小程序 — 通讯录导入功能 PRD /  / > 蜂巢会日期: 2026-07-13 / > 参与者: 山膏(视觉设计) / ml_scientist(技术架构) / 文瑶鱼_投资分析师(产品+合规) / > 状态: 已归档 /  / --- /  / ## 一、背景与目标 /  / ### 用户痛点 /  / 1. **名片维护成本高** — 用户有1000+联系人但懒得逐个录入，AI名片空空如也 / 2. **联系人碎片化** — 微信好友、手机通讯录、名片夹各自独立，无法统一管理 / 3. **关系价值沉睡** — 信任关系链存在微信中，匹配引擎没有数据可训练 / 4. **AI名片冷启动** — 只有18个用户，匹配引擎无法发挥 /  / ### 一句话目标 /  / > **30秒内完成批量通讯录导入，自动生成AI名片并启动人脉匹配** /  / ### 关键指标 /  / | 指标 | 目标值 | 衡量方式 | / |:-----|:------|:---------| / | 导入完成率 | ≥65% | 完成导入用户/点击导入用户 | / | 人均导入联系人数 | ≥200 | 单次导入联系人数均值 | / | 导入用户7日留存 | ≥20% | 导入后7天内至少打开1次 | / | 新增训练数据量 | ≥5万条/月 | 匹配对增量 | /  / --- /  / ## 二、用户场景与用户故事 /  / ### 场景1: 新用户冷启动 /  / 王总注册链客宝后，看到"导入通讯录，发现谁在找你"入口。点击后授权微信读取通讯录，系统批量导入300个联系人并自动匹配，30秒后看到"有15位联系人已经注册了链客宝，3位和你有供需匹配"的结果。 /  / ### 场景2: 老用户增量更新 /  / 李总已导入200个联系人，3个月后通讯录增长了50个。打开小程序看到"你的通讯录有50个新朋友"的提示，一键导入增量。 /  / ### 场景3: 定向邀请与匹配 /  / 张总导入通讯录后，发现老客户赵总也在链客宝上，但两人标签不匹配。张总手动邀请赵总完善名片标签，系统重新计算匹配度。 /  / ### 用户故事 /  / | ID | 用户故事 | 优先级 | / |:---|:---------|:------:| / | US-01 | As a 用户, I want 一键从微信导入通讯录, So that 我不需要逐个录入名片 | **P0** | / | US-02 | As a 用户, I want 导入前预览联系人列表, So that 我可以选择导入哪些人 | **P0** | / | US-03 | As a 用户, I want 导入后看到匹配结果, So that 我知道谁和我是供需匹配 | **P0** | / | US
