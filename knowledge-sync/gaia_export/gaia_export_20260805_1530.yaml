  title: AI数字名片 Fuzzing测试规范
  content: |
    # AI数字名片 Fuzzing测试规范 /  / > 版本: 1.0 · 最后更新: 2026-07-01 /  / --- /  / ## 1. 概述 /  / Fuzzing测试（模糊测试）通过向系统注入随机、异常或极端的输入，验证 API 在非预期数据下不会崩溃（不返回 500），并返回合理的错误码。 /  / ### 1.1 目标 /  / - **健壮性验证**: 确保超长字符串、特殊字符、Unicode、SQL注入、XSS等不导致服务端崩溃 / - **安全边界**: 验证认证/授权体系不会被畸形输入绕过 / - **输入验证**: 确认每个端点对无效输入的拒绝是优雅的（400/422/401/404），而不是抛异常 /  / ### 1.2 Fuzzing vs 其他测试 /  / | 维度 | 单元测试 | 契约测试 | **Fuzzing测试** | / |------|---------|---------|-----------------| / | **输入** | 正常/边界值 | 正常 | **随机/极端/恶意** | / | **关注点** | 逻辑正确 | 协议一致性 | **防崩溃、防注入** | / | **输出验证** | 精确值 | 字段存在性 | **不返回500** | / | **运行频率** | 每次提交 | 每次提交 | 每次提交 + nightly | /  / --- /  / ## 2. Fuzzing策略 /  / ### 2.1 输入类型 /  / 所有 Fuzzing 测试使用以下输入类型生成变异 payload： /  / | # | 类型 | 示例 | / |---|------|------| / | 1 | **超长字符串** | 10KB~50KB 随机 ASCII | / | 2 | **特殊字符** | null字节(`\x00`), 控制字符(`\x01-\x1f`), shell转义(`'; rm -rf /;'`) | / | 3 | **Unicode/多字节** | CJK、Emoji (U+1F600+)、RTL、组合变音符号、零宽连接符 | / | 4 | **SQL注入** | `' OR '1'='1`, `'; DROP TABLE --` 等 10+ 种变体 | / | 5 | **XSS注入** | `<script>alert(1)</script>`, `<img src=x onerror=alert(1)>` 等 | / | 6 | **边界数值** | -1, 0, 2^31, 2^63-1, NaN, Infinity, 10^1000 | / | 7 | **空/缺失/null** | 空字符串 `""`, null 值, 删除关键字段 | /
