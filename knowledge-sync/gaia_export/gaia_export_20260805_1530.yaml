    微信小程序所有尺寸属性必须用rpx(相对单位)而非px。1rpx=屏幕宽度/750。px仅保留用于border/box-shadow/transform。全项目1597处px需批量替换为rpx。自定义导航栏必须设navigationStyle:custom+适配safe-area-inset-top防刘海屏遮挡。
- id: 475
  type: insight
