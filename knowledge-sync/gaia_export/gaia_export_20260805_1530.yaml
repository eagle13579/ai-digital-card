  content: |
    # AI数智名片 — 全自动版本开发协议 v2.0 /  / > 向海容签署 · 白泽自执行 / > 你只管说"改什么"，我自动完成：建分支→开发→推送→等你确认→合master /  / --- /  / ## 一、分支体系 /  / ``` / master  ← 生产环境 ← 你说"确认"我才合并 /   ↑ / releaseV1.0  ← 发布候选版本（当前版本） /   ↑ / develop  ← 大模块开发集成 /   ├── feature/XXX  ← 小模块/小修复（从 develop 开出，改完合并回 develop） /   └── feature/XXX / ``` /  / **规则：** / - `master` — 只进不出。**你说"确认"我才合并**，合并后打 tag / - `releaseV1.0` — 当前版本的发布分支，从 develop 分出，稳定后等确认上 master / - `develop` — 日常开发集成分支。所有 feature 最终合到这里 / - `feature/XXX` — 小模块/小修复，从 develop 开出，改完合回 develop /  / --- /  / ## 二、三档任务自动路由 /  / | 你说 | 我判断 | Git动作 | / |:-----|:-------|:--------| / | "修复XX" / "改个小bug" | 单文件<50行 | 建分支 `feature/fix-XX` → 改 → commit → push → 自动提PR合develop | / | "加个XX小功能" | 新文件或>50行 | 建分支 `feature/XX` → 改 → commit → push → 自动提PR合develop | / | "开发XX大功能" | 跨目录/多文件 | 建分支 `feature/XX` 或直接在 develop 上开发 → commit → push | /  / **你只需要说需求，我自动判断用哪个分支。** /  / --- /  / ## 三、commit 信息规范 /  / ``` / 类型: 简短中文描述 / ``` /  / | 类型 | 说明 | 示例 | / |:-----|:-----|:-----| / | `fix:` | 细节错误修复 | `fix: 名片编辑页头像加载失败` | / | `feat:` | 新增小模块/功能 | `feat: 创建资源平台模块` | / | `refactor:` | 重构代码 | `refactor: 抽离api请求层` | / | `style:` | 样式调整 | `style: 首页卡片圆角统一` | / | `docs:` | 文档修改 | `docs: 更新版本开发协议` 
