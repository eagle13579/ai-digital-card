- id: 8
  type: insight
  title: AI数字名片 — API 设计规范
  content: |
    # AI数字名片 — API 设计规范 /  / > 版本: v1.0   / > 最后更新: 2026-07-01   / > 适用于: 所有 `/api/v1/` 路由 /  / --- /  / ## 1. URL 命名规则 /  / ### 1.1 基本格式 /  / ``` / /api/v1/{resource} / /api/v1/{resource}/{id} / /api/v1/{resource}/{id}/{sub-resource} / ``` /  / - **全小写**: 所有路径段使用小写英文字母。 / - **中划线连接**: 多词资源使用中划线（`-`）而非下划线（`_`）或驼峰。 / - **名词复数**: 资源名使用复数形式。 /  / | ✅ 正确 | ❌ 错误 | / |---------|---------| / | `/api/v1/brochures` | `/api/v1/brochure` | / | `/api/v1/ai-assist` | `/api/v1/ai_assist` | / | `/api/v1/users/{id}/visitor-logs` | `/api/v1/users/{id}/visitorLogs` | /  / ### 1.2 版本控制 /  / - 版本号嵌入 URL 路径：`/api/v1/`、`/api/v2/`。 / - 响应的 `Content-Type` 中**不包含**版本信息。 / - 兼容性说明见第 5 节（Deprecation 策略）。 /  / ### 1.3 查询参数 /  / - 使用 `camelCase`（小驼峰）命名查询参数，与 JSON 响应字段保持一致。 / - 布尔参数使用 `true`/`false`（小写），禁止 `1`/`0` 或 `yes`/`no`。 /  / ``` / GET /api/v1/brochures?pageSize=20&hasVideo=true / ``` /  / --- /  / ## 2. OperationId 命名规范 /  / OperationId 是 OpenAPI 规范中每个端点的唯一标识符，用于生成 SDK 客户端方法名。 /  / ### 2.1 格式 /  / ``` / {action}{Resource} / ``` /  / - **{action}**: 小驼峰动词前缀（`list`、`get`、`create`、`update`、`delete`、`batchCreate` 等） / - **{Resource}**: 资源名首字母大写（PascalCase） /  / | HTTP 方法 | 路径 | operationId | / |-----------|----
