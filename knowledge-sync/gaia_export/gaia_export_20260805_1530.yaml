  content: |
    # 自动翻译管道 — Auto Translation Pipeline /  / ## 概述 /  / 自动翻译管道是 AI数字名片 的智能化翻译维护工具，支持： /  / - **后端翻译**: 自动更新 `backend/app/i18n.py` 中的 `TRANSLATIONS` 多语言字典 / - **前端翻译**: 自动更新 `frontend/src/i18n/` 下的 `.ts` 语言文件 / - **增量更新**: 只翻译缺失的 key，保留已有的人工翻译 / - **多引擎支持**: DeepSeek / 百度翻译 / 有道翻译 /  / ## 快速开始 /  / ### 1. 设置 API Key /  / 根据选择的翻译引擎，在环境变量中配置 API 凭证。 /  / ```bash / # DeepSeek（推荐，默认） / export DEEPSEEK_API_KEY='your-deepseek-api-key' /  / # 百度翻译 / export BAIDU_APP_ID='your-baidu-app-id' / export BAIDU_APP_KEY='your-baidu-app-key' /  / # 有道翻译 / export YOUDAO_APP_KEY='your-youdao-app-key' / export YOUDAO_APP_SECRET='your-youdao-app-secret' / ``` /  / > **Windows PowerShell:** / > ```powershell / > $env:DEEPSEEK_API_KEY='your-deepseek-api-key' / > ``` /  / ### 2. 运行翻译 /  / ```bash / # 后端翻译（默认模式） / python backend/scripts/auto_translate.py /  / # 前端翻译 / python backend/scripts/auto_translate.py --mode frontend /  / # 指定目标语言 / python backend/scripts/auto_translate.py --langs en,ja,ko /  / # 使用百度翻译 / python backend/scripts/auto_translate.py --engine baidu /  / # 预览模式（不写入文件） / python backend/scripts/auto_translate.py --dry-run /  / # 强制重新翻译所有 key（不保留已有翻译） / python backend/scripts/auto_translate.py -
