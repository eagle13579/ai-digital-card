  title: 渗透测试模板
  content: |
    # 渗透测试模板 /  / ## 1. 测试范围 /  / ### 1.1 API 端点 / | 模块 | 端点 | 方法 | / |------|------|------| / | 认证 | `/api/v1/auth/*` | POST/GET | / | 用户 | `/api/v1/user/*` | GET/PUT/DELETE | / | 名片 | `/api/v1/brochure/*` | CRUD | / | GraphQL | `/graphql` | POST | / | 公开 API | `/api/v1/public/*` | GET | / | Webhook | `/api/v1/webhooks/*` | POST/PUT | /  / ### 1.2 Web 应用 / - 前端 SPA (React/Vue) / - SSR 渲染页面（SEO） / - 静态资产（CDN + S3） /  / ### 1.3 基础设施 / - 反向代理 / 负载均衡 / - 数据库（只读访问测试） / - Redis 缓存 / - 对象存储（桶权限） /  / ## 2. 方法论：OWASP Top 10 (2021) /  / | 编号 | 漏洞类别 | 测试用例示例 | 期望结果 | / |------|----------|--------------|----------| / | A01 | 失效的访问控制 | 越权访问其他用户数据 | 返回 403 | / | A02 | 加密失效 | TLS 降级攻击 | 拒绝连接 | / | A03 | 注入 | SQL/NoSQL/OS注入 | 参数化查询防御 | / | A04 | 不安全的设计 | 密码重置 Token 可预测 | Token 随机性验证 | / | A05 | 安全配置错误 | 默认凭据/目录遍历 | 无默认凭据 | / | A06 | 易受攻击的组件 | 已知 CVE 版本扫描 | 依赖项无已知漏洞 | / | A07 | 认证和会话管理失败 | JWT 签名绕过 | 验证签名算法 | / | A08 | 软件和数据完整性失效 | CI/CD 供应链攻击 | 签名校验 | / | A09 | 安全日志和监控失效 | 审计日志绕过 | 强制日志记录 | / | A10 | SSRF | 内网地址探测 | URL 白名单过滤 | /  / ## 3. 测试工具 /  / | 工具 | 用途 | 阶段 | / |------|------|------| / | Burp Suite Pro | Web 流量拦截 + 重放 | 手动测试 | / | OWASP ZAP | 自动化爬取 + 主动扫描 | 自动化 | / | Nuclei | 模板化漏洞扫描 | 快速验证 | 
- id: 45
  type: insight
  title: 安全控制清单
  content: |
    # 安全控制清单 /  / ## 1. 访问控制 /  / ### 1.1 基于角色的访问控制 (RBAC) / - **实现文件：** `app/middleware/rbac.py`, `app/models/rbac.py` / - **角色体系：** `admin`, `editor`, `viewer`, `api` / - **权限粒度：** 按资源类型 + 操作 (create/read/update/delete) / - **验证方式：** 每次请求通过中间件拦截验证 /  / ### 1.2 API Key 认证 / - **实现文件：** `app/middleware/api_key.py` / - **密钥格式：** 32 字节随机字符串 + 前缀 `dc_` / - **存储方式：** bcrypt 哈希存储，原始值仅创建时返回 / - **速率限制：** 每密钥每小时最多 1000 次请求 /  / ### 1.3 JWT 用户认证 / - **实现文件：** `app/routers/auth.py` / - **Token 类型：** Bearer JWT (HS256) / - **过期时间：** 24 小时（Access Token） / - **Refresh Token：** 支持静默续期 /  / ## 2. 加密 /  / ### 2.1 传输加密 (TLS) / - **协议：** TLS 1.2 / 1.3 / - **配置：** 反向代理层 (Nginx / Cloudflare) / - **HSTS：** `max-age=31536000; includeSubDomains` / - **证书管理：** Let's Encrypt / 自动化续期 /  / ### 2.2 静态加密 / - **数据库：** 全量磁盘级加密 (LUKS / AWS RDS 加密) / - **备份文件：** AES-256-GCM 加密存储 / - **敏感字段：** 密码使用 bcrypt 哈希存储 / - **密钥管理：** 环境变量注入，生产环境通过密钥管理服务 (KMS) /  / ## 3. 监控与可观测性 /  / ### 3.1 OpenTelemetry 分布式追踪 / - **实现文件：** `app/middleware/otel.py` / - **采样策略：** 生产环境 10% 采样率，错误链路 100% / - **导出目标：** OTLP 兼容后端 (如 Grafana Tempo) /  / ### 3.2 Grafana + SLO 监控 / - **实现文件：** `app/slo_tracker.py` / - **监控指标：** /   - API 响应时间 p50 < 200
