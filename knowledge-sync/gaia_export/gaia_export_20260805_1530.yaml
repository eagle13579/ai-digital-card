- id: 18
  type: insight
  title: AI数智名片 — 工业化 Git 工作流
  content: |
    # AI数智名片 — 工业化 Git 工作流 /  / ## 概述 /  / 本项目采用 **自动化 + 可控** 的 Git 工作流，降低日常开发的心智负担，同时确保关键分支（master）的 push 操作保持手动控制。 /  / --- /  / ## 1. 自动推送 (post-commit hook) /  / **位置**: `.git/hooks/post-commit` /  / **工作机制**：每次执行 `git commit` 后，git 自动运行该 hook，判断当前分支后决定是否 push。 /  / ### 自动推送的分支 /  / | 分支模式 | 行为 | / |---------|------| / | `develop` | ✅ 自动 push | / | `feature/*` | ✅ 自动 push | / | `fix/*` | ✅ 自动 push | / | `master` / `main` | ❌ 不推送（必须手动） | / | 其他分支 | ❌ 不推送 | /  / ### 为什么不自动推送 master /  / - master 是生产/发布分支，push 操作应当有意识地进行 / - 防止未经 review 的代码直接推送到 master / - 建议流程：feature → develop → (PR) → master /  / ### 测试方法 /  / ```bash / # 1. 在 develop 分支做空提交测试 / git commit --allow-empty -m "test hook" /  / # 2. 观察输出，应看到类似： / #   [post-commit] Auto-pushing branch: develop / #   To github.com:eagle13579/ai-digital-card.git / #   1234567..abcdef  develop -> develop /  / # 3. 回退测试提交 / git revert HEAD --no-edit / # 注意：revert 会触发 post-commit hook 再次推送 revert commit / ``` /  / --- /  / ## 2. 定时自动保存 (cron) /  / **脚本位置**: `scripts/git-auto-save.py` / **cron 注册名**: `ai-digital-card-git-auto-save` / **执行频率**: 每 60 分钟 / **执行方式**: no-agent（直接执行脚本，不经过 LLM） /  / ### 工作流程 /  / ``` / 每隔 60 分钟 ─→ git-auto-save.py / 
