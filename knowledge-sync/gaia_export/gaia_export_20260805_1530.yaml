- id: 95
  type: insight
  title: Interpretable Adaptive Sampling for LLM Test-Time Scaling
  content: |
    [论文摘要] Test-time scaling improves LLM reasoning by generating and aggregating multiple candidate answers, yet many pipelines use fixed per-query budgets that spend the same compute on easy and difficult prompts. These fixed budgets are also difficult to inspect because they do not explain why a given prompt receives a particular number of samples. We propose adaptive} test-time scaling with a lightweight fuzzy controller that maps interpretable signals, including estimated prompt complexity and model confidence, to a per-query sampling budget. The controller assigns fewer samples to easier or more confident prompts and more samples to harder or less certain prompts, making inference-time compute inspectable rather than fixed or opaque. We evaluate under a fair-alignment protocol with matched decoding settings and controlled answer selection, and compare against best-of-$N$, compute-aware scaling, and self-certainty-based baselines on question-answering and mathematical reasoning tasks. Across models and datasets, adaptive fuzzy control improves over several standard baselines and remains close to a selector-matched full-budget control while reducing the average number of samples. T
- id: 96
  type: insight
  title: A game theory for foundation models shows new paths to rational cooperation through similarity inference
  content: |
    [论文摘要] As autonomous agents powered by foundation models are increasingly integrated into social and economic systems, understanding the principles governing their collective behavior is essential for ensuring safety and cooperation. Classical game theory, the dominant framework for modeling rational interaction, is built upon the assumption of `decoupled agency,' where agents treat their own decision-making as independent of the environment and other actors. Modern AI agents, however, jointly predict their own future actions alongside external observations. Here, we report a striking finding: when interacting in stylized social dilemmas, foundation model agents engaging in optimal planning consistently converge to stable cooperation, directly contradicting classical game-theoretic predictions of mutual defection. To understand this phenomenon, we introduce the `embedded Bayesian agent,' a theoretical model for foundation model agents. By shifting from decoupled to embedded agency, these agents model themselves as part of the universe they inhabit, maintaining epistemic uncertainty about their own decision-making algorithms. We show that by inferring whether others are behaviorally
- id: 97
  type: insight
  title: TACT: Taxonomy-Aligned Post-Training for Pedagogically Adaptive English Tutoring
  content: |
    [论文摘要] Large language models (LLMs) are increasingly used to provide conversational practice for English-as-a-second-language (ESL) learners. Effective ESL tutoring, however, requires more than fluent response generation: a tutor must select an appropriate pedagogical action based on learner behavior and dialogue context. Human-tutoring research offers principles for adaptive support, but they are often task-specific and remain insufficiently integrated into LLM-based ESL tutor training and evaluation. We present TACT (Taxonomy-Aligned Conversational Tutor), a human-grounded framework for post-training and evaluating pedagogically adaptive ESL tutors. Drawing on established literature, we develop two complementary taxonomies: the Tutor-Strategy Taxonomy with 13 tutor response strategies and the Student-Move Taxonomy characterizing learner behavior by move type and status. Using these taxonomies, we construct TACTCorpus, which enriches 260 authentic teacher-student conversations with 32,379 annotations and quality-controlled augmented training data. We then post-train Qwen3.5-4B through supervised fine-tuning followed by taxonomy-aligned Group Relative Policy Optimization, producing
- id: 98
  type: pattern
  title: 盖娅大脑知识反哺闭环建设完成
  content: |
    背景: 盖娅大脑gaia_knowledge知识库长期为0条, 原因是反哺管道全部硬编码本地Windows路径(D:/AI数智名片, C:/Python314), 服务器cron从不执行, 且get_db依赖只rollback不commit导致写入丢失。方案: 1) 修复ingest_knowledge/ingest_feedback端点缺commit问题; 2) 开发服务器版反哺管道gaia_backfeed.py(扫描五池Feature库/项目docs/analysis, 幂等去重, CSRF处理); 3) 开发自主学习采集器gaia_self_study.py(GitHub trending + arXiv论文 + 本地增量); 4) 开发工作反哺工具gaia_reflect.py(成员任务后一键沉淀); 5) 注册Hermes cron调度(飞轮每小时+自主学习每日凌晨3点)。效果: gaia_knowledge从0条增长到96条, 进化循环+训练管线+权重部署全部completed, vector_index_size=96。教训: 服务器版管道必须独立于本地路径, get_db不会自动commit需显式调用, 学习素材要过滤短元数据快照(如cortex-snapshot 135字节)。
- id: 412
