    # A/B 定价实验 (A/B Pricing Experiment) /  / > **项目**: AI 数智名片 (AI Digital Business Card) / > **版本**: v1.0 / > **生效日期**: 2026-07-02 / > **维护**: Product / Growth Team /  / --- /  / ## 概述 /  / A/B 定价实验用于在标准版（¥99/月）定价基础上测试新的定价策略。通过 50:50 流量分配，对比两组用户的转化率和收入数据，帮助团队做出数据驱动的定价决策。 /  / ### 当前实验 /  / | 项目 | 内容 | / |------|------| / | **实验名称** | `standard_v2_2026Q3` | / | **对照组** | ¥99/月 (当前定价) | / | **实验组** | ¥79/月 (新定价策略) | / | **流量分配** | 50:50 | / | **状态** | 草稿 (需手动启动) | /  / --- /  / ## 实验设计 /  / ### 实验假设 /  / **H1 (零假设)**: 将标准版定价从 ¥99/月降至 ¥79/月，转化率无显著变化。 / **H1 (备择假设)**: 将标准版定价从 ¥99/月降至 ¥79/月，转化率有显著提升。 /  / ### 流量分配机制 /  / - 新用户通过 `assign_user_to_variant()` 函数分配 / - 基于 `(experiment_name, user_id)` 的哈希值实现**确定性分配** / - 同一用户始终进入同一实验组 / - 默认 split: 50% control, 50% variant /  / ### 指标追踪 /  / | 指标 | 说明 | / |------|------| / | **曝光数 (Exposure)** | 用户被分配到实验组的次数 | / | **转化数 (Conversion)** | 用户完成购买/升级的次数 | / | **转化率 (Conversion Rate)** | 转化数 / 曝光数 × 100% | / | **收入 (Revenue)** | 各组产生的总收入 (分) | / | **每用户平均收入 (ARPU)** | 收入 / 曝光数 | /  / --- /  / ## API 接口 /  / ### 启动实验 /  / **POST** `/api/subscription/ab-test/start` /  / 启动 A/B 定价实验（将草稿状态切换为运行中）。 /  / **请求示例** (无需 body): /  / ```json / {} / ``` /  / **响
