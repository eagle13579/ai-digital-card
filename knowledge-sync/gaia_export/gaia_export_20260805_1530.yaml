- id: 506
  type: insight
  title: 中国软银每日分析运行态
  content: |
    中国软银投资系统已从文档级进化为运行态代码。核心: 21模式识别信号+四层决策仪表盘+GitHub Actions每日自动分析
- id: 507
  type: insight
  title: 21模式识别信号系统
  content: |
    21个信号: 板块效应/涨停动量/量价趋势/均线趋势/筹码集中度/资金流向/市值位置/相对强度/动量震荡/突破形态/换手率/基本面/行业地位/新闻情绪/催化事件/机构动向/龙虎榜/逼空/股息/波动率/综合
- id: 508
  type: insight
  title: Playwright+httpx双通道爬虫架构
  content: |
    双通道分离架构：浏览器通道（Playwright）专职处理登录认证、滑块验证、签名生成等需要浏览器环境的高复杂度操作；httpx通道（高性能异步HTTP客户端）专职处理数据拉取、批量请求等纯数据采集任务。浏览器不参与数据采集，最大化利用浏览器做登录和签名，httpx做高性能数据拉取。核心优势：浏览器资源消耗高但仅用于关键操作，95%+的数据流量通过httpx通道完成，实现资源效率和反检测能力的兼顾。
- id: 509
  type: insight
  title: 可插拔多平台爬虫工厂模式
  content: |
    统一AbstractCrawler抽象基类定义爬虫生命周期（init→login→send_request→crawl→run），每个平台（小红书/抖音/微博/B站/贴吧/GitHub等）各自实现子类。工厂类CrawlerFactory通过平台名称注册和查找具体爬虫实现，新增平台只需新建子类+注册工厂，核心调度逻辑零改动。典型注册方式：CrawlerFactory.register('xhs', XiaoHongShuCrawler)。实现平台无关调度，支持多平台并行或串行采集。
- id: 510
  type: insight
  title: 代理IP池多供应商轮换
  content: |
    ProxyProvider抽象层统一代理供应商接口，IpCache实现代理IP的缓存和有效性验证，ProxyRefreshMixin mixin类为爬虫提供自动代理刷新能力。架构支持同时接入多家代理供应商（如快代理/芝麻代理/星空代理等），按权重或轮询策略分配代理IP。自动检测代理失效、超时踢出、按需补充新IP。支持的代理协议：HTTP/HTTPS/Socks5。关键设计：代理IP按匿名等级分级，高匿名IP优先用于高风险操作。
- id: 511
  type: insight
  title: CDP浏览器反检测
  content: |
    使用Playwright启动真实Chrome浏览器实例（非无头模式），配合stealth.min.js注入实现4层反检测防护：1) WebDriver属性隐藏——移除navigator.webdriver特征；2) 浏览器指纹伪造——修改canvas/WebGL/audio指纹使平台无法识别自动化工具；3) 用户代理和环境一致性——模拟真实用户浏览器环境参数（分辨率/时区/语言/字体等）；4) 行为模拟——随机鼠标轨迹、自然滚动、人工间隔等。四层叠加使平台JS检测脚本无法区分自动化与真实用户。
- id: 512
  type: insight
  title: 签名方案隔离封装
  content: |
    每个平台的签名算法独立封装在各自help.py模块中，核心策略包括：1) Playwright JS注入——在浏览器上下文中执行JavaScript生成签名（如小红书X-s/X-t签名、抖音X-Bogus签名）；2) WBI签名——微博WBI签名算法，通过页面JS逆向获取加密逻辑后移植到Python实现；3) GraphQL签名——B站GraphQL接口的签名方案，使用mixin签名+请求头组合验证。各平台签名完全隔离，互不影响，新增平台签名方案只需新增help.py文件。
- id: 513
  type: insight
  title: 无API纯浏览器渲染采集
  content: |
    针对贴吧等反爬极强的平台，采用零API方案：完全不调用任何HTTP接口，纯浏览器渲染采集。Playwright启动真实Chrome加载完整页面，通过DOM解析提取数据。关键技术：1) 页面完全加载后解析HTML DOM树提取帖子/回复内容；2) 模拟用户滚动触发懒加载获取更多数据；3) 使用CSS选择器/XPath定位目标元素；4) 应对反爬——随机延时、真实鼠标操作（点击/滚动）。优势：完全绕过签名验证，平台无法在传输层检测爬虫。
