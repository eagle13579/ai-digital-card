    # 性能预算门禁 — AI数智名片 /  / | 状态 | 最后更新 | / |------|----------| / | ✅ 已生效 | 2026-07-01 | /  / > **本文件定义 AI 数智名片前端的性能预算指标、当前基线、超预算处理流程。** / > 所有指标由 Lighthouse CI 在 CI 流水线中自动审核（参见 `.github/workflows/performance.yml`）。 /  / --- /  / ## 1. 性能指标定义 /  / ### 1.1 Core Web Vitals（核心网页指标） /  / | 指标 | 全称 | 含义 | 良好 | 待改善 | 差 | / |------|------|------|------|--------|----| / | **FCP** | First Contentful Paint | 首屏首次内容绘制时间 | ≤1.8s | ≤3.0s | >3.0s | / | **LCP** | Largest Contentful Paint | 最大内容绘制时间 | ≤2.5s | ≤4.0s | >4.0s | / | **TBT** | Total Blocking Time | 总阻塞时间（主线程） | ≤200ms | ≤600ms | >600ms | / | **CLS** | Cumulative Layout Shift | 累积布局偏移 | ≤0.1 | ≤0.25 | >0.25 | / | **SI** | Speed Index | 速度指数（内容可见速度） | ≤3.4s | ≤5.8s | >5.8s | / | **FID / TTI** | First Input Delay / Time to Interactive | 首次输入延迟 / 可交互时间 | ≤100ms / ≤3.8s | — | — | /  / ### 1.2 详细说明 /  / #### FCP — First Contentful Paint / 浏览器首次渲染任何文本、图片、SVG 或非白色 `<canvas>` 的时间点。 /  / **优化方向**: / - 减少首屏 CSS/JS 阻塞 / - 启用字体预加载 `<link rel="preload">` / - 使用 HTTP/2 Server Push 或 103 Early Hints / - 最小化关键渲染路径长度 /  / #### LCP — Largest Contentful Paint / 视口内最大可见元素（图片、视频、背景图、文本块）的渲染时间。 /  / **优化方向**: / - 优化图片加载（压缩、WebP/AVIF、懒加载除外） / - 移除大型渲染阻塞资源 / - 优化服务
