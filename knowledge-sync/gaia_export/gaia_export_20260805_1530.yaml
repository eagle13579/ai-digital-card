- id: 448
  type: insight
  title: 自动Cookie同步到三方工具模式
  content: |
    Twitter Cookie不仅存config.yaml，还自动同步到bird CLI(credentials.env)和xfetch(session.json)。配置一次处处可用，各工具认证状态保持一致。
- id: 449
