  title: AI数字名片 契约测试规范
  content: |
    # AI数字名片 契约测试规范 /  / > 版本: 1.0 · 最后更新: 2026-07-01 /  / --- /  / ## 1. 概述 /  / 契约测试 (Contract Testing) 确保 **服务提供方 (Provider)** 与 **服务消费方 (Consumer)** 之间的 API 交互协议始终一致。   / 本规范定义了 AI数字名片 项目的契约测试体系，所有新 API 端点必须附带对应的契约测试。 /  / --- /  / ## 2. 三种测试的职责边界 /  / | 维度 | 单元测试 (Unit) | 契约测试 (Contract) | 集成测试 (Integration) | / |------|----------------|---------------------|----------------------| / | **范围** | 单个函数/方法 | 两个系统之间的 API 接口 | 跨多个真实组件的流程 | / | **关注点** | 业务逻辑正确性 | 请求/响应格式一致性 | 端到端功能完整性 | / | **外部依赖** | Mock / Stub | 真实 HTTP 请求 (或 ASGI Transport) | 真实数据库 / 第三方服务 | / | **运行速度** | 毫秒级 | 亚秒级 | 秒~分钟级 | / | **失败含义** | 逻辑 bug | 协议不兼容 | 组件配合断裂 | / | **触发时机** | 每次提交 | 每次提交 + PR | 合并前 / 定时 | /  / ### 2.1 原则 /  / - **契约测试不是集成测试的替代品**，两者互补。 / - **契约测试定位在单元测试与集成测试之间**：比单元测试更贴近真实 HTTP 层，但比集成测试更轻量、更聚焦。 / - **契约测试只验证"格式"，不验证"业务结果"**。 /  / --- /  / ## 3. 推荐框架: Pact (消费者驱动契约) /  / > 当前阶段使用 `pytest + httpx` (ASGITransport) 实现 HTTP 级契约检查，未来可迁移到 [Pact Python](https://pact.readthedocs.io/) 实现消费者驱动契约。 /  / ### 3.1 httpx (当前) vs Pact (未来) /  / | 特性 | httpx (当前) | Pact (未来) | / |------|-------------|-------------| / | 学习成本 | 低 (复用已有工具栈) | 中 (需学习 Pact DSL) | / | 协议强校验 | 手动断言 | 自动匹配 | / | 消费者驱动 | ❌ | ✅ | / | Broke
