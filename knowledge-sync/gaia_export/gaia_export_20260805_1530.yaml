  content: |
    # 结构化日志规范 (Structured Logging Standards) /  / > **项目**: AI 数智名片 (AI Digital Business Card) / > **版本**: v1.0 / > **生效日期**: 2026-07-01 / > **适用范围**: 后端 API 服务 (`backend/app`)、AI 服务 (`ai_service`) / > **维护人**: 运维团队 /  / --- /  / ## 目录 /  / 1. [日志级别定义](#1-日志级别定义) / 2. [日志字段 Schema](#2-日志字段-schema) / 3. [日志分类与 Logger 命名](#3-日志分类与-logger-命名) / 4. [敏感数据脱敏规则](#4-敏感数据脱敏规则) / 5. [生产日志配置](#5-生产日志配置) / 6. [日志采集与传输](#6-日志采集与传输) / 7. [审计日志规范](#7-审计日志规范) / 8. [常见场景示例](#8-常见场景示例) / 9. [修订历史](#9-修订历史) /  / --- /  / ## 1. 日志级别定义 /  / ### 1.1 级别总览 /  / | 级别 | 数值 | 颜色 | 含义 | 典型场景 | / |------|------|------|------|----------| / | **DEBUG** | 10 | 灰色 | 调试信息，仅开发/测试环境 | SQL 语句、变量值、函数入参 | / | **INFO** | 20 | 绿色 | 正常业务事件，生产默认级别 | 请求完成、用户注册、名片创建 | / | **WARNING** | 30 | 黄色 | 非异常但需关注的情况 | 缓慢查询(>500ms)、降级策略触发、重试 | / | **ERROR** | 40 | 红色 | 功能异常但服务可继续运行 | DB 连接失败、第三方 API 错误、业务异常 | / | **CRITICAL** | 50 | 深红 | 严重故障，需立即人工介入 | 应用启动失败、数据完整性损坏 | /  / ### 1.2 使用原则 /  / ``` / DEBUG → 开发人员调试用，禁止在生产环境频繁输出 / INFO  → 业务关键路径（请求进/出、状态变更、数据增删改） / WARNING → 潜在风险（重试、降级、限流触发、慢查询>500ms） / ERROR → 确定异常但可恢复（第三方超时、数据库连接池耗尽） / CRITICAL → 应用级崩溃（初始化失败、配置错误、panic） / ``` /  / ### 1.3 禁止事项 /  / - ❌ 禁止在 `ERROR` 级别记录业务预期内的"正常异常"（如 401 认证失败用
