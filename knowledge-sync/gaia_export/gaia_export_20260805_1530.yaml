    # AI数字名片 — AI能力注入 P0 PRD /  / > **蜂巢会议共识输出: 乘黄产品规划 × 烛龙技术评估** / > 版本: v1.0 | 日期: 2026-07-05 | 状态: 待开发 / > 分支: `develop` → `feature/today-p0` → `develop` /  / --- /  / ## 目录 /  / 1. [背景与目标](#1-背景与目标) / 2. [优先级定义 (P0/P1/P2/P3)](#2-优先级定义) / 3. [P0 范围详述](#3-p0-范围详述) / 4. [风险登记册](#4-风险登记册) / 5. [技术方案](#5-技术方案) / 6. [模块依赖关系](#6-模块依赖关系) / 7. [开发计划与里程碑](#7-开发计划与里程碑) / 8. [验收标准](#8-验收标准) / 9. [开发纪律](#9-开发纪律) /  / --- /  / ## 1. 背景与目标 /  / ### 1.1 背景 /  / AI数字名片项目已完成后端20+ AI模块的开发（WritingAssistant / RAG / 向量搜索 / 知识图谱等），但前端小程序与后端AI能力之间存在**严重的断连**： /  / - 前端 `api.js` 调用 `/api/ai/write` 和 `/api/ai/generate`——但后端实际路由为 `/api/ai/assist/write` / - `ai/` 目录下所有JS文件为**0字节空存根** / - Mock模式当前为关闭状态（`MockService.USE_MOCK=false`），后端未运行时前端全挂 /  / 本次P0的目标是**打通前端到后端AI能力的注入链路**，使AI名片生成、AI聊天、隐私协议、用户协议四个核心功能可用。 /  / ### 1.2 目标 /  / | 维度 | 目标 | / |:-----|:-----| / | 产品 | 用户可完成AI辅助写名片 + AI聊天咨询 + 查看隐私/用户协议 | / | 技术 | 前端Mock/Real双模式可用，API路径对齐后端真实路由 | / | 质量 | 核心链路e2e跑通，无阻塞性错误 | /  / --- /  / ## 2. 优先级定义 /  / | 优先级 | 模块 | 说明 | 预估工时 | / |:-------|:-----|:-----|:---------| / | **P0** | `ai/chat` | AI聊天（复用 RAGPipeline） | 4h | / | **P0** | `ai/generate` | AI生成名片（复用 WritingAssistant） | 3h | / | **P0** | `agreement/privacy` 
