# 盖娅知识导出 20260806_0000
# 来源: gaia_knowledge

- id: 5167
  type: pattern
  title: 一键蒸馏知识库方法论十原子（对标抖音AI小刘主题）
  content: |
    知识库蒸馏方法论十个原子：A1多源接入(文档/网页/视频字幕/笔记统一进料)、A2自动清洗(去重/去噪/过滤短元数据)、A3 LLM蒸馏(提炼结构化知识)、A4知识分型(concept/pattern/insight/rule/preference)、A5向量入库(语义向量+标签+关联)、A6语义检索(RAG召回)、A7持续进化(增量/去旧增新/复盘)、A8一键编排(全流程pipeline化一条命令触发)、A9安全过滤(敏感信息蒸馏前剔除)、A10成本分级(粗提炼便宜模型/精提炼好模型)。盖娅九步法已实现A1-A7，缺口A8(一键化)/A9(安全策略)/A10(成本分级)。可复用价值：知识库建设对标框架，先补齐一键化+分级可显著提升体验与成本效率。
- id: 5168
  type: optimization
  title: LLM蒸馏成本分级策略：粗提炼与精提炼两级流水线
  content: |
    知识蒸馏成本优化：全量同模型蒸馏浪费token。分级策略：第一级用低成本模型对全部素材做粗提炼(标题/类型/价值评分)，第二级只对高分/高价值素材用高质量模型做深度提炼(洞察/方案/可复用价值)。预期节省50-70%蒸馏成本，且不损失知识质量。落地要点：素材价值评分规则(长度/新鲜度/关键词权重/来源权重)，质量门禁打回重炼机制。适用于盖娅九步法、企业知识库产品。
- id: 5169
  type: optimization
  title: 知识蒸馏的层次化调度与智能路由
  content: |
    知识蒸馏不仅是模型压缩技术，更是一种系统化的知识管理方法论。在构建AI系统时，我们常面临知识碎片化、模型调用成本高、任务复杂度不一等挑战。通过层次化蒸馏（P9→P8→P7→P6）与智能模型路由的结合，可以实现知识的高效沉淀与资源的优化配置。 /  / 核心洞察：1）知识蒸馏应分层进行，从原始数据（P9）逐步提炼为可复用的模式（P8）、规则（P7）和概念（P6），每一层都过滤噪声、提取精华，最终形成结构化的知识库。2）模型路由遵循“杀鸡不用牛刀”原则，70%的简单任务应分配给便宜快速的模型（如DeepSeek），仅对复杂任务使用高性能模型，从而显著降低成本与延迟。3）LLM网关作为AI能力的中控台，统一管理模型调用、鉴权与路由，避免各模块重复接入，提升系统可维护性与扩展性。 /  / 可复用方案：1）建立蒸馏调度器，每周自动执行一轮层次化蒸馏，并检测知识缺口（gap），确保知识库持续更新。2）设计智能路由策略，基于任务复杂度（如token数量、语义难度）动态选择模型，并设置阈值与降级机制。3）构建统一网关层，集中处理API密钥、限流、日志与监控，支持多模型切换与灰度发布。 /  / 适用场景：适用于需要整合多源知识、优化AI调用成本、或构建可扩展AI平台的团队。例如，在会员体系中，通过分层定价模型（免费层吸引流量、标准层转化付费、高端层筛选高价值）与蒸馏知识库结合，可实现精准的用户分层与个性化服务。在工业化P3阶段，通过LLM网关与增长引擎的集成，可支撑国际化与高并发场景。 /  / 总之，层次化蒸馏与智能路由是构建高效AI系统的双引擎，既能沉淀知识资产，又能优化资源利用，是AI工程化的重要实践。
- id: 5170
  type: pattern
  title: API安全测试金字塔：从OWASP Top 10到自动化防护
  content: |
    在API安全领域，OWASP Top 10提供了威胁清单，但如何系统化地测试和防护是关键。本知识提炼自多个项目实践，形成一套可复用的API安全测试金字塔模式。 /  / **核心洞察**：API安全测试应分层进行，从底层单元测试到顶层端到端渗透测试，每层关注不同粒度的安全问题。结合OWASP Top 10，将安全测试嵌入开发流水线，实现持续安全验证。 /  / **可复用方案**： / 1. **单元测试层**：针对每个API端点，编写测试用例覆盖输入验证、认证授权、敏感数据暴露等OWASP风险点。例如，使用pytest和flask测试客户端，模拟恶意输入（SQL注入、XSS payload）验证过滤逻辑。 / 2. **集成测试层**：测试API间交互，关注身份验证和会话管理。使用JWT或OAuth2模拟不同角色，验证权限控制。例如，测试越权访问（IDOR）场景。 / 3. **端到端测试层**：模拟真实攻击，使用工具如OWASP ZAP或Burp Suite进行动态扫描。在CI/CD中集成安全扫描，自动生成报告并阻断高危漏洞。 / 4. **响应头加固**：在中间件中设置安全响应头（如Content-Security-Policy, X-Frame-Options, Strict-Transport-Security），并验证其存在。 / 5. **日志与监控**：记录安全事件（如登录失败、异常请求），并设置告警。 /  / **适用场景**：适用于任何基于RESTful API的Web应用，尤其是涉及用户数据和金融交易的系统。在敏捷开发中，此模式可快速集成，实现安全左移。 /  / **实施步骤**： / - 基于OWASP Top 10建立安全测试用例库。 / - 在测试环境中配置安全扫描工具。 / - 将安全测试纳入CI流水线，每次提交自动执行。 / - 定期进行人工渗透测试，补充自动化盲区。 /  / 此模式已在多个项目验证，能有效减少API安全漏洞，提升整体安全性。
- id: 5172
  type: pattern
  title: 多源并行情报采集：高可用情报管道设计
  content: |
    核心洞察：在构建情报采集系统时，单一数据源往往成为瓶颈，一旦该源不可用，整个系统将陷入瘫痪。通过使用 Promise.allSettled 并发请求多个公开信源，可以确保部分请求失败不会影响整体任务的完成，从而构建高可用的情报管道。这种模式不仅适用于情报采集，也适用于任何需要从多个独立服务获取数据的场景，如聚合搜索、健康检查、分布式数据同步等。 /  / 可复用方案： / 1. 定义统一的数据源接口，每个源返回标准化格式的数据。 / 2. 使用 Promise.allSettled 并发执行所有请求，该方法会等待所有 Promise 完成，无论成功或失败，并返回每个 Promise 的结果数组。 / 3. 对结果进行后处理：过滤掉 rejected 的结果，对 fulfilled 的结果进行数据提取和合并。 / 4. 设置超时和重试机制，避免某个源长时间无响应占用资源。 / 5. 记录每个源的成功/失败状态，用于监控和告警。 /  / 适用场景： / - 每日情报自动化采集，需要从多个新闻网站、API 获取实时信息。 / - 任何“一个源挂了不能影响其他源”的系统，如多数据源聚合服务。 / - AI 军团的每日情报采集任务，确保数据获取的稳定性和完整性。 /  / 示例代码（TypeScript）： / ```typescript / const sources = [ /   { name: 'source1', url: 'https://api.source1.com' }, /   { name: 'source2', url: 'https://api.source2.com' }, /   // ... / ]; /  / const results = await Promise.allSettled(sources.map(async (source) => { /   const response = await fetch(source.url); /   if (!response.ok) throw new Error(`HTTP ${response.status}`); /   return { source: source.name, data: await response.json() }; / })); /  / const successful = results.filter(r => r.status === 'fulfilled').map(r => r.value); / const failed = results.filter(r => r.status === 'rejected').map(r => r.reason); /  / // 合并成功数据，记录失败日志 / ``` /  / 该模式显著提升了系
- id: 5173
  type: pattern
  title: 生产级AI Agent安全护栏：双层Guardrails架构
  content: |
    在生产级AI Agent系统中，安全护栏（Guardrails）是确保系统可靠性和安全性的关键组件。本知识提炼自AutoGen Safety Guardrails、Nvidia NeMo Guardrails以及盖娅之城的实践，提出一种双层护栏架构：Input Guard（入口）和Output Guard（出口）。 /  / 核心洞察： / 1. **双层防护**：输入护栏在用户请求进入Agent之前进行过滤，防止恶意或不当输入；输出护栏在Agent生成响应之后进行校验，确保输出内容符合安全策略。这种双向防护机制能有效降低风险。 / 2. **模块化设计**：护栏模块独立于Agent核心逻辑，便于维护和升级。盖娅之城的guard模块通过`__init__.py`定义，对标AutoGen和NeMo Guardrails，实现了可插拔的架构。 / 3. **中间件集成**：在LangGraph等框架中，护栏可以作为中间件嵌入，如`test_guardrail_middleware.py`所示，通过异步和Mock测试确保其可靠性。 / 4. **可测试性**：护栏逻辑应具备高可测试性，使用单元测试和集成测试覆盖各种边界情况，确保在生产环境中稳定运行。 /  / 可复用方案： / - **定义护栏接口**：创建统一的Guard类，包含`validate_input`和`validate_output`方法，便于扩展。 / - **策略配置**：使用配置文件或规则引擎定义安全策略，如关键词过滤、正则匹配、模型评分等。 / - **中间件集成**：在Agent框架中注册护栏中间件，在请求和响应阶段自动调用。 / - **监控与日志**：记录护栏触发事件，用于审计和持续改进。 /  / 适用场景： / - 企业级AI助手，需要防止敏感信息泄露或不当内容生成。 / - 多Agent协作系统，确保各Agent间交互的安全性。 / - 任何面向用户的AI应用，需要符合合规要求。 /  / 该模式已被多个生产系统验证，能显著提升系统的安全性和可信度。
- id: 5175
  type: pattern
  title: Mock与Stub模式：测试分层与数据激活的实战智慧
  content: |
    在软件测试与数据管道建设中，Mock与Stub模式是两种常被混淆但用途迥异的测试替身。Mock对象用于验证行为（如断言某个方法被调用），而Stub则用于提供预设的返回数据，以隔离外部依赖。核心洞察在于：测试分层是高效利用Mock与Stub的关键。具体而言，单元测试应使用Mock来模拟数据库层（如DAO），以毫秒级速度运行，聚焦业务逻辑；集成测试则使用真实SQLite或轻量级数据库，验证SQL语句与ORM映射的正确性，速度在秒级；端到端测试则通过HTTP调用真实服务，确保全链路功能，但速度慢至分钟级。这种分层策略避免了在单元测试中过度使用Mock导致测试失真，也避免了在集成测试中依赖真实数据库导致速度缓慢。 /  / 可复用方案：首先，为每个测试层级定义清晰的替身策略：单元测试中，使用Mock框架（如Python的unittest.mock或Java的Mockito）模拟所有外部I/O（数据库、网络、文件系统），确保测试独立且快速；集成测试中，使用Stub或轻量级数据库（如SQLite内存模式）提供可控数据，验证数据访问层的正确性；端到端测试中，使用真实环境，但通过测试数据隔离来避免污染。其次，引入“先有再优”原则：在构建数据管道或审计系统时，优先确保有真实数据流动，哪怕初始实现粗糙，也比一个完美但无数据的框架更有价值。例如，一个787行的审计框架若无数据，其价值为零；而仅10条种子数据就能激活整个系统，使风险预测模块有数据可读。因此，在开发初期，应快速搭建最小可行管道，注入种子数据，让系统“活”起来，再逐步优化。 /  / 适用场景：适用于多平台支付架构（如统一支付注册中心）、审计日志系统、数据管道建设，以及任何需要隔离外部依赖的测试场景。通过合理运用Mock与Stub，结合测试分层，可显著提升测试速度与系统可靠性，同时避免过度设计。
- id: 5177
  type: optimization
  title: 知识蒸馏的层次化调度与模型路由优化
  content: |
    核心洞察：知识蒸馏不仅是模型压缩技术，更是一种知识管理范式。在复杂系统中，通过层次化调度（P9→P8→P7→P6）和智能模型路由，可以显著提升资源利用率和知识传递效率。可复用方案：1. 建立层次化蒸馏管道，将原始知识（P9）逐步精炼为可执行规则（P6），每一层聚焦不同抽象级别，确保知识从数据到决策的完整传递。2. 实施智能模型路由：根据任务复杂度动态选择模型，简单任务（如分类、抽取）使用轻量模型（如DeepSeek），复杂任务（如推理、生成）使用重型模型（如GPT-4），可节省70%成本。3. 引入SOP驱动的慢思考规划器，将复杂任务分解为标准化步骤，结合蒸馏知识库，提升决策质量。4. 使用调度器自动执行蒸馏流程，定期检测知识缺口，持续优化。适用场景：适用于需要大规模知识管理、多模型协同、成本敏感的企业级AI系统，如会员体系、LLM网关、增长引擎等。实施时需注意：确保蒸馏数据的质量，定期评估蒸馏效果，并建立反馈机制。
- id: 5178
  type: pattern
  title: API安全测试金字塔：从OWASP Top 10到纵深防御
  content: |
    API安全测试金字塔是一种分层测试策略，将API安全测试从底层到顶层分为单元测试、集成测试、端到端测试和渗透测试，每层关注不同粒度的安全问题，从而在开发早期发现并修复漏洞，降低修复成本。该模式基于OWASP Top 10（如注入、失效的身份认证、敏感数据暴露等）构建，确保覆盖最常见的安全风险。 /  / 核心洞察：安全测试不应仅在开发末期进行，而应贯穿整个软件开发生命周期。通过金字塔模型，可以在不同层级实施针对性的安全测试，实现安全左移。 /  / 可复用方案： / 1. 单元测试层：使用静态分析工具（如Bandit、SonarQube）扫描代码中的安全漏洞，并编写针对安全函数的单元测试，如输入验证、输出编码、加密解密等。 / 2. 集成测试层：测试API端点之间的交互，验证身份认证、授权、输入校验等机制。使用工具如OWASP ZAP进行动态分析，模拟攻击请求。 / 3. 端到端测试层：模拟真实用户场景，测试整个业务流程的安全性，包括会话管理、访问控制、数据保护等。 / 4. 渗透测试层：由安全专家或自动化工具（如Burp Suite）进行模拟攻击，发现深层漏洞。 /  / 适用场景：适用于任何API驱动的系统，尤其是涉及用户数据、金融交易或敏感信息处理的Web应用。在敏捷开发或DevOps环境中，可将安全测试集成到CI/CD流水线中，实现持续安全验证。 /  / 实施建议：根据团队资源和项目风险，调整金字塔各层的投入比例。高风险项目应加强渗透测试和端到端测试，而低风险项目可侧重单元和集成测试。同时，定期更新测试用例以应对新出现的威胁。
- id: 5180
  type: pattern
  title: 多源并行情报采集：高可用情报管道设计
  content: |
    核心洞察：在构建情报采集系统时，单一数据源故障可能导致整个管道瘫痪。通过使用 Promise.allSettled 并发请求多个公开信源，可以确保部分请求失败不影响整体结果，从而提升系统的鲁棒性和可用性。该模式不仅适用于情报采集，也适用于任何需要从多个外部服务获取数据的场景，如聚合搜索、监控告警、数据同步等。 /  / 可复用方案： / 1. 使用 Promise.allSettled 替代 Promise.all，它会在所有 Promise 完成后返回每个 Promise 的状态（fulfilled 或 rejected），而不会因单个失败而中断。 / 2. 对每个请求设置超时和重试机制，避免长时间挂起。 / 3. 对返回结果进行统一封装，区分成功和失败，便于后续处理。 / 4. 可结合并发控制（如 p-limit）限制同时请求的数量，避免对目标服务器造成过大压力。 / 5. 将采集结果缓存，减少重复请求，提高效率。 /  / 适用场景： / - 需要从多个网站或 API 获取实时信息的系统，如新闻聚合、舆情监控、市场情报。 / - 任何「一个源挂了不能影响其他源」的分布式系统。 / - AI 军团的每日情报自动化采集，确保即使部分信源不可用，仍能获取关键信息。 /  / 示例代码（TypeScript）： / ```typescript / const sources = [ /   { url: 'https://api.source1.com/data', options: { timeout: 5000 } }, /   { url: 'https://api.source2.com/data', options: { timeout: 5000 } }, /   // ... / ]; /  / const results = await Promise.allSettled( /   sources.map(async (source) => { /     const response = await fetch(source.url, { signal: AbortSignal.timeout(source.options.timeout) }); /     return response.json(); /   }) / ); /  / const successfulData = results /   .filter((result) => result.status === 'fulfilled') /   .map((result) => result.value); /  / const failedSources = results /   .filter((result) => result.status === 'rej
- id: 5182
  type: pattern
  title: 测试金字塔与网络策略：从采集到全量验证的工业化修复路径
  content: |
    核心洞察：在AI原生应用与多模态小模型集群的交付中，测试修复必须遵循“采集通过→单项通过→全量验证”的三阶段心智模型。这一顺序源于链客宝P0修复实践：先运行pytest --collect-only修复采集错误（如导入路径、语法错误），再运行单项模块测试验证逻辑正确性，最后运行--cov全覆盖验证覆盖率。跳过任何一步都会导致调试效率低下——例如直接跑全量测试，可能因采集错误导致大量用例失败，难以定位根因；或单项未通过就追求覆盖率，掩盖了逻辑缺陷。 /  / 可复用方案：1) 建立测试金字塔的“三层门禁”：第一层为采集门禁（collect-only），确保所有测试文件可被正确发现和导入；第二层为单元门禁（单项模块），针对每个功能模块运行最小测试集，快速反馈逻辑错误；第三层为集成门禁（全量+覆盖率），确保整体功能与测试覆盖达标。2) 在CI/CD流水线中，将三层门禁设为串行阶段，任一阶段失败即中止，避免下游浪费。3) 对于网络策略（Network Policies）的测试，同样遵循此模式：先验证策略语法与API可采集性（采集），再验证单个策略的规则生效（单项），最后进行全集群策略冲突与覆盖验证（全量）。 /  / 适用场景：适用于任何需要工业化测试修复的软件项目，尤其是微服务、AI模型集群、基础设施即代码（如Kubernetes网络策略）等复杂系统。当测试数量庞大、依赖关系复杂时，此模式能显著减少调试时间，提升交付质量。
- id: 5185
  type: insight
  title: LLM作为语义推测器：弥补编译器优化盲区的新范式
  content: |
    核心洞察：传统优化编译器受限于程序表示中显式存在的语义，无法利用隐含的语义信息（如底层假设、数据结构不变量、高层语义提升）进行优化。大语言模型（LLM）能够从异构的C/C++上下文中恢复这些缺失的语义，并生成经过验证的、保持契约的优化产物，从而补充编译器的分析能力。 /  / 可复用方案：构建一个可执行的基准测试集（如SeGaBench），包含合成和真实场景，每个案例包含隐藏的使能语义、标准答案、正确性和语义验证器以及可复现的性能评估协议。通过评估多个LLM，发现最强模型在94.8%的响应中生成正确产物，在83.3%的案例中实现至少1.05倍加速，并在93.3%的案例中达到性能成功。然而，正确产物往往只部分缩小与标准答案的差距。 /  / 适用场景：适用于编译器优化、程序变换、性能工程等领域。当传统编译器无法发现优化机会时，可以利用LLM作为推测性语义提议者，生成候选优化，并通过验证器确保正确性和语义保持。此方法特别适用于嵌入式系统、高性能计算、遗留代码优化等场景。 /  / 关键要点：1) LLM可以补充编译器分析，但必须经过验证；2) 验证器设计至关重要，需确保语义保持和性能提升；3) 当前LLM生成的优化可能不完整，需结合传统编译器进一步优化；4) 该范式可扩展至其他编程语言和优化类型。
- id: 5186
  type: insight
  title: 量子电路与经典语言模型的可分离性：低深度量子优势的严格证明
  content: |
    核心洞察：现代大型语言模型（如Transformer和扩散语言模型）的核心任务为预测和生成，但存在严格的计算分离：低深度量子电路（QNC^0）在某些分布采样和函数计算任务上，无法被有界资源的经典语言模型（如恒定轮数的扩散语言模型或恒定深度Transformer）有效模拟。这揭示了量子计算在语言模型时代的潜在优势，并提供了理论上的严格证明。 /  / 可复用方案： / 1. 分布级分离：构造一个可由QNC^0电路采样的分布，证明任何恒定轮数的扩散语言模型（即使允许次线性链式思维和输出token修订/重掩码）都无法在恒定距离内采样该分布。这提示在生成任务中，量子采样可能提供经典模型无法企及的分布多样性。 / 2. 函数级分离：构造一个可由O(log log n)深度QNC^0电路（后接一个经典AND门）计算的函数，证明任何恒定深度decoder-only Transformer计算该函数时，其宽度必须为n^Ω(1)。这暗示在特定函数计算上，量子电路能以更小的资源实现经典模型需要更大规模才能完成的任务。 /  / 适用场景： / - 理论计算机科学：用于研究量子计算与经典机器学习模型之间的计算复杂性边界。 / - 量子机器学习：指导设计量子增强的语言模型或混合量子-经典架构，在特定任务上寻求优势。 / - 密码学与安全：基于量子优势的分布可能用于生成经典模型难以伪造的随机序列或数据分布。 / - 算法设计：启发在资源受限环境下（如低深度电路）利用量子效应解决经典模型难以处理的问题。
- id: 5187
  type: concept
  title: 测试时扩展的系统化框架：推理机制、评估原则与可复现性
  content: |
    核心洞察：测试时扩展（Test-Time Scaling）并非单一方法，而是涵盖多种推理算法的统称，这些算法在统计结构、计算核算和失败模式上存在显著差异。将不同算法视为可互换的单一标量预算，或仅报告准确率而不说明推理协议，会导致研究结果难以比较。因此，需要从三个维度系统化理解测试时扩展：推理机制、评估原则和可复现性要求。 /  / 可复用方案：1. 推理机制分类：将测试时扩展形式化为自回归模型隐式前缀树上的预算推理，区分三种结构机制：单轨迹顺序扩展（如思维链延长）、叶级扩展（如采样多个完整候选并通过投票或验证聚合）和前缀级扩展（如搜索未完成的部分状态）。2. 评估原则：将评估对象视为整个推理系统，分离端到端系统性能与候选库诊断。引入评估档案，其坐标和简单函数可恢复或界定常见的重复采样指标，并规定协议匹配的计算和不确定性报告。3. 可复现性要求：区分精确重放和分布可复现性，明确支持每种所需的工件（如随机种子、采样参数、搜索树结构等）。 /  / 适用场景：适用于研究测试时扩展算法的研究者、开发推理系统的工程师，以及需要比较不同推理方法的评估者。该框架有助于设计实验、报告结果和复现研究，推动推理模型领域的可比较性和可重复性。
- id: 5188
  type: optimization
  title: 视频深度研究智能体：解耦感知-探索流水线与阶段式工具解锁
  content: |
    核心洞察：当前多模态智能体在处理连续视频流时存在两个关键瓶颈：模态偏差（modality bias）和参数化知识泄漏（parametric knowledge leakage）。模态偏差指智能体倾向于使用文本搜索而非视觉工具，导致视觉信息未被充分利用；参数化知识泄漏指模型依赖内部记忆而非真实工具增强执行，导致回答缺乏事实依据。为解决这些问题，我们提出Video-DR框架，其核心创新在于解耦感知-探索流水线（decoupled perception-exploration pipeline）和阶段式工具解锁（stage-wise tool unlocking），强制模型在网页检索前进行彻底的跨帧视觉定位。训练策略采用两阶段：监督微调（SFT）和组相对策略优化（GRPO），使智能体能够自主探索，突破模仿学习的上限。 /  / 可复用方案：1. 架构设计：将感知模块（视觉理解）与探索模块（工具使用）解耦，先进行密集的时空视觉锚定（如跨帧目标跟踪、事件识别），再允许调用网页搜索等外部工具。阶段式工具解锁意味着在训练初期仅开放视觉工具，迫使模型学习从视频中提取信息，后期再开放搜索工具，避免模型跳过视觉分析。2. 训练策略：采用SFT使模型掌握基础能力，然后使用GRPO进行强化学习，鼓励模型探索多样化的推理路径，减少对模仿数据的依赖。3. 基准构建：通过人机协作方式构建包含200个复杂多跳VQA实例的基准（Video-DR-Bench），覆盖时空推理、跨模态关联等挑战。 /  / 适用场景：适用于需要从长视频中提取信息并回答复杂问题的场景，如视频监控分析、自动驾驶场景理解、医学影像视频诊断、教育视频内容问答等。该方案可推广到任何需要结合视觉理解和外部知识检索的多模态任务，尤其当视频数据丰富且问题需要跨帧推理时。 /  / 实证效果：Video-DeepResearch-35B-A3B在Video-DR-Bench上达到64.0%的平均准确率，超越Claude-4.5-Sonnet（59.0%）5个百分点，显著优于GPT-5（52.5%）和Gemini 2.5 Pro（57.5%）。30B-A3B变体也达到59.3%，与Claude-4.5-Sonnet相当，证明该训练范式在紧凑模型上同样有效。
- id: 5189
  type: concept
  title: 嵌入贝叶斯智能体：基础模型智能体通过相似性推断实现理性合作的新博弈论框架
  content: |
    核心洞察：经典博弈论假设智能体是“解耦的”，即决策独立于环境和他人，这导致在囚徒困境等社会困境中预测相互背叛。然而，由基础模型驱动的智能体在最优规划时却持续收敛到稳定合作，与经典预测相悖。原因在于这些智能体是“嵌入的”：它们将自身视为所栖居宇宙的一部分，对自己的决策算法保持认知不确定性。在规划过程中，它们通过推断他人是否与自己行为相似，将自身 deliberation 作为证据：若我选择合作，则相似伙伴也会合作。这种相似性推断机制通过“嵌入均衡”形式化，取代纳什均衡，为现代AI智能体的社会行为提供基础博弈论。 /  / 可复用方案：在设计多智能体系统时，可借鉴嵌入智能体原理。具体而言，让智能体在决策时考虑自身行为与环境的耦合，并利用自我预测作为他人行为的证据。例如，在协作任务中，智能体可以首先评估自身策略，然后推断其他智能体可能采取类似策略，从而促进合作。实现上，可在训练或推理阶段引入对自身决策的建模，如使用贝叶斯推断来更新对其他智能体相似性的信念，并据此调整策略。 /  / 适用场景：适用于需要多智能体协作的领域，如自动驾驶车队协调、分布式资源分配、多机器人协作、以及人机协作场景。在这些场景中，智能体需要在不完全信息下做出决策，而相似性推断可以增强信任和合作。此外，对于评估基础模型智能体在社交模拟中的行为，该框架提供了理论工具。
- id: 5190
  type: pattern
  title: TACT：基于分类法对齐的英语教学对话后训练框架
  content: |
    核心洞察：大语言模型（LLM）在英语作为第二语言（ESL）教学对话中，仅生成流畅回复是不够的，必须根据学习者行为和对话上下文选择恰当的教学动作。人类辅导研究提供了适应性支持原则，但往往针对特定任务，未能充分整合到基于LLM的ESL辅导训练和评估中。TACT框架通过构建两个互补的分类法（Tutor-Strategy Taxonomy和Student-Move Taxonomy），将教学策略和学习者行为结构化，从而实现对LLM辅导能力的后训练和评估，显著提升其教学适应性。 /  / 可复用方案：1. 构建分类法：基于文献和专家知识，定义辅导策略（如提示、解释、纠错等13种）和学习者行为（如回答类型、状态等），形成统一标注体系。2. 数据增强：利用分类法对真实师生对话进行多维度标注（TACTCorpus包含260个对话，32,379个标注），并生成质量受控的增强训练数据。3. 后训练流程：采用监督微调（SFT）结合分类法对齐的组相对策略优化（GRPO），优化目标从模仿参考回复转向提升脚手架质量（如引导、提示等）。4. 评估基准：构建策略平衡的诊断基准（TACTBench），包含78个真实教学情境，确保评估覆盖各类策略。5. 应用步骤：收集教学对话数据→按分类法标注→SFT微调→GRPO对齐→在基准上评估→迭代优化。 /  / 适用场景：适用于需要教学适应性的对话系统，如ESL辅导、智能导师、语言学习应用等。尤其适合需要根据学生水平、错误类型、学习进度动态调整教学策略的场景。
- id: 5191
  type: pattern
  title: 一键蒸馏管线落地：A8一键编排+A9安全过滤+A10成本分级
  content: |
    P0落地完成：gaia_distill.py 实现6步蒸馏管线(采集到反哺到简报)。A9安全过滤7种敏感模式自动脱敏；A10成本分级两级(规则粗筛0token加deepseek-chat精炼加top20%高价值走premium)；实测local源35条8条精炼、web源25条6条精炼全部入库。踩坑：反哺source-id用秒级时间戳会撞唯一索引(8条只入库4条)，须毫秒加序号；web源素材评分低需降低粗筛阈值到35；后台运行需timeout包裹防LLM调用超时。可复用价值：任意知识库系统可套用此管线框架。
