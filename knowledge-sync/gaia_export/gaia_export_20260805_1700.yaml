# 盖娅知识导出 20260805_1700
# 来源: gaia_knowledge

- id: 5158
  type: pattern
  title: 同步脚本stash冲突生产事故复盘+远程操作本地通道限制图谱
  content: |
    事故：gaia_bidirectional_sync.py git_pull() 用 stash --include-untracked → pull --rebase → stash pop 全仓库操作，rebase/pop 冲突把冲突标记写进生产代码(backend/app/* 6文件 UU)，服务存在 SyntaxError 风险。修复：改为 git fetch + checkout origin/master -- knowledge-sync/（只更新同步目录，绝不 stash 项目代码），已合并 master 并恢复 cron。远程操作本地电脑通道限制（阿里云服务器→本地Windows）：(1) 仅 SSH 反向隧道 127.0.0.1:8799 可达，项目控制API只支持简单数组 start_cmd（复杂引号/if链/多命令会卡死或静默失败），无通用 exec/文件读取端点；(2) 服务器新端口(8899)公网不通(安全组)，80/443 nginx 可投递文件但本地到443也可能受限；(3) 本地脚本重新 clone 仓库会卡 SSH 认证，须复用本地已有开发仓库(凭据缓存)。经验：服务器运维脚本严禁 stash 整个仓库；远程控制异构电脑优先复用现有通道+GitHub 中转验证，而非新建通道。
- id: 5159
  type: pattern
  title: 远程操作本地Windows硬边界：项目控制API仅支持长驻服务命令
  content: |
    12轮系统探索确认远程分身(阿里云)→本地Windows的操作边界：SSH反向隧道8799只暴露项目控制API(CRUD+start/stop/status)，start机制经验证仅可靠执行长驻服务型命令(如python -m http.server成功health:true)，一次性快速命令(python -c写文件/git push/复杂cmd链)从未真正执行；无stdout/日志/文件读取端点导致失败不可诊断；服务器新端口(8899)公网不可达(安全组)；nginx 80/443可投递文件但本地出站443可能受限。结论：远程分身可靠自动化的边界=服务器侧一切+通过GitHub中转的异步协作；本地Windows一次性脚本执行必须用户配合(30秒)。可复用模式：GitHub作为双向验证通道(本地push→服务器fetch验证)，http.server+health_check布尔探测作为文件存在性验证。
