  type: insight
  title: 盖亚大脑反哺报告 — AI数智名片匹配引擎迭代沉淀
  content: |
    # 盖亚大脑反哺报告 — AI数智名片匹配引擎迭代沉淀 /  / > **日期**: 2026-07-13 | **迭代周期**: V1 → V2   / > **九步法引擎 Step 7**: 反哺盖亚大脑，沉淀本轮成果到五池 /  / --- /  / ## 一、匹配引擎迭代记录 /  / ### 1.1 V1 → V2 架构演化 /  / | 维度 | V1 (三塔规则) | V2 (五层综合评分) | 变化原因 | / |------|--------------|------------------|---------| / | **评分维度数** | 3层 | 5层 | 增加行业互补和注意力匹配 | / | **标签重叠权重** | 0.40 | 0.35 | 从单一维度降权，避免过拟合 | / | **语义相似度权重** | 0.40 | 0.25 | 语义特征在小数据下区分度低 | / | **标签权重** | 0.20 | 0.10 | 降权，为新增维度腾空间 | / | **行业互补 (新增)** | — | 0.20 | 商业场景最核心指标 | / | **注意力匹配 (新增)** | — | 0.10 | 探索四头注意力匹配效果 | / | **MMR多样性** | ❌ | ✅ | 避免推荐结果同质化 | / | **协同过滤** | ❌ | ✅ | ItemBasedCF + UserBasedCF | / | **反馈闭环** | ❌ | ✅ | 在线学习+反馈调整 | / | **匹配可解释性** | ❌ | ✅ | 四头注意力详情+Explain API | /  / ### 1.2 评分公式变化 /  / ``` / V1 (三层): /   score = tag_overlap × 0.40 + vector_semantic × 0.40 + tag_weight × 0.20 /  / V2 (五层): /   score = tag_overlap × 0.35 ← 降权 /          + vector_semantic × 0.25 ← 降权 /          + tag_weight × 0.10 ← 降权 /          + industry_complement × 0.20 ← 新增（10类行业供需映射） /          + attention_score × 0.10 ← 新增（四头注意力） / ``` /  / ### 1.3 ML模型迭代: V1 → V2 训练对比 /  / | 指标 | V1 三塔模型 | V2 三塔模型 (防过拟合版) | 分析 | / |------|------------|------------------------|------| / | *
