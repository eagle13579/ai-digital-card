  content: |
    --- / trinity_tag_layer: "L5孵化室" / trinity_tag_project: "LKB" / trinity_tag_scene: "Scene-Knowledge" / trinity_tag_version: "1.0" / trinity_tag_injected: "2026-06-20 21:19:54" / source_path: "L5孵化室/五池/2026-05-20_IJPay决策.md" / --- /  / # 决策验证池 - 2026-05-20 IJPay集成决策 /  / ## 关键决策记录 /  / ### D1 翻译策略：非完整重写 / - **决策**: 不对IJPay做Java→Python的逐行翻译, 而是提取架构模式+设计哲学翻译 / - **理由**: 支付宝/PayPal已有官方Python SDK, 只需要WxPay/UnionPay/JDPay/QQPay的Python适配 / - **验证**: 烛龙分析确认6个模式独立于Java生态, 可翻译 /  / ### D2 配置模式选择：ContextVar + 中间件 vs 全局单例 / - **决策**: 选ContextVar + FastAPI中间件 (而非全局单例) / - **理由**: ThreadLocal模式在Python的等价物是ContextVar, FastAPI的async运行时需要中间件注入 / - **验证**: 烛龙提供完整Python代码实现 /  / ### D3 HTTP客户端选择：httpx vs requests / - **决策**: 优先httpx (async支持) / - **理由**: FastAPI/异步web框架占主导, httpx同时支持sync/async / - **验证**: 链客宝使用FastAPI, httpx是标准选择 /  / ### D4 证书管理：apscheduler定时轮换 vs 按需获取 / - **决策**: apscheduler定时任务 + 缓存双机制 / - **理由**: 微信v3平台证书有效期较长(5年), 但大促期间API限流可能影响按需获取 / 
