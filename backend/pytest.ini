[pytest]
; ──────────────────────────────────────────────
; pytest 配置 — CI兼容模式
; ──────────────────────────────────────────────
minversion = 7.0
testpaths = tests
asyncio_mode = auto

; CI 默认标记：跳过需要真实数据库/外部服务的测试
; 本地完整测试：pytest -m ""
addopts = -m "not db"

markers =
    db: 需要数据库连接的测试（含真实数据库或外部API）
    slow: 耗时较长的测试
    asyncio: asyncio 测试
    skipif: 条件跳过
    benchmark: 性能基准测试
    fuzzing: 模糊测试

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
